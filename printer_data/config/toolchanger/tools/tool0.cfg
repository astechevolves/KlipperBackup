# See docs/Config_Reference.md for a description of parameters.

[mcu T0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3232323236196C07-if00
restart_method: command

#####################################################################
#   Nitehawk-36 Tool Board
#####################################################################

#####################################################################
#   Filament Sensor
#####################################################################
# [filament_switch_sensor filament_sensor]
# switch_pin: T0:gpio3
# pause_on_runout: True

#####################################################################
#   Extruder, specific to Jabberwocky, needs tweaked got sherpa
#####################################################################
[extruder] # Extruder0 Red Tool head
step_pin: T0:gpio23
dir_pin: T0:gpio24
enable_pin: !T0:gpio25
microsteps: 16
rotation_distance: 22.66												#Sherpa Mini calibrated
gear_ratio: 50:8
full_steps_per_rotation: 200 #1.8deg Motor

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: T0:gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: T0:gpio29
pullup_resistor: 2200
control: pid                                                        # Do PID calibration after initial checks
pid_Kp: 28.182
pid_Ki: 1.978
pid_Kd: 100.397
min_temp: -90
max_temp: 315
min_extrude_temp: 145
max_extrude_only_distance: 1000                                     
max_extrude_cross_section: 30                                       
pressure_advance: 0.052                                             #Be sure to calibrate
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: T0:gpio0
tx_pin: T0:gpio1
interpolate: false
run_current: 0.5                        #.45 minimum offers 12N of force. DO NOT EXCEED .55A as it will cause excess heat.

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T0_part_fan]
pin: T0:gpio6
kick_start_time: .3
off_below: 0.1


# ## HEF
[heater_fan T0_hotend_fan]
pin: T0:gpio5
tachometer_pin: T0:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: .1
heater: extruder
heater_temp: 50.0
fan_speed: .8

#####################################################################
#   Lights
#####################################################################
##Toolhead Headlights moved to Neopixel_Control as part of Demon macros
# [neopixel T0_headlights]
# pin: T0:gpio7
# chain_count: 3
# color_order: GRBW
# initial_RED: 0.0
# initial_GREEN: 0.0
# initial_BLUE: 0.0
# initial_WHITE: 1.0

# PCB Activity Light
[output_pin _T0_act_led]
pin: !T0:gpio8

# #####################################################################
# #   Accelerometer
# #####################################################################
[adxl345]
cs_pin: T0:gpio27
spi_software_sclk_pin: T0:gpio18
spi_software_mosi_pin: T0:gpio20
spi_software_miso_pin: T0:gpio19

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

probe_points:
   175, 175, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor T0_temp]
sensor_type: temperature_mcu
sensor_mcu: T0
min_temp: 0
max_temp: 100

#####################################################################
#   Macros - Tools Specific
#####################################################################

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0


#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T0]
#change this too
tool_number: 0
# detection_pin: # Only required for non TAP probing.
#if this were T1, then this would be extruder1, etc
extruder: extruder
#Change T0_partfan to tool number
fan: T0_part_fan
# offset of the nozzle's orifice in relation to tool 0, so T0 is always null
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 31.88
params_park_y: 6.36
params_park_z: 292.94
# For InputShaper run per tool and enter the frequency here, SHAPER_CALIBRATE AXIS=X & SHAPER_CALIBRATE AXIS=Y in console then take output to put here
params_input_shaper_type_x: 'mzv' # suggested max_accel <= 12100 mm/sec^2
params_input_shaper_freq_x: 66
params_input_shaper_damping_ratio_x: 0.048
params_input_shaper_type_y: 'mzv' # To avoid too much smoothing with 'mzv', suggested max_accel <= 12100 mm/sec^2
params_input_shaper_freq_y: 64.2
params_input_shaper_damping_ratio_y: 0.050

# Below should be diabled if using beacon or carto later
[tool_probe T0]
pin: T0:gpio10
tool: 0
x_offset: 0 # X axis-sensor relative nozzle offset TODO
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: -0.38 # Z axis-sensor relative nozzle offset 
# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder