#####################################################################
#                  Mellow LLL Filament Plus Buffer
#                  Buffer0 feeding Tool0
#####################################################################

[mcu Buffer0]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_2B0043000F57465331323720-if00
restart_method: command

#####################################################################
#                       Buffer Motor Configuration
#####################################################################

[manual_stepper buffer0_motor]
step_pin: Buffer0:PC13
dir_pin: Buffer0:PA7
enable_pin: !Buffer0:PA6
microsteps: 16
gear_ratio: 50:17
rotation_distance: 18.86
velocity: 50
accel: 500

[tmc2208 manual_stepper buffer0_motor]
uart_pin: Buffer0:PB1
run_current: 0.35 # .2 to .5 is usable range. If using higher end montior for motor heat
stealthchop_threshold: 999999

#####################################################################
#            Buffer reference logic for hall sensors
#####################################################################
#        | Hall3     Hall2     Hall1
#        |##---------##---------##    >> Out to tool head
#        |<0         50       100>|   Buffer0 position range
#
#   Hall3 is at the buffer body.
#   When Hall3 is touched, there is no more buffer available.
#   If the extruder continues to pull from here, the toolhead can starve.
#
#   Hall2 is the central position.
#   There is space for the toolhead to pull filament, but also room
#   to feed extra filament into the system.
#
#   Hall1 is the overflow side.
#   There is no more slack that can be given without the buffer skipping.
#
#   For reference the below are the only numbers vailable. 
#   These are just reference states and the numbers do not scale between these states. 
#
# Physical state map:
#
#   HALL3   HALL2   HALL1      State              MM Out     Percent
#   -----   -----   -----      ----------------   ------     -------
#   REL     PRS     PRS        FULL_RETRACTED     ~0 mm      0%
#   PRS     PRS     PRS        LOW_BUFFER         ~5 mm      25%
#   PRS     REL     PRS        HALF_EXTENDED      ~10 mm     50%
#   PRS     REL     REL        HIGH_BUFFER        ~15 mm     75%
#   PRS     PRS     REL        FULL_EXTENDED      ~20 mm     100%
#####################################################################

#####################################################################
#                  Buffer0 Shared Variables
#####################################################################

[gcode_macro _VARS_BUFFER0]
description: Shared variables for Buffer0

# Motor
variable_buffer_stepper: "buffer0_motor"       # Manual stepper name used to drive this buffer

# Hall sensor object names.
# These must match your [gcode_button ...] section names.
variable_hall1_object: "buffer0_hall1"         # Hall1 input name, overflow / fully extended end
variable_hall2_object: "buffer0_hall2"         # Hall2 input name, center position reference
variable_hall3_object: "buffer0_hall3"         # Hall3 input name, body side / fully retracted end

# Debug
variable_debug: 0                              # 1 = print normal debug output, 0 = silent
variable_debug_hold: 0                         # 1 = print hold/target-loop debug output, 0 = silent

# Last raw Hall sensor states.
variable_last_hall1: "UNKNOWN"                 # Last read raw Hall1 state: PRESSED / RELEASED / UNKNOWN
variable_last_hall2: "UNKNOWN"                 # Last read raw Hall2 state: PRESSED / RELEASED / UNKNOWN
variable_last_hall3: "UNKNOWN"                 # Last read raw Hall3 state: PRESSED / RELEASED / UNKNOWN

# Last interpreted buffer state.
variable_buffer_state: "UNKNOWN"               # Last calculated buffer state name

# Estimated buffer position.
# Fully retracted = 0%
# Fully extended  = 100%
variable_buffer_mm: -1.0                       # Estimated buffer extension in mm, -1 = unknown / invalid
variable_buffer_percent: -1.0                  # Estimated buffer percent, -1 = unknown / invalid

# State validity.
variable_buffer_valid: 0                       # 1 = known valid Hall pattern, 0 = invalid / unknown pattern

#####################################################################
# Blocking move defaults
#####################################################################

variable_move_speed: 20.0                      # Default MOVE_BUFFER0 speed in mm/s
variable_move_accel: 300.0                     # Default MOVE_BUFFER0 acceleration in mm/s^2

#####################################################################
# Percent move defaults
#####################################################################

variable_percent_step_mm: 1.0                  # Small move distance used per feedback step in mm
variable_percent_tolerance: 5.0                # Allowed percent error before target is considered reached
variable_percent_max_steps: 45                 # Max feedback steps before move-to-percent gives up

# Motor direction used by percent control.
variable_percent_move_sign: 1                  # 1 = positive move increases %, -1 = negative move increases %

# Runtime percent-control state.
variable_percent_target: -1.0                  # Target %, -1 = no active target currently set
variable_percent_active: 0                     # 1 = move-to-percent loop active, 0 = inactive
variable_percent_step_count: 0                 # Number of feedback steps used during current target move

#####################################################################
# Manual button move defaults
#####################################################################

variable_manual_button_step_mm: 2.0            # Distance moved per hold-loop step in mm
variable_manual_button_speed: 5.0              # Manual button move speed in mm/s
variable_manual_button_accel: 100.0            # Manual button move acceleration in mm/s^2
variable_manual_button_print_guard: 1          # 1 = ignore button moves while Tool0 is actively printing
variable_tool_extruder: "extruder"             # Tool0 extruder object name used by print guard

#####################################################################
# Manual button tap/hold state
#####################################################################

variable_button_hold_delay: 0.35               # Seconds button must stay pressed before hold mode starts
variable_button_hold_repeat: 0.01              # Delay between repeated hold-loop moves
variable_advance_button_pressed: 0             # 1 = advance button currently pressed
variable_retract_button_pressed: 0             # 1 = retract button currently pressed
variable_advance_hold_active: 0                # 1 = advance hold loop active
variable_retract_hold_active: 0                # 1 = retract hold loop active

#####################################################################
# Advance seek defaults (advance button single press logic)
#####################################################################

variable_seek_step_mm: 0.5                     # Step size while seeking next Hall state
variable_seek_speed: 5.0                       # Seek move speed in mm/s
variable_seek_accel: 100.0                     # Seek move acceleration in mm/s^2
variable_seek_max_steps: 45                    # Max seek steps before faulting out
variable_seek_active: 0                        # 1 = advance seek loop active
variable_seek_step_count: 0                    # Runtime seek step counter
variable_seek_start_percent: -1.0              # Starting percent before seek begins
variable_seek_center_after: 1                  # 1 = move to 50% after Hall state changes
variable_seek_center_target: 50.0              # Target percent after successful advance seek

#####################################################################
# Retract-until-empty defaults (retract button single press logic)
#####################################################################

variable_presence_object: ""                   # Filament presence gcode_button name; empty = not configured
variable_presence_empty_state: "RELEASED"      # Presence sensor state meaning filament is no longer detected
variable_empty_retract_step_mm: 2.0            # Retract distance per empty-check step in mm
variable_empty_retract_speed: 10.0             # Retract-until-empty speed in mm/s
variable_empty_retract_accel: 200.0            # Retract-until-empty acceleration in mm/s^2
variable_empty_retract_max_steps: 150          # Max retract steps before faulting out
variable_empty_retract_active: 0               # 1 = retract-until-empty loop active
variable_empty_retract_step_count: 0           # Runtime retract-until-empty step counter

gcode:
    # Variable storage only.


#####################################################################
#                  Buffer0 State Machine
#####################################################################

[gcode_macro UPDATE_STATE_BUFFER0]
description: Read Buffer0 Hall sensors and update the estimated Buffer0 position

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    # Debug output control.
    {% set debug = vars.debug|int %}
    {% set force_report = params.FORCE_REPORT|default(0)|int %}

    # Read raw Hall sensor states.
    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    # Convert raw states to booleans.
    # True  = PRESSED
    # False = RELEASED
    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    #################################################################
    # State Machine
    #################################################################

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set mm = 0.0 %}
        {% set pct = 0.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set mm = 5.0 %}
        {% set pct = 25.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set mm = 10.0 %}
        {% set pct = 50.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set mm = 15.0 %}
        {% set pct = 75.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set mm = 20.0 %}
        {% set pct = 100.0 %}
        {% set valid = 1 %}

    {% else %}
        {% set state = "INVALID" %}
        {% set mm = -1.0 %}
        {% set pct = -1.0 %}
        {% set valid = 0 %}
    {% endif %}

    #################################################################
    # Store Results
    #################################################################

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_mm VALUE={mm}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

    #################################################################
    # Debug / Forced Report Output
    #################################################################

    {% if debug == 1 or force_report == 1 %}
        RESPOND TYPE=command MSG="Buffer0: {state} | H3={h3} H2={h2} H1={h1} | {mm}mm out | {pct}% buffer"
    {% endif %}


#####################################################################
#                  Buffer0 Status Command
#####################################################################

[gcode_macro STATUS_BUFFER0]
description: Report current Buffer0 state estimate

gcode:
    UPDATE_STATE_BUFFER0 FORCE_REPORT=1


#####################################################################
#                  Buffer0 Blocking Move
#####################################################################
# Usage:
#   MOVE_BUFFER0 DISTANCE=5
#   MOVE_BUFFER0 DISTANCE=-5 SPEED=15 ACCEL=250
#
# Notes:
# - DISTANCE is a relative move distance.
# - Internally this resets the manual_stepper position to 0, then moves
#   to DISTANCE.
# - This is intentionally blocking because SYNC=0 is not used.
#####################################################################

[gcode_macro MOVE_BUFFER0]
description: Blocking relative move for Buffer0 manual_stepper

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set stepper = vars.buffer_stepper|string %}
    {% set distance = params.DISTANCE|default(0)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    {% if distance == 0 %}
        RESPOND TYPE=command MSG="Buffer0 move skipped: DISTANCE=0"
    {% else %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 move: distance={distance}mm speed={speed}mm/s accel={accel}mm/s^2"
        {% endif %}

        MANUAL_STEPPER STEPPER={stepper} ENABLE=1
        MANUAL_STEPPER STEPPER={stepper} SET_POSITION=0
        MANUAL_STEPPER STEPPER={stepper} MOVE={distance} SPEED={speed} ACCEL={accel}
    {% endif %}


#####################################################################
#                  Buffer0 Move To Percent - Start
#####################################################################
# Usage:
#   MOVE_TO_PERCENT_BUFFER0 PERCENT=50
#   MOVE_TO_PERCENT_BUFFER0 PERCENT=75 STEP=0.5 SPEED=10 ACCEL=200 TOLERANCE=5 MAX_STEPS=40
#
# Notes:
# - This uses small blocking MOVE_BUFFER0 moves.
# - Feedback is handled by the delayed_gcode below.
# - This is not a normal Jinja for-loop because Klipper evaluates a
#   macro before the physical moves complete.
#####################################################################

[gcode_macro MOVE_TO_PERCENT_BUFFER0]
description: Move Buffer0 toward a target percentage using sensor feedback

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set target = params.PERCENT|default(50)|float %}
    {% set step = params.STEP|default(vars.percent_step_mm)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}
    {% set tolerance = params.TOLERANCE|default(vars.percent_tolerance)|float %}
    {% set max_steps = params.MAX_STEPS|default(vars.percent_max_steps)|int %}

    {% if target < 0 or target > 100 %}
        RESPOND TYPE=error MSG="Buffer0 target percent must be 0-100. Requested: {target}"
    {% elif step <= 0 %}
        RESPOND TYPE=error MSG="Buffer0 STEP must be greater than 0. Requested: {step}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_target VALUE={target}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_mm VALUE={step}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=move_speed VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=move_accel VALUE={accel}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_tolerance VALUE={tolerance}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_max_steps VALUE={max_steps}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_count VALUE=0
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=1

        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 move-to-percent start: target={target}% step={step}mm speed={speed} accel={accel} tolerance={tolerance}% max_steps={max_steps}"
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0.01
    {% endif %}


#####################################################################
#                  Buffer0 Move To Percent - Stop
#####################################################################

[gcode_macro STOP_PERCENT_MOVE_BUFFER0]
description: Stop active Buffer0 move-to-percent loop

gcode:
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0

    {% if printer["gcode_macro _VARS_BUFFER0"].debug|int == 1 %}
        RESPOND TYPE=command MSG="Buffer0 move-to-percent stopped"
    {% endif %}


#####################################################################
#                  Buffer0 Move To Percent - Feedback Loop
#####################################################################
# This is intentionally a delayed_gcode so each pass can:
#   1. Read the current real Hall sensor state
#   2. Decide whether another step is needed
#   3. Move one small blocking step
#   4. Schedule the next check
#####################################################################

[delayed_gcode _MOVE_TO_PERCENT_LOOP_BUFFER0]
gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set active = vars.percent_active|int %}
    {% set target = vars.percent_target|float %}
    {% set tolerance = vars.percent_tolerance|float %}
    {% set step_mm = vars.percent_step_mm|float %}
    {% set speed = vars.move_speed|float %}
    {% set accel = vars.move_accel|float %}
    {% set max_steps = vars.percent_max_steps|int %}
    {% set step_count = vars.percent_step_count|int %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% if active == 1 %}

        #################################################################
        # Read sensors directly.
        # Do not rely on UPDATE_STATE_BUFFER0 here because nested macro
        # variable writes are not visible inside this same evaluation pass.
        #################################################################

        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        #################################################################
        # Inline state calculation
        #################################################################

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set mm = 0.0 %}
            {% set pct = 0.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set mm = 5.0 %}
            {% set pct = 25.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set mm = 10.0 %}
            {% set pct = 50.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set mm = 15.0 %}
            {% set pct = 75.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set mm = 20.0 %}
            {% set pct = 100.0 %}
            {% set valid = 1 %}

        {% else %}
            {% set state = "INVALID" %}
            {% set mm = -1.0 %}
            {% set pct = -1.0 %}
            {% set valid = 0 %}
        {% endif %}

        #################################################################
        # Store latest observed state
        #################################################################

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_mm VALUE={mm}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

        #################################################################
        # Feedback decision
        #################################################################

        {% set error = target - pct %}
        {% set abs_error = error|abs %}

        {% if valid == 0 %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
            RESPOND TYPE=error MSG="Buffer0 move-to-percent stopped: invalid Hall state H3={h3} H2={h2} H1={h1}"

        {% elif abs_error <= tolerance %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0

            {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 target reached: state={state} current={pct}% target={target}% error={error}%"
            {% endif %}

        {% elif step_count >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
            RESPOND TYPE=error MSG="Buffer0 move-to-percent stopped: max steps reached. state={state} current={pct}% target={target}%"

        {% else %}
            {% if error > 0 %}
                # Need more buffer extension.
                {% set move_distance = step_mm * move_sign %}
            {% else %}
                # Need less buffer extension.
                {% set move_distance = step_mm * move_sign * -1 %}
            {% endif %}

            {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 step {step_count + 1}/{max_steps}: state={state} current={pct}% target={target}% move={move_distance}mm"
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_count VALUE={step_count + 1}

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}

            UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0.01
        {% endif %}
    {% endif %}

#####################################################################
#                  Buffer0 Manual Button Moves
#####################################################################
# Purpose:
# - Provide simple one-step manual advance/retract controls.
# - Each button press commands one blocking MOVE_BUFFER0 move.
# - Button release is required by gcode_button but does nothing.
#
# Direction:
# - ADVANCE_BUFFER0 increases buffer percentage.
# - RETRACT_BUFFER0 decreases buffer percentage.
# - Direction uses variable_percent_move_sign so it follows the same
#   confirmed direction as MOVE_TO_PERCENT_BUFFER0.
#
# Safety:
# - If variable_manual_button_print_guard = 1, button moves are ignored
#   while Klipper is actively printing on Tool0's configured extruder.
# - The buttons also refuse to move farther into the known hard end states:
#     ADVANCE blocked at FULL_EXTENDED / 100%
#     RETRACT blocked at FULL_RETRACTED / 0%
#####################################################################

[gcode_macro ADVANCE_BUFFER0]
description: Manual one-step advance for Buffer0

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    # User-tunable manual button move settings.
    {% set step = params.STEP|default(vars.manual_button_step_mm)|float %}
    {% set speed = params.SPEED|default(vars.manual_button_speed)|float %}
    {% set accel = params.ACCEL|default(vars.manual_button_accel)|float %}

    # Direction shared with percent-control logic.
    {% set move_sign = vars.percent_move_sign|int %}
    {% set move_distance = step * move_sign %}

    # Print guard.
    {% set guard = vars.manual_button_print_guard|int %}
    {% set printing = printer.idle_timeout.state|string == "Printing" %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set tool_extruder = vars.tool_extruder|string %}

    # Read current Hall state directly so the safety check is current.
    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set pct = 0.0 %}
        {% set valid = 1 %}
    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set pct = 25.0 %}
        {% set valid = 1 %}
    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set pct = 50.0 %}
        {% set valid = 1 %}
    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set pct = 75.0 %}
        {% set valid = 1 %}
    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set pct = 100.0 %}
        {% set valid = 1 %}
    {% else %}
        {% set state = "INVALID" %}
        {% set pct = -1.0 %}
        {% set valid = 0 %}
    {% endif %}

    {% if guard == 1 and printing and active_extruder == tool_extruder %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 advance ignored: actively printing on {active_extruder}"
        {% endif %}

    {% elif valid == 0 %}
        RESPOND TYPE=error MSG="Buffer0 advance blocked: invalid Hall state H3={h3} H2={h2} H1={h1}"

    {% elif pct >= 100.0 %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 advance blocked: already FULL_EXTENDED / 100%"
        {% endif %}

    {% else %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 manual advance: state={state} current={pct}% move={move_distance}mm speed={speed} accel={accel}"
        {% endif %}

        MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
        UPDATE_STATE_BUFFER0
    {% endif %}


[gcode_macro RETRACT_BUFFER0]
description: Manual one-step retract for Buffer0

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    # User-tunable manual button move settings.
    {% set step = params.STEP|default(vars.manual_button_step_mm)|float %}
    {% set speed = params.SPEED|default(vars.manual_button_speed)|float %}
    {% set accel = params.ACCEL|default(vars.manual_button_accel)|float %}

    # Direction shared with percent-control logic.
    {% set move_sign = vars.percent_move_sign|int %}
    {% set move_distance = step * move_sign * -1 %}

    # Print guard.
    {% set guard = vars.manual_button_print_guard|int %}
    {% set printing = printer.idle_timeout.state|string == "Printing" %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set tool_extruder = vars.tool_extruder|string %}

    # Read current Hall state directly so the safety check is current.
    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set pct = 0.0 %}
        {% set valid = 1 %}
    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set pct = 25.0 %}
        {% set valid = 1 %}
    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set pct = 50.0 %}
        {% set valid = 1 %}
    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set pct = 75.0 %}
        {% set valid = 1 %}
    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set pct = 100.0 %}
        {% set valid = 1 %}
    {% else %}
        {% set state = "INVALID" %}
        {% set pct = -1.0 %}
        {% set valid = 0 %}
    {% endif %}

    {% if guard == 1 and printing and active_extruder == tool_extruder %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 retract ignored: actively printing on {active_extruder}"
        {% endif %}

    {% elif valid == 0 %}
        RESPOND TYPE=error MSG="Buffer0 retract blocked: invalid Hall state H3={h3} H2={h2} H1={h1}"

    {% elif pct <= 0.0 %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 retract blocked: already FULL_RETRACTED / 0%"
        {% endif %}

    {% else %}
        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 manual retract: state={state} current={pct}% move={move_distance}mm speed={speed} accel={accel}"
        {% endif %}

        MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
        UPDATE_STATE_BUFFER0
    {% endif %}

#####################################################################
#                  Buffer0 Hall Sensors
#####################################################################
# Purpose:
# - Expose the Hall sensor pin states to Klipper macros.
# - These are used by STATUS_BUFFER0 and UPDATE_STATE_BUFFER0.
# - No press/release behavior is needed yet for basic testing.
#
# Sensor position reference:
# - Hall1 = overflow / fully extended side
# - Hall2 = center reference
# - Hall3 = buffer body / fully retracted side
#####################################################################

[gcode_button buffer0_hall1]
pin: ^!Buffer0:PB2
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

[gcode_button buffer0_hall2]
pin: ^!Buffer0:PB3
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

[gcode_button buffer0_hall3]
pin: ^!Buffer0:PB4
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

#####################################################################
#                  Buffer0 Manual Feed/Retract Buttons
#####################################################################
# Purpose:
# - Physical button inputs for manual Buffer0 movement.
# - Press = one blocking step.
# - Release = no action, but required by gcode_button.
#
#####################################################################

[gcode_button advance_button_buffer0]
pin: ^!Buffer0:PB12
press_gcode:
    ADVANCE_BUFFER0
release_gcode:
    # Required but not used at present.


[gcode_button retract_button_buffer0]
pin: ^!Buffer0:PB13
press_gcode:
    RETRACT_BUFFER0
release_gcode:
    # Required but not used at present.

