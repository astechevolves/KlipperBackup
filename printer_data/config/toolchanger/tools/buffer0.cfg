#####################################################################
#                  Mellow LLL Filament Plus Buffer
#                  Buffer0 feeding Tool0
#####################################################################

[mcu Buffer0]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_2B0043000F57465331323720-if00 # Needs to be set for your address
restart_method: command

#####################################################################
#                       Buffer Motor Configuration
#####################################################################
# Proof-of-concept mode:
# - Buffer0 motor is configured as an extruder_stepper, not manual_stepper.
# - Live print assist uses SYNC_EXTRUDER_MOTION so Buffer0 follows the
#   active hotend extruder motion queue instead of injecting MANUAL_STEPPER
#   bumps during printing.
# - Independent buffer moves for staging/manual/load/unload helpers use
#   FORCE_MOVE. Those moves should only be used when not actively printing.
#####################################################################

[extruder_stepper buffer0_motor]
extruder:
#   Empty on purpose. Buffer0 starts unsynced and is attached by macro.
step_pin: Buffer0:PC13
dir_pin: Buffer0:PA7
enable_pin: !Buffer0:PA6
microsteps: 16
gear_ratio: 50:17
rotation_distance: 18.86 # changing from 18.86 trying to get the gear ration of the buffer and hot end to match for consistant feeding

[tmc2208 extruder_stepper buffer0_motor]
uart_pin: Buffer0:PB1
run_current: 0.35 # .2 to .5 is usable range. If using higher end monitor for motor heat
stealthchop_threshold: 999999

[force_move]
enable_force_move: True
# Required for independent Buffer0 moves now that the motor is an extruder_stepper.
# If [force_move] already exists elsewhere in your config, remove this duplicate section. 

#####################################################################
#            Buffer reference logic for hall sensors
#####################################################################
#        | Hall3     Hall2     Hall1
#        |##---------##---------##    >> Out to tool head
#        |<0         50       100>|   Buffer0 position range
#
#   Hall3 is at the buffer body.
#   When Hall3 is touched, there is no more buffer available.
#   If the extruder continues to pull from here, the toolhead can starve.
#
#   Hall2 is the central position.
#   There is space for the toolhead to pull filament, but also room
#   to feed extra filament into the system.
#
#   Hall1 is the overflow side.
#   There is no more slack that can be given without the buffer skipping.
#
#   For reference the below are the only numbers available.
#   These are just reference states and the numbers do not scale between these states.
#
# Physical state map:
#
#   HALL3   HALL2   HALL1      State              MM Out     Percent
#   -----   -----   -----      ----------------   ------     -------
#   REL     PRS     PRS        FULL_RETRACTED     ~0 mm      0%
#   PRS     PRS     PRS        LOW_BUFFER         ~5 mm      25%
#   PRS     REL     PRS        HALF_EXTENDED      ~10 mm     50%
#   PRS     REL     REL        HIGH_BUFFER        ~15 mm     75%
#   PRS     PRS     REL        FULL_EXTENDED      ~20 mm     100%
#####################################################################

#####################################################################
#                  Buffer0 Shared Variables
#####################################################################

[gcode_macro _VARS_BUFFER0]
description: Shared variables for Buffer0

#####################################################################
# Motor / Sync
#####################################################################

variable_buffer_stepper: "buffer0_motor"                  # Short extruder_stepper name used by SYNC_EXTRUDER_MOTION
variable_buffer_force_stepper: "extruder_stepper buffer0_motor" # Full object name used by FORCE_MOVE / SET_STEPPER_ENABLE
variable_tool_extruder: "extruder"             # Tool0 hotend extruder motion queue
variable_buffer_sync_active: 0                 # 1 = Buffer0 currently synced to tool extruder, 0 = desynced
variable_buffer_sync_mode: "OFF"               # Last sync decision/state for debug

#####################################################################
# Hall sensor object names
#####################################################################
# These must match your [gcode_button ...] section names.

variable_hall1_object: "buffer0_hall1"         # Hall1 input name, overflow / fully extended end
variable_hall2_object: "buffer0_hall2"         # Hall2 input name, center position reference
variable_hall3_object: "buffer0_hall3"         # Hall3 input name, body side / fully retracted end

#####################################################################
# Debug
#####################################################################

variable_debug: 0                              # 1 = print normal debug output, 0 = silent
variable_debug_hold: 1                         # 1 = print sync/state loop debug output, 0 = silent

#####################################################################
# Independent move defaults
#####################################################################
# These are used by MOVE_BUFFER0, percent positioning, staging, manual
# buttons, and load/unload helpers. Because Buffer0 is now an
# extruder_stepper, these independent moves use FORCE_MOVE.
# Do not use these during active printing.
#####################################################################

variable_move_speed: 20.0                      # Default MOVE_BUFFER0 speed in mm/s
variable_move_accel: 300.0                     # Default MOVE_BUFFER0 acceleration in mm/s^2

#####################################################################
# Percent move defaults
#####################################################################

variable_percent_step_mm: 1.0                  # Small move distance used per feedback step in mm
variable_percent_tolerance: 5.0                # Allowed percent error before target is considered reached
variable_percent_max_steps: 45                 # Max feedback steps before move-to-percent gives up

# Motor direction used by percent control / FORCE_MOVE helpers.
variable_percent_move_sign: 1                  # 1 = positive move increases %, -1 = negative move increases %

#####################################################################
# Manual button move defaults
#####################################################################

variable_manual_button_step_mm: 20.0           # Distance moved per button press/loop in mm
variable_manual_button_speed: 50.0             # Manual button move speed in mm/s
variable_manual_button_accel: 200.0            # Manual button move acceleration in mm/s^2
variable_manual_button_loop_delay: 0.18        # Delay between repeated button moves while held
variable_manual_button_print_guard: 1          # 1 = ignore button presses while Tool0 is actively printing

#####################################################################
# Buffer0 Initial Filament Staging Defaults
#####################################################################

# Used when filament is first inserted at the buffer entrance.
# This pushes filament through the long tube path, then walks the buffer
# up to a known ready state.
variable_stage_initial_feed_distance: 1800.0   # Long feed distance to move filament near the hotend
variable_stage_initial_feed_speed: 50.0        # Long feed speed in mm/s
variable_stage_initial_feed_accel: 500.0       # Long feed acceleration in mm/s^2
variable_stage_finish_percent: 75.0            # Final buffer ready target after long feed
variable_stage_finish_step_mm: 5.0             # Step size while walking buffer toward ready target
variable_stage_finish_speed: 30.0              # Finish move speed in mm/s
variable_stage_finish_accel: 300.0             # Finish move acceleration in mm/s^2
variable_stage_finish_max_steps: 45            # Max feedback steps for final buffer positioning

#####################################################################
# Load preload defaults
#####################################################################

variable_load_preload_empty_mm: 15.0           # Buffer preload move if starting from 0%
variable_load_preload_low_mm: 10.0             # Buffer preload move if starting from 25%
variable_load_preload_half_mm: 5.0             # Buffer preload move if starting from 50%
variable_load_preload_speed: 50.0              # Buffer preload speed in mm/s
variable_load_preload_accel: 300.0             # Buffer preload acceleration in mm/s^2

#####################################################################
# Load assist defaults
#####################################################################

variable_load_feed_burst_mm: 10.0              # Buffer bump distance during LOAD_FILAMENT purge chunks
variable_load_feed_burst_speed: 30.0           # Buffer bump speed in mm/s
variable_load_feed_burst_accel: 300.0          # Buffer bump acceleration in mm/s^2
variable_load_feed_trigger_percent: 50.0       # Bump Buffer0 when at or below this percent

#####################################################################
# Auto buffer sync tuning
#####################################################################
# Live print control no longer sends MANUAL_STEPPER moves.
# Instead, Buffer0 is synced/desynced to the hotend extruder motion queue.
#####################################################################

variable_auto_enabled: 0                       # 1 = auto buffer sync loop enabled, 0 = disabled
variable_auto_loop_delay: 0.25                 # Delay between sync-state checks
variable_auto_print_only: 1                    # 1 = only maintain while Tool0 is actively printing

# Flow tracking is used for debug only in deadband sync mode.
variable_auto_raw_flow: 0.0                    # Last sampled raw flow in mm3/s
variable_auto_effective_flow: 0.0              # Smoothed flow demand kept for debug/history
variable_auto_flow_decay: 2.0                  # Max mm3/s drop per loop pass when flow falls
variable_auto_flow_min_active: 0.5             # Treat raw flow below this as zero/noise

# Legacy threshold variables retained so older SET_GCODE_VARIABLE commands do not error.
# They are not used by the current deadband sync loop.
variable_auto_half_sync_flow: 8.0              # Legacy / unused in deadband sync mode
variable_auto_high_sync_flow: 999.0            # Legacy / unused in deadband sync mode

#####################################################################
# Internal Logic, should not be changed manually
#####################################################################

# Last raw Hall sensor states.
variable_last_hall1: "UNKNOWN"                 # Last read raw Hall1 state: PRESSED / RELEASED / UNKNOWN
variable_last_hall2: "UNKNOWN"                 # Last read raw Hall2 state: PRESSED / RELEASED / UNKNOWN
variable_last_hall3: "UNKNOWN"                 # Last read raw Hall3 state: PRESSED / RELEASED / UNKNOWN

# Last interpreted buffer state.
variable_buffer_state: "UNKNOWN"               # Last calculated buffer state name

# Estimated buffer position.
# Fully retracted = 0%
# Fully extended  = 100%
variable_buffer_mm: -1.0                       # Estimated buffer extension in mm, -1 = unknown / invalid
variable_buffer_percent: -1.0                  # Estimated buffer percent, -1 = unknown / invalid

# Runtime percent-control state.
variable_percent_target: -1.0                  # Target %, -1 = no active target currently set
variable_percent_active: 0                     # 1 = move-to-percent loop active, 0 = inactive
variable_percent_step_count: 0                 # Number of feedback steps used during current target move

# State validity.
variable_buffer_valid: 0                       # 1 = known valid Hall pattern, 0 = invalid / unknown pattern

# Left for compatibility with older debug/macros. Not used by extruder_stepper sync mode.
variable_auto_async_position: 0.0              # Legacy manual-stepper target tracker, unused in sync mode

gcode:
    # Variable storage only.

#####################################################################
#                  Buffer0 State Machine
#####################################################################

[gcode_macro UPDATE_STATE_BUFFER0]
description: Read Buffer0 Hall sensors and update the estimated Buffer0 position

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    # Debug output control.
    {% set debug = vars.debug|int %}
    {% set force_report = params.FORCE_REPORT|default(0)|int %}

    # Read raw Hall sensor states.
    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    # Convert raw states to booleans.
    # True  = PRESSED
    # False = RELEASED
    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    #################################################################
    # State Machine
    #################################################################

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set mm = 0.0 %}
        {% set pct = 0.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set mm = 5.0 %}
        {% set pct = 25.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set mm = 10.0 %}
        {% set pct = 50.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set mm = 15.0 %}
        {% set pct = 75.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set mm = 20.0 %}
        {% set pct = 100.0 %}
        {% set valid = 1 %}

    {% else %}
        {% set state = "INVALID" %}
        {% set mm = -1.0 %}
        {% set pct = -1.0 %}
        {% set valid = 0 %}
    {% endif %}

    #################################################################
    # Store Results
    #################################################################

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_mm VALUE={mm}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

    #################################################################
    # Debug / Forced Report Output
    #################################################################

    {% if debug == 1 or force_report == 1 %}
        RESPOND TYPE=command MSG="Buffer0: {state} | H3={h3} H2={h2} H1={h1} | {mm}mm out | {pct}% buffer"
    {% endif %}


#####################################################################
#                  Buffer0 Status Command
#####################################################################

[gcode_macro STATUS_BUFFER0]
description: Report current Buffer0 state estimate

gcode:
    UPDATE_STATE_BUFFER0 FORCE_REPORT=1


#####################################################################
#             Buffer0 to about 50% to prep for motion
#####################################################################

[gcode_macro CENTER_BUFFER_0]
description: Walk Buffer0 to HALF_EXTENDED / 50% before enabling sync/auto control
variable_active: 0
variable_step_count: 0
variable_max_steps: 60
variable_speed: 20.0
variable_accel: 300.0
variable_coarse_step_mm: 3.0
variable_fine_step_mm: 1.0

gcode:
    {% set sd_active = printer.virtual_sdcard is defined and printer.virtual_sdcard.is_active %}
    {% set paused = printer.pause_resume.is_paused if printer.pause_resume is defined else False %}
    {% set idle_state = printer.idle_timeout.state|string if printer.idle_timeout is defined else "Unknown" %}

    {% set max_steps = params.MAX_STEPS|default(60)|int %}
    {% set speed = params.SPEED|default(20.0)|float %}
    {% set accel = params.ACCEL|default(300.0)|float %}
    {% set coarse = params.COARSE|default(3.0)|float %}
    {% set fine = params.FINE|default(1.0)|float %}
    {% set force = params.FORCE|default(0)|int %}

    # Do not run during an active or paused print.
    # This macro uses service buffer moves and should only be used
    # before print start, during setup, or during manual filament handling.
    {% if force == 0 and (sd_active or paused or idle_state == "Printing") %}
        RESPOND TYPE=error MSG="CENTER_BUFFER_0 skipped: print is active/paused. sd_active={sd_active} paused={paused} idle_state={idle_state}"
    {% else %}
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
        BUFFER_SYNC_OFF_0
        STOP_PERCENT_MOVE_BUFFER0

        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=step_count VALUE=0
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=max_steps VALUE={max_steps}
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=speed VALUE={speed}
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=accel VALUE={accel}
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=coarse_step_mm VALUE={coarse}
        SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=fine_step_mm VALUE={fine}

        RESPOND TYPE=command MSG="CENTER_BUFFER_0 started: target=HALF_EXTENDED coarse={coarse} fine={fine} speed={speed} accel={accel} max_steps={max_steps}"
        UPDATE_DELAYED_GCODE ID=_CENTER_BUFFER_LOOP_0 DURATION=0.01
    {% endif %}


[delayed_gcode _CENTER_BUFFER_LOOP_0]
gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set center = printer["gcode_macro CENTER_BUFFER_0"] %}

    {% set active = center.active|int %}
    {% set step_count = center.step_count|int %}
    {% set max_steps = center.max_steps|int %}
    {% set speed = center.speed|float %}
    {% set accel = center.accel|float %}
    {% set coarse = center.coarse_step_mm|float %}
    {% set fine = center.fine_step_mm|float %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% if active == 1 %}

        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set move_mm = coarse * move_sign %}

        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set move_mm = fine * move_sign %}

        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set move_mm = 0.0 %}

        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set move_mm = fine * move_sign * -1 %}

        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set move_mm = coarse * move_sign * -1 %}

        {% else %}
            {% set state = "INVALID" %}
            {% set move_mm = 0.0 %}
        {% endif %}

        {% if state == "INVALID" %}
            SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=0
            RESPOND TYPE=error MSG="CENTER_BUFFER_0 stopped: invalid Hall state H3={h3} H2={h2} H1={h1}"

        {% elif state == "HALF_EXTENDED" %}
            SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=0
            RESPOND TYPE=command MSG="CENTER_BUFFER_0 reached: state={state} current=50.0% steps={step_count}"
            STATUS_BUFFER0

        {% elif step_count >= max_steps %}
            SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=0
            RESPOND TYPE=error MSG="CENTER_BUFFER_0 stopped: max steps reached. state={state} H3={h3} H2={h2} H1={h1}"
            STATUS_BUFFER0

        {% else %}
            {% set abs_move = move_mm|abs %}
            {% set move_time = (abs_move / speed) if speed > 0 else 0.25 %}
            {% set next_delay = move_time + 0.08 %}

            RESPOND TYPE=command MSG="CENTER_BUFFER_0 step {step_count + 1}/{max_steps}: state={state} move={move_mm}mm"

            SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=step_count VALUE={step_count + 1}

            MOVE_BUFFER0 DISTANCE={move_mm} SPEED={speed} ACCEL={accel}

            UPDATE_DELAYED_GCODE ID=_CENTER_BUFFER_LOOP_0 DURATION={next_delay}
        {% endif %}
    {% endif %}

#####################################################################
#                  Buffer0 Compatibility Alias
#####################################################################
# Purpose:
# - Some KlipperScreen/custom menu buttons may still call BUFFER0.
# - Keep that old command from erroring while this proof-of-concept file
#   uses explicit commands such as STATUS_BUFFER0, MOVE_BUFFER0,
#   BUFFER_SYNC_ON_0, and BUFFER_SYNC_OFF_0.
#####################################################################

[gcode_macro BUFFER0]
description: Compatibility alias for old Buffer0 menu/button command

gcode:
    STATUS_BUFFER0


#####################################################################
#                  Buffer0 Independent Move
#####################################################################
# Usage:
#   MOVE_BUFFER0 DISTANCE=5
#   MOVE_BUFFER0 DISTANCE=-5 SPEED=15 ACCEL=250
#
# Notes:
# - DISTANCE is a relative move distance.
# - This uses FORCE_MOVE because Buffer0 is configured as an
#   extruder_stepper for sync testing, not a manual_stepper.
# - This is intentionally for staging/manual/service moves only.
# - Do not use this during active printing.
#####################################################################

[gcode_macro MOVE_BUFFER0]
description: Independent relative move for Buffer0 extruder_stepper using FORCE_MOVE

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set force_stepper = vars.buffer_force_stepper|string %}
    {% set distance = params.DISTANCE|default(0)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    {% if distance == 0 %}
        RESPOND TYPE=command MSG="Buffer0 move skipped: DISTANCE=0"
    {% else %}
        BUFFER_SYNC_OFF_0

        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 force move: distance={distance}mm speed={speed}mm/s accel={accel}mm/s^2"
        {% endif %}

        SET_STEPPER_ENABLE STEPPER="{force_stepper}" ENABLE=1
        FORCE_MOVE STEPPER="{force_stepper}" DISTANCE={distance} VELOCITY={speed} ACCEL={accel}
    {% endif %}

#####################################################################
#                  Buffer0 Move To Percent - Start
#####################################################################
# Usage:
#   MOVE_TO_PERCENT_BUFFER0 PERCENT=50
#   MOVE_TO_PERCENT_BUFFER0 PERCENT=75 STEP=0.5 SPEED=10 ACCEL=200 TOLERANCE=5 MAX_STEPS=40
#
# Notes:
# - This uses small blocking MOVE_BUFFER0 moves.
# - Feedback is handled by the delayed_gcode below.
# - This is not a normal Jinja for-loop because Klipper evaluates a
#   macro before the physical moves complete.
#####################################################################

[gcode_macro MOVE_TO_PERCENT_BUFFER0]
description: Move Buffer0 toward a target percentage using sensor feedback

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set target = params.PERCENT|default(50)|float %}
    {% set step = params.STEP|default(vars.percent_step_mm)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}
    {% set tolerance = params.TOLERANCE|default(vars.percent_tolerance)|float %}
    {% set max_steps = params.MAX_STEPS|default(vars.percent_max_steps)|int %}

    {% if target < 0 or target > 100 %}
        RESPOND TYPE=error MSG="Buffer0 target percent must be 0-100. Requested: {target}"
    {% elif step <= 0 %}
        RESPOND TYPE=error MSG="Buffer0 STEP must be greater than 0. Requested: {step}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_target VALUE={target}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_mm VALUE={step}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=move_speed VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=move_accel VALUE={accel}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_tolerance VALUE={tolerance}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_max_steps VALUE={max_steps}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_count VALUE=0
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=1

        {% if vars.debug|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 move-to-percent start: target={target}% step={step}mm speed={speed} accel={accel} tolerance={tolerance}% max_steps={max_steps}"
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0.01
    {% endif %}


#####################################################################
#                  Buffer0 Move To Percent - Stop
#####################################################################

[gcode_macro STOP_PERCENT_MOVE_BUFFER0]
description: Stop active Buffer0 move-to-percent loop

gcode:
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0

    {% if printer["gcode_macro _VARS_BUFFER0"].debug|int == 1 %}
        RESPOND TYPE=command MSG="Buffer0 move-to-percent stopped"
    {% endif %}


#####################################################################
#                  Buffer0 Move To Percent - Feedback Loop
#####################################################################
# This is intentionally a delayed_gcode so each pass can:
#   1. Read the current real Hall sensor state
#   2. Decide whether another step is needed
#   3. Move one small blocking step
#   4. Schedule the next check
#####################################################################

[delayed_gcode _MOVE_TO_PERCENT_LOOP_BUFFER0]
gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set active = vars.percent_active|int %}
    {% set target = vars.percent_target|float %}
    {% set tolerance = vars.percent_tolerance|float %}
    {% set step_mm = vars.percent_step_mm|float %}
    {% set speed = vars.move_speed|float %}
    {% set accel = vars.move_accel|float %}
    {% set max_steps = vars.percent_max_steps|int %}
    {% set step_count = vars.percent_step_count|int %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% if active == 1 %}

        #################################################################
        # Read sensors directly.
        # Do not rely on UPDATE_STATE_BUFFER0 here because nested macro
        # variable writes are not visible inside this same evaluation pass.
        #################################################################

        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        #################################################################
        # Inline state calculation
        #################################################################

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set mm = 0.0 %}
            {% set pct = 0.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set mm = 5.0 %}
            {% set pct = 25.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set mm = 10.0 %}
            {% set pct = 50.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set mm = 15.0 %}
            {% set pct = 75.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set mm = 20.0 %}
            {% set pct = 100.0 %}
            {% set valid = 1 %}

        {% else %}
            {% set state = "INVALID" %}
            {% set mm = -1.0 %}
            {% set pct = -1.0 %}
            {% set valid = 0 %}
        {% endif %}

        #################################################################
        # Store latest observed state
        #################################################################

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_mm VALUE={mm}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

        #################################################################
        # Feedback decision
        #################################################################

        {% set error = target - pct %}
        {% set abs_error = error|abs %}

        {% if valid == 0 %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
            RESPOND TYPE=error MSG="Buffer0 move-to-percent stopped: invalid Hall state H3={h3} H2={h2} H1={h1}"

        {% elif abs_error <= tolerance %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0

            {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 target reached: state={state} current={pct}% target={target}% error={error}%"
            {% endif %}

        {% elif step_count >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_active VALUE=0
            RESPOND TYPE=error MSG="Buffer0 move-to-percent stopped: max steps reached. state={state} current={pct}% target={target}%"

        {% else %}
            {% if error > 0 %}
                # Need more buffer extension.
                {% set move_distance = step_mm * move_sign %}
            {% else %}
                # Need less buffer extension.
                {% set move_distance = step_mm * move_sign * -1 %}
            {% endif %}

            {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 step {step_count + 1}/{max_steps}: state={state} current={pct}% target={target}% move={move_distance}mm"
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=percent_step_count VALUE={step_count + 1}

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}

            UPDATE_DELAYED_GCODE ID=_MOVE_TO_PERCENT_LOOP_BUFFER0 DURATION=0.01
        {% endif %}
    {% endif %}


#####################################################################
#                  Buffer0 Preload For Hotend Load
#####################################################################
# Purpose:
# - Used before the initial LOAD_FILAMENT hotend load move.
# - Pushes Buffer0 out before the toolhead extruder pulls filament.
# - This is a blocking FORCE_MOVE on purpose so the buffer is staged
#   before the initial E load starts.
#
# Behavior:
# - FULL_RETRACTED: push larger amount
# - LOW_BUFFER:     push medium amount
# - HALF_EXTENDED:  push small amount
# - HIGH/FULL:      do nothing
#####################################################################

[gcode_macro PRELOAD_FOR_HOTEND_LOAD_BUFFER0]
description: Push Buffer0 out before the initial hotend load move

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set speed = params.SPEED|default(vars.load_preload_speed)|float %}
    {% set accel = params.ACCEL|default(vars.load_preload_accel)|float %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% set empty_mm = params.EMPTY_MM|default(vars.load_preload_empty_mm)|float %}
    {% set low_mm = params.LOW_MM|default(vars.load_preload_low_mm)|float %}
    {% set half_mm = params.HALF_MM|default(vars.load_preload_half_mm)|float %}

    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set move_mm = empty_mm %}

    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set move_mm = low_mm %}

    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set move_mm = half_mm %}

    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set move_mm = 0.0 %}

    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set move_mm = 0.0 %}

    {% else %}
        {% set state = "INVALID" %}
        {% set move_mm = 0.0 %}
    {% endif %}

    {% if state == "INVALID" %}
        RESPOND TYPE=error MSG="Buffer0 hotend-load preload skipped: invalid Hall state H3={h3} H2={h2} H1={h1}"

    {% elif move_mm > 0 %}
        {% set move_distance = move_mm * move_sign %}

        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 hotend-load preload: state={state} move={move_distance}mm speed={speed} accel={accel}"
        {% endif %}

        MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}

    {% else %}
        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 hotend-load preload skipped: state={state}"
        {% endif %}
    {% endif %}

#####################################################################
#                  Buffer0 Load Assist Check
#####################################################################
# Purpose:
# - Used during LOAD_FILAMENT purge/service moves.
# - Reads Buffer0 Hall state each time it is called.
# - If Buffer0 is at or below the trigger percent, it performs a
#   blocking FORCE_MOVE bump before the next hotend purge chunk.
# - This macro is not intended for live printing.
#
# Behavior:
# - 0%, 25%, 50% = bump Buffer0 forward.
# - 75%, 100%   = do nothing.
#####################################################################

[gcode_macro LOAD_ASSIST_CHECK_BUFFER0]
description: Check Buffer0 state and bump feed if needed during LOAD_FILAMENT purge

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set bump = params.BUMP|default(vars.load_feed_burst_mm)|float %}
    {% set speed = params.SPEED|default(vars.load_feed_burst_speed)|float %}
    {% set accel = params.ACCEL|default(vars.load_feed_burst_accel)|float %}
    {% set trigger_pct = params.TRIGGER|default(vars.load_feed_trigger_percent)|float %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
    {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
    {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

    {% set h1p = h1|upper == "PRESSED" %}
    {% set h2p = h2|upper == "PRESSED" %}
    {% set h3p = h3|upper == "PRESSED" %}

    #################################################################
    # Inline Buffer0 state calculation
    #################################################################

    {% if (not h3p) and h2p and h1p %}
        {% set state = "FULL_RETRACTED" %}
        {% set mm = 0.0 %}
        {% set pct = 0.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and h1p %}
        {% set state = "LOW_BUFFER" %}
        {% set mm = 5.0 %}
        {% set pct = 25.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and h1p %}
        {% set state = "HALF_EXTENDED" %}
        {% set mm = 10.0 %}
        {% set pct = 50.0 %}
        {% set valid = 1 %}

    {% elif h3p and (not h2p) and (not h1p) %}
        {% set state = "HIGH_BUFFER" %}
        {% set mm = 15.0 %}
        {% set pct = 75.0 %}
        {% set valid = 1 %}

    {% elif h3p and h2p and (not h1p) %}
        {% set state = "FULL_EXTENDED" %}
        {% set mm = 20.0 %}
        {% set pct = 100.0 %}
        {% set valid = 1 %}

    {% else %}
        {% set state = "INVALID" %}
        {% set mm = -1.0 %}
        {% set pct = -1.0 %}
        {% set valid = 0 %}
    {% endif %}

    #################################################################
    # Store latest observed state
    #################################################################

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_mm VALUE={mm}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

    #################################################################
    # Assist decision
    #################################################################

    {% if valid == 0 %}
        RESPOND TYPE=error MSG="Buffer0 load assist skipped: invalid Hall state H3={h3} H2={h2} H1={h1}"

    {% elif pct <= trigger_pct %}
        {% set move_distance = bump * move_sign %}

        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 load assist force bump: state={state} current={pct}% move={move_distance}mm speed={speed} accel={accel}"
        {% endif %}

        MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}

    {% else %}
        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 load assist hold: state={state} current={pct}%"
        {% endif %}
    {% endif %}

#####################################################################
#                  Buffer0 Auto Maintain Control
#####################################################################
# Purpose:
# - Live-print buffer assist using extruder_stepper sync.
# - No MANUAL_STEPPER bumps are sent while printing.
# - Hall state decides whether Buffer0 should follow the active
#   extruder motion queue.
# - Sync/desync commands are only sent when the desired sync state changes.
#
# Deadband behavior:
# - FULL_RETRACTED / LOW_BUFFER / HALF_EXTENDED: sync Buffer0 to the tool extruder.
# - HIGH_BUFFER / FULL_EXTENDED: desync to avoid overfill.
# - INVALID / idle / paused / wrong tool: desync.
#
# Notes:
# - This is a proof of concept for one tool: Tool0 / extruder / Buffer0.
# - If the buffer feeds the wrong direction while synced, flip dir_pin or
#   make rotation_distance negative after testing direction carefully.
#####################################################################

[gcode_macro BUFFER_SYNC_ON_0]
description: Sync Buffer0 extruder_stepper to Tool0 extruder motion

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set stepper = vars.buffer_stepper|string %}
    {% set force_stepper = vars.buffer_force_stepper|string %}
    {% set tool_extruder = vars.tool_extruder|string %}

    {% if vars.buffer_sync_active|int == 0 %}
        SET_STEPPER_ENABLE STEPPER="{force_stepper}" ENABLE=1
        SYNC_EXTRUDER_MOTION EXTRUDER="{stepper}" MOTION_QUEUE="{tool_extruder}"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_mode VALUE="'SYNCED'"

        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 sync ON: {stepper} following {tool_extruder}"
        {% endif %}
    {% endif %}


[gcode_macro BUFFER_SYNC_OFF_0]
description: Desync Buffer0 extruder_stepper from all extruder motion

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set stepper = vars.buffer_stepper|string %}

    {% if vars.buffer_sync_active|int == 1 %}
        SYNC_EXTRUDER_MOTION EXTRUDER="{stepper}" MOTION_QUEUE=""
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_mode VALUE="'OFF'"

        {% if vars.debug|int == 1 or vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 sync OFF"
        {% endif %}
    {% endif %}


[gcode_macro ENABLE_AUTO_BUFFER0]
description: Enable automatic Buffer0 sync maintenance

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set force_stepper = vars.buffer_force_stepper|string %}

    STOP_PERCENT_MOVE_BUFFER0
    BUFFER_SYNC_OFF_0

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_raw_flow VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_effective_flow VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_mode VALUE="'OFF'"

    SET_STEPPER_ENABLE STEPPER="{force_stepper}" ENABLE=1

    {% if vars.debug|int == 1 %}
        RESPOND TYPE=command MSG="Buffer0 auto sync maintain enabled"
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_AUTO_MAINTAIN_LOOP_BUFFER0 DURATION=0.01


[gcode_macro DISABLE_AUTO_BUFFER0]
description: Disable automatic Buffer0 sync maintenance

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set force_stepper = vars.buffer_force_stepper|string %}
    {% set disable_motor = params.DISABLE_MOTOR|default(0)|int %}

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=_AUTO_MAINTAIN_LOOP_BUFFER0 DURATION=0
    BUFFER_SYNC_OFF_0
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_sync_mode VALUE="'OFF'"

    {% if disable_motor == 1 %}
        SET_STEPPER_ENABLE STEPPER="{force_stepper}" ENABLE=0
    {% endif %}

    {% if vars.debug|int == 1 %}
        RESPOND TYPE=command MSG="Buffer0 auto sync maintain disabled"
    {% endif %}


[delayed_gcode _AUTO_MAINTAIN_LOOP_BUFFER0]
gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set enabled = vars.auto_enabled|int %}
    {% set active_sync = vars.buffer_sync_active|int %}
    {% set loop_delay = vars.auto_loop_delay|float %}
    {% set print_only = vars.auto_print_only|int %}
    {% set flow_decay = vars.auto_flow_decay|float %}
    {% set flow_min_active = vars.auto_flow_min_active|float %}

    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set tool_extruder = vars.tool_extruder|string %}
    {% set sd_printing = printer.virtual_sdcard is defined and printer.virtual_sdcard.is_active %}
    {% set paused = printer.pause_resume.is_paused if printer.pause_resume is defined else False %}
    {% set printing = sd_printing and not paused %}

    #################################################################
    # Live flow estimate for debug only.
    #################################################################

    {% if printer.motion_report is defined and printer.motion_report.live_extruder_velocity is defined %}
        {% set e_vel = printer.motion_report.live_extruder_velocity|float %}
    {% else %}
        {% set e_vel = 0.0 %}
    {% endif %}

    {% set filament_dia = printer.configfile.settings[active_extruder].filament_diameter|default(1.75)|float %}
    {% set filament_area = 3.14159265 * (filament_dia / 2.0) * (filament_dia / 2.0) %}
    {% set flow_mm3 = (e_vel|abs) * filament_area %}

    {% if flow_mm3 < flow_min_active %}
        {% set raw_flow = 0.0 %}
    {% else %}
        {% set raw_flow = flow_mm3 %}
    {% endif %}

    {% if enabled == 1 %}

        #################################################################
        # Read current Hall state directly.
        #################################################################

        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        #################################################################
        # Inline Buffer0 state calculation.
        #################################################################

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set pct = 0.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set pct = 25.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set pct = 50.0 %}
            {% set valid = 1 %}

        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set pct = 75.0 %}
            {% set valid = 1 %}

        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set pct = 100.0 %}
            {% set valid = 1 %}

        {% else %}
            {% set state = "INVALID" %}
            {% set pct = -1.0 %}
            {% set valid = 0 %}
        {% endif %}

        #################################################################
        # Effective flow.
        # Rise immediately, fall slowly.
        # Do not decay while already low/empty.
        #################################################################

        {% set old_eff_flow = vars.auto_effective_flow|float %}

        {% if raw_flow > old_eff_flow %}
            {% set eff_flow = raw_flow %}
        {% elif (state == "LOW_BUFFER" or state == "FULL_RETRACTED") and old_eff_flow > raw_flow %}
            {% set eff_flow = old_eff_flow %}
        {% else %}
            {% set eff_flow = [raw_flow, old_eff_flow - flow_decay]|max %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_raw_flow VALUE={raw_flow}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_effective_flow VALUE={eff_flow}

        #################################################################
        # Store latest observed state.
        #################################################################

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

        #################################################################
        # Sync decision.
        # Deadband control:
        # - 0%, 25%, 50% = sync ON
        # - 75%, 100%   = sync OFF
        #################################################################

        {% if valid == 0 %}
            {% set want_sync = 0 %}
            {% set reason = "INVALID_HOLD" %}

        {% elif print_only == 1 and not (printing and active_extruder == tool_extruder) %}
            {% set want_sync = 0 %}
            {% set reason = "IDLE_OR_WRONG_TOOL" %}

        {% elif state == "FULL_RETRACTED" %}
            {% set want_sync = 1 %}
            {% set reason = "EMPTY_SYNC" %}

        {% elif state == "LOW_BUFFER" %}
            {% set want_sync = 1 %}
            {% set reason = "LOW_SYNC" %}

        {% elif state == "HALF_EXTENDED" %}
            {% set want_sync = 1 %}
            {% set reason = "HALF_SYNC" %}

        {% elif state == "HIGH_BUFFER" %}
            {% set want_sync = 0 %}
            {% set reason = "HIGH_HOLD" %}

        {% elif state == "FULL_EXTENDED" %}
            {% set want_sync = 0 %}
            {% set reason = "FULL_HOLD" %}

        {% else %}
            {% set want_sync = 0 %}
            {% set reason = "UNKNOWN_HOLD" %}
        {% endif %}

        #################################################################
        # Apply sync command only when desired state changes.
        #################################################################

        {% if want_sync == 1 and active_sync == 0 %}
            BUFFER_SYNC_ON_0
            {% set action = "SYNC_ON_SENT" %}

        {% elif want_sync == 0 and active_sync == 1 %}
            BUFFER_SYNC_OFF_0
            {% set action = "SYNC_OFF_SENT" %}

        {% else %}
            {% set action = "NO_CHANGE" %}
        {% endif %}

        #################################################################
        # Debug output and loop reschedule.
        #################################################################

        {% if vars.debug_hold|int == 1 %}
            RESPOND TYPE=command MSG="Buffer0 auto sync: state={state} current={pct}% want_sync={want_sync} active_sync={active_sync} action={action} reason={reason} raw_flow={raw_flow|round(2)} eff_flow={eff_flow|round(2)} e_vel={e_vel|round(3)}"
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_AUTO_MAINTAIN_LOOP_BUFFER0 DURATION={loop_delay}

    {% endif %}

#####################################################################
#                  Buffer0 Hall Sensors
#####################################################################
# Purpose:
# - Expose the Hall sensor pin states to Klipper macros.
# - These are used by STATUS_BUFFER0 and UPDATE_STATE_BUFFER0.
# - No press/release behavior is needed yet for basic testing.
#
# Sensor position reference:
# - Hall1 = overflow / fully extended side
# - Hall2 = center reference
# - Hall3 = buffer body / fully retracted side
#####################################################################

[gcode_button buffer0_hall1]
pin: ^!Buffer0:PB2
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

[gcode_button buffer0_hall2]
pin: ^!Buffer0:PB3
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

[gcode_button buffer0_hall3]
pin: ^!Buffer0:PB4
press_gcode:
  # required but not used at present
release_gcode:
  # required but not used at present

#####################################################################
#                  Buffer0 Manual Button Moves
#####################################################################
# Purpose:
# - Provide a continuous series of manual bumps advance/retract while a button is held.
# - Press starts the loop.
# - Release stops the loop.
#
# Direction:
# - _MANUAL_ADVANCE_BUFFER0 feeds filament forward.
# - _MANUAL_RETRACT_BUFFER0 pulls filament backward.
# - Direction uses variable_percent_move_sign.
#
# Safety:
# - Movement is ignored while Tool0 is actively printing when
#   variable_manual_button_print_guard = 1.
#####################################################################

[gcode_macro _MANUAL_ADVANCE_BUFFER0]
description: Continuous manual advance loop for Buffer0
variable_active: 0

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set manual = printer["gcode_macro _MANUAL_ADVANCE_BUFFER0"] %}

    {% set step = vars.manual_button_step_mm|float %}
    {% set speed = vars.manual_button_speed|float %}
    {% set accel = vars.manual_button_accel|float %}
    {% set delay = vars.manual_button_loop_delay|float %}

    {% set move_distance = step * vars.percent_move_sign|int %}

    {% set guard = vars.manual_button_print_guard|int %}
    {% set sd_printing = printer.virtual_sdcard is defined and printer.virtual_sdcard.is_active %}
    {% set paused = printer.pause_resume.is_paused if printer.pause_resume is defined else False %}
    {% set printing = sd_printing and not paused %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set tool_extruder = vars.tool_extruder|string %}

    {% if manual.active|int == 1 %}

        {% if guard == 1 and printing and active_extruder == tool_extruder %}
            SET_GCODE_VARIABLE MACRO=_MANUAL_ADVANCE_BUFFER0 VARIABLE=active VALUE=0
            UPDATE_DELAYED_GCODE ID=_MANUAL_ADVANCE_LOOP_BUFFER0 DURATION=0

            {% if vars.debug|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 manual advance stopped: actively printing on {active_extruder}"
            {% endif %}

        {% else %}
            {% if vars.debug|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 manual advance: move={move_distance}mm speed={speed} accel={accel}"
            {% endif %}

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
            UPDATE_STATE_BUFFER0
            UPDATE_DELAYED_GCODE ID=_MANUAL_ADVANCE_LOOP_BUFFER0 DURATION={delay}
        {% endif %}
    {% endif %}


[delayed_gcode _MANUAL_ADVANCE_LOOP_BUFFER0]
gcode:
    _MANUAL_ADVANCE_BUFFER0


[gcode_macro _MANUAL_RETRACT_BUFFER0]
description: Continuous manual retract loop for Buffer0
variable_active: 0

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set manual = printer["gcode_macro _MANUAL_RETRACT_BUFFER0"] %}

    {% set step = vars.manual_button_step_mm|float %}
    {% set speed = vars.manual_button_speed|float %}
    {% set accel = vars.manual_button_accel|float %}
    {% set delay = vars.manual_button_loop_delay|float %}

    {% set move_distance = step * vars.percent_move_sign|int * -1 %}

    {% set guard = vars.manual_button_print_guard|int %}
    {% set sd_printing = printer.virtual_sdcard is defined and printer.virtual_sdcard.is_active %}
    {% set paused = printer.pause_resume.is_paused if printer.pause_resume is defined else False %}
    {% set printing = sd_printing and not paused %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set tool_extruder = vars.tool_extruder|string %}

    {% if manual.active|int == 1 %}

        {% if guard == 1 and printing and active_extruder == tool_extruder %}
            SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT_BUFFER0 VARIABLE=active VALUE=0
            UPDATE_DELAYED_GCODE ID=_MANUAL_RETRACT_LOOP_BUFFER0 DURATION=0

            {% if vars.debug|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 manual retract stopped: actively printing on {active_extruder}"
            {% endif %}

        {% else %}
            {% if vars.debug|int == 1 %}
                RESPOND TYPE=command MSG="Buffer0 manual retract: move={move_distance}mm speed={speed} accel={accel}"
            {% endif %}

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
            UPDATE_STATE_BUFFER0
            UPDATE_DELAYED_GCODE ID=_MANUAL_RETRACT_LOOP_BUFFER0 DURATION={delay}
        {% endif %}
    {% endif %}


[delayed_gcode _MANUAL_RETRACT_LOOP_BUFFER0]
gcode:
    _MANUAL_RETRACT_BUFFER0

#####################################################################
#                  Buffer0 Manual Feed/Retract Buttons
#####################################################################
# Purpose:
# - Physical button inputs for manual Buffer0 movement.
# - Holding advance repeatedly feeds filament forward.
# - Holding retract repeatedly pulls filament backward.
# - Releasing either button stops movement.
#####################################################################

[gcode_button advance_button_buffer0]
pin: ^!Buffer0:PB12
press_gcode:
    SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT_BUFFER0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MANUAL_RETRACT_LOOP_BUFFER0 DURATION=0

    SET_GCODE_VARIABLE MACRO=_MANUAL_ADVANCE_BUFFER0 VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_MANUAL_ADVANCE_LOOP_BUFFER0 DURATION=0.01

release_gcode:
    SET_GCODE_VARIABLE MACRO=_MANUAL_ADVANCE_BUFFER0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MANUAL_ADVANCE_LOOP_BUFFER0 DURATION=0


[gcode_button retract_button_buffer0]
pin: ^!Buffer0:PB13
press_gcode:
    SET_GCODE_VARIABLE MACRO=_MANUAL_ADVANCE_BUFFER0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MANUAL_ADVANCE_LOOP_BUFFER0 DURATION=0

    SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT_BUFFER0 VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_MANUAL_RETRACT_LOOP_BUFFER0 DURATION=0.01

release_gcode:
    SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT_BUFFER0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_MANUAL_RETRACT_LOOP_BUFFER0 DURATION=0

#####################################################################
#                  Buffer0 Stage Filament From Entrance
#####################################################################
# Purpose:
# - Used after filament is inserted into the buffer entrance.
# - Performs one long feed to push filament through the tube path.
# - Then moves Buffer0 to the configured ready percent, normally 75%.
#
# Notes:
# - The long MOVE_BUFFER0 command is blocking.
# - MOVE_TO_PERCENT_BUFFER0 is async, so final positioning continues
#   after this macro starts that target move.
#####################################################################

[gcode_macro STAGE_FILAMENT_BUFFER0]
description: Stage filament from Buffer0 entrance toward hotend, then preload buffer

gcode:
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set initial_distance = params.INITIAL_DISTANCE|default(vars.stage_initial_feed_distance)|float %}
    {% set initial_speed = params.INITIAL_SPEED|default(vars.stage_initial_feed_speed)|float %}
    {% set initial_accel = params.INITIAL_ACCEL|default(vars.stage_initial_feed_accel)|float %}

    {% set finish_percent = params.PERCENT|default(vars.stage_finish_percent)|float %}
    {% set finish_step = params.STEP|default(vars.stage_finish_step_mm)|float %}
    {% set finish_speed = params.SPEED|default(vars.stage_finish_speed)|float %}
    {% set finish_accel = params.ACCEL|default(vars.stage_finish_accel)|float %}
    {% set finish_max_steps = params.MAX_STEPS|default(vars.stage_finish_max_steps)|int %}

    DISABLE_AUTO_BUFFER0
    STOP_PERCENT_MOVE_BUFFER0

    M118 Buffer0: staging filament {initial_distance}mm
    MOVE_BUFFER0 DISTANCE={initial_distance} SPEED={initial_speed} ACCEL={initial_accel}

    M118 Buffer0: moving staged filament to {finish_percent}% buffer
    MOVE_TO_PERCENT_BUFFER0 PERCENT={finish_percent} STEP={finish_step} SPEED={finish_speed} ACCEL={finish_accel} MAX_STEPS={finish_max_steps}

#####################################################################
#                  Buffer0 Entrance Sensor
#####################################################################
# Purpose:
# - Detect filament entering or leaving the buffer.
# - Insert latches Buffer0 as buffered, then starts filament staging.
# - Runout/clear does not disable the buffer latch because filament may
#   simply have moved past the entrance sensor into the buffer/PTFE.
#####################################################################

[filament_switch_sensor buffer0_entrance]
switch_pin: ^!Buffer0:PB7
pause_on_runout: False

insert_gcode:
    M118 Buffer0: Filament inserted
    ENTRANCE_INSERT_BUFFER0
    STAGE_FILAMENT_BUFFER0

runout_gcode:
    M118 Buffer0: Entrance sensor clear
    ENTRANCE_RUNOUT_BUFFER0
