#####################################################################
#                  Mellow LLL Filament Plus Buffer
#                  Buffer0 feeding Tool0
#####################################################################
# Purpose:
# - Uses the LLL Plus as an independent buffer feeder for Tool0.
# - Uses [manual_stepper] instead of a fake extruder so the buffer
#   motor does not steal the active hotend extruder during prints.
# - Entrance sensor starts initial fill.
# - Initial fill now continues until HALL1 overfill is reached so PTFE
#   resistance does not leave the buffer stopped short at HALL2/HALL3.
# - Normal load / purge / print behavior is handled by a closed-loop
#   neck-state regulator that polls the Hall sensors while armed.
# - Hall sensor events wake the regulator instead of running a separate
#   one-shot burst controller.
# - Disable/disarm macros stop loops and can release the buffer motor so
#   it does not sit energized forever after a print.
#####################################################################

[mcu Buffer0]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_2B0043000F57465331323720-if00 # USB serial path for the Buffer0 LLL Plus MCU.
restart_method: command # Allows Klipper to restart this MCU with a firmware command.

#####################################################################
#                  Buffer0 / Tool0 Shared Variables
#####################################################################
# Purpose:
# - Central place for motor name, movement distances, speeds, timing,
#   regulator behavior, initial-fill behavior, and debug output.
# - When duplicating for another buffer/tool pair, this is one of the
#   main sections to edit.
#####################################################################

[gcode_macro _BUFFERZERO_TOOLZERO_VARS]
variable_buffer_stepper: "buffer0_motor" # Name of the [manual_stepper] used by this buffer.

# Manual / service motion
variable_manual_move: 20                  # Distance in mm for each manual feed/retract button loop.
variable_load_move: 50                    # Default one-shot buffer feed distance used by load assist.
variable_unload_move: 50                  # Default one-shot buffer retract distance used by unload assist.
variable_move_speed: 50                   # Blocking move speed in mm/s for manual/load/unload moves.
variable_move_accel: 500                  # Acceleration in mm/s^2 for buffer motor moves.
variable_loop_time: 0.10                  # Delay in seconds between repeated manual moves.
variable_reenable_delay: 2                # Delay after manual release before auto regulation resumes.

# Initial fill to overfill
variable_initial_fill_move: 20.0           # Distance in mm for each initial-fill step toward Tool0.
variable_initial_fill_speed: 50           # Initial-fill speed in mm/s; lower helps prevent overshoot and grinding.
variable_initial_fill_accel: 300          # Gentle acceleration for initial fill through PTFE/buffer resistance.
variable_initial_fill_loop_time: 0.10     # Delay in seconds between initial-fill sensor checks.
variable_initial_fill_max_moves: 80       # Safety limit; max feed is move distance x move count before aborting.

# Async regulator motion
variable_auto_speed: 50                   # Non-blocking regulator feed speed in mm/s.
variable_async_cooldown: 0.35             # Delay before another async feed may be queued.
variable_regulator_poll_time: 0.20        # Seconds between regulator state checks while armed.
variable_regulator_start_delay: 0.10      # Delay before first regulator check after arming.
variable_feed_empty: 12                   # Feed amount when buffer is fully retracted / starving.
variable_feed_low: 8                      # Feed amount when buffer is low.
variable_feed_mid: 4                      # Feed amount for small demand/top-off state.

# Motor hold behavior
variable_disable_motor_on_disarm: 1        # 1 releases buffer stepper after disable/disarm; 0 leaves it enabled.
variable_disable_motor_delay: 2.0          # Seconds after disable/disarm before releasing buffer stepper.

# Debug
variable_debug: 1                         # Set to 1 for extra troubleshooting messages; set to 0 once stable.
gcode:
    # Variable storage only.

#####################################################################
#                  Buffer0 / Tool0 Status Output Helper
#####################################################################
# Purpose:
# - Routes status/debug messages through one debug-controlled macro.
# - Set variable_debug: 1 in _BUFFERZERO_TOOLZERO_VARS to show messages.
# - Set variable_debug: 0 once stable to stop routine console chatter.
# - This keeps the control logic active while silencing non-essential
#   status output.
#####################################################################

[gcode_macro _BUFFERZERO_TOOLZERO_STATUS]
description: Print Buffer0/Tool0 status messages only when debug is enabled
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set msg = params.MSG|default("")|string %}

    {% if vars.debug == 1 and msg|length > 0 %}
        M118 {msg}
    {% endif %}

#####################################################################
#                       Buffer Motor Configuration
#####################################################################
# Purpose:
# - Defines the LLL Plus feeder motor as an independent manual stepper.
# - Positive manual-stepper moves feed filament toward Tool0.
#####################################################################

[manual_stepper buffer0_motor]
step_pin: Buffer0:PC13                    # Step signal from the Buffer0 MCU to the feeder driver.
dir_pin: Buffer0:PA7                      # Direction signal for the feeder driver; verified positive move creates slack.
enable_pin: !Buffer0:PA6                  # Enable pin for the feeder driver; inverted with !.
microsteps: 16                            # Driver microstep setting.
gear_ratio: 50:17                         # Gear ratio for the LLL Plus feeder drive.
rotation_distance: 18.86                  # Filament movement per motor rotation after gearing.
velocity: 50                              # Default max speed in mm/s for MANUAL_STEPPER moves.
accel: 500                                # Default acceleration in mm/s^2 for MANUAL_STEPPER moves.

[tmc2208 manual_stepper buffer0_motor]
uart_pin: Buffer0:PB1                     # UART pin used to configure the feeder motor driver.
run_current: 0.35                         # Motor current; increase only if skipping, reduce if motor runs hot.
stealthchop_threshold: 999999             # Keeps the driver in stealthChop for quiet low-load feeder motion.

#####################################################################
#                  Shared Buffer Move Helpers
#####################################################################
# Purpose:
# - Blocking moves are used for manual/service/initial-fill actions.
# - Async moves are used by the active regulator so the buffer can feed
#   independently while the hotend extruder is moving.
#####################################################################

[gcode_macro _BUFFERZERO_TOOLZERO_BLOCKING_MOVE]
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    {% set distance = params.DISTANCE|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    {% if state.async_active == 1 %}
        _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Blocking move requested while async move is active, skipping"
    {% else %}
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE={distance} SPEED={speed} ACCEL={accel}
    {% endif %}

[gcode_macro _BUFFERZERO_TOOLZERO_ASYNC_MOVE]
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    {% set distance = params.DISTANCE|float %}
    {% set speed = params.SPEED|default(vars.auto_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    {% if distance == 0 %}
        # No movement requested.
    {% elif state.async_active == 0 %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=1
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE={distance} SPEED={speed} ACCEL={accel} SYNC=0
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION={vars.async_cooldown}
    {% else %}
        {% if vars.debug == 1 %}
            _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Async buffer move already active, skipping"
        {% endif %}
    {% endif %}

[delayed_gcode _bufferzero_toolzero_async_clear]
gcode:
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0

    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    {% if state.system_enabled == 1 and state.continuous_fill == 0 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_poll_time}
    {% endif %}

#####################################################################
#                  Buffer State / Public Control
#####################################################################
# Purpose:
# - _BUFFERZERO_TOOLZERO_AUTO_STATE stores runtime flags.
# - ARM starts regulator mode for active load/purge/print use.
# - DISABLE/DISARM stops loops and releases the buffer stepper after a
#   short delay so the motor does not sit in hold forever.
#####################################################################

[gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE]
variable_system_enabled: 0                # 1 allows automatic buffer behavior.
variable_continuous_fill: 0               # 1 means entrance-sensor initial-fill mode is active.
variable_manual_operation: 0              # 1 suppresses auto behavior during physical button use.
variable_service_operation: 0             # 1 suppresses auto behavior during blocking service moves.
variable_overfill_lock: 0                 # 1 prevents feeding when HALL1 detects overfill.
variable_async_active: 0                  # 1 prevents overlapping async regulator moves.
variable_initial_fill_count: 0            # Counts initial-fill moves so a failed sensor/jam cannot feed forever.
gcode:
    # Runtime state storage only.

[gcode_macro BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION]
description: Arm Buffer0 regulator for Tool0 extrusion, purge, or print moves
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set reset_overfill = params.RESET_OVERFILL|default(0)|int %}

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0

    {% if reset_overfill == 1 %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_start_delay}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Armed regulator for Tool0 extrusion assist"

[gcode_macro BUFFERZERO_TOOLZERO_ENABLE_AUTO]
description: Compatibility alias for arming Buffer0 automatic regulation
gcode:
    BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION RESET_OVERFILL=1

[gcode_macro BUFFERZERO_TOOLZERO_START_REGULATOR]
description: Compatibility alias for arming Buffer0 regulator
gcode:
    BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION RESET_OVERFILL=1

[gcode_macro BUFFERZERO_TOOLZERO_DISABLE_AUTO]
description: Disable Buffer0 automatic behavior and optionally release the motor
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set disable_motor = params.DISABLE_MOTOR|default(vars.disable_motor_on_disarm)|int %}

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_feed_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_retract_loop DURATION=0

    {% if disable_motor == 1 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION={vars.disable_motor_delay}
    {% endif %}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Auto-buffer disabled"

[gcode_macro BUFFERZERO_TOOLZERO_STOP_REGULATOR]
description: Compatibility alias for disabling Buffer0 automatic regulation
gcode:
    BUFFERZERO_TOOLZERO_DISABLE_AUTO {rawparams}

[gcode_macro BUFFERZERO_TOOLZERO_DISARM_FOR_TOOLCHANGE]
description: Disable Buffer0 when Tool0 is no longer the active extrusion path
gcode:
    BUFFERZERO_TOOLZERO_DISABLE_AUTO {rawparams}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Disarmed for tool change"

[gcode_macro BUFFERZERO_TOOLZERO_RELEASE_MOTOR]
description: Immediately release the Buffer0 manual stepper hold
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=0
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Buffer motor released"

[delayed_gcode _bufferzero_toolzero_disable_motor]
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}

    {% if state.system_enabled == 0 and state.manual_operation == 0 and state.async_active == 0 %}
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=0
        _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Buffer motor released after disable"
    {% elif state.system_enabled == 0 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=1.0
    {% endif %}

#####################################################################
#                  Load / Unload Service Hooks
#####################################################################
# Purpose:
# - Service hooks temporarily pause regulator movement during intentional
#   blocking feed/retract actions.
# - These are optional one-shot helpers. Normal print/purge operation
#   should use ARM and let the regulator maintain the buffer.
#####################################################################

[gcode_macro BUFFERZERO_TOOLZERO_BEGIN_SERVICE]
gcode:
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0

[gcode_macro BUFFERZERO_TOOLZERO_END_SERVICE]
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0

    {% if state.system_enabled == 1 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_start_delay}
    {% endif %}

[gcode_macro BUFFERZERO_TOOLZERO_LOAD_ASSIST]
description: Optional one-shot blocking preload toward Tool0
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set distance = params.DISTANCE|default(vars.load_move)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION RESET_OVERFILL=1
    BUFFERZERO_TOOLZERO_BEGIN_SERVICE
    _BUFFERZERO_TOOLZERO_BLOCKING_MOVE DISTANCE={distance} SPEED={speed} ACCEL={accel}
    BUFFERZERO_TOOLZERO_END_SERVICE

[gcode_macro BUFFERZERO_TOOLZERO_UNLOAD_ASSIST]
description: Optional one-shot blocking retract away from Tool0
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set distance = params.DISTANCE|default(vars.unload_move)|float %}
    {% set speed = params.SPEED|default(vars.move_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}

    BUFFERZERO_TOOLZERO_BEGIN_SERVICE
    _BUFFERZERO_TOOLZERO_BLOCKING_MOVE DISTANCE=-{distance} SPEED={speed} ACCEL={accel}
    BUFFERZERO_TOOLZERO_END_SERVICE

[gcode_macro BUFFERZERO_TOOLZERO_START_UNLOAD_TENSION]
description: Start low-force Buffer0 take-up tension for unload
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set current = params.CURRENT|default(0.18)|float %}
    {% set distance = params.DISTANCE|default(80)|float %}
    {% set speed = params.SPEED|default(8)|float %}
    {% set accel = params.ACCEL|default(100)|float %}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: starting unload tension CURRENT={current} DISTANCE={distance} SPEED={speed}"

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0

    SET_TMC_CURRENT STEPPER="buffer0_motor" CURRENT={current}
    G4 P250

    MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE=-{distance} SPEED={speed} ACCEL={accel} SYNC=0

#####################################################################
#                  Buffer0 Near-Overfill Positioning
#####################################################################
# Purpose:
# - Moves Buffer0 toward the overfill / spring-loaded side using a
#   blocking manual-stepper move.
# - Positive Buffer0 movement feeds filament toward Tool0 in your current
#   buffer0.cfg, so positive DISTANCE is used to build buffer spring force.
# - Use this before LOAD_FILAMENT so Tool0 has slack to grab/feed.
# - Use this before UNLOAD_FILAMENT so the buffer has spring force to pull
#   filament away from the hotend/extruder path.
#
# Notes:
# - This is intentionally a fixed blocking move, not a Hall-polled loop.
# - The entrance-sensor initial fill below is Hall-polled because it uses
#   delayed_gcode loops between short moves.
# - A true stop-on-Hall move would require wiring HALL1 as the
#   [manual_stepper] endstop_pin and using MANUAL_STEPPER STOP_ON_ENDSTOP,
#   which conflicts with using the same pin as [gcode_button] unless the
#   signal is duplicated or the config is redesigned.
#####################################################################

[gcode_macro BUFFERZERO_TOOLZERO_POSITION_NEAR_OVERFILL]
description: Move Buffer0 toward near-overfill / spring-loaded state
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set distance = params.DISTANCE|default(25)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}
    {% set arm_after = params.ARM_AFTER|default(0)|int %}
    {% set disable_after = params.DISABLE_AFTER|default(0)|int %}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: positioning near overfill DISTANCE={distance} SPEED={speed} ARM_AFTER={arm_after}"

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0

    MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE={distance} SPEED={speed} ACCEL={accel}
    M400

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0

    {% if arm_after == 1 %}
        BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION RESET_OVERFILL=0
    {% endif %}

    {% if disable_after == 1 %}
        BUFFERZERO_TOOLZERO_RELEASE_MOTOR
    {% endif %}

[gcode_macro _BUFFERZERO_TOOLZERO_REGULATE_BLOCKING]
description: Poll Hall states and feed Buffer0 with a blocking move for load/unload macros
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}

    {% set h1 = printer["gcode_button buffer0_tool0_hall1"].state %}
    {% set h2 = printer["gcode_button buffer0_tool0_hall2"].state %}
    {% set h3 = printer["gcode_button buffer0_tool0_hall3"].state %}

    {% set distance = 0 %}
    {% set reason = "hold" %}

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0

    {% if h1 == "RELEASED" %}
        {% set distance = 0 %}
        {% set reason = "overfill / stop feed" %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=1

    {% elif h1 == "PRESSED" and h2 == "PRESSED" and h3 == "RELEASED" %}
        {% set distance = vars.feed_empty|float %}
        {% set reason = "empty / no slack" %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0

    {% elif h2 == "PRESSED" and h3 == "RELEASED" %}
        {% set distance = vars.feed_low|float %}
        {% set reason = "low slack" %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0

    {% elif h2 == "RELEASED" %}
        {% set distance = vars.feed_mid|float %}
        {% set reason = "demand / midpoint" %}
        SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
    {% endif %}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0 blocking regulator: H1={h1} H2={h2} H3={h3} feed={distance} reason={reason}"

    {% if distance > 0 %}
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
        MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE={distance} SPEED={vars.move_speed} ACCEL={vars.move_accel}
        M400
    {% endif %}

#####################################################################
#                  Manual Feed/Retract Buttons
#####################################################################
# Purpose:
# - Physical feed/retract buttons for Buffer0.
# - Button movement is blocking and loops while the button is held.
# - Manual operation temporarily suppresses automatic regulator moves.
#####################################################################

[gcode_button buffer0_tool0_feed_button]
pin: ^!Buffer0:PB12
press_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 feed button pressed - starting continuous feed"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_MANUAL_FEED VARIABLE=active VALUE=1
    _BUFFERZERO_TOOLZERO_MANUAL_FEED
release_gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 feed button released"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_MANUAL_FEED VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_feed_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_reenable_autofeed DURATION={vars.reenable_delay}

[gcode_button buffer0_tool0_retract_button]
pin: ^!Buffer0:PB13
press_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 retract button pressed - starting continuous retract"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_MANUAL_RETRACT VARIABLE=active VALUE=1
    _BUFFERZERO_TOOLZERO_MANUAL_RETRACT
release_gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 retract button released"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_MANUAL_RETRACT VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_retract_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_reenable_autofeed DURATION={vars.reenable_delay}

#####################################################################
#                  Manual Control Macros
#####################################################################

[gcode_macro _BUFFERZERO_TOOLZERO_MANUAL_FEED]
variable_active: 0
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% if active == 1 %}
        _BUFFERZERO_TOOLZERO_BLOCKING_MOVE DISTANCE={vars.manual_move} SPEED={vars.move_speed} ACCEL={vars.move_accel}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_feed_loop DURATION={vars.loop_time}
    {% endif %}

[delayed_gcode _bufferzero_toolzero_manual_feed_loop]
gcode:
    _BUFFERZERO_TOOLZERO_MANUAL_FEED

[gcode_macro _BUFFERZERO_TOOLZERO_MANUAL_RETRACT]
variable_active: 0
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% if active == 1 %}
        _BUFFERZERO_TOOLZERO_BLOCKING_MOVE DISTANCE=-{vars.manual_move} SPEED={vars.move_speed} ACCEL={vars.move_accel}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_manual_retract_loop DURATION={vars.loop_time}
    {% endif %}

[delayed_gcode _bufferzero_toolzero_manual_retract_loop]
gcode:
    _BUFFERZERO_TOOLZERO_MANUAL_RETRACT

[delayed_gcode _bufferzero_toolzero_reenable_autofeed]
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}

    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Re-enabling auto-feed system"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0

    {% if state.system_enabled == 1 and state.continuous_fill == 0 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_start_delay}
    {% endif %}

#####################################################################
#                  Buffer Initial Fill / Entrance Sensor
#####################################################################
# Purpose:
# - Entrance sensor enables the buffer and runs initial fill.
# - Initial fill feeds in small blocking increments until HALL1 overfill
#   is reached.
# - HALL2 and HALL3 do not end initial fill anymore; they are only
#   useful as intermediate state indicators while pushing toward overfill.
# - Small increments keep the overfill push controlled and prevent one
#   long blind shove through PTFE resistance.
# - A safety counter aborts initial fill if HALL1 overfill is never seen.
# - Once overfill is reached, normal operation switches to the regulator
#   loop with overfill_lock set.
#####################################################################

[filament_switch_sensor _buffer0_tool0_entrance]
switch_pin: ^!Buffer0:PB7
pause_on_runout: False
insert_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Filament detected, filling until HALL1 overfill"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0
    _BUFFERZERO_TOOLZERO_INITIAL_FILL_CONTROL
runout_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Filament runout detected at entrance"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
    BUFFERZERO_TOOLZERO_DISABLE_AUTO

[gcode_macro _BUFFERZERO_TOOLZERO_INITIAL_FILL_CONTROL]
description: Feed Buffer0 in short steps until HALL1 overfill is reached
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    {% set h1 = printer["gcode_button buffer0_tool0_hall1"].state %}
    {% set h2 = printer["gcode_button buffer0_tool0_hall2"].state %}
    {% set h3 = printer["gcode_button buffer0_tool0_hall3"].state %}
    {% set fill_count = state.initial_fill_count|int %}
    {% set max_moves = vars.initial_fill_max_moves|int %}

    {% if state.system_enabled == 1 and state.continuous_fill == 1 and state.manual_operation == 0 and state.service_operation == 0 %}
        {% if h1 == "RELEASED" %}
            _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 initial fill complete: HALL1 overfill reached"
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=1
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
            UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
            UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_start_delay}

        {% elif fill_count >= max_moves %}
            _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 initial fill aborted: max moves reached before HALL1 overfill H1={h1} H2={h2} H3={h3}"
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
            UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
            UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0
            MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=0

        {% else %}
            {% if vars.debug == 1 %}
                _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 initial fill: pushing to overfill move={fill_count + 1}/{max_moves} H1={h1} H2={h2} H3={h3}"
            {% endif %}

            MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1
            MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0
            MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE={vars.initial_fill_move} SPEED={vars.initial_fill_speed} ACCEL={vars.initial_fill_accel}
            M400

            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE={fill_count + 1}
            UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION={vars.initial_fill_loop_time}
        {% endif %}
    {% endif %}

[delayed_gcode _bufferzero_toolzero_initial_fill_loop]
gcode:
    _BUFFERZERO_TOOLZERO_INITIAL_FILL_CONTROL

#####################################################################
#                  Buffer Hall Sensors
#####################################################################
# Purpose:
# - HALL1 is the overfill limiter.
# - HALL2 is a demand/midpoint event.
# - HALL3 is an upper neck-state indicator, but it no longer ends
#   entrance-sensor initial fill.
# - Initial fill only stops on HALL1 overfill or the safety counter.
# - Hall events do not run independent feed bursts; they update state and
#   wake the regulator so there is only one feed decision path.
#####################################################################

[gcode_button buffer0_tool0_hall3]
pin: ^!Buffer0:PB4
press_gcode:
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL3 PRESSED - upper neck state observed"
    {% if state.continuous_fill == 0 %}
        _BUFFERZERO_TOOLZERO_REGULATE
    {% else %}
        _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL3 ignored for initial fill - continuing to HALL1 overfill"
    {% endif %}
release_gcode:
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL3 RELEASED - observed no-slack side of travel when H1/H2 are also pressed"
    {% if state.continuous_fill == 0 %}
        _BUFFERZERO_TOOLZERO_REGULATE
    {% endif %}

[gcode_button buffer0_tool0_hall2]
pin: ^!Buffer0:PB3
press_gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL2 PRESSED - regulator check"
    {% if vars.debug == 1 %}
        _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL2 press state: enabled={state.system_enabled} manual={state.manual_operation} service={state.service_operation} overfill={state.overfill_lock} async={state.async_active} fill={state.continuous_fill}"
    {% endif %}
    {% if state.continuous_fill == 0 %}
        _BUFFERZERO_TOOLZERO_REGULATE
    {% endif %}
release_gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL2 RELEASED - demand/midpoint event, regulator check"
    {% if vars.debug == 1 %}
        _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL2 release state: enabled={state.system_enabled} manual={state.manual_operation} service={state.service_operation} overfill={state.overfill_lock} async={state.async_active} fill={state.continuous_fill}"
    {% endif %}
    {% if state.continuous_fill == 0 %}
        _BUFFERZERO_TOOLZERO_REGULATE
    {% endif %}

[gcode_button buffer0_tool0_hall1]
pin: ^!Buffer0:PB2
press_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL1 PRESSED - clearing overfill lock"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
    _BUFFERZERO_TOOLZERO_REGULATE
release_gcode:
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 HALL1 RELEASED - overfill detected, pausing feed"
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=initial_fill_count VALUE=0
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0
    _BUFFERZERO_TOOLZERO_REGULATE

#####################################################################
#                  Closed-Loop Neck Regulator
#####################################################################
# Purpose:
# - Runs while Buffer0 is armed for Tool0.
# - Repeatedly samples Hall states and feeds only when current neck state
#   says slack is low.
# - This replaces the previous HALL2-only one-shot burst behavior.
#####################################################################

[delayed_gcode _bufferzero_toolzero_regulator_loop]
gcode:
    _BUFFERZERO_TOOLZERO_REGULATE

[gcode_macro _BUFFERZERO_TOOLZERO_REGULATE]
description: Poll Hall states and feed Buffer0 based on current neck position
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}

    {% set h1 = printer["gcode_button buffer0_tool0_hall1"].state %}
    {% set h2 = printer["gcode_button buffer0_tool0_hall2"].state %}
    {% set h3 = printer["gcode_button buffer0_tool0_hall3"].state %}

    {% set distance = 0 %}
    {% set reason = "hold" %}

    {% if state.system_enabled == 1 and state.continuous_fill == 0 and state.manual_operation == 0 and state.service_operation == 0 %}
        {% if h1 == "RELEASED" %}
            {% set distance = 0 %}
            {% set reason = "overfill / stop feed" %}
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=1

        {% elif h1 == "PRESSED" and h2 == "PRESSED" and h3 == "RELEASED" %}
            {% set distance = vars.feed_empty|float %}
            {% set reason = "empty / no slack" %}
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0

        {% elif h2 == "PRESSED" and h3 == "RELEASED" %}
            {% set distance = vars.feed_low|float %}
            {% set reason = "low slack" %}
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0

        {% elif h2 == "RELEASED" %}
            {% set distance = vars.feed_mid|float %}
            {% set reason = "demand / midpoint" %}
            SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=overfill_lock VALUE=0
        {% endif %}

        {% if vars.debug == 1 %}
            _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0 regulator: H1={h1} H2={h2} H3={h3} feed={distance} reason={reason} async={state.async_active}"
        {% endif %}

        {% if distance > 0 and state.async_active == 0 %}
            _BUFFERZERO_TOOLZERO_ASYNC_MOVE DISTANCE={distance} SPEED={vars.auto_speed} ACCEL={vars.move_accel}
        {% endif %}
    {% endif %}

    {% if state.system_enabled == 1 and state.continuous_fill == 0 %}
        UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION={vars.regulator_poll_time}
    {% endif %}

#####################################################################
#                  Debug / Test Helpers
#####################################################################

[gcode_macro BUFFERZERO_TOOLZERO_DEBUG_STATE]
description: Report Buffer0 state, Hall sensors, and tuning values
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set state = printer["gcode_macro _BUFFERZERO_TOOLZERO_AUTO_STATE"] %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 state: enabled={state.system_enabled} continuous_fill={state.continuous_fill} manual={state.manual_operation} service={state.service_operation} overfill={state.overfill_lock} async={state.async_active} initial_fill_count={state.initial_fill_count}"
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 buttons: hall1={printer["gcode_button buffer0_tool0_hall1"].state} hall2={printer["gcode_button buffer0_tool0_hall2"].state} hall3={printer["gcode_button buffer0_tool0_hall3"].state}"
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 regulator tuning: empty={vars.feed_empty} low={vars.feed_low} mid={vars.feed_mid} poll={vars.regulator_poll_time} speed={vars.auto_speed} accel={vars.move_accel}"
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0 initial-fill tuning: move={vars.initial_fill_move} speed={vars.initial_fill_speed} accel={vars.initial_fill_accel} loop={vars.initial_fill_loop_time} max_moves={vars.initial_fill_max_moves}"

[gcode_macro BUFFERZERO_TOOLZERO_TEST_ASYNC_FEED]
description: Force a non-blocking Buffer0 feed move for testing
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set distance = params.DISTANCE|default(vars.feed_empty)|float %}
    {% set speed = params.SPEED|default(vars.auto_speed)|float %}
    {% set accel = params.ACCEL|default(vars.move_accel)|float %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Forcing async feed DISTANCE={distance} SPEED={speed} ACCEL={accel}"
    _BUFFERZERO_TOOLZERO_ASYNC_MOVE DISTANCE={distance} SPEED={speed} ACCEL={accel}

[gcode_macro BUFFERZERO_TOOLZERO_TEST_BLOCKING_FEED]
description: Force a blocking Buffer0 feed move for direction/testing
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %}
    {% set distance = params.DISTANCE|default(40)|float %}
    {% set speed = params.SPEED|default(10)|float %}
    {% set accel = params.ACCEL|default(200)|float %}
    _BUFFERZERO_TOOLZERO_STATUS MSG="Buffer0/Tool0: Forcing blocking feed DISTANCE={distance} SPEED={speed} ACCEL={accel}"
    _BUFFERZERO_TOOLZERO_BLOCKING_MOVE DISTANCE={distance} SPEED={speed} ACCEL={accel}
