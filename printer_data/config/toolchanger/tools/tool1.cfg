# See docs/Config_Reference.md for a description of parameters.

[mcu T1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_34343433391351D7-if00
restart_method: command

#####################################################################
#   Nitehawk-36 Tool Board
#####################################################################

#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor T1_filament_sensor]
switch_pin: T1:gpio3
pause_on_runout: True
runout_gcode:
    M117 Filament runout T1
    RESPOND TYPE=error MSG="FILAMENT RUNOUT: T1_filament_sensor went empty during the print. Print paused."

#####################################################################
#   Extruder, specific to Jabberwocky, needs tweaked got sherpa
#####################################################################
[extruder1] # Extruder1 Fix this T1
step_pin: T1:gpio23
dir_pin: T1:gpio24
enable_pin: !T1:gpio25
microsteps: 16
rotation_distance: 21.98												#Sherpa Mini calibrated
gear_ratio: 50:8
full_steps_per_rotation: 200 #1.8deg Motor

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: T1:gpio9
sensor_type: PT1000
sensor_pin: T1:gpio29
min_temp: -90
max_temp: 350                                                      
pullup_resistor: 2200
control: pid                                                        
pid_Kp: 29.787 
pid_Ki: 6.018
pid_Kd: 36.862
min_extrude_temp: 145
max_extrude_only_distance: 1000                                     
max_extrude_cross_section: 30                                       
pressure_advance: 0.052                                             #Be sure to calibrate
pressure_advance_smooth_time: 0.040

[tmc2209 extruder1] # Fix this extruder T1
sense_resistor: 0.100
uart_pin: T1:gpio0
tx_pin: T1:gpio1
interpolate: false
run_current: 0.5                        #.45 minimum offers 12N of force. DO NOT EXCEED .55A as it will cause excess heat.

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T1_part_fan]
pin: T1:gpio6
kick_start_time: .3
off_below: 0.1


# ## HEF
[heater_fan T1_hotend_fan]
pin: T1:gpio5
tachometer_pin: T1:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: .1
heater: extruder1
heater_temp: 50.0
fan_speed: .8

#####################################################################
#   Lights
#####################################################################
# Toolhead Headlights moved to Neopixel_Control
# [neopixel T1_headlights]
# pin: T1:gpio7
# chain_count: 3
# color_order: GRBW
# initial_RED: 0.0
# initial_GREEN: 0.0
# initial_BLUE: 0.0
# initial_WHITE: 1.0

# PCB Activity Light
# [output_pin _T1_act_led]
# pin: !T1:gpio8

# #####################################################################
# #   Accelerometer
# #####################################################################
[adxl345 T1]
cs_pin: T1:gpio27
spi_software_sclk_pin: T1:gpio18
spi_software_mosi_pin: T1:gpio20
spi_software_miso_pin: T1:gpio19

[resonance_tester]
accel_chip: adxl345 T1
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

probe_points:
   175, 175, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor T1_temp]
sensor_type: temperature_mcu
sensor_mcu: T1
min_temp: 0
max_temp: 100

#####################################################################
#   Macros - Tools Specific
#####################################################################

[gcode_macro T1]
variable_active: 0
variable_color: "blue"
gcode:
    # Make sure the toolchanger state exists before selecting a tool.
    INITIALIZE_TOOLCHANGER

    # Let the toolchanger library perform the actual physical/tool state change.
    SELECT_TOOL T=1

    # After T1 is selected, restore all toolhead identity colors and set
    # only T1's nozzle/headlight LEDs to dim white.
    # The logo stays the tool/path color.
    SET_ACTIVE_TOOLHEAD_LEDS TOOL=1


#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T1]
#change this too T1
tool_number: 1 
detection_pin: ^!T1:gpio10 # Tap Trigger Pin
#if this were T1, then this would be extruder1, etc
extruder: extruder1
#Change T1_partfan to tool number
fan: T1_part_fan
# offset of the nozzle's orifice in relation to tool 0, so T0 is always null
gcode_x_offset: -0.310
gcode_y_offset: 0.120
gcode_z_offset: -0.229
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 101.30
params_park_y: 8.90
params_park_z: 290.70
# For InputShaper run per tool and enter the data here
params_input_shaper_type_x: '3hump_ei' # suggested max_accel <= 12100 mm/sec^2
params_input_shaper_freq_x: 105.2
params_input_shaper_damping_ratio_x: 0.048
params_input_shaper_type_y: 'mzv' # To avoid too much smoothing with 'mzv', suggested max_accel <= 12100 mm/sec^2
params_input_shaper_freq_y: 50.0
params_input_shaper_damping_ratio_y: 0.050

