# See docs/Config_Reference.md for a description of parameters.

[mcu T3]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339121E88-if00
restart_method: command

#####################################################################
#   Nitehawk-36 Tool Board
#####################################################################

#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor T3_filament_sensor]
switch_pin: T3:gpio3
pause_on_runout: True
runout_gcode:
    M117 Filament runout T3
    RESPOND TYPE=error MSG="FILAMENT RUNOUT: T3_filament_sensor went empty during the print. Print paused."

#####################################################################
#   Extruder
#####################################################################
[extruder3]
step_pin: T3:gpio23
dir_pin: T3:gpio24
enable_pin: !T3:gpio25
microsteps: 16
rotation_distance: 21.98												#Sherpa Mini calibrated
gear_ratio: 50:8
full_steps_per_rotation: 200 #1.8 deg Motor

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: T3:gpio9
sensor_type: PT1000
sensor_pin: T3:gpio29
min_temp: -90
max_temp: 350                                                      
pullup_resistor: 2200
control: pid                                                        
pid_Kp: 29.787 
pid_Ki: 6.018
pid_Kd: 36.862
min_extrude_temp: 145
max_extrude_only_distance: 1000                                     
max_extrude_cross_section: 30                                       
pressure_advance: 0.052                                             #Be sure to calibrate
pressure_advance_smooth_time: 0.040

[tmc2209 extruder3]
sense_resistor: 0.100
uart_pin: T3:gpio0
tx_pin: T3:gpio1
interpolate: false
run_current: 0.5                        #.45 minimum offers 12N of force. DO NOT EXCEED .55A as it will cause excess heat.

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T3_part_fan]
pin: T3:gpio6
kick_start_time: .3
off_below: 0.1


## HEF
[heater_fan T3_hotend_fan]
pin: T3:gpio5
tachometer_pin: T3:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: .1
heater: extruder3
heater_temp: 50.0
fan_speed: .8

#####################################################################
#   Lights
#####################################################################
# Toolhead Headlights moved to Neopixel_Control
# [neopixel T3_headlights]
# pin: T3:gpio7
# chain_count: 3
# color_order: GRBW
# initial_RED: 0.0
# initial_GREEN: 0.0
# initial_BLUE: 0.0
# initial_WHITE: 1.0

# PCB Activity Light
# [output_pin _T3_act_led]
# pin: !T3:gpio8

# #####################################################################
# #   Accelerometer
# #####################################################################
[adxl345 T3]
cs_pin: T3:gpio27
spi_software_sclk_pin: T3:gpio18
spi_software_mosi_pin: T3:gpio20
spi_software_miso_pin: T3:gpio19

[resonance_tester]
accel_chip: adxl345 T3
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

probe_points:
   175, 175, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor T3_temp]
sensor_type: temperature_mcu
sensor_mcu: T3
min_temp: 0
max_temp: 100

#####################################################################
#   Macros - Tools Specific
#####################################################################

[gcode_macro T3]
variable_active: 0
variable_color: "orange"
gcode:
    # Make sure the toolchanger state exists before selecting a tool.
    INITIALIZE_TOOLCHANGER

    # Let the toolchanger library perform the actual physical/tool state change.
    SELECT_TOOL T=3

    # After T3 is selected, restore all toolhead identity colors and set
    # only T3's nozzle/headlight LEDs to dim white.
    # The logo stays the tool/path color.
    SET_ACTIVE_TOOLHEAD_LEDS TOOL=3


#change the tool numbers to the tool you are configuring, ie T3, T3, etc
[tool T3]
#change this to Tn
tool_number: 3 
detection_pin: ^!T3:gpio10 # Tap Trigger pin
#if this were T3, then this would be extruder3, etc
extruder: extruder3
#Change T3_partfan to tool number
fan: T3_part_fan
# offset of the nozzle's orifice in relation to tool 0, so T0 is always null
gcode_x_offset: 0.280
gcode_y_offset: 0.450
gcode_z_offset: -0.513
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 242.10
params_park_y: 11.10
params_park_z: 290.50
# For InputShaper run per tool and enter the data here
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_freq_x: 86.0
params_input_shaper_damping_ratio_x: 0.085

params_input_shaper_type_y: '2hump_ei'
params_input_shaper_freq_y: 61.0
params_input_shaper_damping_ratio_y: 0.164

