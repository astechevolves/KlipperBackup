# Original written by Viesturs Zarins
# Modified by Justin F. Hallett
# Modified more by Jared Wellman
#
# G28.1 is used for native homing because G28 is handled by this override.
#
# Physical-switch homing order:
#   1. Move X 5 mm in the negative direction to clear the fixed X-switch mount if carrage happens to be against the positive side
#   2. Home Y and complete its normal second touch.
#   3. Move Y 7 mm away from the rear switch.
#   4. Home X and complete its normal second touch.
#   5. Move X 10 mm away from its switch.

[homing_override]
axes: xyz
gcode:
    {% set uses_tool_probe = printer["tool_probe_endstop"] is defined %}

    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}

    {% set rebound_y = params.REBOUND_Y|default(3.0)|float %}

    # Remember whether Z was legitimately homed before temporarily establishing
    # a Z position for clearance movement.
    {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}

    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set position_endstop_y = printer.configfile.config["stepper_y"]["position_endstop"]|float %}
    {% set position_endstop_x = printer.configfile.config["stepper_x"]["position_endstop"]|float %}

    INITIALIZE_TOOLCHANGER

    {% if uses_tool_probe and printer.probe.last_query %}
        RESPOND TYPE=error MSG="Z Probe triggered, cannot home."
    {% else %}
        ENTER_DOCKING_MODE
        SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
        G90

        # Establish enough Z clearance for XY movement without incorrectly
        # declaring X and Y homed.
        {% if not z_was_homed %}
            SET_KINEMATIC_POSITION SET_HOMED=Z Z=0
            G0 Z10 F1000
        {% elif printer.toolhead.position[2]|float < 10 %}
            G0 Z10 F1000
        {% endif %}

        {% if home_x %}
            # The fixed X switch is only aligned after Y reaches its rear home.
            # First perform a coordinated 5 mm negative-X move so the carriage
            # cannot strike the fixed switch mount while Y moves rearward.
            #
            # A raw FORCE_MOVE on one CoreXY stepper would produce diagonal
            # motion, so temporary XY coordinates are used for a straight move.
            SET_KINEMATIC_POSITION SET_HOMED=XY X=5 Y=0
            G90
            G0 X0 F600
            M400

            # Home Y first. The configured homing_retract_dist performs the
            # backoff and second switch touch.
            G28.1 Y

            # After the second Y touch, move exactly 7 mm away from the switch.
            G90
            G0 Y{position_endstop_y - rebound_y} F6000
            M400

            # Y is now positioned correctly to align the carriage with the
            # fixed X switch.
            G28.1 X

            # Preserve the existing 10 mm X clearance after its second touch.
            G90
            G0 X{position_endstop_x - 10.0} F6000
            M400

        {% elif home_y %}
            # Y-only calls are retained for the dock-height Y re-home performed
            # by the public G28 wrapper after X has already been safely positioned.
            G28.1 Y

            # Leave Y 7 mm away from the switch after its second touch.
            G90
            G0 Y{position_endstop_y - rebound_y} F6000
            M400
        {% endif %}

        EXIT_DOCKING_MODE

        {% if home_z %}
            {% set random_x = (range(-50, 50) | random) / 10 %}
            {% set random_y = (range(-50, 50) | random) / 10 %}

            G90
            G0 X{(max_x / 2) + random_x} Y{(max_y / 2) + random_y} F12000
            G28.1 Z

            {% if uses_tool_probe %}
                _ADJUST_Z_HOME_FOR_TOOL_OFFSET
            {% endif %}

            G0 Z10 F1000
        {% endif %}

        M400

        # XY-only homing may temporarily establish Z=0 for clearance.
        # Restore Z to the unhomed state unless this request actually homed Z.
        {% if not z_was_homed and not home_z %}
            SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        {% endif %}
    {% endif %}

