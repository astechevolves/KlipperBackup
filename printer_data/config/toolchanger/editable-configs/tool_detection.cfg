# Example config to setup per-tool probing and tool detection.
# Used in per-tool-probe examples.

[tool_probe_endstop]
crash_gcode:
    # Preserve the print if the active tool-detection signal is lost.
    RESPOND TYPE=error MSG='Active tool detection was lost. Print paused for recovery.'
    PAUSE


[gcode_macro INITIALIZE_TOOLCHANGER]
rename_existing: INITIALIZE_TOOLCHANGER_ORIG
gcode:
    _INITIALIZE_FROM_DETECTED_TOOL


[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL]
gcode:
    DETECT_ACTIVE_TOOL_PROBE
    _INITIALIZE_FROM_DETECTED_TOOL_IMPL


[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL_IMPL]
gcode:
    {% if printer.tool_probe_endstop.active_tool_number | int == -1 %}
        RESPOND TYPE=error MSG='Failed to detect active tool'
        PAUSE
    {% else %}
        { action_respond_info('initialize from detected tool') }
        INITIALIZE_TOOLCHANGER_ORIG T={printer.tool_probe_endstop.active_tool_number}
    {% endif %}


# Per-tool probe is not yet integrated with toolchanger tool detection.
# This macro adds a stopgap.
[gcode_macro VERIFY_TOOL_DETECTED]
rename_existing: VERIFY_TOOL_DETECTED_ORIG
gcode:
    # Allow the tool and detection signal to settle before checking it.
    G4 P200
    DETECT_ACTIVE_TOOL_PROBE
    _STOP_IF_INCORRECT_TOOL {rawparams}


[gcode_macro _STOP_IF_INCORRECT_TOOL]
gcode:
    {% set detected_tool = printer.tool_probe_endstop.active_tool_number | int %}

    {% if detected_tool == -1 %}
        # SELECT_TOOL_ERROR aborts the remaining toolchange without shutting
        # Klipper down, then invokes the configured [toolchanger] error_gcode.
        RESPOND TYPE=error MSG='No tool detected. Toolchange stopped for recovery.'
        SELECT_TOOL_ERROR MESSAGE="No tool detected during toolchange"

    {% elif 'T' in params and detected_tool != params.T | int %}
        # A tool is present, but it is not the tool that was requested.
        RESPOND TYPE=error MSG='Expected T{params.T}, but detected T{detected_tool}. Toolchange stopped for recovery.'
        SELECT_TOOL_ERROR MESSAGE="Expected T{params.T}, but detected T{detected_tool}"

    {% endif %}