

#####################################################################
#   X/Y AWD Motion Motors
#   LDO 42STH48-2504AH
#
# TMC Autotune motor database:
# - ldo-42sth48-2504ah is an alias of ldo-42sth48-2504ac.
# - AH is the high-temp variant of AC.
#
# Current printer.cfg:
# - run_current: 1.3
# - sense_resistor: 0.075
# - sensorless homing on stepper_x and stepper_y only
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 24
sgt: 2

[autotune_tmc stepper_x1]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 24
sgt: 2

[autotune_tmc stepper_y1]
motor: ldo-42sth48-2504ah
tuning_goal: performance
voltage: 24


#####################################################################
#   Z Motors
#   LDO 42STH48-2004AC
#
# Current printer.cfg:
# - run_current: 0.8
# - sense_resistor: 0.110
# - no sensorless homing on Z
#####################################################################

[autotune_tmc stepper_z]
motor: ldo-42sth48-2004ac
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2004ac
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_z2]
motor: ldo-42sth48-2004ac
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_z3]
motor: ldo-42sth48-2004ac
tuning_goal: performance
voltage: 24