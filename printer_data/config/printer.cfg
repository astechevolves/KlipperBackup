#####################################################################
#   Fan Control on MCU, not used
#####################################################################

# Fan and Heater_fan are being controlled by Nitehawk in toolheads
# [fan]
# ##  Print Cooling Fan - FAN0
# pin: PB7
# ##tachometer_pin: PB8
# kick_start_time: 0.5
# ##  Depending on your fan, you may need to increase this value
# ##  if your fan will not start. Can change cycle_time (increase)
# ##  if your fan is not able to slow down effectively
# off_below: 0.10

[heater_fan nevermore_fan]
pin: PB3                     # FAN1 PWM output on the Leviathan
#tachometer_pin: PB4         # Optional RPM feedback pin ifadded later
max_power: 1.0               # Allows full output when the fan is commanded on
kick_start_time: 0.5         # Brief startup boost to help the fan start reliably
heater: heater_bed           # Ties fan behavior to the bed heater object
heater_temp: 70           # Fan turns on when bed temperature is above 70C
fan_speed: 1.0               # Runs at full speed when active

[multi_pin _leviathan_mcu_fans]
pins: PF5, PF3                 # Drives both fan outputs from exp board (FAN4 + FAN5) together as one signal, tach pins are PF4 and Pf2, respectivly if needed. 

[temperature_fan leviathan_mcu_fans] # removed _ to unhide for ability to see and test fans
# [temperature_fan _leviathan_mcu_fans]
pin: multi_pin:_leviathan_mcu_fans   # Uses the combined multi_pin output for both fans
sensor_type: temperature_mcu        # Reads the Leviathan MCU’s internal temperature sensor
control: pid                        # Enables smooth fan speed ramping instead of on/off behavior
min_temp: 18                        # Lower bound of valid temperature readings (safety check)
max_temp: 120                       # Upper bound of valid temperature readings (safety cutoff)
target_temp: 45                     # Temperature the fan tries to maintain (in °C)

max_power: 0.8                      # Caps max PWM output to 80% of full fan power
shutdown_speed: 0.0                 # Forces fan OFF on shutdown (required for soft PWM)
max_speed: 1.0                      # Allows PID to request up to 100% (before max_power cap)
min_speed: 0                        # Minimum fan speed once active
kick_start_time: 1                # Briefly runs fan at 100% to ensure reliable startup

pid_Kp: 2.0                         # Proportional gain (how aggressively fan reacts to temp error)
pid_Ki: 0.5                         # Integral gain (corrects long-term temp drift)
pid_Kd: 2.0                         # Derivative gain (dampens rapid temp changes)
pid_deriv_time: 2.0                 # Smooths derivative response to reduce fan oscillation

