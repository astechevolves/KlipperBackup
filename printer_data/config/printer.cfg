#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

# Sensorless homing is contained within the macros.cfg

#####################################################################
#                  Idle Timeout
#####################################################################
# Purpose:
# - When the printer sits idle:
#   - turn off all tool/nozzle heaters
#   - disable all buffer regulators and release buffer motors
#   - release printer steppers
#
# Notes:
# - timeout is in seconds.
# - 900 = 15 minutes.
#####################################################################

[idle_timeout]
timeout: 900

gcode:
    M118 Idle timeout reached - shutting down bed, tools, and buffers

    # Comment out portoins not wanted to be included in the timeout.

    # Turn off all toolchanger nozzle heaters.
    {% if printer.toolchanger is defined %}
        {% for tn in printer.toolchanger.tool_numbers %}
            M104 S0 T{tn}
        {% endfor %}
    {% else %}
        # Fallback for single-tool mode.
        M104 S0
    {% endif %}

    # Turn off the bed
    M140 S0

    # Disable all buffer regulators and release buffer motors.
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1

    # Release printer motors.
    M84

# [safe_z_home] # Disable because toolchanger has a custom version
# ##  XY Location of the Z Endstop Switch
# ##  Update -10,-10 to the XY coordinates of your endstop pin 
# ##  (such as 157,305) after going through Z Endstop Pin
# ##  Location Definition step.
# home_xy_position: 234,350
# speed:100
# z_hop:10

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

#--------------------------------------------------------------------

##  Gantry Corners for 350mm Build
gantry_corners:
  -48,7
  395,428
#  Probe points
points:
  50,50
  50,298
  298,298
  298,50
  
speed: 500
horizontal_move_z: 6
max_adjust: 6 # max delt allowed before it will complain instead of fixing it. 
retries: 5
retry_tolerance: 0.015

[rounded_path] # rounds out non printing g-code moves to reduce jerk
resolution: 0.2
replace_g0: False

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PG9, EXP1_2=PG12,
    EXP1_3=PG13, EXP1_4=PG14,
    EXP1_5=PC13, EXP1_6=PC14,    # Slot in the socket on this side
    EXP1_7=PC15, EXP1_8=PF0,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PE2, EXP2_4=PE4,
    EXP2_5=PE3, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PE5, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PE4


