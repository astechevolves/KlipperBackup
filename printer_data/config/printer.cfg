# See docs/Config_Reference.md for a description of parameters.
[respond]

[save_variables]
filename = ~/demon_vars.cfg

[include mainsail.cfg]
# Tool changer Specific
[include toolchanger/editable-configs/toolchanger-include.cfg]
[include toolchanger/tools/tool0.cfg]
[include toolchanger/tools/buffer0.cfg]
[include toolchanger/tools/knomi.cfg]

[include KAMP_Settings.cfg]
[include demon-poop-chute.cfg.cfg]
# Tool head led logo and nozzle lights
[include Neopixel_Control.cfg]
[include Heat_Soak_SB_LEDs.cfg]


# [include KlipperScreen_button_macros.cfg] #Custom Klipperscreen Menu macros
[include macros.cfg] #all my macros and calls to some of the demon configs
[include timelapse.cfg] #figure out later when cam is installed

[exclude_object]

[virtual_sdcard]
path: /home/goofballtech/printer_data/gcodes

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_27001A000751333232323930-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500  # Max speed that the printer can travel a 90 corner at, part of a math problem that changes speeds based on corner angles for > or < 90
max_accel: 12000
max_z_velocity: 50          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 600
square_corner_velocity: 5.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[bed_mesh]
speed: 500
horizontal_move_z: 5 # height for moves
mesh_min: 50,50 # Min corner for meshes of full bed
mesh_max: 300,300 # Max corner for full bed meshes
probe_count: 5, 5 
adaptive_margin: 10 # Adding space around the adaptive mesh

[gcode_macro homing_override_config]
variable_sensorless_x: True # Enable for sensorless homing on X axis
variable_sensorless_y: True # Enable for sensorless homing on Y axis
variable_homing_rebound_y: 20 # for sensorless you probably want this set to 20.
variable_stepper_driver: "tmc5160"
variable_homing_current: 0.47

#####################################################################
#   X/Y Stepper Settings
#   Using LDO Motors 42STH48-2504AH NEMA 17 Stepper Motor - High Performance High Temperature for AWD
#   1.8 degree, 200 Steps per rev, 2.5 amp
#####################################################################

##  A Stepper - Back Left
##  Connected to HV STEPPER 2
##  Endstop connected to Y-ENDSTOP
[stepper_x]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PG2
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
# endstop_pin: tool1:gpio13 # Pin for end stop on Nitehawk
# endstop_pin: PC1 # pin on the main board

position_min: 0
position_endstop: 350
position_max: 350

endstop_pin: tmc5160_stepper_x:virtual_endstop # sensorless homing
homing_speed: 30   #Max 100
homing_retract_dist: 0 # Used for microswitch second touch
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PB12
spi_bus: spi2
diag0_pin: ^!PG3
driver_sgt: 2 # -64 is most sensitive value, 63 is least sensitive
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0

#  B1 Stepper - Front Left
#  Connected to HV STEPPER 1
[stepper_x1]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x1]
cs_pin: PE11
spi_bus: spi4
# diag0_pin: ^!PE10
driver_sgt: 2 # -64 is most sensitive value, 63 is least sensitive
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0



##  B Stepper - Back Right
##  Connected to HV STEPPER 3
##  Endstop connected to X-ENDSTOP
[stepper_y]
step_pin: PG4
dir_pin: !PE8
enable_pin: !PB0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200 

endstop_pin: tmc5160_stepper_y:virtual_endstop # sensorless homing
# endstop_pin: PC2 # Pin on main MCU

position_min: 0
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 40  #Max 100
homing_retract_dist: 0 # Used for microswitch second touch
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PG5
spi_bus: spi2
diag0_pin: ^!PE7
driver_sgt: 2 # -64 is most sensitive value, 63 is least sensitive
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0

#  A1 Stepper - Front Right
#  Connected to HV STEPPER 0
[stepper_y1]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 200 for 1.8 degree stepper

[tmc5160 stepper_y1]
cs_pin: PE15
spi_bus: spi4
# diag0_pin: ^!PG1
driver_sgt: 2 # -64 is most sensitive value, 63 is least sensitive
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0


#####################################################################
#   Buzzer
#####################################################################

[pwm_cycle_time _beeper]
## Passive Buzzer - varying cycle time varies the pitch
pin: PB1
shutdown_value: 0
value: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to STEPPER 0
##  Endstop connected to Z-ENDSTOP
[stepper_z]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16  
microsteps: 32
# endstop_pin: PC1 # Endtop pin on main MCU
# position_endstop: 1 # not used with virtual pin
endstop_pin: probe:z_virtual_endstop

homing_retract_dist: 0
position_min: -10
position_max: 345

homing_speed: 20
second_homing_speed: 6

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z]
uart_pin: PD5
#diag_pin: ^!PD6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
