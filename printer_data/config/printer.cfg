[exclude_object]

[virtual_sdcard]
path: /home/goofballtech/printer_data/gcodes
on_error_gcode:
    {% set tc = printer.toolchanger if "toolchanger" in printer else {} %}

    {% if tc.status|default("") == "error" %}
        # The toolchanger already created PAUSE_STATE. Calling PAUSE again is
        # harmless and, critically, leaves the virtual-SD file open for RESUME.
        PAUSE
    {% else %}
        # Retain normal cancellation and cleanup for unrelated G-code errors.
        CANCEL_PRINT
    {% endif %}

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_27001A000751333232323930-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500  # Max speed that the printer can travel a 90 corner at, part of a math problem that changes speeds based on corner angles for > or < 90
max_accel: 12000
max_z_velocity: 40         #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 600
square_corner_velocity: 5

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_6D98551A4E5737374D202020FF0B1B43-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 38 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
speed: 15                    # Z descent speed when Beacon approaches the bed
restart_method: command

[bed_mesh]
speed: 500
horizontal_move_z: 2 # height for moves
mesh_min: 30, 90 # Min corner for meshes of full bed
mesh_max: 320, 300 # Max corner for full bed meshes
probe_count: 20, 20 
adaptive_margin: 10 # Adding space around the adaptive mesh
algorithm: bicubic
zero_reference_position: 175, 175

