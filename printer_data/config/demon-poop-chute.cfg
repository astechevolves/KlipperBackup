#####################################################################
#                    Standalone Poop Pellet Shoot Macro
#                    Voron 2.4 / StealthChanger / LLL Plus Buffer0
#####################################################################
# Purpose:
# - Takes control of Buffer0 for a standalone poop-pellet purge.
# - Stops the normal Buffer0 auto-maintain loop so it cannot interfere.
# - Desyncs Buffer0 before setup to clear any stale sync state.
# - Centers Buffer0 before purge so the filament path does not start
#   in negative or positive tension.
# - Syncs Buffer0 through ALL intentional E moves: anchor, purge, retract.
# - Desyncs Buffer0 after E motion is complete.
# - Wipes, cools, and shoots the pellet into the bucket.
#
# Printer assumptions:
# - This is called manually / standalone when no print is active.
# - Tool0 hotend is the active Klipper extruder when this macro is called.
# - Buffer0 is the paired LLL Plus buffer for the active tool.
# - Existing Buffer0 macros are present:
#     CENTER_BUFFER_0
#     STOP_CENTER_BUFFER_0
#     BUFFER_SYNC_ON_0
#     BUFFER_SYNC_OFF_0
# - Existing delayed auto-maintain loop is present:
#     _AUTO_MAINTAIN_LOOP_BUFFER0
#
# Important:
# - CENTER_BUFFER_0 is expected to fully complete before returning.
# - If CENTER_BUFFER_0 only starts an async/delayed centering routine,
#   that macro should be fixed to support blocking completion or a callback.
#####################################################################

[gcode_macro POOP_PELLET_SHOOT]
description: Center Buffer0, form a purge pellet, and shoot it off the bed/bucket edge.

# -------------------------------------------------------------------
# Temperature tuning
# -------------------------------------------------------------------
variable_purge_temp: 250.0             # Hotend temp used while forming the pellet
variable_shoot_temp: 175.0             # Cooldown temp before mechanically shooting the pellet
variable_temp_tolerance: 2.0           # Temperature wait tolerance for heat/cool waits

# -------------------------------------------------------------------
# Pellet forming location
# -------------------------------------------------------------------
variable_form_x: 310.0                 # X location where pellet is formed
variable_form_y: 15.0                  # Y location where pellet is formed
variable_form_z: 0.35                  # Starting Z height for pellet formation
variable_travel_z: 10.0                # Safe travel height around purge/shoot area
variable_z_speed: 600                  # Z movement speed in mm/min
variable_travel_speed: 12000           # XY travel speed in mm/min

# -------------------------------------------------------------------
# Pellet extrusion tuning
# -------------------------------------------------------------------
variable_filament_diameter: 1.75       # Used to convert poop_flow_mm3s into E feedrate
variable_purge_length: 45.0            # Total filament length extruded into pellet
variable_anchor_length: 6.0            # Slow initial extrusion to stick pellet to surface
variable_anchor_speed: 180             # Anchor extrusion speed in mm/min
variable_poop_flow_mm3s: 8.0           # Volumetric purge flow while forming pellet
variable_purge_chunk_mm: 6.0           # Chunk size for purge body extrusion
variable_pellet_z_lift: 2.8            # Z lift while extruding body of pellet
variable_retract_length: 2.0           # Matched hotend+buffer retract after pellet formation
variable_retract_speed: 1800           # Retract speed in mm/min
variable_settle_ms: 250                # Short pause after pellet formation

# -------------------------------------------------------------------
# Wipe-away / neck-forming move
# -------------------------------------------------------------------
variable_wipe_x: 310.0                 # Move here after retract to pull/string away from pellet
variable_wipe_y: 18.0                  # Keep near pellet unless you want a longer neck pull
variable_wipe_z: 8                  # Z height during wipe-away move
variable_wipe_speed: 4500              # Wipe-away speed in mm/min

# -------------------------------------------------------------------
# Pellet shooting tuning
# -------------------------------------------------------------------
variable_shoot_start_x: 310.0          # Nozzle starts behind pellet here
variable_shoot_start_y: 23.0           # Nozzle starts behind pellet here
variable_shoot_end_x: 310.0            # Nozzle pushes toward this location
variable_shoot_end_y: 0.0              # Nozzle pushes toward this location
variable_shoot_z: 0.7                  # Nozzle height while pushing pellet
variable_shoot_speed: 18000            # Fast push speed in mm/min
variable_shoot_passes: 1               # Number of push attempts

gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set th = printer.toolhead %}
    {% set active_extruder = th.extruder %}

    # Runtime tuning overrides.
    {% set purge_temp = params.TEMP|default(vars.purge_temp)|float %}
    {% set shoot_temp = params.SHOOT_TEMP|default(vars.shoot_temp)|float %}
    {% set temp_tolerance = params.TEMP_TOLERANCE|default(vars.temp_tolerance)|float %}

    {% set form_x = params.FORM_X|default(vars.form_x)|float %}
    {% set form_y = params.FORM_Y|default(vars.form_y)|float %}
    {% set form_z = params.FORM_Z|default(vars.form_z)|float %}
    {% set travel_z = params.TRAVEL_Z|default(vars.travel_z)|float %}
    {% set z_speed = params.Z_SPEED|default(vars.z_speed)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(vars.travel_speed)|float %}

    {% set filament_diameter = params.FILAMENT_DIAMETER|default(vars.filament_diameter)|float %}
    {% set purge_length = params.PURGE|default(vars.purge_length)|float %}
    {% set anchor_length = params.ANCHOR|default(vars.anchor_length)|float %}
    {% set anchor_speed = params.ANCHOR_SPEED|default(vars.anchor_speed)|float %}
    {% set poop_flow_mm3s = params.FLOW|default(vars.poop_flow_mm3s)|float %}
    {% set purge_chunk_mm = params.CHUNK|default(vars.purge_chunk_mm)|float %}
    {% set pellet_z_lift = params.PELLET_Z_LIFT|default(vars.pellet_z_lift)|float %}
    {% set retract_length = params.RETRACT|default(vars.retract_length)|float %}
    {% set retract_speed = params.RETRACT_SPEED|default(vars.retract_speed)|float %}
    {% set settle_ms = params.SETTLE_MS|default(vars.settle_ms)|int %}

    {% set wipe_x = params.WIPE_X|default(vars.wipe_x)|float %}
    {% set wipe_y = params.WIPE_Y|default(vars.wipe_y)|float %}
    {% set wipe_z = params.WIPE_Z|default(vars.wipe_z)|float %}
    {% set wipe_speed = params.WIPE_SPEED|default(vars.wipe_speed)|float %}

    {% set shoot_start_x = params.SHOOT_START_X|default(vars.shoot_start_x)|float %}
    {% set shoot_start_y = params.SHOOT_START_Y|default(vars.shoot_start_y)|float %}
    {% set shoot_end_x = params.SHOOT_END_X|default(vars.shoot_end_x)|float %}
    {% set shoot_end_y = params.SHOOT_END_Y|default(vars.shoot_end_y)|float %}
    {% set shoot_z = params.SHOOT_Z|default(vars.shoot_z)|float %}
    {% set shoot_speed = params.SHOOT_SPEED|default(vars.shoot_speed)|float %}
    {% set shoot_passes = params.SHOOT_PASSES|default(vars.shoot_passes)|int %}

    # Home if needed because this macro intentionally moves near the purge bucket / bed edge.
    {% if "x" not in th.homed_axes or "y" not in th.homed_axes or "z" not in th.homed_axes %}
        _CG28
    {% endif %}

    # Make sure all configured coordinates are inside Klipper's known travel envelope.
    # This still allows purge buckets outside the bed as long as they are inside axis limits.
    {% if form_x < th.axis_minimum.x or form_x > th.axis_maximum.x or
          wipe_x < th.axis_minimum.x or wipe_x > th.axis_maximum.x or
          shoot_start_x < th.axis_minimum.x or shoot_start_x > th.axis_maximum.x or
          shoot_end_x < th.axis_minimum.x or shoot_end_x > th.axis_maximum.x %}
        {action_raise_error("POOP_PELLET_SHOOT X coordinate is outside configured axis limits.")}
    {% endif %}

    {% if form_y < th.axis_minimum.y or form_y > th.axis_maximum.y or
          wipe_y < th.axis_minimum.y or wipe_y > th.axis_maximum.y or
          shoot_start_y < th.axis_minimum.y or shoot_start_y > th.axis_maximum.y or
          shoot_end_y < th.axis_minimum.y or shoot_end_y > th.axis_maximum.y %}
        {action_raise_error("POOP_PELLET_SHOOT Y coordinate is outside configured axis limits.")}
    {% endif %}

    {% if form_z < th.axis_minimum.z or form_z > th.axis_maximum.z or
          wipe_z < th.axis_minimum.z or wipe_z > th.axis_maximum.z or
          shoot_z < th.axis_minimum.z or shoot_z > th.axis_maximum.z or
          travel_z < th.axis_minimum.z or travel_z > th.axis_maximum.z %}
        {action_raise_error("POOP_PELLET_SHOOT Z coordinate is outside configured axis limits.")}
    {% endif %}

    # Prevent invalid purge chunking.
    {% if purge_chunk_mm <= 0 %}
        {action_raise_error("POOP_PELLET_SHOOT CHUNK must be greater than 0.")}
    {% endif %}

    # Save the original active tool temperature target so the macro can restore idle state afterward.
    {% set original_target = printer[active_extruder].target|float %}

    # Use the active extruder config limit so flow tuning does not exceed Klipper's E-only cap.
    {% set max_e_feed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %}

    # Convert requested volumetric poop flow into filament feedrate.
    {% set filament_area = 3.14159 * (filament_diameter / 2.0) * (filament_diameter / 2.0) %}
    {% set requested_purge_feed = (poop_flow_mm3s / filament_area) * 60.0 %}
    {% set purge_feed = [requested_purge_feed, max_e_feed]|min %}
    {% set safe_retract_speed = [retract_speed, max_e_feed]|min %}
    {% set body_length = [purge_length - anchor_length, 0.0]|max %}

    SAVE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE

    # This macro owns Buffer0 while it runs.
    # Stop the normal hall-sensor auto-maintain loop so it cannot fight centering or synced E moves.
    UPDATE_DELAYED_GCODE ID=_AUTO_MAINTAIN_LOOP_BUFFER0 DURATION=0

    # Clear any stale centering or sync state before setup.
    STOP_CENTER_BUFFER_0
    M400
    BUFFER_SYNC_OFF_0
    M400

    # Heat the active hotend while Buffer0 is being prepared.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={purge_temp}

    # Center Buffer0 before any extrusion so the filament path does not start under stored tension.
    # This should be a complete centering operation, not a timed partial center.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT centering Buffer0"
    CENTER_BUFFER_0
    M400

    # Wait for the active hotend to reach purge temperature before any E motion.
    TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={purge_temp - temp_tolerance}

    # Absolute XYZ, relative E. This keeps the macro independent of the caller's slicer mode.
    G90
    M83

    # Move to the pellet forming location from a safe height first.
    G1 Z{travel_z} F{z_speed}
    G1 X{form_x} Y{form_y} F{travel_speed}
    G1 Z{form_z} F{z_speed}

    # Sync Buffer0 through the full intentional E sequence.
    # Anchor, purge, and retract all move both extruders so neither drive fights the other.
    BUFFER_SYNC_ON_0
    M400
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Buffer0 sync ON for pellet E sequence"

    # Slow anchor extrusion helps the pellet stick before higher-flow purge begins.
    {% if anchor_length > 0 %}
        G1 E{anchor_length} F{anchor_speed}
    {% endif %}

    # Build the pellet in short chunks while slowly lifting Z to make a compact blob.
    {% if body_length > 0 %}
        {% set chunks = (body_length / purge_chunk_mm)|round(0, "ceil")|int %}
        {% for i in range(chunks) %}
            {% set remaining = body_length - (i * purge_chunk_mm) %}
            {% set this_e = [purge_chunk_mm, remaining]|min %}
            {% set this_z = form_z + (pellet_z_lift * ((i + 1) / chunks)) %}
            G1 Z{this_z|round(3)} E{this_e|round(3)} F{purge_feed|round(0)}
        {% endfor %}
    {% endif %}

    # Retract while Buffer0 is still synced so the filament column moves as one system.
    {% if retract_length > 0 %}
        G1 E-{retract_length} F{safe_retract_speed|round(0)}
    {% endif %}

    # All intentional E motion is done. Desync before wipe/shoot travel moves.
    M400
    BUFFER_SYNC_OFF_0
    M400
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Buffer0 sync OFF after pellet E sequence"

    # Let the blob settle before the wipe/neck pull.
    {% if settle_ms > 0 %}
        G4 P{settle_ms}
    {% endif %}

    # Pull away from the pellet to thin or break the strand.
    G1 Z{wipe_z} F{z_speed}
    G1 X{wipe_x} Y{wipe_y} F{wipe_speed}

    # Cool the hotend before mechanical pellet contact so the nozzle is less likely to smear the pellet.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={shoot_temp}
    {% if shoot_temp < purge_temp %}
        TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={shoot_temp + temp_tolerance}
    {% endif %}

    # Shoot the pellet with one or more fast nozzle passes.
    {% for pass in range(shoot_passes) %}
        G1 Z{travel_z} F{z_speed}
        G1 X{shoot_start_x} Y{shoot_start_y} F{travel_speed}
        G1 Z{shoot_z} F{z_speed}
        M400
        G1 X{shoot_end_x} Y{shoot_end_y} F{shoot_speed}
    {% endfor %}

    # Lift clear before returning control.
    G1 Z{travel_z} F{z_speed}

    # Final safety cleanup.
    # Leave Buffer0 idle, desynced, and not in a centering routine.
    M400
    BUFFER_SYNC_OFF_0
    STOP_CENTER_BUFFER_0
    M400

    # Restore whatever hotend target existed before the macro was called.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={original_target}

    RESTORE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE MOVE=0

    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT complete using active extruder: {active_extruder}"