[display_status]

[delayed_gcode _BOOT_INIT_TOOLCHANGER]
initial_duration: 5
gcode:
    INITIALIZE_TOOLCHANGER
    _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS


#####################################################################
#                  Macro Message Control
#####################################################################

[gcode_macro _MACRO_MESSAGES]
description: Shared message controls for macros.cfg
variable_status_enabled: 1                    # 1 = show basic progress messages.
variable_debug: 0                             # 1 = show detailed debug messages.
gcode:
    # Variable storage only.


#####################################################################
#                  Buffer / Tool Map
#####################################################################
# Purpose:
# - Central map for installed buffers and tool-to-buffer pairing.
# - LLL-buffed firmware owns buffer entrance/hall behavior.
# - Klipper routes active-tool buffer actions to the correct CP2112 wrapper.
#
# Mapping flow:
# - active extruder object -> tool number
# - tool number -> mapped buffer number
# - buffer number -> BUFFER_*_N wrapper macro
#
# I2C address note:
# - Do not build I2C addresses here.
# - Each bufferN.cfg owns its own address in _LLL_BUFFER_VARS_N.
#####################################################################

[gcode_macro _BUFFER_USAGE_STATE]
description: Central buffer/tool map

variable_installed_buffers: "0,1,2,3,4"              # Installed buffer numbers. Later: "0,1,2,3,4"

variable_tool0_buffer: 0
variable_tool1_buffer: 1
variable_tool2_buffer: 2
variable_tool3_buffer: 3
variable_tool4_buffer: 4

# Use the full Klipper object name for each toolhead/nozzle sensor.
# These remain useful for hotend-side load/unload decisions.
variable_tool0_hotend_sensor: "filament_switch_sensor T0_filament_sensor"
variable_tool1_hotend_sensor: "filament_switch_sensor T1_filament_sensor"
variable_tool2_hotend_sensor: "filament_switch_sensor T2_filament_sensor"
variable_tool3_hotend_sensor: "" # "filament_switch_sensor T3_filament_sensor"
variable_tool4_hotend_sensor: "" # "filament_switch_sensor T4_filament_sensor"

gcode:
    # Central map only.

    
[gcode_macro _PRINT_START_TOOL_NOZZLE_STATE]
description: Set used tool nozzle LEDs white and idle tool nozzle LEDs to their static tool colors
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}

    # TOOL is the first/active print tool from PRINT_START.
    {% set print_tool = params.TOOL|default(vars.default_tool)|int %}

    # USED_TOOLS comes from Orca as a comma-separated list, usually with a trailing comma.
    # Example: USED_TOOLS="0,1,3,"
    #
    # T0 is always added because it is used for reference homing/QGL/mesh even
    # when it is not an actual print color.
    #
    # print_tool is also added as a fallback so the first print tool is marked
    # even if the slicer does not pass USED_TOOLS for some reason.
    {% set used_tools_raw = "0," ~ print_tool ~ "," ~ params.USED_TOOLS|default("")|string %}

    # Normalize into a comma-padded string so tool 1 does not accidentally match tool 10.
    {% set used_tools = "," ~ used_tools_raw|replace(" ", "") ~ "," %}

    {% for tool in range(vars.tool_count|int) %}
        {% set tool_key = tool|string %}

        # Pull each tool's idle color from the static tool color map.
        # This keeps idle nozzle color matched to the logo/static identity color.
        {% if tool_key in vars.tool_static_colors %}
            {% set idle_color = vars.tool_static_colors[tool_key] %}
        {% else %}
            {% set idle_color = vars.tool_static_colors['default'] %}
        {% endif %}

        {% if "," ~ tool_key ~ "," in used_tools %}
            # Tools involved in startup/print get white nozzle LEDs.
            # Use the named-color helper because COLOR= is a palette name.
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR="white" TRANSMIT=1
        {% else %}
            # Inactive tools keep nozzle LEDs matched to their static/logo color.
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={idle_color} TRANSMIT=1
        {% endif %}
    {% endfor %}
[gcode_macro _WIPE_NOZZLE]
description: Wipe nozzle using purge bucket / brush location from PRINT_START

# Brush / wipe tuning
variable_brush_top:            1.0       # Absolute Z height at the top of the brush.
variable_z_wipe_distance:      1.75       # How far below brush_top to plunge for wiping.
variable_clearance_z:          5.0       # Minimum Z height before any X/Y positioning moves.

# Dock collision protection
variable_dock_y_limit:         85.0      # If Y is at/below this and Z is high, XY travel can hit docks.
variable_dock_z_limit:         125.0     # Z above this is considered dock-height collision risk.
variable_dock_clearance_z:     120.0     # Z to lower to before XY travel when inside the dock-risk zone.

# Brush X travel range
variable_brush_start:          251.0     # Left-side wipe position.
variable_brush_width:          32.0      # Wipe stroke distance from brush_start to the right-side brush edge.
variable_safe_x_min:           235.0     # Minimum safe X allowed over the brush/bucket area.
variable_safe_x_max:           310.0     # Maximum safe X allowed over the brush/bucket area.

# Optional Y adjustment
variable_brush_y_offset:       0.0       # Offset from PRINT_START bucket_y if the brush line needs tuning.

# Zig-zag wipe tuning
variable_zigzag_y_max:         3.0       # Maximum Y offset added during wipe strokes. Set 0.0 for straight X-only wipes.
variable_zigzag_cycles:        4         # Number of Y min/max zig-zag cycles across each full X stroke.

# Motion tuning
variable_wipe_qty:             3         # Number of left/right wipe passes.
variable_prep_spd_xy:          9000      # Travel speed for staging moves.
variable_prep_spd_z:           1500      # Z move speed.
variable_wipe_spd_xy:          5000      # Wipe stroke speed.

gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle

    {% set ps = printer["gcode_macro PRINT_START"] %}
    {% set vars = printer["gcode_macro _WIPE_NOZZLE"] %}
    {% set th = printer.toolhead %}

    # Pull shared bucket Y from PRINT_START so the brush line tracks the bucket location.
    {% set wipe_y = ps.bucket_y|float + vars.brush_y_offset|float %}

    # Calculate the upper Y target used for zig-zag wipe strokes.
    # This is an offset from the normal brush Y line, not an absolute machine Y limit.
    {% set wipe_y_zigzag = wipe_y + vars.zigzag_y_max|float %}

    # Calculate wipe X endpoints and final wipe Z.
    {% set wipe_x_left = vars.brush_start|float %}
    {% set wipe_x_right = vars.brush_start|float + vars.brush_width|float %}
    {% set wipe_x_span = wipe_x_right - wipe_x_left %}
    {% set wipe_z = vars.brush_top|float - vars.z_wipe_distance|float %}

    # Each zig-zag cycle needs two X segments: one move to Y max, one move back to Y min.
    {% set zigzag_cycles = vars.zigzag_cycles|int %}
    {% set zigzag_segments = zigzag_cycles * 2 %}

    # Clamp staging X inside the known safe brush/bucket range.
    {% set stage_x = ps.bucket_entry_x|float %}
    {% if stage_x < vars.safe_x_min|float %}
        {% set stage_x = vars.safe_x_min|float %}
    {% elif stage_x > vars.safe_x_max|float %}
        {% set stage_x = vars.safe_x_max|float %}
    {% endif %}

    # Exit to the right side of the brush. Normally this is bucket_entry_x,
    # clamped to the safe range. If bucket_entry_x is not to the right of the
    # brush, fall back to safe_x_max so the final right move exits the bristles.
    {% set wipe_x_exit = stage_x if stage_x > wipe_x_right else (vars.safe_x_max|float) %}

    # Choose the Z height used before XY travel.
    # Normal behavior:
    #   Raise to at least clearance_z if currently low.
    #
    # Dock-risk behavior:
    #   If currently high and still in the risky dock Y zone, lower to dock_clearance_z
    #   before any X/Y movement so the top of the toolhead clears parked docks.
    {% set current_y = th.position.y|float %}
    {% set current_z = th.position.z|float %}

    {% if current_z > vars.dock_z_limit|float and current_y <= vars.dock_y_limit|float %}
        {% set safe_z = vars.dock_clearance_z|float %}
        RESPOND TYPE=command MSG="_WIPE_NOZZLE: dock-risk position Z={current_z} Y={current_y}. Lowering to Z={safe_z} before XY travel."
    {% elif current_z < vars.clearance_z|float %}
        {% set safe_z = vars.clearance_z|float %}
    {% else %}
        {% set safe_z = current_z %}
    {% endif %}

    # Refuse to wipe if the configured stroke leaves the safe brush range.
    {% if wipe_x_left < vars.safe_x_min|float %}
        { action_raise_error("_WIPE_NOZZLE: brush_start is below safe_x_min. Refusing wipe.") }
    {% endif %}

    {% if wipe_x_right > vars.safe_x_max|float %}
        { action_raise_error("_WIPE_NOZZLE: brush_start + brush_width exceeds safe_x_max. Refusing wipe.") }
    {% endif %}

    {% if wipe_x_right <= wipe_x_left %}
        { action_raise_error("_WIPE_NOZZLE: brush_width must produce a positive X travel distance. Refusing wipe.") }
    {% endif %}

    {% if wipe_x_exit <= wipe_x_right %}
        { action_raise_error("_WIPE_NOZZLE: wipe exit X must be to the right of the brush. Refusing wipe.") }
    {% endif %}

    {% if vars.zigzag_y_max|float < 0 %}
        { action_raise_error("_WIPE_NOZZLE: zigzag_y_max must be 0 or greater. Refusing wipe.") }
    {% endif %}

    {% if zigzag_cycles < 1 %}
        { action_raise_error("_WIPE_NOZZLE: zigzag_cycles must be 1 or greater. Refusing wipe.") }
    {% endif %}

    G90

    # Move to a safe Z before entering the brush/bucket area.
    # This may lower Z if the toolhead started high in the dock-risk zone.
    G1 Z{safe_z} F{vars.prep_spd_z}

    # Stage to the right/outside side of the brush before moving onto the brush Y line.
    G1 X{wipe_x_exit} F{vars.prep_spd_xy}

    # Move onto the brush Y line only after Z and X are safe.
    G1 Y{wipe_y} F{vars.prep_spd_xy}

    # Move to the right-side brush edge while still above the brush.
    G1 X{wipe_x_right} F{vars.prep_spd_xy}

    # Plunge at the right-side brush edge instead of the smaller/left X value.
    G1 Z{wipe_z} F{vars.prep_spd_z}

    # Wipe left, then right. Each X stroke is broken into sub-moves while Y alternates
    # between the normal brush line and the zig-zag max line.
    {% for wipes in range(vars.wipe_qty|int) %}

        # Right-to-left zig-zag stroke.
        {% for step in range(1, zigzag_segments + 1) %}
            {% set x_pos = wipe_x_right - ((wipe_x_span * step) / zigzag_segments) %}
            {% set y_pos = wipe_y_zigzag if step % 2 == 1 else wipe_y %}
            G1 X{x_pos} Y{y_pos} F{vars.wipe_spd_xy}
        {% endfor %}

        # Left-to-right zig-zag stroke.
        {% for step in range(1, zigzag_segments + 1) %}
            {% set x_pos = wipe_x_left + ((wipe_x_span * step) / zigzag_segments) %}
            {% set y_pos = wipe_y_zigzag if step % 2 == 1 else wipe_y %}
            G1 X{x_pos} Y{y_pos} F{vars.wipe_spd_xy}
        {% endfor %}

    {% endfor %}

    # Continue the final rightward wipe motion out of the brush before lifting.
    G1 X{wipe_x_exit} F{vars.wipe_spd_xy}

    # Return to the pre-wipe safe height after exiting so the nozzle is not lifted while buried.
    G1 Z{safe_z} F{vars.prep_spd_z}

    RESTORE_GCODE_STATE NAME=clean_nozzle

#####################################################################
#                  Active Tool Buffer Router
#####################################################################
# Purpose:
# - Route active-tool buffer actions through the mapped CP2112/I2C wrappers.
# - Tool0 / extruder  -> mapped buffer from variable_tool0_buffer
# - Tool1 / extruder1 -> mapped buffer from variable_tool1_buffer
#
# Assumption:
# - T0 selects [extruder].
# - T1 selects [extruder1].
# - Each bufferN.cfg has matching BUFFER_AUTO_N, BUFFER_OFF_N,
#   BUFFER_MOVE_N, and BUFFER_STATUS_N wrappers loaded.
#####################################################################

[gcode_macro _ACTIVE_BUFFER_NUMBER]
description: Debug helper showing which buffer is mapped to the active tool
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    M118 Active extruder {active_extruder} maps to Buffer{buffer}


[gcode_macro BUFFER_ARM_ACTIVE_TOOL]
description: Return the buffer paired to the currently active tool to native auto logic
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set direct_feed = params.DIRECT_FEED|default(0)|int %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if direct_feed %}
        _STATUS_MSG MSG="Buffer skipped - DIRECT_FEED=1"
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: skipped by DIRECT_FEED=1"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif buffer >= 0 %}
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: active_extruder={active_extruder} -> Buffer{buffer} AUTO"

        # This emits BUFFER_AUTO_0, BUFFER_AUTO_1, etc.
        # The matching bufferN.cfg owns the actual I2C address.
        BUFFER_AUTO_{buffer}

    {% else %}
        M118 No CP2112 buffer arm route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro BUFFER_DISABLE_ACTIVE_TOOL]
description: Disable or release the buffer paired to the current active tool
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if buffer >= 0 %}
        _DEBUG_MSG MSG="BUFFER_DISABLE_ACTIVE_TOOL: active_extruder={active_extruder} -> Buffer{buffer}, disable_motor={disable_motor}"

        {% if disable_motor %}
            # This emits BUFFER_OFF_0, BUFFER_OFF_1, etc.
            BUFFER_OFF_{buffer}
        {% else %}
            # This emits BUFFER_AUTO_0, BUFFER_AUTO_1, etc.
            BUFFER_AUTO_{buffer}
        {% endif %}

    {% else %}
        M118 No CP2112 buffer disable route for active extruder: {active_extruder}
    {% endif %}

[gcode_macro BUFFER_AUTO_ALL_BUFFERS]
description: Return all installed CP2112/lll-buffed buffers to native AUTO logic
gcode:
    # Uses installed_buffers from _BUFFER_USAGE_STATE.
    # DISABLE_MOTOR=0 makes BUFFER_DISABLE_ALL_BUFFERS route to BUFFER_AUTO_N.
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=0

[gcode_macro BUFFER_DISABLE_ALL_BUFFERS]
description: Disable all installed CP2112/lll-buffed buffers
gcode:
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set installed = map.installed_buffers|string %}

    _DEBUG_MSG MSG="BUFFER_DISABLE_ALL_BUFFERS: disable_motor={disable_motor}, installed_buffers={installed}"

    {% for b in installed.split(",") %}
        {% set n = b|trim %}

        {% if n != "" %}
            {% if disable_motor %}
                # This emits BUFFER_OFF_0, BUFFER_OFF_1, etc.
                BUFFER_OFF_{n}
            {% else %}
                # This emits BUFFER_AUTO_0, BUFFER_AUTO_1, etc.
                BUFFER_AUTO_{n}
            {% endif %}
        {% endif %}
    {% endfor %}

# Some buffer settins are stored in RAM, in order for these to be verified on a normal basis we need to make sure they are applied at major steps in the process. 
[gcode_macro _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS]
description: Apply configured defaults (within the buffer file) to all installed CP2112/lll-buffed buffers
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set installed = map.installed_buffers|string %}

    _DEBUG_MSG MSG="BUFFER_APPLY_DEFAULTS_ALL_BUFFERS: installed_buffers={installed}"

    {% for b in installed.split(",") %}
        {% set n = b|trim %}

        {% if n != "" %}
            _DEBUG_MSG MSG="BUFFER_APPLY_DEFAULTS_ALL_BUFFERS: applying BUFFER_APPLY_DEFAULTS_{n}"

            # This emits BUFFER_APPLY_DEFAULTS_0, BUFFER_APPLY_DEFAULTS_1, etc.
            # Each numbered buffer file owns its own configured defaults.
            BUFFER_APPLY_DEFAULTS_{n}
        {% endif %}
    {% endfor %}

[gcode_macro BUFFER_MOVE_ACTIVE_TOOL]
description: Move active tool buffer using firmware MOVE_DIST
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set distance = params.DISTANCE|default(0.0)|float %}
    {% set speed = params.SPEED|default(0.0)|float %}
    {% set wait = params.WAIT|default(0)|int %}
    {% set auto = params.AUTO|default(0)|int %}
    {% set read_after = params.READ_AFTER|default(0)|int %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if buffer >= 0 %}
        _DEBUG_MSG MSG="BUFFER_MOVE_ACTIVE_TOOL: active_extruder={active_extruder} -> Buffer{buffer}, DISTANCE={distance}, SPEED={speed}, WAIT={wait}, AUTO={auto}, READ_AFTER={read_after}"

        # This emits BUFFER_MOVE_0, BUFFER_MOVE_1, etc.
        BUFFER_MOVE_{buffer} DISTANCE={distance} SPEED={speed} WAIT={wait} AUTO={auto} READ_AFTER={read_after}

    {% else %}
        M118 No CP2112 buffer move route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro BUFFER_STATUS_ACTIVE_TOOL]
description: Read status from the buffer paired to the active tool
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if buffer >= 0 %}
        # This emits BUFFER_STATUS_0, BUFFER_STATUS_1, etc.
        BUFFER_STATUS_{buffer}
    {% else %}
        M118 No CP2112 buffer status route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#   LLL Buffer CP2112 Comms Check
#####################################################################

[gcode_macro BUFFER_CHECK_COMMS]
description: Quietly verify one or all LLL buffers respond with healthy CP2112 status
variable_buffer_ids: "0,1,2,3,4"
variable_default_target: "all"
variable_between_checks_ms: 100
variable_default_verbose: 0
gcode:
    # Accept BUFFER=2, BUFFERS=2, BUFFER=0,2,4, or no parameter for all buffers.
    {% if params.BUFFER is defined %}
        {% set requested_raw = params.BUFFER|string %}
    {% elif params.BUFFERS is defined %}
        {% set requested_raw = params.BUFFERS|string %}
    {% else %}
        {% set requested_raw = default_target|string %}
    {% endif %}

    # VERBOSE=1 makes the check visible for testing. Default is silent success.
    {% set verbose = params.VERBOSE|default(default_verbose)|int %}

    # Klipper/Jinja needs parentheses before calling .split() after filter chains.
    {% set requested = (requested_raw|lower|replace(" ", "")) %}
    {% set configured_buffers = (buffer_ids|string|replace(" ", "")).split(",") %}

    # Default behavior checks every buffer listed in variable_buffer_ids.
    {% if requested in ["all", "*", ""] %}
        {% set selected_buffers = configured_buffers %}
    {% else %}
        {% set selected_buffers = requested.split(",") %}
    {% endif %}

    {% if verbose %}
        RESPOND TYPE=command MSG="Checking LLL buffer comms: {selected_buffers|join(',')}"
    {% endif %}

    {% for buffer_index in selected_buffers %}
        # Prevent quiet typos like BUFFER=5 when only 0-4 are configured.
        {% if buffer_index not in configured_buffers %}
            {action_raise_error("BUFFER_CHECK_COMMS invalid buffer index '" ~ buffer_index ~ "'. Configured buffers: " ~ buffer_ids)}
        {% endif %}

        # Pull the I2C address from the matching _LLL_BUFFER_VARS_x macro.
        {% set vars_macro = "gcode_macro _LLL_BUFFER_VARS_" ~ buffer_index %}
        {% set vars = printer[vars_macro] %}

        {% if verbose %}
            RESPOND TYPE=command MSG="Checking Buffer{buffer_index} comms at addr {vars.addr}"
            {% set verbose_arg = "--verbose" %}
        {% else %}
            {% set verbose_arg = "" %}
        {% endif %}

        # Python helper prints nothing on success.
        # On failure it prints a loud BUFFER COMMS ERROR and exits non-zero.
        RUN_SHELL_COMMAND CMD=lll_buffer_cp2112_check PARAMS="--name Buffer{buffer_index} --addr {vars.addr} {verbose_arg}"

        # Small gap keeps CP2112/I2C checks from hammering the bridge back-to-back.
        {% if not loop.last %}
            G4 P{between_checks_ms|int}
        {% endif %}
    {% endfor %}

    {% if verbose %}
        RESPOND TYPE=command MSG="LLL buffer comms check complete"
    {% endif %}

[gcode_macro BUFFER_HOLD_ACTIVE_TOOL]
description: Put the buffer paired to the current active tool into manual/hold mode
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if buffer >= 0 %}
        _DEBUG_MSG MSG="BUFFER_HOLD_ACTIVE_TOOL: active_extruder={active_extruder} -> Buffer{buffer} MANUAL/HOLD"

        # This emits BUFFER_MANUAL_0, BUFFER_MANUAL_1, etc.
        # MANUAL/HOLD ignores native hall-sensor auto behavior.
        BUFFER_MANUAL_{buffer}

    {% else %}
        M118 No CP2112 buffer hold route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro BUFFER_MANUAL_ACTIVE_TOOL]
description: Alias for BUFFER_HOLD_ACTIVE_TOOL
gcode:
    BUFFER_HOLD_ACTIVE_TOOL

#####################################################################
#                  Utility Positions / QGL
#####################################################################

[gcode_macro CENTER_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y163 Z20 F9000


[gcode_macro PRESENT_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y20 Z20 F9000

[gcode_macro _CLEAR_DOCK_ZONE_IF_HIGH]
description: Lower Z before XY travel if the toolhead is high enough to hit tool docks
variable_dock_y_limit: 85.0
variable_dock_z_limit: 125.0
variable_clearance_z: 120.0
variable_z_speed: 1200
gcode:
    # This macro protects against moving through the tool dock area while the toolhead is too high.
    # Unsafe zone definition:
    #   If Z > dock_z_limit, then Y must be greater than dock_y_limit.
    #
    # Recovery strategy:
    #   If currently violating that rule, lower Z to clearance_z before any XY travel.
    #   This keeps the top of the toolhead below the dock collision zone.

    _CG28

    {% set v = printer["gcode_macro _CLEAR_DOCK_ZONE_IF_HIGH"] %}
    {% set y_now = printer.toolhead.position.y|float %}
    {% set z_now = printer.toolhead.position.z|float %}

    {% if z_now > v.dock_z_limit|float and y_now <= v.dock_y_limit|float %}
        RESPOND TYPE=command MSG="_CLEAR_DOCK_ZONE_IF_HIGH: Z={z_now} Y={y_now} is inside dock collision rule. Lowering to Z={v.clearance_z} before XY travel."
        G90
        G1 Z{v.clearance_z} F{v.z_speed}
    {% else %}
        RESPOND TYPE=command MSG="_CLEAR_DOCK_ZONE_IF_HIGH: position safe. Z={z_now} Y={y_now}"
    {% endif %}


