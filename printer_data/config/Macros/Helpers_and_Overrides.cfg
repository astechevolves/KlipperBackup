
[display_status]

[delayed_gcode _BOOT_INIT_TOOLCHANGER]
initial_duration: 5
gcode:
    INITIALIZE_TOOLCHANGER


#####################################################################
#                  Macro Message Control
#####################################################################

[gcode_macro _MACRO_MESSAGES]
description: Shared message controls for macros.cfg
variable_status_enabled: 0                    # 1 = show basic progress messages.
variable_debug: 1                             # 1 = show detailed debug messages.
gcode:
    # Variable storage only.


#####################################################################
#                  Buffer / Toolhead Sensor Map
#####################################################################
# Purpose:
# - Central map for installed buffers, tool-to-buffer pairing, and sensors.
# - Does not store live buffer/direct-feed state.
# - Buffer/direct-feed decisions are made from live sensor states.
#
# Mode decision used by load/unload/routers:
# - Buffer mode: buffer entrance sensor = detected.
# - Direct-feed mode: buffer entrance sensor = clear AND toolhead sensor = detected.
# - No-filament state: both sensors clear.
# - DIRECT_FEED=1 can force buffer bypass for side-feed/special cases.
#
# Tool/extruder mapping:
# - Tool0 hotend = extruder
# - Tool1 hotend = extruder1
# - Tool2 hotend = extruder2
# - Tool3 hotend = extruder3
#
# Buffer mapping:
# - Tool0 uses Buffer0
# - Tool1 uses Buffer1
# - Tool2 uses Buffer2
# - Tool3 uses Buffer3
#
# installed_buffers:
# - Comma-separated list of physically installed buffers.
# - Only add a buffer number after matching macros/config exist.
#####################################################################

[gcode_macro _BUFFER_USAGE_STATE]
description: Central buffer/tool/sensor map

variable_installed_buffers: "0"              # Installed buffer numbers. Later: "0,1,2,3,4"

variable_tool0_buffer: 0
variable_tool1_buffer: 1
variable_tool2_buffer: 2
variable_tool3_buffer: 3
variable_tool4_buffer: 4

# Use the full Klipper object name for each buffer entrance sensor.
variable_tool0_entrance_sensor: "filament_switch_sensor buffer0_entrance"
variable_tool1_entrance_sensor: ""
variable_tool2_entrance_sensor: ""
variable_tool3_entrance_sensor: ""
variable_tool4_entrance_sensor: ""

# Use the full Klipper object name for each toolhead/nozzle sensor.
variable_tool0_hotend_sensor: "filament_switch_sensor T0_filament_sensor"
variable_tool1_hotend_sensor: ""
variable_tool2_hotend_sensor: ""
variable_tool3_hotend_sensor: ""
variable_tool4_hotend_sensor: ""

gcode:
    # Central map only.


#####################################################################
#                  Buffer0 Entrance Sensor Event Handlers
#####################################################################

[gcode_macro ENTRANCE_INSERT_BUFFER0]
description: Handle Buffer0 entrance filament insert event
gcode:
    _STATUS_MSG MSG="Buffer0 entrance filament detected"
    _DEBUG_MSG MSG="ENTRANCE_INSERT_BUFFER0: insert event only; no mode state stored"


[gcode_macro ENTRANCE_RUNOUT_BUFFER0]
description: Handle Buffer0 entrance filament runout/clear event
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        _STATUS_MSG MSG="Buffer0 entrance clear during print - warning only"
        _DEBUG_MSG MSG="ENTRANCE_RUNOUT_BUFFER0: print continues; no mode state changed"
        _BEEP
    {% else %}
        _STATUS_MSG MSG="Buffer0 entrance sensor clear"
        _DEBUG_MSG MSG="ENTRANCE_RUNOUT_BUFFER0: event only; no mode state stored"
    {% endif %}


#####################################################################
#                  Logo Thermal Warning
#####################################################################
# Purpose:
# - Turns the active toolhead logo LED red when the active nozzle is at
#   or above that extruder's configured min_extrude_temp.
# - Does not touch the nozzle LEDs, so they can stay white/on for print visibility.
# - Re-checks periodically so normal status macros cannot accidentally hide
#   a hot nozzle warning for long.

[gcode_macro _LOGO_THERMAL_VARS]
description: Internal state for logo hot-nozzle warning
variable_enabled:       1       # 1 = monitor active, 0 = monitor disabled
variable_poll_seconds:  2.0     # How often to re-check hotend temp
variable_tool:          0       # Current toolhead LED index; Toolhead0_LEDs for now
variable_last_hot:      0       # Tracks hot/cold transition so cooling can restore standby
gcode:
    # Variable storage only.

[delayed_gcode _LOGO_THERMAL_MONITOR]
initial_duration: 2.0
gcode:
    {% set v = printer["gcode_macro _LOGO_THERMAL_VARS"] %}
    {% set enabled = v.enabled|int %}
    {% set poll = v.poll_seconds|float %}
    {% set tool = v.tool|int %}

    {% if enabled %}
        # Use Klipper's currently active extruder so this follows tool changes later.
        {% set active_extruder = printer.toolhead.extruder %}

        # Read the active extruder's actual temperature and configured extrusion-safe threshold.
        {% set current_temp = printer[active_extruder].temperature|float %}
        {% set min_temp = printer.configfile.settings[active_extruder].min_extrude_temp|default(170)|float %}

        {% if current_temp >= min_temp %}
            # Force the logo LED red any time the nozzle is extrusion-hot.
            _set_logo_leds TOOL={tool} RED=1.0 GREEN=0.0 BLUE=0.0 WHITE=0.0 TRANSMIT=1
            SET_GCODE_VARIABLE MACRO=_LOGO_THERMAL_VARS VARIABLE=last_hot VALUE=1
        {% else %}
            {% if v.last_hot|int == 1 %}
                # Once the nozzle cools below min_extrude_temp, return the logo to standby.
                # This only runs on the hot-to-cold transition so normal status colors can work while cold.
                _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR="standby" TRANSMIT=1
                SET_GCODE_VARIABLE MACRO=_LOGO_THERMAL_VARS VARIABLE=last_hot VALUE=0
            {% endif %}
        {% endif %}

        # Keep monitoring while enabled.
        UPDATE_DELAYED_GCODE ID=_LOGO_THERMAL_MONITOR DURATION={poll}
    {% endif %}

[gcode_macro START_LOGO_THERMAL_MONITOR]
description: Enable automatic red logo LED when active nozzle is extrusion-hot
gcode:
    SET_GCODE_VARIABLE MACRO=_LOGO_THERMAL_VARS VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=_LOGO_THERMAL_MONITOR DURATION=0.1

[gcode_macro STOP_LOGO_THERMAL_MONITOR]
description: Disable automatic logo thermal warning
gcode:
    SET_GCODE_VARIABLE MACRO=_LOGO_THERMAL_VARS VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=_LOGO_THERMAL_MONITOR DURATION=0

[gcode_macro SET_LOGO_THERMAL_TOOL]
description: Set which ToolheadN_LEDs chain the thermal logo warning controls
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_LOGO_THERMAL_VARS VARIABLE=tool VALUE={tool}

#####################################################################
#                  Utility Positions / QGL
#####################################################################

[gcode_macro CENTER_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y163 Z20 F9000


[gcode_macro PRESENT_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y20 Z20 F9000


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        STATUS_CALIBRATING_Z
        _CG28
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    _FINE_QUAD_GANTRY_LEVEL


[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0
        G28 Z
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_CALIBRATED
        _BEEP
    {% else %}
        {action_respond_info("Fine QGL called without calling coarse QGL first!")}
        _QUAD_GANTRY_LEVEL
    {% endif %}


#####################################################################
#                  Active Tool Buffer Router
#####################################################################

[gcode_macro BUFFER_ARM_ACTIVE_TOOL]
description: Enable the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    {% if active_extruder == "extruder" %}
        {% set entrance_sensor = sensors.tool0_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool0_hotend_sensor|string %}
    {% elif active_extruder == "extruder1" %}
        {% set entrance_sensor = sensors.tool1_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool1_hotend_sensor|string %}
    {% elif active_extruder == "extruder2" %}
        {% set entrance_sensor = sensors.tool2_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool2_hotend_sensor|string %}
    {% elif active_extruder == "extruder3" %}
        {% set entrance_sensor = sensors.tool3_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool3_hotend_sensor|string %}
    {% else %}
        {% set entrance_sensor = "" %}
        {% set hotend_sensor = "" %}
    {% endif %}

    {% set entrance_detected = 1 if entrance_sensor|length > 0 and entrance_sensor in printer and printer[entrance_sensor].filament_detected|int == 1 else 0 %}
    {% set hotend_detected = 1 if hotend_sensor|length > 0 and hotend_sensor in printer and printer[hotend_sensor].filament_detected|int == 1 else 0 %}

    {% if active_extruder == "extruder" and entrance_detected == 1 %}
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: active_extruder={active_extruder}, entrance_detected={entrance_detected}, hotend_detected={hotend_detected}"
        STOP_CENTER_BUFFER_0
        STOP_PERCENT_MOVE_BUFFER0
        ENABLE_AUTO_BUFFER0
    {% elif active_extruder == "extruder" %}
        _STATUS_MSG MSG="Buffer skipped - direct-feed/no-buffer mode"
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: skipped. active_extruder={active_extruder}, entrance_sensor={entrance_sensor}, entrance_detected={entrance_detected}, hotend_sensor={hotend_sensor}, hotend_detected={hotend_detected}"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% else %}
        M118 No buffer enable route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro BUFFER_DISABLE_ACTIVE_TOOL]
description: Disable the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}

    {% if active_extruder == "extruder" %}
        _DEBUG_MSG MSG="BUFFER_DISABLE_ACTIVE_TOOL: active_extruder={active_extruder}, disable_motor={disable_motor}"
        STOP_CENTER_BUFFER_0
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR={disable_motor}
        STOP_PERCENT_MOVE_BUFFER0
    {% else %}
        M118 No buffer disable route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro STOP_CENTER_BUFFER_0]
description: Stop active Buffer0 center loop
gcode:
    SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_CENTER_BUFFER_LOOP_0 DURATION=0

    {% if printer["gcode_macro _VARS_BUFFER0"].debug|int == 1 or printer["gcode_macro _VARS_BUFFER0"].debug_hold|int == 1 %}
        RESPOND TYPE=command MSG="CENTER_BUFFER_0 stopped"
    {% endif %}


[gcode_macro BUFFER_DISABLE_ALL_BUFFERS]
description: Disable all installed buffer regulators and optionally release motors
gcode:
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set installed = map.installed_buffers|string %}

    _DEBUG_MSG MSG="BUFFER_DISABLE_ALL_BUFFERS: disable_motor={disable_motor}, installed_buffers={installed}"

    {% for b in installed.split(",") %}
        {% set n = b|trim %}

        {% if n == "0" %}
            STOP_CENTER_BUFFER_0
            DISABLE_AUTO_BUFFER0 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER0

        {% elif n == "1" %}
            STOP_CENTER_BUFFER_1
            DISABLE_AUTO_BUFFER1 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER1

        {% elif n == "2" %}
            STOP_CENTER_BUFFER_2
            DISABLE_AUTO_BUFFER2 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER2

        {% elif n == "3" %}
            STOP_CENTER_BUFFER_3
            DISABLE_AUTO_BUFFER3 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER3

        {% elif n == "4" %}
            STOP_CENTER_BUFFER_4
            DISABLE_AUTO_BUFFER4 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER4

        {% elif n == "" %}
            # Ignore empty entries in installed_buffers.
        {% else %}
            M118 BUFFER_DISABLE_ALL_BUFFERS: no disable route for buffer {n}
        {% endif %}
    {% endfor %}


[gcode_macro BUFFER_POSITION_ACTIVE_TOOL]
description: Manual/service move of active tool buffer to requested percent
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set target = params.PERCENT|default(50)|float %}
    {% set step = params.STEP|default(5)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% set accel = params.ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(45)|int %}

    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        { action_respond_info("BUFFER_POSITION_ACTIVE_TOOL ignored while actively printing.") }
    {% elif active_extruder == "extruder" %}
        _DEBUG_MSG MSG="BUFFER_POSITION_ACTIVE_TOOL: active_extruder={active_extruder}, target={target}, step={step}, speed={speed}, accel={accel}, max_steps={max_steps}"
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
        STOP_PERCENT_MOVE_BUFFER0
        MOVE_TO_PERCENT_BUFFER0 PERCENT={target} STEP={step} SPEED={speed} ACCEL={accel} MAX_STEPS={max_steps}
    {% else %}
        M118 No buffer position route for active extruder: {active_extruder}
    {% endif %}


#####################################################################
#                  Compatibility Wrappers
#####################################################################
# These are intentionally harmless. They exist only so an old button or
# Mainsail macro fails soft instead of running old manual_stepper logic.
#####################################################################

[gcode_macro BUFFER_REGULATE_ACTIVE_TOOL]
description: Compatibility wrapper; routes to BUFFER_ARM_ACTIVE_TOOL
gcode:
    _DEBUG_MSG MSG="BUFFER_REGULATE_ACTIVE_TOOL: compatibility wrapper -> BUFFER_ARM_ACTIVE_TOOL"
    BUFFER_ARM_ACTIVE_TOOL


[gcode_macro BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING]
description: Compatibility wrapper; routes to BUFFER_ARM_ACTIVE_TOOL
gcode:
    _DEBUG_MSG MSG="BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING: compatibility wrapper -> BUFFER_ARM_ACTIVE_TOOL"
    BUFFER_ARM_ACTIVE_TOOL


#####################################################################
#                  KlipperScreen Material Prompt Helpers
#####################################################################

[gcode_macro _KS_END_PROMPT]
description: Close active KlipperScreen/Moonraker action prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _KS_LOAD_MATERIAL]
description: Close material prompt and call LOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}
    {% set load_v = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set purge_speed = params.PURGE_SPEED|default(params.SPEED|default(load_v.purge_speed))|float %}

    _KS_END_PROMPT
    LOAD_FILAMENT MATERIAL={material} PURGE_SPEED={purge_speed}


[gcode_macro _KS_UNLOAD_MATERIAL]
description: Close material prompt and call UNLOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}
    {% set speed = params.SPEED|default(50)|float %}

    _KS_END_PROMPT
    UNLOAD_FILAMENT MATERIAL={material} SPEED={speed}

#####################################################################
#                  Basic functions, overrides, and stock macro mods
#####################################################################

[gcode_macro _BEEP]
description: Beep once or multiple times
gcode:
    {% set times = params.TIMES|default(1)|int %}
    {% set s = params.S|default(500)|int %}
    {% set p = params.P|default(500)|int %}
    {% set delay = params.DELAY|default(0.5)|float %}

    {% for i in range(times) %}
        M300 S{s} P{p}
        {% if i < times - 1 %}
            G4 P{(delay * 1000)|int}
        {% endif %}
    {% endfor %}


[gcode_macro _WAIT]
description: Wait/dwell for a number of seconds
gcode:
    {% set time = params.TIME|default(3)|float %}
    _DEBUG_MSG MSG="WAIT START {time}s"
    M400
    G4 P{(time * 1000)|int}
    _DEBUG_MSG MSG="WAIT DONE"


[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


[gcode_macro _CQGL]
description: Quad gantry level only if not already applied
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}


[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False


[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False


[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    BTT_BED_MESH_CALIBRATE {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False


[gcode_macro M600]
description: Filament change
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    _BEEP TIMES=3
    PAUSE
    G91
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X175 Y175 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32


[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% set L = 0.5 %}
    {% if S <= 0 %}
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %}
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %}
    {% endif %}
    SET_PIN PIN=_beeper VALUE={L} CYCLE_TIME={F}
    G4 P{P}
    SET_PIN PIN=_beeper VALUE=0


[gcode_macro DEBUG_ACTIVE_EXTRUDER]
gcode:
    M118 Active extruder is {printer.toolhead.extruder}


[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
description: Set heater temp and wait until within a deadband
variable_default_deadband: 4.0
gcode:
    {% set heater = params.HEATER|default(params.SENSOR|default("extruder"))|string %}
    {% set target = params.TARGET|float %}
    {% set deadband = params.DEADBAND|default(default_deadband)|float %}

    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={target - deadband} MAXIMUM={target + deadband}


[gcode_macro _STATUS_MSG]
description: Print a basic user-facing macro status message
gcode:
    {% set msg = params.MSG|default("")|string %}
    {% set vars = printer["gcode_macro _MACRO_MESSAGES"] %}

    {% if vars.status_enabled|int == 1 and msg != "" %}
        M118 {msg}
    {% endif %}


[gcode_macro _DEBUG_MSG]
description: Print a detailed debug message when macro debug is enabled
gcode:
    {% set msg = params.MSG|default("")|string %}
    {% set vars = printer["gcode_macro _MACRO_MESSAGES"] %}

    {% if vars.debug|int == 1 and msg != "" %}
        M118 DEBUG: {msg}
    {% endif %}


#####################################################################
#                  Speed / Stability Test Macros
#####################################################################

[gcode_macro TEST_Z_STABILITY]
description: QGL -> Z cycle -> QGL drift check
variable_cycles: 20
variable_z_low: 50
variable_z_high: 250
variable_speed: 1800
gcode:
    {% set cycles = params.CYCLES|default(printer["gcode_macro TEST_Z_STABILITY"].cycles)|int %}
    {% set z_low = params.Z_LOW|default(printer["gcode_macro TEST_Z_STABILITY"].z_low)|float %}
    {% set z_high = params.Z_HIGH|default(printer["gcode_macro TEST_Z_STABILITY"].z_high)|float %}
    {% set speed = params.SPEED|default(printer["gcode_macro TEST_Z_STABILITY"].speed)|int %}

    M117 Z Stability Test: Baseline QGL
    RESPOND MSG="--- Z TEST: BASELINE QGL ---"

    G28
    QUAD_GANTRY_LEVEL

    G90
    G0 Z{z_high} F{speed}

    M117 Z Cycling...
    RESPOND MSG="--- Z TEST: CYCLING {cycles} TIMES ({z_low}->{z_high}) @ {speed} ---"

    {% for i in range(cycles) %}
        G0 Z{z_low} F{speed}
        G0 Z{z_high} F{speed}
    {% endfor %}

    M400

    M117 Z Stability Test: Post QGL
    RESPOND MSG="--- Z TEST: POST QGL ---"

    QUAD_GANTRY_LEVEL
    M117 Z Stability Test Done


[gcode_macro TEST_SPEED]
description: Test max speed/accel by moving toolhead through repeated patterns
gcode:
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(50)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% if x_min < 0 %}
        {% set x_min = 0 %}
    {% endif %}

    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% if y_min < 0 %}
        {% set y_min = 0 %}
    {% endif %}

    {% set x_min = x_min + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = y_min + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize/2) %}
    {% set x_center_max = x_center + (smallpatternsize/2) %}
    {% set y_center_min = y_center - (smallpatternsize/2) %}
    {% set y_center_max = y_center + (smallpatternsize/2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED

    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }

    M400
    G28

    {% if printer.configfile.settings.quad_gantry_level %}
        {% if printer.quad_gantry_level.applied == False %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}
    {% endif %}

    G90
    G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION

    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}

        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    M400
    G28
    G90
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED
