    {% endfor %}

    {% if ns.count == 0 %}
        RESPOND TYPE=command MSG="action:prompt_text No tools were reported by printer.toolchanger.tool_numbers."
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _RUN_RESONANCE_TEST_TOOL]
description: Grab selected tool and run native Klipper shaper calibration using that tool accelerometer
variable_accel_type: "adxl345"
variable_accel_prefix: "T"
variable_test_x: 175
variable_test_y: 175
variable_test_z: 20
variable_travel_speed: 12000
variable_query_accel: 1
variable_run_x: 1
variable_run_y: 1
variable_use_shaper_calibrate: 1
gcode:
    {% set cfg = printer["gcode_macro _RUN_RESONANCE_TEST_TOOL"] %}
    {% set tool = params.T|int %}

    # Accelerometers should be named:
    # [adxl345 T0], [adxl345 T1], etc.
    #
    # ACCELEROMETER_QUERY uses only the chip name:
    # CHIP=T0
    #
    # Native Klipper resonance commands need the full chip string:
    # CHIPS="adxl345 T0"
    {% set accel_type = params.ACCEL_TYPE|default(cfg.accel_type)|string %}
    {% set accel_prefix = params.ACCEL_PREFIX|default(cfg.accel_prefix)|string %}
    {% set accel_name = params.ACCEL_NAME|default(accel_prefix ~ tool)|string %}
    {% set accel_chip = accel_type ~ " " ~ accel_name %}

    {% set test_x = params.X|default(cfg.test_x)|float %}
    {% set test_y = params.Y|default(cfg.test_y)|float %}
    {% set test_z = params.Z|default(cfg.test_z)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(cfg.travel_speed)|float %}
    {% set query_accel = params.QUERY_ACCEL|default(cfg.query_accel)|int %}
    {% set run_x = params.RUN_X|default(cfg.run_x)|int %}
    {% set run_y = params.RUN_Y|default(cfg.run_y)|int %}
    {% set use_shaper_calibrate = params.SHAPER|default(cfg.use_shaper_calibrate)|int %}

    # Close the prompt immediately after a tool is selected.
    RESPOND TYPE=command MSG="action:prompt_end"

    # Initialize again so this helper is safe to call directly.
    INITIALIZE_TOOLCHANGER
    M400

    RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL selecting T{tool}"
    RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL using accelerometer {accel_chip}"

    # Home only if needed before moving to the resonance test point.
    _CG28

    # Grab the selected tool before testing so the test measures the mounted toolhead mass.
    SELECT_TOOL T={tool}
    M400

    # Move to the resonance test point before testing.
    G90
    G0 X{test_x} Y{test_y} Z{test_z} F{travel_speed}
    M400

    {% if query_accel %}
        # Query selected accelerometer before starting the resonance test.
        ACCELEROMETER_QUERY CHIP={accel_name}
    {% endif %}

    {% if use_shaper_calibrate %}
        # Native Klipper auto-calibration.
        # Requires [resonance_tester] to have usable probe_points configured.
        {% if run_x %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running SHAPER_CALIBRATE X on {accel_chip}"
            SHAPER_CALIBRATE AXIS=X NAME=T{tool}_x CHIPS="{accel_chip}"
        {% endif %}

        {% if run_y %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running SHAPER_CALIBRATE Y on {accel_chip}"
            SHAPER_CALIBRATE AXIS=Y NAME=T{tool}_y CHIPS="{accel_chip}"
        {% endif %}
    {% else %}
        # Native Klipper raw resonance test.
        # POINT is passed directly so this can run even if you want to override probe_points.
        {% if run_x %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running TEST_RESONANCES X on {accel_chip}"
            TEST_RESONANCES AXIS=X NAME=T{tool}_x CHIPS="{accel_chip}" POINT={test_x},{test_y},{test_z}
        {% endif %}

        {% if run_y %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running TEST_RESONANCES Y on {accel_chip}"
            TEST_RESONANCES AXIS=Y NAME=T{tool}_y CHIPS="{accel_chip}" POINT={test_x},{test_y},{test_z}
        {% endif %}
    {% endif %}

    
[gcode_macro CALIBRATE_ALL_Z_OFFSETS]
rename_existing: _CALIBRATE_ALL_Z_OFFSETS_ORIGINAL
description: Preheat configured tools while docked, wipe each nozzle starting with current tool, then run original all-tool Z calibration
variable_calibrate_temp: 150
gcode:
    {% set vars = printer["gcode_macro CALIBRATE_ALL_Z_OFFSETS"] %}
    {% set calibrate_temp = params.TEMP|default(vars.calibrate_temp)|float %}
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set current_tool = printer.toolchanger.tool_number|int %}

    # If a valid tool is already selected, rotate the wipe order so we start there.
    # This avoids an unnecessary immediate tool change just to begin the cleanup pass.
    {% if current_tool in tools %}
        {% set current_index = tools.index(current_tool) %}
        {% set ordered_tools = tools[current_index:] + tools[:current_index] %}
    {% else %}
        # No active/known tool is selected, so fall back to the toolchanger's configured order.
        {% set ordered_tools = tools %}
    {% endif %}

    RESPOND TYPE=command MSG="Clean Z calibration: preheating configured tools {tools} to {calibrate_temp}C while docked"

    # Set every tool heater by tool number without physically picking up each tool.
    # SET_TOOL_TEMPERATURE targets the assigned tool directly, so the docked tools can warm in place.
    {% for tool in tools %}
        SET_TOOL_TEMPERATURE T={tool} TARGET={calibrate_temp} WAIT=0
    {% endfor %}

    # Home only if needed before moving between docks, brush, and calibration locations.
    _CG28

    RESPOND TYPE=command MSG="Clean Z calibration: wiping tools in order {ordered_tools} at {calibrate_temp}C"

    # Wipe each tool, starting with the currently mounted/active tool when available.
    {% for tool in ordered_tools %}
        # Wait on the tool's heater before selecting/wiping so the wipe happens at calibration temp.
        # This still targets the tool by number instead of relying on whichever extruder is active.
        SET_TOOL_TEMPERATURE T={tool} TARGET={calibrate_temp} WAIT=1

        # Select the tool that is about to be wiped.
        # If this is already the active tool, this should avoid a real dock/pick cycle.
        T{tool}

        # Use the existing wipe routine so brush position, safe travel, and plunge depth stay single-source.
        _WIPE_NOZZLE
    {% endfor %}

    RESPOND TYPE=command MSG="Clean Z calibration: starting original CALIBRATE_ALL_Z_OFFSETS"

    # Run the original calibration after every configured nozzle has been warmed and wiped.
    _CALIBRATE_ALL_Z_OFFSETS_ORIGINAL

    
[gcode_macro _REFERENCE_STATE]
description: Runtime state for T0 reference homing and QGL validity
variable_reference_home_valid: 0      # 1 = last full home was done with T0 active
variable_reference_qgl_valid: 0       # 1 = QGL was completed after valid T0 reference home
variable_reference_valid: 0           # 1 = T0 full home + QGL are both valid
gcode:
    # State-only macro. Intentionally no runtime commands.

    
[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False


[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set raw = rawparams | trim | upper %}

    # Plain G28 is a full home. Explicit X/Y/Z together also counts as full home.
    # Partial homes should not establish a complete T0 reference state.
    {% set full_home = 1 if raw|length == 0 or ("X" in raw and "Y" in raw and "Z" in raw) else 0 %}

    # In this setup, T0 uses the base "extruder".
    # Anything else is treated as not-T0 for reference-state purposes.
    {% set active_extruder = printer.toolhead.extruder | string %}
    {% set active_is_t0 = 1 if active_extruder == "extruder" else 0 %}

    # Set LEDs and Knomi screen state
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    STATUS_HOMING

    G28.1 {rawparams}

    STATUS_READY
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

    # Any homing clears the combined reference state because QGL must be proven
    # again after the machine position changes.
    SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_qgl_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_valid VALUE=0

    {% if active_is_t0 and full_home %}
        # Full machine home was done with T0 active, so T0 reference home is valid.
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_home_valid VALUE=1
        RESPOND TYPE=command MSG="G28: full home completed with T0; QGL state cleared"

    {% elif active_is_t0 %}
        # Partial home with T0 does not prove the full reference state.
        RESPOND TYPE=command MSG="G28: partial home completed with T0; QGL state cleared"

    {% else %}
        # Homing with any non-T0 tool invalidates the T0 reference state.
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_home_valid VALUE=0
        RESPOND TYPE=command MSG="G28: homed with non-T0 tool; T0 reference state invalidated"
    {% endif %}


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
