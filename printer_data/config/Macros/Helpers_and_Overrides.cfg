[gcode_macro BUFFER_CAPTURE_ACTIVE_TOOL]
description: Capture active tool buffer state into its per-buffer state macro
gcode:
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% if active_extruder == "extruder" %}
        {% set buffer = map.tool0_buffer|int %}
    {% elif active_extruder == "extruder1" %}
        {% set buffer = map.tool1_buffer|int %}
    {% elif active_extruder == "extruder2" %}
        {% set buffer = map.tool2_buffer|int %}
    {% elif active_extruder == "extruder3" %}
        {% set buffer = map.tool3_buffer|int %}
    {% elif active_extruder == "extruder4" %}
        {% set buffer = map.tool4_buffer|int %}
    {% else %}
        {% set buffer = -1 %}
    {% endif %}

    {% if buffer < 0 %}
        {action_raise_error("BUFFER_CAPTURE_ACTIVE_TOOL has no buffer route for active_extruder=" ~ active_extruder)}
    {% endif %}

    {% if buffer == 0 %}
        BUFFER_CAPTURE_0
    {% elif buffer == 1 %}
        BUFFER_CAPTURE_1
    {% elif buffer == 2 %}
        BUFFER_CAPTURE_2
    {% elif buffer == 3 %}
        BUFFER_CAPTURE_3
    {% elif buffer == 4 %}
        BUFFER_CAPTURE_4
    {% else %}
        {action_raise_error("BUFFER_CAPTURE_ACTIVE_TOOL mapped to unsupported buffer=" ~ buffer)}
    {% endif %}

[gcode_macro DOCK_ACTIVE_TOOL_AND_STANDBY]
description: Dock the currently active tool and move the empty shuttle to bed-center standby
gcode:
    {% set center_x = ((printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2.0) %}
    {% set center_y = ((printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2.0) %}

    {% set standby_z = 291.0 %}
    {% set travel_speed = 12000 %}
    {% set z_travel_speed = 1800 %}

    RESPOND TYPE=command MSG="Docking active tool and moving shuttle to standby"

    # Make sure the machine has a valid position before docking or parking.
    _CG28

    # Dock the currently active tool using the toolchanger's normal dropoff logic.
    # This should leave the toolchanger with no mounted/active tool.
    UNSELECT_TOOL
    
    # Move the empty shuttle away from the docks and back to bed-center standby.
    G90
    G1 X{center_x} Y{center_y} F{travel_speed}
    M400

    RESPOND TYPE=command MSG="Active tool docked; shuttle parked at standby"

