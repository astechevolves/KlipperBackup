#####################################################################
#                  Basic functions, overrides, and stock macro mods
#####################################################################

[gcode_macro _BEEP]
description: Beep once or multiple times
gcode:
    {% set times = params.TIMES|default(1)|int %}
    {% set s = params.S|default(500)|int %}
    {% set p = params.P|default(500)|int %}
    {% set delay = params.DELAY|default(0.5)|float %}

    {% for i in range(times) %}
        M300 S{s} P{p}
        {% if i < times - 1 %}
            G4 P{(delay * 1000)|int}
        {% endif %}
    {% endfor %}


[gcode_macro _WAIT]
description: Wait/dwell for a number of seconds
gcode:
    {% set time = params.TIME|default(3)|float %}
    _DEBUG_MSG MSG="WAIT START {time}s"
    M400
    G4 P{(time * 1000)|int}
    _DEBUG_MSG MSG="WAIT DONE"


[gcode_macro _CG28]
description: Home only if Klipper does not currently have all axes homed
gcode:
    {% set homed_axes = printer.toolhead.homed_axes | string %}
    {% set machine_fully_homed = 1 if ("x" in homed_axes and "y" in homed_axes and "z" in homed_axes) else 0 %}

    {% if not machine_fully_homed %}
        # The G28 override owns T0 / non-T0 reference-home state.
        # If the active tool is T0, the override can mark reference_home_valid.
        # If the active tool is not T0, the override invalidates T0 reference state.
        G28
    {% else %}
        # No homing happened, so do not touch the reference state.
        RESPOND TYPE=command MSG="_CG28: skipped; XYZ already homed"
    {% endif %}

[gcode_macro _CQGL]
description: Reference-aware quad gantry level only when needed
gcode:
    {% set ref = printer["gcode_macro _REFERENCE_STATE"] %}
    {% set reference_home_valid = ref.reference_home_valid | default(0) | int %}
    {% set reference_valid = ref.reference_valid | default(0) | int %}
    {% set force_qgl = params.FORCE | default(0) | int %}

    # Snapshot current machine/tool state at macro start.
    # These values do not update inside this same macro after _CG28 or T0 runs.
    {% set homed_axes = printer.toolhead.homed_axes | string %}
    {% set machine_fully_homed = 1 if ("x" in homed_axes and "y" in homed_axes and "z" in homed_axes) else 0 %}

    # T0 uses the base "extruder". Anything else is treated as not-T0.
    {% set active_extruder = printer.toolhead.extruder | string %}
    {% set active_is_t0 = 1 if active_extruder == "extruder" else 0 %}

    # Force a T0 full home if the reference-home flag is not valid or if
    # Klipper does not currently consider XYZ homed.
    {% set need_t0_home = 1 if (not reference_home_valid or not machine_fully_homed) else 0 %}

    # Conditional by default. FORCE=1 exists only for explicit manual override.
    {% set need_qgl = 1 if (force_qgl or printer.quad_gantry_level.applied == False or not reference_valid or need_t0_home) else 0 %}

    {% if not need_t0_home and not need_qgl %}
        RESPOND TYPE=command MSG="_CQGL: skipped; T0 reference home/QGL already valid"

    {% else %}
        {% if not active_is_t0 %}
            # Get T0 instead of blocking. T0 is the machine/reference tool.
            M117 Selecting reference tool T0

            {% if not machine_fully_homed %}
                _CG28
            {% endif %}

            T0
        {% endif %}

        {% if need_t0_home %}
            # Full G28 with T0 refreshes the reference-home flag.
            M117 Reference home T0
            G28
        {% endif %}

        {% if need_qgl %}
            # Actual coarse/fine QGL sequence lives in the internal runner.
            M117 Reference QGL T0
            _RUN_REFERENCE_QUAD_GANTRY_LEVEL
        {% endif %}
    {% endif %}


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Public reference-aware conditional QGL wrapper
gcode:
    # Normal QUAD_GANTRY_LEVEL is conditional.
    # Use QUAD_GANTRY_LEVEL FORCE=1 only when you intentionally want a fresh QGL.
    _CQGL {rawparams}


[gcode_macro _RUN_REFERENCE_QUAD_GANTRY_LEVEL]
description: Internal coarse/fine QGL sequence after _CQGL has prepared T0
gcode:
    # LED/Knomi status belongs here because this macro now owns the actual
    # coarse/fine QGL sequence.
    STATUS_LEVELING
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True

    {% if printer.quad_gantry_level.applied == False %}
        # Coarse QGL pass gets the gantry close enough for the fine pass.
        # This calls the original Klipper QGL command renamed by the wrapper.
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}

    # Fine pass is where the final reference-valid marker happens.
    _FINE_QUAD_GANTRY_LEVEL


[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # Fine QGL pass after the coarse pass has already applied leveling.
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0

        # Re-home Z after QGL. Your G28 override clears QGL validity here,
        # so the reference marker must happen after this line.
        G28 Z

        # Mark T0 reference QGL valid only after fine QGL and post-QGL Z home.
        _MARK_REFERENCE_QGL_DONE

        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_CALIBRATED
        _BEEP

    {% else %}
        {action_respond_info("Fine QGL called without coarse QGL applied first!")}

        # Make sure the UI/status state does not get stuck in leveling mode
        # if this recovery path is hit.
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_READY

        # Recovery fallback: run original coarse QGL only.
        # Do not mark reference valid here because the fine pass did not complete.
        _QUAD_GANTRY_LEVEL
    {% endif %}


[gcode_macro _MARK_REFERENCE_QGL_DONE]
description: Mark T0 reference QGL complete if T0 reference home is valid
gcode:
    {% set ref = printer["gcode_macro _REFERENCE_STATE"] %}
    {% set reference_home_valid = ref.reference_home_valid | default(0) | int %}

    # T0 uses the base "extruder". Anything else is not-T0.
    {% set active_extruder = printer.toolhead.extruder | string %}
    {% set active_is_t0 = 1 if active_extruder == "extruder" else 0 %}

    {% if active_is_t0 and reference_home_valid %}
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_qgl_valid VALUE=1
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_valid VALUE=1
        RESPOND TYPE=command MSG="Reference state valid: T0 full home and QGL complete"

    {% elif active_is_t0 %}
        # QGL may have physically completed, but it does not count as a valid
        # reference state unless a full T0 home was also valid.
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_qgl_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_valid VALUE=0
        RESPOND TYPE=command MSG="QGL completed with T0, but T0 full-home state was not valid"

    {% else %}
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_qgl_valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_REFERENCE_STATE VARIABLE=reference_valid VALUE=0
        RESPOND TYPE=command MSG="QGL completed with non-T0 tool; T0 reference state invalid"
    {% endif %}
    
[gcode_macro PROBE_ACCURACY_w_VAR]
description: Run PROBE_ACCURACY with configurable sample count
variable_default_samples: 10
variable_probe_speed: 5.0
variable_lift_speed: 10.0
variable_sample_retract_dist: 2.0
gcode:
