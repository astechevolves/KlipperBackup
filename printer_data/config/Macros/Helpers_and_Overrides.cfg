[gcode_macro _BEEP]
description: Beep once or multiple times
gcode:
    {% set times = params.TIMES|default(1)|int %}
    {% set s = params.S|default(500)|int %}
    {% set p = params.P|default(500)|int %}
    {% set delay = params.DELAY|default(0.5)|float %}

    {% for i in range(times) %}
        M300 S{s} P{p}
        {% if i < times - 1 %}
            G4 P{(delay * 1000)|int}
        {% endif %}
    {% endfor %}


[gcode_macro _WAIT]
description: Wait/dwell for a number of seconds
gcode:
    {% set time = params.TIME|default(3)|float %}
    _DEBUG_MSG MSG="WAIT START {time}s"
    M400
    G4 P{(time * 1000)|int}
    _DEBUG_MSG MSG="WAIT DONE"

[gcode_macro _RESTORE_MOTION_LIMITS]
description: Restore live motion limits from the configured [printer] section
gcode:
    # Restore motion to 100% in case it was adjusted during print
    M220 S100
    M221 S100
    
    # Slicers can lower Klipper's live accel with M204/SET_VELOCITY_LIMIT.
    # Restore only the motion limits that exist in the configured [printer] section.
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity|float} ACCEL={printer.configfile.settings.printer.max_accel|float} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity|float}
    
[gcode_macro RESONANCE_TOOL_MENU]
description: Initialize toolchanger, then show toolheads for resonance testing
gcode:
    # Initialize first so the toolchanger detects the currently mounted tool
    # and populates the toolchanger state before the prompt is built.
    INITIALIZE_TOOLCHANGER
    M400

    # Delay prompt generation so it runs after INITIALIZE_TOOLCHANGER executes.
    UPDATE_DELAYED_GCODE ID=_SHOW_RESONANCE_TOOL_MENU DURATION=0.25


[delayed_gcode _SHOW_RESONANCE_TOOL_MENU]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Toolhead Resonance Test"
    RESPOND TYPE=command MSG="action:prompt_text Select the toolhead to grab and run resonance testing."

    {% if printer.toolchanger is not defined %}
        RESPOND TYPE=command MSG="action:prompt_text ERROR toolchanger is not defined."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
        {action_raise_error("_SHOW_RESONANCE_TOOL_MENU requires printer.toolchanger")}
    {% endif %}

    {% set ns = namespace(count=0) %}

    # Show every tool reported by the toolchanger.
    # Do not filter on variable_active because that does not reliably mean installed or available.
    {% for tool in printer.toolchanger.tool_numbers %}
        {% set ns.count = ns.count + 1 %}
        RESPOND TYPE=command MSG="action:prompt_button T{tool}|_RUN_RESONANCE_TEST_TOOL T={tool}|primary"
    {% endfor %}

    {% if ns.count == 0 %}
        RESPOND TYPE=command MSG="action:prompt_text No tools were reported by printer.toolchanger.tool_numbers."
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _RUN_RESONANCE_TEST_TOOL]
description: Grab selected tool and run native Klipper shaper calibration using that tool accelerometer
variable_accel_type: "adxl345"
variable_accel_prefix: "T"
variable_test_x: 175
variable_test_y: 175
variable_test_z: 20
variable_travel_speed: 12000
variable_query_accel: 1
variable_run_x: 1
variable_run_y: 1
variable_use_shaper_calibrate: 1
gcode:
    {% set cfg = printer["gcode_macro _RUN_RESONANCE_TEST_TOOL"] %}
    {% set tool = params.T|int %}

    # Accelerometers should be named:
    # [adxl345 T0], [adxl345 T1], etc.
    #
    # ACCELEROMETER_QUERY uses only the chip name:
    # CHIP=T0
    #
    # Native Klipper resonance commands need the full chip string:
    # CHIPS="adxl345 T0"
    {% set accel_type = params.ACCEL_TYPE|default(cfg.accel_type)|string %}
    {% set accel_prefix = params.ACCEL_PREFIX|default(cfg.accel_prefix)|string %}
    {% set accel_name = params.ACCEL_NAME|default(accel_prefix ~ tool)|string %}
    {% set accel_chip = accel_type ~ " " ~ accel_name %}

    {% set test_x = params.X|default(cfg.test_x)|float %}
    {% set test_y = params.Y|default(cfg.test_y)|float %}
    {% set test_z = params.Z|default(cfg.test_z)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(cfg.travel_speed)|float %}
    {% set query_accel = params.QUERY_ACCEL|default(cfg.query_accel)|int %}
    {% set run_x = params.RUN_X|default(cfg.run_x)|int %}
    {% set run_y = params.RUN_Y|default(cfg.run_y)|int %}
    {% set use_shaper_calibrate = params.SHAPER|default(cfg.use_shaper_calibrate)|int %}

    # Close the prompt immediately after a tool is selected.
    RESPOND TYPE=command MSG="action:prompt_end"

    # Initialize again so this helper is safe to call directly.
    INITIALIZE_TOOLCHANGER
    M400

    RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL selecting T{tool}"
    RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL using accelerometer {accel_chip}"

    # Home only if needed before moving to the resonance test point.
    _CG28

    # Grab the selected tool before testing so the test measures the mounted toolhead mass.
    SELECT_TOOL T={tool}
    M400

    # Move to the resonance test point before testing.
    G90
    G0 X{test_x} Y{test_y} Z{test_z} F{travel_speed}
    M400

    {% if query_accel %}
        # Query selected accelerometer before starting the resonance test.
        ACCELEROMETER_QUERY CHIP={accel_name}
    {% endif %}

    {% if use_shaper_calibrate %}
        # Native Klipper auto-calibration.
        # Requires [resonance_tester] to have usable probe_points configured.
        {% if run_x %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running SHAPER_CALIBRATE X on {accel_chip}"
            SHAPER_CALIBRATE AXIS=X NAME=T{tool}_x CHIPS="{accel_chip}"
        {% endif %}

        {% if run_y %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running SHAPER_CALIBRATE Y on {accel_chip}"
            SHAPER_CALIBRATE AXIS=Y NAME=T{tool}_y CHIPS="{accel_chip}"
        {% endif %}
    {% else %}
        # Native Klipper raw resonance test.
        # POINT is passed directly so this can run even if you want to override probe_points.
        {% if run_x %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running TEST_RESONANCES X on {accel_chip}"
            TEST_RESONANCES AXIS=X NAME=T{tool}_x CHIPS="{accel_chip}" POINT={test_x},{test_y},{test_z}
        {% endif %}

        {% if run_y %}
            RESPOND TYPE=command MSG="_RUN_RESONANCE_TEST_TOOL running TEST_RESONANCES Y on {accel_chip}"
            TEST_RESONANCES AXIS=Y NAME=T{tool}_y CHIPS="{accel_chip}" POINT={test_x},{test_y},{test_z}
        {% endif %}
    {% endif %}


[gcode_macro _CG28]
description: Home only if Klipper does not currently have all axes homed
gcode:
    {% set homed_axes = printer.toolhead.homed_axes | string %}
    {% set machine_fully_homed = 1 if ("x" in homed_axes and "y" in homed_axes and "z" in homed_axes) else 0 %}

    {% if printer.toolchanger is defined %}
        INITIALIZE_TOOLCHANGER
        M400
    {% endif %}

    {% if not machine_fully_homed %}
        G28
    {% else %}
        RESPOND TYPE=command MSG="_CG28: skipped; XYZ already homed"
    {% endif %}


[gcode_macro _CQGL]
description: Beacon-aware quad gantry level only when needed
gcode:
    {% set force_qgl = params.FORCE | default(0) | int %}

    # Re-sync toolchanger before QGL because manual QGL does not pass through PRINT_START.
    # This is the part that reboot/PRINT_START were doing but a direct QGL path was not.
    {% if printer.toolchanger is defined %}
        INITIALIZE_TOOLCHANGER
        M400
    {% endif %}

    # Beacon is mounted to the carriage, so QGL no longer depends on which
    # tool is mounted or whether any tool is mounted.
    {% set homed_axes = printer.toolhead.homed_axes | string %}
    {% set machine_fully_homed = 1 if ("x" in homed_axes and "y" in homed_axes and "z" in homed_axes) else 0 %}

    # Build a passthrough parameter string for native QGL while stripping FORCE,
    # because FORCE is only for this wrapper and native QGL does not use it.
    {% set qgl_params = namespace(value="") %}
    {% for key, value in params.items() %}
        {% if key|upper != "FORCE" %}
            {% set qgl_params.value = qgl_params.value ~ " " ~ key ~ "=" ~ value %}
        {% endif %}
    {% endfor %}

    # Klipper already tracks whether QGL is applied.
    # FORCE=1 intentionally bypasses the conditional skip.
    {% set need_qgl = 1 if (force_qgl or printer.quad_gantry_level.applied == False or not machine_fully_homed) else 0 %}

    {% if not need_qgl %}
        RESPOND TYPE=command MSG="_CQGL: skipped; machine homed and QGL already applied"

    {% else %}
        {% if not machine_fully_homed %}
            M117 Beacon home
            G28
        {% endif %}

        STATUS_LEVELING
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
        M117 Beacon QGL

        # Native QGL already handles retries/tolerance.
        # Keep HORIZONTAL_MOVE_Z in the [quad_gantry_level] config or pass it
        # directly when calling QUAD_GANTRY_LEVEL.
        _QUAD_GANTRY_LEVEL{qgl_params.value}

        # Re-home Z after gantry adjustment using Beacon.
        G28 Z

        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_CALIBRATED
        _BEEP

        RESPOND TYPE=command MSG="Beacon QGL complete"
    {% endif %}


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Public Beacon-aware conditional QGL wrapper
gcode:
    # Normal QUAD_GANTRY_LEVEL is conditional.
    # Use QUAD_GANTRY_LEVEL FORCE=1 when you intentionally want a fresh QGL.
    # Any native QGL params except FORCE are passed through.
    _CQGL {rawparams} FORCE=1

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    STATUS_MESHING
    BTT_BED_MESH_CALIBRATE {rawparams}
    STATUS_READY
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    # Public homing wrapper:
    # - Preserves Knomi and machine-status indications.
    # - Routes physical-switch homing through [homing_override].
    # - The homing override handles the required Y-before-X sequence.
    # - No dock-height movement or second Y homing pass is required.

    {% set raw = rawparams|trim %}
    {% set home_all = raw|length == 0 %}

    {% set home_x = home_all or params.X is defined %}
    {% set home_y = home_all or params.Y is defined %}
    {% set home_z = home_all or params.Z is defined %}

    # Record whether Z was already homed so the existing Z=100
    # standby behavior can be preserved for XY-only homing.
    {% set z_already_homed = 'z' in printer.toolhead.homed_axes %}

    {% set z_travel_speed = 1800 %}

    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    STATUS_HOMING

    {% if home_x and home_y %}
        {% if home_z %}
            RESPOND TYPE=command MSG="G28: homing Y, X, then Z"

            # Pass the complete request through once. The homing override handles:
            # X pre-clear -> Y double-touch -> Y rebound ->
            # X double-touch -> X rebound -> Z home.
            G28.1 {rawparams}

        {% else %}
            RESPOND TYPE=command MSG="G28: homing Y, then X"

            # Request X once. The homing override automatically homes Y first
            # because the fixed X switch is only aligned after Y has homed.
            G28.1 X
        {% endif %}

    {% else %}
        # Single-axis requests pass through the homing override:
        # - G28 X performs the required Y-to-X sequence.
        # - G28 Y homes only Y and performs its 7 mm rebound.
        # - G28 Z performs the existing Z homing sequence.
        G28.1 {rawparams}
    {% endif %}

    # Preserve the existing Z=100 standby position whenever Z is valid.
    # This is unrelated to the removed dock-height Y re-home.
    {% if home_z or z_already_homed %}
        G90
        G1 Z100 F{z_travel_speed}
    {% endif %}

    STATUS_READY
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

    RESPOND TYPE=command MSG="G28: Requested homing complete"

