[gcode_macro _CLEAR_DOCK_ZONE_IF_HIGH]
description: Lower Z before XY travel if the current or destination Y enters the tool dock zone
variable_dock_y_limit: 85.0
variable_dock_z_limit: 125.0
variable_clearance_z: 120.0
variable_z_speed: 1200
gcode:
    # Unsafe dock rule:
    #   When Z is above dock_z_limit, the carriage must not currently be
    #   inside, or travel into, Y <= dock_y_limit.
    #
    # TARGET_Y is optional so existing calls without parameters continue
    # to protect the current position exactly as before.

    {% set v = printer["gcode_macro _CLEAR_DOCK_ZONE_IF_HIGH"] %}
    {% set homed_axes = printer.toolhead.homed_axes|string %}
    {% set was_fully_homed =
        "x" in homed_axes and
        "y" in homed_axes and
        "z" in homed_axes
    %}

    # These coordinates are valid when the machine was already homed.
    # When it was not homed, the separate branch below moves to a known
    # dock-safe Z after _CG28 completes.
    {% set y_now = printer.toolhead.position.y|float %}
    {% set z_now = printer.toolhead.position.z|float %}
    {% set target_y = params.TARGET_Y|default(y_now)|float %}

    _CG28

    {% if not was_fully_homed %}
        # Position values captured before homing cannot be trusted.
        # After _CG28, move vertically to the known dock-clearance height
        # before the calling macro performs any lateral travel.
        RESPOND TYPE=command MSG="_CLEAR_DOCK_ZONE_IF_HIGH: homing completed. Moving to known dock-safe Z={v.clearance_z} before XY travel."

        G90
        G1 Z{v.clearance_z|float} F{v.z_speed|float}

    {% elif z_now > v.dock_z_limit|float and
            (y_now <= v.dock_y_limit|float or
             target_y <= v.dock_y_limit|float) %}

        # This catches both cases:
        #   1. The carriage is already inside the dock-side Y zone.
        #   2. The carriage is at the back but is about to enter that zone.
        RESPOND TYPE=command MSG="_CLEAR_DOCK_ZONE_IF_HIGH: Z={z_now}, current Y={y_now}, target Y={target_y}. Lowering to Z={v.clearance_z} before XY travel."

        G90
        G1 Z{v.clearance_z|float} F{v.z_speed|float}

    {% else %}
        RESPOND TYPE=command MSG="_CLEAR_DOCK_ZONE_IF_HIGH: travel safe. Z={z_now}, current Y={y_now}, target Y={target_y}"
    {% endif %}
    
[gcode_macro WIPE_ALL_NOZZLES]
description: Sequentially heat and safely wipe T0 through T4
variable_wipe_temp: 220
gcode:
    {% set wipe_all = printer["gcode_macro WIPE_ALL_NOZZLES"] %}
    {% set wipe = printer["gcode_macro _WIPE_NOZZLE"] %}
    {% set dock_guard = printer["gcode_macro _CLEAR_DOCK_ZONE_IF_HIGH"] %}
    {% set ps = printer["gcode_macro PRINT_START"] %}

    # Use the existing wipe geometry instead of maintaining duplicate coordinates.
    {% set safe_y = dock_guard.dock_y_limit|float %}
    {% set brush_y = ps.bucket_y|float + wipe.brush_y_offset|float %}
    {% set brush_safe_z = wipe.clearance_z|float %}
    {% set brush_wipe_z = wipe.brush_top|float - wipe.z_wipe_distance|float %}
    {% set brush_plunge = brush_safe_z - brush_wipe_z %}

    # Enforce the rule that only a small brush plunge may occur forward of Y85.
    {% if brush_plunge > 20.0 %}
        { action_raise_error(
            "WIPE_ALL_NOZZLES: Existing _WIPE_NOZZLE geometry requires a "
            ~ brush_plunge|string
            ~ "mm plunge. Refusing wipe because forward Z movement exceeds 20mm."
        ) }
    {% endif %}

    # Remove all existing hotend targets before beginning the sequential warmup.
    # The heated bed is intentionally left unchanged.
    SET_HEATER_TEMPERATURE HEATER=extruder  TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder4 TARGET=0

    # Home only if required.
    _CG28

    G90

    # Begin behind the dock-zone boundary. This move changes only Y, preventing
    # any major Z movement while the carriage is forward of Y85.
    G1 Y{safe_y} F{wipe.prep_spd_xy}
    M400

    M117 Starting sequential nozzle wipe
    RESPOND TYPE=command MSG="WIPE_ALL_NOZZLES: Starting T0-T4 wipe at {wipe_all.wipe_temp|int}C"

    {% for tool in range(5) %}

        # Map T0-T4 to extruder through extruder4.
        {% if tool == 0 %}
            {% set heater = "extruder" %}
        {% else %}
            {% set heater = "extruder" ~ tool|string %}
        {% endif %}

        M117 Heating T{tool}
        RESPOND TYPE=command MSG="WIPE_ALL_NOZZLES: Selecting T{tool}"

        # Every tool change begins at Y85. The toolchanger may raise to dock
        # height, but it never starts that major Z movement from the wipe area.
        T{tool}
        M400

        # Re-establish Y85 after tool selection before making any major Z move.
        # This is normally a no-op when the T macro restores its starting position.
        G90
        G1 Y{safe_y} F{wipe.prep_spd_xy}
        M400

        # Apply the existing dock-height protection while still at Y85, then
        # complete the descent to the existing brush-safe Z at the same Y position.
        _CLEAR_DOCK_ZONE_IF_HIGH TARGET_Y={brush_y}

        G90
        G1 Z{brush_safe_z} F{wipe.prep_spd_z}
        M400

        # Only the current tool is heated. The preceding heater was shut down
        # before this iteration began.
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={wipe_all.wipe_temp}
        TEMPERATURE_WAIT SENSOR={heater} MINIMUM={wipe_all.wipe_temp - 2.0}

        M117 Wiping T{tool}
        RESPOND TYPE=command MSG="WIPE_ALL_NOZZLES: Wiping T{tool}"

        # Relieve nozzle pressure before brushing the softened material away.
        SAVE_GCODE_STATE NAME=WIPE_ALL_NOZZLES_RETRACT_{tool}
        M83
        G1 E-2.0 F1500
        RESTORE_GCODE_STATE NAME=WIPE_ALL_NOZZLES_RETRACT_{tool}

        # _WIPE_NOZZLE now begins at its existing clearance_z. It moves forward
        # at that height, performs only its small brush plunge, and returns to
        # the same brush-safe Z before returning control here.
        _WIPE_NOZZLE
        M400

        # Shut down this heater before the next hotend is enabled.
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0

        RESPOND TYPE=command MSG="WIPE_ALL_NOZZLES: Exiting wipe area after T{tool}"

        # Confirm that no dock-height correction is required, then retreat along
        # Y while remaining at the brush-safe Z. The following T command may raise
        # to dock height only after the carriage has reached Y85.
        _CLEAR_DOCK_ZONE_IF_HIGH TARGET_Y={safe_y}

        G90
        G1 Y{safe_y} F{wipe.prep_spd_xy}
        M400

    {% endfor %}

    M117 All nozzles wiped
    RESPOND TYPE=command MSG="WIPE_ALL_NOZZLES: T0-T4 complete; all hotends off and carriage at safe Y"
    
