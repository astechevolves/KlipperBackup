    {% set lift_speed = params.LIFT_SPEED|default(lift_speed)|float %}
    {% set retract = params.RETRACT|default(sample_retract_dist)|float %}

    RESPOND TYPE=command MSG="Running PROBE_ACCURACY with SAMPLES={samples}, PROBE_SPEED={probe_speed}, LIFT_SPEED={lift_speed}, RETRACT={retract}"

    PROBE_ACCURACY SAMPLES={samples} PROBE_SPEED={probe_speed} LIFT_SPEED={lift_speed} SAMPLE_RETRACT_DIST={retract}

    
[gcode_macro RESONANCE_TOOL_MENU]
description: Initialize toolchanger, then show toolheads for resonance testing
gcode:
    # Initialize first so the toolchanger detects the currently mounted tool
    # and populates the toolchanger state before the prompt is built.
    INITIALIZE_TOOLCHANGER
    M400

    # Delay prompt generation so it runs after INITIALIZE_TOOLCHANGER executes.
    UPDATE_DELAYED_GCODE ID=_SHOW_RESONANCE_TOOL_MENU DURATION=0.25


[delayed_gcode _SHOW_RESONANCE_TOOL_MENU]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Toolhead Resonance Test"
    RESPOND TYPE=command MSG="action:prompt_text Select the toolhead to grab and run resonance testing."

    {% if printer.toolchanger is not defined %}
        RESPOND TYPE=command MSG="action:prompt_text ERROR toolchanger is not defined."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
        {action_raise_error("_SHOW_RESONANCE_TOOL_MENU requires printer.toolchanger")}
    {% endif %}

    {% set ns = namespace(count=0) %}

    # Show every tool reported by the toolchanger.
    # Do not filter on variable_active because that does not reliably mean installed or available.
