#####################################################################
#                    Standalone Poop Pellet Shoot Macro
#                    Voron 2.4 / StealthChanger / LLL Plus Buffer0
#####################################################################
# Purpose:
# - Preheats the active hotend.
# - Moves to the LOAD_FILAMENT purge bucket position for staging/wiping.
# - Centers Buffer0 before purge so the filament path starts neutral.
# - Uses _WIPE_NOZZLE tuning values for brush geometry.
# - Enters the brush from the right / bucket side and swipes left first.
# - Forms a purge pellet at dedicated absolute pellet coordinates.
# - Syncs Buffer0 through all intentional E motion: anchor, purge, retract.
# - Builds the pellet by extruding while slowly raising Z.
# - Moves back to the bucket and wipes while cooling.
# - Returns to the pellet and kicks it into the bucket.
#
# Required existing macros:
# - _CG28
# - _WIPE_NOZZLE
# - CENTER_BUFFER_0
# - STOP_CENTER_BUFFER_0
# - BUFFER_SYNC_ON_0
# - BUFFER_SYNC_OFF_0
# - DISABLE_AUTO_BUFFER0
# - STOP_PERCENT_MOVE_BUFFER0
#
# Required LOAD_FILAMENT variables:
# - variable_purge_bucket_x
# - variable_purge_bucket_y
# - variable_purge_bucket_z
#
# Note:
# - Tune using the variables below.
# - Runtime parameter overrides are intentionally not used because this macro
#   hands off to delayed/helper stages, and normal params do not carry forward.
#####################################################################

[gcode_macro POOP_PELLET_SHOOT]
description: Preheat, wipe, center Buffer0, poop pellet, wipe while cooling, then shoot pellet.

# -------------------------------------------------------------------
# Temperature tuning
# -------------------------------------------------------------------
variable_purge_temp: 250.0             # Hotend temp used while forming the purge pellet
variable_shoot_temp: 160.0             # Cooldown temp before kicking the pellet
variable_temp_tolerance: 2.0           # Temperature wait tolerance

# -------------------------------------------------------------------
# Motion speed tuning
# -------------------------------------------------------------------
variable_travel_speed: 12000           # XY travel speed in mm/min for this macro
variable_z_speed: 600                  # Z travel speed in mm/min for normal Z positioning

# -------------------------------------------------------------------
# Pellet forming location - absolute printer coordinates
# -------------------------------------------------------------------
variable_form_x: 310.0                 # X location where pellet is formed
variable_form_y: 30.0                  # Y location where pellet is formed
variable_form_z: 0.25                  # Starting Z height for pellet formation

# -------------------------------------------------------------------
# Pellet extrusion tuning
# -------------------------------------------------------------------
variable_filament_diameter: 1.75       # Used to convert poop_flow_mm3s into E feedrate
variable_purge_length: 65.0            # Total filament length extruded into pellet
variable_anchor_length: 12.0            # Slow initial extrusion at form_z to stick pellet to surface
variable_anchor_speed: 180             # Anchor extrusion speed in mm/min
variable_poop_flow_mm3s: 8.0           # Volumetric purge flow while forming pellet
variable_purge_chunk_mm: 4.0           # Smaller chunks give smoother Z rise / extrusion timing
variable_pellet_z_lift: 6.0            # Z lift while extruding the body of the pellet
variable_retract_length: 2.5           # Matched hotend+buffer retract after pellet formation
variable_retract_speed: 1800           # Retract speed in mm/min
variable_settle_ms: 250                # Short pause after pellet formation

# -------------------------------------------------------------------
# Neck-forming move after pellet creation - absolute printer coordinates
# -------------------------------------------------------------------
variable_neck_x: 310.0                 # Move here after retract to pull/string away from pellet
variable_neck_y: 35.0                  # Keep near pellet unless a longer neck pull is needed
variable_neck_z: 10.0                   # Z height during neck pull
variable_neck_speed: 4500              # Neck pull speed in mm/min

# -------------------------------------------------------------------
# Pellet shooting location - absolute printer coordinates
# -------------------------------------------------------------------
variable_shoot_start_x: 310.0          # Nozzle starts behind pellet here
variable_shoot_start_y: 30.0           # Nozzle starts behind pellet here
variable_shoot_end_x: 310.0            # Nozzle pushes toward this location
variable_shoot_end_y: 0.0              # Nozzle pushes toward this location
variable_shoot_z: 2.0                  # Nozzle height while kicking pellet
variable_shoot_speed: 18000            # Fast push speed in mm/min
variable_shoot_passes: 1               # Number of kick attempts

# -------------------------------------------------------------------
# Internal state - do not tune
# -------------------------------------------------------------------
variable_active: 0
variable_saved_hotend_target: 0.0
variable_center_poll_time: 0.25

gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set th = printer.toolhead %}
    {% set active_extruder = th.extruder %}

    # Prevent stacking this macro on top of itself.
    {% if vars.active|int == 1 %}
        {action_raise_error("POOP_PELLET_SHOOT is already active.")}
    {% endif %}

    # Pull only the actual purge bucket stage position from LOAD_FILAMENT.
    # Pellet geometry remains owned by this macro and uses absolute coordinates.
    {% set bucket_x = load.purge_bucket_x|float %}
    {% set bucket_y = load.purge_bucket_y|float %}
    {% set bucket_z = load.purge_bucket_z|float %}

    # Pull this macro's tuned values.
    {% set form_x = vars.form_x|float %}
    {% set form_y = vars.form_y|float %}
    {% set form_z = vars.form_z|float %}
    {% set neck_x = vars.neck_x|float %}
    {% set neck_y = vars.neck_y|float %}
    {% set neck_z = vars.neck_z|float %}
    {% set shoot_start_x = vars.shoot_start_x|float %}
    {% set shoot_start_y = vars.shoot_start_y|float %}
    {% set shoot_end_x = vars.shoot_end_x|float %}
    {% set shoot_end_y = vars.shoot_end_y|float %}
    {% set shoot_z = vars.shoot_z|float %}
    {% set pellet_top_z = form_z + vars.pellet_z_lift|float %}

    # Prevent invalid purge chunking before any motion starts.
    {% if vars.purge_chunk_mm|float <= 0 %}
        {action_raise_error("POOP_PELLET_SHOOT variable_purge_chunk_mm must be greater than 0.")}
    {% endif %}

    {% if vars.pellet_z_lift|float < 0 %}
        {action_raise_error("POOP_PELLET_SHOOT variable_pellet_z_lift must be zero or positive.")}
    {% endif %}

    # Home if needed before moving to bucket, wipe, pellet, or shoot positions.
    {% if "x" not in th.homed_axes or "y" not in th.homed_axes or "z" not in th.homed_axes %}
        _CG28
    {% endif %}

    # Coordinate safety checks against Klipper's configured travel limits.
    {% if bucket_x < th.axis_minimum.x or bucket_x > th.axis_maximum.x or
          form_x < th.axis_minimum.x or form_x > th.axis_maximum.x or
          neck_x < th.axis_minimum.x or neck_x > th.axis_maximum.x or
          shoot_start_x < th.axis_minimum.x or shoot_start_x > th.axis_maximum.x or
          shoot_end_x < th.axis_minimum.x or shoot_end_x > th.axis_maximum.x %}
        {action_raise_error("POOP_PELLET_SHOOT X coordinate is outside configured axis limits.")}
    {% endif %}

    {% if bucket_y < th.axis_minimum.y or bucket_y > th.axis_maximum.y or
          form_y < th.axis_minimum.y or form_y > th.axis_maximum.y or
          neck_y < th.axis_minimum.y or neck_y > th.axis_maximum.y or
          shoot_start_y < th.axis_minimum.y or shoot_start_y > th.axis_maximum.y or
          shoot_end_y < th.axis_minimum.y or shoot_end_y > th.axis_maximum.y %}
        {action_raise_error("POOP_PELLET_SHOOT Y coordinate is outside configured axis limits.")}
    {% endif %}

    {% if bucket_z < th.axis_minimum.z or bucket_z > th.axis_maximum.z or
          form_z < th.axis_minimum.z or form_z > th.axis_maximum.z or
          pellet_top_z < th.axis_minimum.z or pellet_top_z > th.axis_maximum.z or
          neck_z < th.axis_minimum.z or neck_z > th.axis_maximum.z or
          shoot_z < th.axis_minimum.z or shoot_z > th.axis_maximum.z %}
        {action_raise_error("POOP_PELLET_SHOOT Z coordinate is outside configured axis limits.")}
    {% endif %}

    # Save state for delayed stages and cleanup.
    SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=saved_hotend_target VALUE={printer[active_extruder].target|float}
    SAVE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE

    # Start preheating immediately.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.purge_temp}

    # Move to the known purge bucket stage position while preparing the buffer.
    G90
    M83
    G1 X{bucket_x} F{vars.travel_speed}
    G1 Y{bucket_y} F{vars.travel_speed}
    G1 Z{bucket_z} F{vars.z_speed}

    # This macro owns Buffer0 while it runs.
    # Stop the normal buffer behavior and clear stale sync/centering state before centering.
    DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
    STOP_CENTER_BUFFER_0
    STOP_PERCENT_MOVE_BUFFER0
    BUFFER_SYNC_OFF_0
    M400

    # Center Buffer0 using that macro's own configured defaults.
    # Do not pass tuning here; CENTER_BUFFER_0 owns its own tuning.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT centering Buffer0"
    CENTER_BUFFER_0 FORCE=1

    # CENTER_BUFFER_0 runs as a delayed state machine, so this helper waits until it reports complete.
    UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_WAIT_CENTER DURATION={vars.center_poll_time}


[delayed_gcode _POOP_PELLET_SHOOT_WAIT_CENTER]
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set center = printer["gcode_macro CENTER_BUFFER_0"] %}

    {% if vars.active|int == 1 %}
        {% if center.active|int == 1 %}
            # Keep polling until CENTER_BUFFER_0 finishes its own sensor-driven sequence.
            UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_WAIT_CENTER DURATION={vars.center_poll_time}
        {% else %}
            _POOP_PELLET_SHOOT_RUN
        {% endif %}
    {% endif %}


[gcode_macro _POOP_PELLET_SHOOT_RUN]
description: Internal stage for POOP_PELLET_SHOOT after Buffer0 centering is complete.
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set wipe = printer["gcode_macro _WIPE_NOZZLE"] %}
    {% set th = printer.toolhead %}
    {% set active_extruder = th.extruder %}

    # Pull only the bucket stage position from LOAD_FILAMENT.
    {% set bucket_x = load.purge_bucket_x|float %}
    {% set bucket_y = load.purge_bucket_y|float %}
    {% set bucket_z = load.purge_bucket_z|float %}

    # Pull wipe geometry from _WIPE_NOZZLE so this follows the current brush tuning.
    {% set wipe_y = bucket_y + wipe.brush_y_offset|float %}
    {% set wipe_x_left = wipe.brush_start|float %}
    {% set wipe_x_right = wipe.brush_start|float + wipe.brush_width|float %}
    {% set wipe_z = wipe.brush_top|float - wipe.z_wipe_distance|float %}
    {% set wipe_safe_z = [bucket_z, wipe.clearance_z|float]|max %}

    # Use this macro's own absolute pellet geometry.
    {% set form_x = vars.form_x|float %}
    {% set form_y = vars.form_y|float %}
    {% set form_z = vars.form_z|float %}
    {% set neck_x = vars.neck_x|float %}
    {% set neck_y = vars.neck_y|float %}
    {% set neck_z = vars.neck_z|float %}
    {% set shoot_start_x = vars.shoot_start_x|float %}
    {% set shoot_start_y = vars.shoot_start_y|float %}
    {% set shoot_end_x = vars.shoot_end_x|float %}
    {% set shoot_end_y = vars.shoot_end_y|float %}
    {% set shoot_z = vars.shoot_z|float %}

    # Validate the direct right-to-left brush wipe path before heating/wiping.
    {% if wipe_x_left < wipe.safe_x_min|float or wipe_x_left > wipe.safe_x_max|float or
          wipe_x_right < wipe.safe_x_min|float or wipe_x_right > wipe.safe_x_max|float or
          wipe_x_right <= wipe_x_left %}
        _POOP_PELLET_SHOOT_CLEANUP
        {action_raise_error("POOP_PELLET_SHOOT direct brush wipe X path is outside _WIPE_NOZZLE safe range.")}
    {% endif %}

    {% if wipe_y < th.axis_minimum.y or wipe_y > th.axis_maximum.y %}
        _POOP_PELLET_SHOOT_CLEANUP
        {action_raise_error("POOP_PELLET_SHOOT direct brush wipe Y is outside configured axis limits.")}
    {% endif %}

    {% if wipe_z < th.axis_minimum.z or wipe_z > th.axis_maximum.z or
          wipe_safe_z < th.axis_minimum.z or wipe_safe_z > th.axis_maximum.z %}
        _POOP_PELLET_SHOOT_CLEANUP
        {action_raise_error("POOP_PELLET_SHOOT direct brush wipe Z is outside configured axis limits.")}
    {% endif %}

    # Use active extruder limits so purge flow cannot exceed Klipper's E-only velocity cap.
    {% set max_e_feed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %}

    # Convert requested volumetric flow into filament feedrate.
    # Example: 8 mm^3/s on 1.75mm filament is about 199 mm/min of E feed.
    {% set filament_area = 3.14159 * (vars.filament_diameter|float / 2.0) * (vars.filament_diameter|float / 2.0) %}
    {% set requested_purge_feed = (vars.poop_flow_mm3s|float / filament_area) * 60.0 %}
    {% set purge_feed = [requested_purge_feed, max_e_feed]|min %}
    {% set safe_retract_speed = [vars.retract_speed|float, max_e_feed]|min %}
    {% set body_length = [vars.purge_length|float - vars.anchor_length|float, 0.0]|max %}

    # Wait for purge temperature before wiping or extruding.
    TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={vars.purge_temp|float - vars.temp_tolerance|float}

    # Absolute XYZ, relative E.
    G90
    M83

    # First wipe: plunge on the right / bucket side of the brush and swipe left first.
    # This pulls the hot string off toward the brush instead of diving into the left side
    # and smearing hot filament across the nozzle.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT first right-to-left nozzle wipe before pellet"
    G1 Z{wipe_safe_z} F{vars.z_speed}
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    G1 X{wipe_x_right} Y{wipe_y} F{wipe.prep_spd_xy}
    G1 Z{wipe_z} F{wipe.prep_spd_z}

    {% for wipes in range(wipe.wipe_qty|int) %}
        G1 X{wipe_x_left} F{wipe.wipe_spd_xy}
        G1 X{wipe_x_right} F{wipe.wipe_spd_xy}
    {% endfor %}

    G1 Z{wipe_safe_z} F{wipe.prep_spd_z}
    M400

    # Move to the dedicated absolute pellet forming location.
    G1 Z{bucket_z} F{vars.z_speed}
    G1 X{form_x} Y{form_y} F{vars.travel_speed}
    G1 Z{form_z} F{vars.z_speed}

    # Sync Buffer0 through the entire intentional E sequence.
    # Anchor, purge, and retract all move both drives together.
    BUFFER_SYNC_ON_0
    M400
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Buffer0 sync ON for anchor/purge/retract"

    # Slow anchor extrusion at low Z helps the pellet stick before the rising purge begins.
    {% if vars.anchor_length|float > 0 %}
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT anchor purge E={vars.anchor_length|float} F={vars.anchor_speed|float}"
        G1 E{vars.anchor_length|float|round(3)} F{vars.anchor_speed|float|round(0)}
    {% endif %}

    # Build the pellet body by extruding while slowly raising Z.
    # Do not use purge_feed directly as the combined Z+E move speed:
    # for a tiny Z move, that turns into a blob cannon.
    #
    # Instead, calculate the Z feedrate so each Z rise takes the same
    # amount of time as the desired E feed for that chunk.
    #
    # E time, minutes = this_e / purge_feed
    # Z feed, mm/min = z_delta / E time
    # Z feed = z_delta * purge_feed / this_e
    {% if body_length > 0 %}
        {% set chunks = (body_length / (vars.purge_chunk_mm|float))|round(0, "ceil")|int %}
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT rising purge body_length={body_length|round(2)} chunks={chunks} purge_feed={purge_feed|round(1)}"

        {% for i in range(chunks) %}
            {% set remaining = body_length - (i * (vars.purge_chunk_mm|float)) %}
            {% set this_e = [vars.purge_chunk_mm|float, remaining]|min %}

            # Calculate the previous and next absolute Z position for this chunk.
            {% set prev_z = form_z + (vars.pellet_z_lift|float * (i / chunks)) %}
            {% set this_z = form_z + (vars.pellet_z_lift|float * ((i + 1) / chunks)) %}
            {% set z_delta = this_z - prev_z %}

            {% if this_e > 0 and z_delta > 0 %}
                {% set lift_feed = (z_delta * purge_feed / this_e) %}
                G1 Z{this_z|round(3)} E{this_e|round(3)} F{lift_feed|round(1)}
            {% elif this_e > 0 %}
                # If pellet_z_lift is zero, fall back to true E-only purge chunks.
                G1 E{this_e|round(3)} F{purge_feed|round(0)}
            {% endif %}
        {% endfor %}
    {% endif %}

    # Retract while Buffer0 is still synced so the filament path moves as one system.
    {% if vars.retract_length|float > 0 %}
        G1 E-{vars.retract_length|float|round(3)} F{safe_retract_speed|round(0)}
    {% endif %}

    # All intentional E motion is complete. Desync before wipe/shoot travel moves.
    M400
    BUFFER_SYNC_OFF_0
    M400
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Buffer0 sync OFF after pellet E sequence"
    
    # Start cooling early so the next travel/wait/wipe steps happen while the nozzle is dropping.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.shoot_temp}

    # Let the pellet settle, then pull away slightly to thin or break the strand.
    {% if vars.settle_ms|int > 0 %}
        G4 P{vars.settle_ms|int}
    {% endif %}
    G1 Z{neck_z} F{vars.z_speed}
    G1 X{neck_x} Y{neck_y} F{vars.neck_speed}

    # Park over the bucket while cooling so ooze drops into the bucket, not onto the bed.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT parking over bucket and cooling before wipe"
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    G1 Z{bucket_z} F{vars.z_speed}

    # Wait until the nozzle has cooled close enough to the final shoot temp that wiping will
    # pull semi-firm filament instead of smearing fully molten ooze everywhere.
    TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={vars.shoot_temp|float + 30.0}

    # Cooling wipe: also enter from the right / bucket side and swipe left first.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT right-to-left wipe at shoot temp + 30C"
    G1 Z{wipe_safe_z} F{vars.z_speed}
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    G1 X{wipe_x_right} Y{wipe_y} F{wipe.prep_spd_xy}
    G1 Z{wipe_z} F{wipe.prep_spd_z}

    {% for wipes in range(wipe.wipe_qty|int) %}
        G1 X{wipe_x_left} F{wipe.wipe_spd_xy}
        G1 X{wipe_x_right} F{wipe.wipe_spd_xy}
    {% endfor %}

    G1 Z{wipe_safe_z} F{wipe.prep_spd_z}
    M400

    # Return to the bucket/stage position and finish cooling before kicking the pellet.
    G1 Z{bucket_z} F{vars.z_speed}
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    M400

    # Wait until the hotend cools enough that the pellet is less likely to smear.
    {% if vars.shoot_temp|float < vars.purge_temp|float %}
        TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={vars.shoot_temp|float + vars.temp_tolerance|float}
    {% endif %}

    # Return to the dedicated absolute shoot path and kick the hardened pellet into the bucket.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT kicking pellet into bucket"
    {% for pass in range(vars.shoot_passes|int) %}
        G1 Z{neck_z} F{vars.z_speed}
        G1 X{shoot_start_x} Y{shoot_start_y} F{vars.travel_speed}
        G1 Z{shoot_z} F{vars.z_speed}
        M400
        G1 X{shoot_end_x} Y{shoot_end_y} F{vars.shoot_speed}
    {% endfor %}

    # Lift clear and clean up.
    G1 Z{bucket_z} F{vars.z_speed}
    _POOP_PELLET_SHOOT_CLEANUP

    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT complete using active extruder: {active_extruder}"


[gcode_macro _POOP_PELLET_SHOOT_CLEANUP]
description: Internal cleanup for POOP_PELLET_SHOOT.
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set active_extruder = printer.toolhead.extruder %}

    # Cancel any pending center wait loop before resetting state.
    UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_WAIT_CENTER DURATION=0

    # Leave Buffer0 idle, desynced, and not in a service routine.
    M400
    BUFFER_SYNC_OFF_0
    STOP_CENTER_BUFFER_0
    STOP_PERCENT_MOVE_BUFFER0
    DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=1
    M400

    # Restore the hotend target that existed before the poop macro started.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.saved_hotend_target}

    # Restore motion/extrusion mode and clear active flag.
    RESTORE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE MOVE=0
    SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=active VALUE=0