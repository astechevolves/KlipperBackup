#####################################################################
#                    Standalone Poop Pellet Shoot Macro
#                    Voron 2.4 / StealthChanger / lll-buffed Buffer
#####################################################################
# Purpose:
# - Uses LOAD_FILAMENT bucket/stage coordinates for staging.
# - Uses _WIPE_NOZZLE as the only source of truth for brush wiping.
# - Uses Beacon to sample a nearby local deck height before forming the pellet.
# - Clamps the Beacon sample carriage/nozzle Y to keep the nozzle at Y>=1.
# - Uses the sampled local deck height plus variable_form_z for purge start height.
# - Moves to the pellet start height while the hotend reheats.
# - Forms a purge pellet at dedicated X/Y coordinates.
# - Lets lll-buffed firmware handle buffer feed behavior in AUTO.
# - Builds the pellet by extruding while slowly raising Z.
# - Moves back to the bucket and wipes while cooling.
# - Returns to the pellet and kicks it into the bucket.
# - Performs a final 220C wipe, then either restores temp or sets the hotend to zero.
#
# Required existing macros / commands:
# - LOAD_FILAMENT
# - _CG28
# - PROBE
# - _WIPE_NOZZLE
# - BUFFER_ARM_ACTIVE_TOOL
#
# Optional call parameters:
# - TEMP=260                  Overrides purge_temp for this run.
# - RESTORE_TEMP=0            Final cleanup sets hotend target to 0 instead of restoring previous target.
# - BUFFER_AUTO=1             Returns active buffer to AUTO before pellet purge.
# - BUFFER_AUTO_CLEANUP=1     Returns active buffer to AUTO during cleanup.
# - DIRECT_FEED=1             Skips active buffer use through BUFFER_ARM_ACTIVE_TOOL.
# - RESET_ACTIVE=1            Clears a stale active latch after an interrupted run.
#
# Note:
# - LOAD_FILAMENT owns the bucket/stage X/Y/Z position.
# - _WIPE_NOZZLE owns all brush wipe motion.
# - TEMP / RESTORE_TEMP / BUFFER_AUTO / DIRECT_FEED are stored at macro start
#   because the macro hands off to delayed/helper stages.
#####################################################################

[gcode_macro POOP_PELLET_SHOOT]
description: Beacon sample, reheat at pellet start, poop pellet, wipe, shoot pellet, final wipe.

# -------------------------------------------------------------------
# Temperature tuning
# -------------------------------------------------------------------
variable_purge_temp: 250.0             # Hotend temp used while forming the purge pellet unless TEMP= is passed.
variable_shoot_temp: 180.0             # Cooldown temp before kicking the pellet.
variable_temp_tolerance: 2.0           # Temperature wait tolerance.

# -------------------------------------------------------------------
# Wipe / cleanup tuning
# -------------------------------------------------------------------
variable_final_wipe_temp: 220.0        # Final cleanup wipe temp after pellet shoot is complete.
variable_wipe_fan_speed: 255           # Fan speed used while cooling/wiping stringy material.
variable_wipe_fan_pause_ms: 500        # Pause after fan turns on before each wipe.

# -------------------------------------------------------------------
# Motion speed tuning
# -------------------------------------------------------------------
variable_travel_speed: 12000           # XY travel speed in mm/min for this macro.
variable_z_speed: 600                  # Z travel speed in mm/min for normal Z positioning.

# -------------------------------------------------------------------
# Local purge-point probing
# -------------------------------------------------------------------
variable_probe_safe_z: 8.0             # Safe Z used while moving to/from the local Beacon sample point.
variable_sample_min_y: 1.0             # Keep the nozzle/carriage at or above this Y while Beacon samples.

# -------------------------------------------------------------------
# Pellet forming location - local-sampled Z, absolute X/Y
# -------------------------------------------------------------------
variable_form_x: 310.0                 # X location where pellet is formed.
variable_form_y: 80.0                 # Y location where pellet is formed.
variable_form_z: 0.45                  # Nozzle height above sampled local deck for pellet start.

# -------------------------------------------------------------------
# Pellet extrusion tuning
# -------------------------------------------------------------------
variable_filament_diameter: 1.75       # Used to convert poop_flow_mm3s into E feedrate.
variable_purge_length: 70.0            # Total filament length extruded into pellet.
variable_poop_flow_mm3s: 9             # Volumetric purge flow while forming pellet.
variable_purge_chunk_mm: 6.0           # Smaller chunks give smoother Z rise / extrusion timing.
variable_pellet_z_lift: 8.0            # Z lift while extruding the body of the pellet.
variable_retract_length: 2.5           # Hotend retract after pellet formation.
variable_retract_speed: 1800           # Retract speed in mm/min.
variable_settle_ms: 250                # Short pause after pellet formation.

# -------------------------------------------------------------------
# Neck-forming move after pellet creation - absolute printer coordinates
# -------------------------------------------------------------------
variable_neck_x: 310.0                 # Move here after retract to pull/string away from pellet.
variable_neck_y: 5.0                   # Keep near pellet unless a longer neck pull is needed.
variable_neck_z: 20.0                  # Z height during neck pull.
variable_neck_speed: 7000              # Neck pull speed in mm/min.

# -------------------------------------------------------------------
# Pellet shooting location - absolute printer coordinates
# -------------------------------------------------------------------
variable_shoot_start_x: 310.0          # Nozzle starts behind pellet here.
variable_shoot_start_y: 95        # Nozzle starts behind pellet here.
variable_shoot_end_x: 310.0            # Nozzle pushes toward this location.
variable_shoot_end_y: 4.0              # Nozzle pushes toward this location.
variable_shoot_z: 0.5                # Nozzle height while kicking pellet.
variable_shoot_speed: 18000            # Fast push speed in mm/min.
variable_shoot_passes: 1               # Number of kick attempts.

# -------------------------------------------------------------------
# Buffer behavior
# -------------------------------------------------------------------
variable_buffer_auto_before_purge: 1   # 1 = return active buffer to AUTO before purge extrusion.
variable_buffer_auto_cleanup: 1        # 1 = return active buffer to AUTO during cleanup.

# -------------------------------------------------------------------
# Internal runtime state - do not tune
# -------------------------------------------------------------------
variable_active: 0
variable_saved_hotend_target: 0.0
variable_runtime_purge_temp: 250.0
variable_restore_previous_temp: 1
variable_runtime_buffer_auto_before_purge: 1
variable_runtime_buffer_auto_cleanup: 1
variable_runtime_direct_feed: 0

gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set th = printer.toolhead %}
    {% set active_extruder = th.extruder %}

    # Manual recovery path for an interrupted delayed run.
    {% if params.RESET_ACTIVE|default(0)|int == 1 %}
        UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_RUN_DELAY DURATION=0
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=active VALUE=0
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT active latch reset"

    # Ignore duplicate calls while the delayed poop stage is still running.
    {% elif vars.active|int == 1 %}
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT already active; ignoring duplicate call"

    {% else %}
        # Beacon publishes the most recent PROBE result through printer.beacon.last_z_result.
        {% if printer.beacon is not defined %}
            {action_raise_error("POOP_PELLET_SHOOT requires printer.beacon so PROBE can update printer.beacon.last_z_result.")}
        {% endif %}

        # Pull Beacon X/Y offsets from the active [beacon] config.
        {% set beacon_x_offset = printer.configfile.settings["beacon"].x_offset|default(0.0)|float %}
        {% set beacon_y_offset = printer.configfile.settings["beacon"].y_offset|default(0.0)|float %}

        # Pull the bucket/stage position from LOAD_FILAMENT so the bucket location has one source of truth.
        {% set bucket_x = load.bucket_x|float %}
        {% set bucket_y = load.bucket_y|float %}
        {% set bucket_z = load.bucket_z|float %}

        # Pull this macro's tuned pellet geometry.
        {% set form_x = vars.form_x|float %}
        {% set form_y = vars.form_y|float %}
        {% set form_z_above_deck = vars.form_z|float %}
        {% set neck_x = vars.neck_x|float %}
        {% set neck_y = vars.neck_y|float %}
        {% set neck_z = vars.neck_z|float %}
        {% set shoot_start_x = vars.shoot_start_x|float %}
        {% set shoot_start_y = vars.shoot_start_y|float %}
        {% set shoot_end_x = vars.shoot_end_x|float %}
        {% set shoot_end_y = vars.shoot_end_y|float %}
        {% set shoot_z = vars.shoot_z|float %}
        {% set probe_safe_z = vars.probe_safe_z|float %}

        # Carriage position that puts Beacon as close as practical to the nozzle poop point.
        # With Beacon behind the nozzle, exact sampling may require negative Y.
        # Clamp only the carriage/nozzle Y and let normal Klipper motion checks handle the rest.
        {% set beacon_sample_x = form_x - beacon_x_offset %}
        {% set beacon_sample_y_raw = form_y - beacon_y_offset %}
        {% set beacon_sample_y = [beacon_sample_y_raw, vars.sample_min_y|float]|max %}
        {% set actual_beacon_x = beacon_sample_x + beacon_x_offset %}
        {% set actual_beacon_y = beacon_sample_y + beacon_y_offset %}

        # Store runtime behavior because params do not carry into delayed/helper stages.
        {% set runtime_purge_temp = params.TEMP|default(vars.purge_temp)|float %}
        {% set restore_previous_temp = params.RESTORE_TEMP|default(vars.restore_previous_temp)|int %}
        {% set buffer_auto_before_purge = params.BUFFER_AUTO|default(vars.buffer_auto_before_purge)|int %}
        {% set buffer_auto_cleanup = params.BUFFER_AUTO_CLEANUP|default(vars.buffer_auto_cleanup)|int %}
        {% set direct_feed = params.DIRECT_FEED|default(0)|int %}

        # Runtime status values used for messages and validation.
        {% set final_wipe_temp = vars.final_wipe_temp|float %}
        {% set current_temp = printer[active_extruder].temperature|float %}

        # Prevent invalid purge chunking before any motion starts.
        {% if vars.purge_chunk_mm|float <= 0 %}
            {action_raise_error("POOP_PELLET_SHOOT variable_purge_chunk_mm must be greater than 0.")}
        {% endif %}

        {% if vars.pellet_z_lift|float < 0 %}
            {action_raise_error("POOP_PELLET_SHOOT variable_pellet_z_lift must be zero or positive.")}
        {% endif %}

        {% if form_z_above_deck < 0 %}
            {action_raise_error("POOP_PELLET_SHOOT variable_form_z must be zero or positive because it is height above the sampled local deck.")}
        {% endif %}

        {% if final_wipe_temp <= 0 %}
            {action_raise_error("POOP_PELLET_SHOOT variable_final_wipe_temp must be greater than 0.")}
        {% endif %}

        {% if vars.wipe_fan_pause_ms|int < 0 %}
            {action_raise_error("POOP_PELLET_SHOOT variable_wipe_fan_pause_ms cannot be negative.")}
        {% endif %}

        # Home if needed before moving to bucket, pellet, sample, or shoot positions.
        {% if "x" not in th.homed_axes or "y" not in th.homed_axes or "z" not in th.homed_axes %}
            _CG28
        {% endif %}

        # Coordinate safety checks against Klipper's configured travel limits.
        # The Beacon sample move is intentionally not checked here; Klipper will error normally if invalid.
        {% if bucket_x < th.axis_minimum.x or bucket_x > th.axis_maximum.x or
              form_x < th.axis_minimum.x or form_x > th.axis_maximum.x or
              neck_x < th.axis_minimum.x or neck_x > th.axis_maximum.x or
              shoot_start_x < th.axis_minimum.x or shoot_start_x > th.axis_maximum.x or
              shoot_end_x < th.axis_minimum.x or shoot_end_x > th.axis_maximum.x %}
            {action_raise_error("POOP_PELLET_SHOOT X coordinate is outside configured axis limits.")}
        {% endif %}

        {% if bucket_y < th.axis_minimum.y or bucket_y > th.axis_maximum.y or
              form_y < th.axis_minimum.y or form_y > th.axis_maximum.y or
              neck_y < th.axis_minimum.y or neck_y > th.axis_maximum.y or
              shoot_start_y < th.axis_minimum.y or shoot_start_y > th.axis_maximum.y or
              shoot_end_y < th.axis_minimum.y or shoot_end_y > th.axis_maximum.y %}
            {action_raise_error("POOP_PELLET_SHOOT Y coordinate is outside configured axis limits.")}
        {% endif %}

        {% if bucket_z < th.axis_minimum.z or bucket_z > th.axis_maximum.z or
              probe_safe_z < th.axis_minimum.z or probe_safe_z > th.axis_maximum.z or
              neck_z < th.axis_minimum.z or neck_z > th.axis_maximum.z or
              shoot_z < th.axis_minimum.z or shoot_z > th.axis_maximum.z %}
            {action_raise_error("POOP_PELLET_SHOOT Z coordinate is outside configured axis limits.")}
        {% endif %}

        # Save state for delayed stages and cleanup.
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=saved_hotend_target VALUE={printer[active_extruder].target|float}
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=runtime_purge_temp VALUE={runtime_purge_temp}
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=restore_previous_temp VALUE={restore_previous_temp}
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=runtime_buffer_auto_before_purge VALUE={buffer_auto_before_purge}
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=runtime_buffer_auto_cleanup VALUE={buffer_auto_cleanup}
        SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=runtime_direct_feed VALUE={direct_feed}
        SAVE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE

        # Absolute XYZ, relative E. Keep the macro independent from the caller's mode.
        G90
        M83

        #################################################################
        # Beacon sample sequence.
        # Filament load/purge is owned by LOAD_FILAMENT before this macro is called.
        # Beacon samples without nozzle contact, so no special pre-sample wipe
        # implementation exists here.
        #################################################################

        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Beacon sample path current_temp={current_temp|round(1)}"

        # Start at the bucket so any ooze during movement drops in the bucket.
        G1 Z{probe_safe_z} F{vars.z_speed}
        G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
        G1 Z{bucket_z} F{vars.z_speed}

        # Beacon sample near the pellet point. Y is clamped to keep the carriage/nozzle
        # in the safe zone while putting Beacon as close as practical to the configured pellet point.
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT Beacon sample near pellet point nozzle X={form_x} Y={form_y}; carriage X={beacon_sample_x|round(3)} Y={beacon_sample_y|round(3)}; Beacon actual X={actual_beacon_x|round(3)} Y={actual_beacon_y|round(3)}"
        G1 Z{probe_safe_z} F{vars.z_speed}
        G1 X{beacon_sample_x} Y{beacon_sample_y} F{vars.travel_speed}
        PROBE
        G1 Z{probe_safe_z} F{vars.z_speed}

        # Delay the run stage so PROBE has completed and printer.beacon.last_z_result is current.
        UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_RUN_DELAY DURATION=0.1
    {% endif %}


[delayed_gcode _POOP_PELLET_SHOOT_RUN_DELAY]
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}

    {% if vars.active|int == 1 %}
        _POOP_PELLET_SHOOT_RUN
    {% endif %}


[gcode_macro _POOP_PELLET_SHOOT_RUN]
description: Internal stage for POOP_PELLET_SHOOT after local Beacon sample has completed.
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set th = printer.toolhead %}
    {% set active_extruder = th.extruder %}
    {% set purge_temp = vars.runtime_purge_temp|float %}

    # Pull the bucket/stage position from LOAD_FILAMENT so the bucket location has one source of truth.
    {% set bucket_x = load.bucket_x|float %}
    {% set bucket_y = load.bucket_y|float %}
    {% set bucket_z = load.bucket_z|float %}

    # Use this macro's own absolute X/Y pellet geometry.
    {% set form_x = vars.form_x|float %}
    {% set form_y = vars.form_y|float %}
    {% set neck_x = vars.neck_x|float %}
    {% set neck_y = vars.neck_y|float %}
    {% set neck_z = vars.neck_z|float %}
    {% set shoot_start_x = vars.shoot_start_x|float %}
    {% set shoot_start_y = vars.shoot_start_y|float %}
    {% set shoot_end_x = vars.shoot_end_x|float %}
    {% set shoot_end_y = vars.shoot_end_y|float %}
    {% set shoot_z = vars.shoot_z|float %}

    # Beacon publishes the most recent PROBE result through printer.beacon.last_z_result.
    {% if printer.beacon is not defined %}
        {action_raise_error("_POOP_PELLET_SHOOT_RUN requires printer.beacon.")}
    {% endif %}

    {% if printer.beacon.last_z_result is not defined %}
        {action_raise_error("_POOP_PELLET_SHOOT_RUN could not read printer.beacon.last_z_result after PROBE.")}
    {% endif %}

    # Convert the local Beacon sample result into this run's actual purge Z.
    # variable_form_z is height above the sampled local deck, not global absolute Z.
    {% set probed_deck_z = printer.beacon.last_z_result|float %}
    {% set form_z = probed_deck_z + vars.form_z|float %}
    {% set pellet_top_z = form_z + vars.pellet_z_lift|float %}

    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT local deck_z={probed_deck_z|round(4)} form_z={form_z|round(4)} pellet_top_z={pellet_top_z|round(4)} purge_temp={purge_temp|round(1)} restore_previous_temp={vars.restore_previous_temp|int}"

    {% if form_z < th.axis_minimum.z or form_z > th.axis_maximum.z or
          pellet_top_z < th.axis_minimum.z or pellet_top_z > th.axis_maximum.z %}
        {action_raise_error("POOP_PELLET_SHOOT sampled local form_z or pellet_top_z is outside configured Z limits.")}
    {% endif %}

    # Use active extruder limits so purge flow cannot exceed Klipper's E-only velocity cap.
    {% set max_e_feed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %}

    # Convert requested volumetric flow into filament feedrate.
    {% set filament_area = 3.14159 * (vars.filament_diameter|float / 2.0) * (vars.filament_diameter|float / 2.0) %}
    {% set requested_purge_feed = (vars.poop_flow_mm3s|float / filament_area) * 60.0 %}
    {% set purge_feed = [requested_purge_feed, max_e_feed]|min %}
    {% set safe_retract_speed = [vars.retract_speed|float, max_e_feed]|min %}
    {% set body_length = vars.purge_length|float %}

    # Start reheating immediately after the Beacon sample stage.
    # Move down to the local start point while the nozzle is heating.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={purge_temp}

    G90
    M83
    G1 Z{vars.probe_safe_z|float} F{vars.z_speed}
    G1 X{form_x} Y{form_y} F{vars.travel_speed}
    G1 Z{form_z} F{vars.z_speed}

    # Return active buffer to AUTO after probing and before the actual purge extrusion.
    # AUTO hands control back to the native sensor logic.
    {% if vars.runtime_buffer_auto_before_purge|int == 1 %}
        BUFFER_ARM_ACTIVE_TOOL DIRECT_FEED={vars.runtime_direct_feed|int}
    {% endif %}

    # Wait at the pellet start point. This avoids waiting away from the pellet while a string forms.
    TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={purge_temp - vars.temp_tolerance|float}

    # Build the pellet body by extruding while slowly raising Z.
    # lll-buffed firmware remains in AUTO and handles physical buffer feed behavior.
    #
    # Do not use purge_feed directly as the combined Z+E move speed:
    # for a tiny Z move, that turns into a blob cannon.
    #
    # Instead, calculate the Z feedrate so each Z rise takes the same
    # amount of time as the desired E feed for that chunk.
    {% if body_length > 0 %}
        {% set chunks = (body_length / (vars.purge_chunk_mm|float))|round(0, "ceil")|int %}
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT rising purge body_length={body_length|round(2)} chunks={chunks} purge_feed={purge_feed|round(1)}"

        {% for i in range(chunks) %}
            {% set remaining = body_length - (i * (vars.purge_chunk_mm|float)) %}
            {% set this_e = [vars.purge_chunk_mm|float, remaining]|min %}

            # Calculate the previous and next absolute Z position for this chunk.
            {% set prev_z = form_z + (vars.pellet_z_lift|float * (i / chunks)) %}
            {% set this_z = form_z + (vars.pellet_z_lift|float * ((i + 1) / chunks)) %}
            {% set z_delta = this_z - prev_z %}

            {% if this_e > 0 and z_delta > 0 %}
                {% set lift_feed = (z_delta * purge_feed / this_e) %}
                G1 Z{this_z|round(3)} E{this_e|round(3)} F{lift_feed|round(1)}
            {% elif this_e > 0 %}
                # If pellet_z_lift is zero, fall back to true E-only purge chunks.
                G1 E{this_e|round(3)} F{purge_feed|round(0)}
            {% endif %}
        {% endfor %}
    {% endif %}

    # Hotend-only retract after pellet formation.
    {% if vars.retract_length|float > 0 %}
        {% set retract_len = vars.retract_length|float %}
        G1 E-{retract_len|round(3)} F{safe_retract_speed|round(0)}
    {% endif %}

    M400

    # Start cooling early so the next travel/wait/wipe steps happen while the nozzle is dropping.
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.shoot_temp}

    # Let the pellet settle, then pull away slightly to thin or break the strand.
    {% if vars.settle_ms|int > 0 %}
        G4 P{vars.settle_ms|int}
    {% endif %}
    G1 Z{neck_z} F{vars.z_speed}
    G1 X{neck_x} Y{neck_y} F{vars.neck_speed}

    # Park over the bucket while cooling so ooze drops into the bucket, not onto the bed.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT parking over bucket and cooling before wipe"
    M106 S{vars.wipe_fan_speed|int}
    G4 P{vars.wipe_fan_pause_ms|int}
    G1 Z{bucket_z} F{vars.z_speed}
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}

    # Wait until the nozzle has cooled to the shoot temp so wiping pulls semi-firm filament.
    TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={vars.shoot_temp}

    # Use the shared wipe macro so brush motion stays single-source.
    _WIPE_NOZZLE

    # Return to the LOAD_FILAMENT bucket after wiping so the shoot sequence starts from a known staging point.
    G90
    G1 Z{bucket_z} F{vars.z_speed}
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    M106 S0

    # Return to the dedicated absolute shoot path and kick the hardened pellet into the bucket.
    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT kicking pellet into bucket"
    {% for shot in range(vars.shoot_passes|int) %}
        G1 Z{neck_z} F{vars.z_speed}
        G1 X{shoot_start_x} Y{shoot_start_y} F{vars.travel_speed}
        G1 Z{shoot_z} F{vars.z_speed}
        M400
        G1 X{shoot_end_x} Y{shoot_end_y} F{vars.shoot_speed}
    {% endfor %}

    # Lift clear and clean up.
    G1 Z{bucket_z} F{vars.z_speed}
    _POOP_PELLET_SHOOT_CLEANUP

    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT complete using active extruder: {active_extruder}"


[gcode_macro _POOP_PELLET_SHOOT_CLEANUP]
description: Internal cleanup for POOP_PELLET_SHOOT.
gcode:
    {% set vars = printer["gcode_macro POOP_PELLET_SHOOT"] %}
    {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
    {% set active_extruder = printer.toolhead.extruder %}

    # Pull the bucket/stage position from LOAD_FILAMENT so final standby ends in the bucket.
    {% set bucket_x = load.bucket_x|float %}
    {% set bucket_y = load.bucket_y|float %}
    {% set bucket_z = load.bucket_z|float %}

    # Cancel the delayed run stage before resetting state.
    UPDATE_DELAYED_GCODE ID=_POOP_PELLET_SHOOT_RUN_DELAY DURATION=0

    M400

    # Return active buffer to AUTO only when requested.
    # AUTO hands control back to lll-buffed native sensor logic.
    {% if vars.runtime_buffer_auto_cleanup|int == 1 %}
        BUFFER_ARM_ACTIVE_TOOL DIRECT_FEED={vars.runtime_direct_feed|int}
    {% endif %}

    #################################################################
    # Final hot wipe after pellet cleanup.
    # This gives the nozzle one last hot brush pass, then the macro either
    # restores the old temp or sets the hotend to zero for standby.
    #################################################################

    RESPOND TYPE=command MSG="POOP_PELLET_SHOOT final cleanup wipe at {vars.final_wipe_temp|float}C"
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.final_wipe_temp|float}
    TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={vars.final_wipe_temp|float - vars.temp_tolerance|float}

    M106 S{vars.wipe_fan_speed|int}
    G4 P{vars.wipe_fan_pause_ms|int}

    # Use the shared wipe macro so brush motion stays single-source.
    _WIPE_NOZZLE

    M106 S0

    # End physically staged over the bucket before standby/restore target is applied.
    G90
    G1 X{bucket_x} Y{bucket_y} F{vars.travel_speed}
    G1 Z{bucket_z} F{vars.z_speed}
    M400

    # Restore the hotend target only when requested.
    # RESTORE_TEMP=0 is the LOAD_FILAMENT default path and leaves the hotend off at the end.
    {% if vars.restore_previous_temp|int == 1 %}
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={vars.saved_hotend_target}
    {% else %}
        RESPOND TYPE=command MSG="POOP_PELLET_SHOOT setting hotend target to 0 because RESTORE_TEMP=0"
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET=0
    {% endif %}

    # Restore motion/extrusion mode and clear active flag.
    RESTORE_GCODE_STATE NAME=POOP_PELLET_SHOOT_STATE MOVE=0
    SET_GCODE_VARIABLE MACRO=POOP_PELLET_SHOOT VARIABLE=active VALUE=0
    M117 Poop purge standby