
#####################################################################
#                  Speed / Stability Test Macros
#####################################################################

[gcode_macro TEST_HOME_REPEATABILITY]
description: Repeated XY homing + GET_POSITION baseline for homing repeatability
variable_cycles: 3
variable_travel_speed: 1800
variable_dwell_ms: 500
gcode:
    {% set cfg = printer["gcode_macro TEST_HOME_REPEATABILITY"] %}
    {% set cycles = params.CYCLES|default(cfg.cycles)|int %}
    {% set travel_speed = params.SPEED|default(cfg.travel_speed)|float %}
    {% set dwell_ms = params.DWELL_MS|default(cfg.dwell_ms)|int %}

    {% if cycles < 1 %}
        {action_raise_error("TEST_HOME_REPEATABILITY requires CYCLES >= 1")}
    {% endif %}

    SAVE_GCODE_STATE NAME=TEST_HOME_REPEATABILITY_STATE

    RESPOND TYPE=command MSG="TEST_HOME_REPEATABILITY: starting {cycles} XY home repeatability cycle(s)"
    RESPOND TYPE=command MSG="TEST_HOME_REPEATABILITY: compare MCU stepper counts after each GET_POSITION"

    G90

    {% for i in range(cycles) %}
        RESPOND TYPE=command MSG="--- TEST_HOME_REPEATABILITY cycle {i + 1} / {cycles}: G28 X Y ---"

        # Run the real XY homing routine every cycle.
        # This intentionally uses G28 X Y, not _CG28, because the point is to test homing repeatability.
        G28

        # Move to the same known corner used for comparing post-home position.
        # This makes the reported MCU stepper positions easier to compare cycle-to-cycle.
        G90
        G0 X50 Y50 F{travel_speed}

        # Let motion and sensorless/current-settle behavior finish before logging position.
        M400
        G4 P{dwell_ms}

        RESPOND TYPE=command MSG="TEST_HOME_REPEATABILITY cycle {i + 1}: GET_POSITION at X{x_check} Y{y_check}"
        GET_POSITION
    {% endfor %}

    RESPOND TYPE=command MSG="TEST_HOME_REPEATABILITY: complete"

    RESTORE_GCODE_STATE NAME=TEST_HOME_REPEATABILITY_STATE

[gcode_macro TEST_Z_STABILITY]
description: QGL -> Z cycle -> QGL drift check
variable_cycles: 20
variable_z_low: 50
variable_z_high: 250
variable_speed: 1800
gcode:
    {% set cycles = params.CYCLES|default(printer["gcode_macro TEST_Z_STABILITY"].cycles)|int %}
    {% set z_low = params.Z_LOW|default(printer["gcode_macro TEST_Z_STABILITY"].z_low)|float %}
    {% set z_high = params.Z_HIGH|default(printer["gcode_macro TEST_Z_STABILITY"].z_high)|float %}
    {% set speed = params.SPEED|default(printer["gcode_macro TEST_Z_STABILITY"].speed)|int %}

    M117 Z Stability Test: Baseline QGL
    RESPOND MSG="--- Z TEST: BASELINE QGL ---"

    G28
    QUAD_GANTRY_LEVEL

    G90
    G0 Z{z_high} F{speed}

    M117 Z Cycling...
    RESPOND MSG="--- Z TEST: CYCLING {cycles} TIMES ({z_low}->{z_high}) @ {speed} ---"

    {% for i in range(cycles) %}
        G0 Z{z_low} F{speed}
        G0 Z{z_high} F{speed}
    {% endfor %}

    M400

    M117 Z Stability Test: Post QGL
    RESPOND MSG="--- Z TEST: POST QGL ---"

    QUAD_GANTRY_LEVEL
    M117 Z Stability Test Done
    
[gcode_macro TEST_SPEED]
description: Test max speed/accel by moving toolhead through repeated patterns
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(50)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% if x_min < 0 %}
        {% set x_min = 0 %}
    {% endif %}

    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% if y_min < 0 %}
        {% set y_min = 0 %}
    {% endif %}

    {% set x_min = x_min + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = y_min + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}

    {% set x_center_min = x_center - (smallpatternsize / 2) %}
    {% set x_center_max = x_center + (smallpatternsize / 2) %}
    {% set y_center_min = y_center - (smallpatternsize / 2) %}
    {% set y_center_max = y_center + (smallpatternsize / 2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED

    {action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel))}

    M400
    G28

    {% if printer.configfile.settings.quad_gantry_level %}
        {% if printer.quad_gantry_level.applied == False %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}
    {% endif %}

    G90
    G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F{30 * 60}
    M400

    G28 X Y

    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F{30 * 60}
    G4 P1000
    GET_POSITION

    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}

        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    {% endfor %}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    M400
    G28

    G90
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F{30 * 60}
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED
    

[gcode_macro TEST_X_AXIS_SWEEP]
description: Sweep X axis from 50 to 300 at progressive speeds for noise testing
variable_x_min: 50.0
variable_x_max: 300.0
variable_repeats: 3
variable_home_default: 1
variable_pause_ms: 250
gcode:
    # Pull macro variables through the Klipper macro object.
    # Klipper does not expose variable_x_min directly as a local Jinja variable.
    {% set cfg = printer["gcode_macro TEST_X_AXIS_SWEEP"] %}

    # HOME=1 homes XY before the test. Use HOME=0 if already homed and positioned safely.
    {% set home = params.HOME|default(cfg.home_default)|int %}

    # Test boundaries. Override from console if needed:
    # TEST_X_AXIS_SWEEP X_MIN=75 X_MAX=275
    {% set x_min = params.X_MIN|default(cfg.x_min)|float %}
    {% set x_max = params.X_MAX|default(cfg.x_max)|float %}

    # Number of back-and-forth cycles per speed.
    {% set repeats = params.REPEATS|default(cfg.repeats)|int %}

    # Small pause between speed groups so sound changes are easier to hear.
    {% set pause_ms = params.PAUSE_MS|default(cfg.pause_ms)|int %}

    # Speeds are in mm/s. Klipper G1 feedrates use mm/min, so each speed is multiplied by 60.
    {% set speeds = [50, 100, 150, 200, 250, 300, 350, 400, 450] %}

    # Validate the commanded X sweep against configured machine travel before moving.
    {% if x_min < printer.toolhead.axis_minimum.x or x_max > printer.toolhead.axis_maximum.x %}
        RESPOND TYPE=error MSG="TEST_X_AXIS_SWEEP: X range is outside configured travel limits"
    {% elif x_min >= x_max %}
        RESPOND TYPE=error MSG="TEST_X_AXIS_SWEEP: X_MIN must be less than X_MAX"
    {% else %}
        SAVE_GCODE_STATE NAME=TEST_X_AXIS_SWEEP_STATE

        # Keep motion predictable regardless of previous macro/slicer state.
        G90

        # Optional XY home. XY is safer than X-only on CoreXY machines.
        {% if home == 1 %}
            RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: Homing XY before X sweep"
            _CG28
        {% else %}
            RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: HOME=0, skipping home"
        {% endif %}

        # Move to the starting edge at a moderate speed before the test begins.
        RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: Moving to X={x_min}"
        G1 X{x_min} F6000

        {% for speed in speeds %}
            RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: Testing X speed {speed} mm/s, {repeats} cycles"

            {% for i in range(repeats) %}
                RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: {speed} mm/s cycle {i + 1} of {repeats} -> X{x_max}"
                G1 X{x_max} F{speed * 60}

                RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: {speed} mm/s cycle {i + 1} of {repeats} -> X{x_min}"
                G1 X{x_min} F{speed * 60}
            {% endfor %}

            # Brief pause makes it easier to distinguish one speed group from the next by ear.
            G4 P{pause_ms}
        {% endfor %}

        RESPOND TYPE=command MSG="TEST_X_AXIS_SWEEP: Complete"

        RESTORE_GCODE_STATE NAME=TEST_X_AXIS_SWEEP_STATE
    {% endif %}

#####################################################################
#                  Toolchanger Swap Cycle Test
#####################################################################

[gcode_macro TEST_TOOL_SWAP_CYCLE]
description: Cycle toolchanger through all configured tools repeatedly for dock/pickup testing

variable_cycles: 10             # Number of full forward/back cycles to run.
variable_dwell_ms: 500          # Pause after each tool selection so failures are easier to see.
variable_tool_list: "0,1"       # Fallback only. Used if printer.toolchanger.tool_numbers is unavailable.

gcode:
    {% set v = printer["gcode_macro TEST_TOOL_SWAP_CYCLE"] %}
    {% set cycles = params.CYCLES|default(v.cycles)|int %}
    {% set dwell_ms = params.DWELL_MS|default(v.dwell_ms)|int %}

    # Prefer the configured toolchanger tool list so future tools are included automatically.
    {% if printer.toolchanger is defined %}
        {% set tools = printer.toolchanger.tool_numbers %}
    {% else %}
        {% set tools = v.tool_list.split(",") %}
    {% endif %}

    {% if cycles < 1 %}
        {action_raise_error("TEST_TOOL_SWAP_CYCLE requires CYCLES >= 1")}
    {% endif %}

    {% if tools|length < 2 %}
        {action_raise_error("TEST_TOOL_SWAP_CYCLE requires at least two tools")}
    {% endif %}

    # Make sure the printer and toolchanger are in a known usable state.
    INITIALIZE_TOOLCHANGER
    _CG28

    M118 TEST_TOOL_SWAP_CYCLE: starting {cycles} cycle(s), tools={tools}, dwell_ms={dwell_ms}

    {% for c in range(cycles) %}
        M118 TEST_TOOL_SWAP_CYCLE: cycle {c + 1} / {cycles} forward pass

        # Forward pass: T0 -> T1 -> T2 -> ...
        {% for i in range(tools|length) %}
            {% set t = tools[i]|int %}
            M118 TEST_TOOL_SWAP_CYCLE: selecting T{t}
            T{t}
            M400
            G4 P{dwell_ms}
        {% endfor %}

        M118 TEST_TOOL_SWAP_CYCLE: cycle {c + 1} / {cycles} reverse pass

        # Reverse pass excluding the last tool because it was just selected.
        # Example with tools 0,1,2: forward 0,1,2 then reverse 1,0.
        {% for i in range((tools|length) - 2, -1, -1) %}
            {% set t = tools[i]|int %}
            M118 TEST_TOOL_SWAP_CYCLE: selecting T{t}
            T{t}
            M400
            G4 P{dwell_ms}
        {% endfor %}
    {% endfor %}

    M118 TEST_TOOL_SWAP_CYCLE: complete

[gcode_macro DOCK_TUNER]
description: "Cyclic dock tuner: step pickup/dropoff safely; auto-detect at pickup verify"
variable_path_interpolation: 2 # '< 1' to disable, 2... upsampling to N steps
variable_state: {'ui_is_open': False, 'idx': -1, 'speed_multiplier': 1.0}
variable_ignore_gcode_offsets: True # to move in absolute space regardless of what offsets are loaded at the time
gcode:
    # ╭──────────────────────────────── shorts ────────────────────────────────╮
    {% set NAME         = 'DOCK_TUNER' %}
    {% set tc           = printer.toolchanger %}
    {% set tpe          = printer.tool_probe_endstop if 'tool_probe_endstop' in printer else {} %}
    {% set use_docking_mode = ignore_gcode_offsets and ('ENTER_DOCKING_MODE' in printer.gcode.commands) 
                                                   and ('EXIT_DOCKING_MODE'  in printer.gcode.commands) %}
    {% set provided_tn  = params.T|d('only provide when no tool selected/active')|int(None) %}
    # HACK HACK HACK (comment this out if it ever causes problems) \/ \/ \/ \/ \/ 
    {% if not state.ui_is_open and tpe %}
        {% set _tpe = printer.printer.lookup_object('tool_probe_endstop', None) %}
        {% if _tpe %}
            {% set active_tools = _tpe._query_open_tools()|list %}
            {% if active_tools|length == 1 %}
                {% set _ = _tpe.set_active_probe(active_tools[0]) %}
                {% set _ = tpe.update({'active_tool_number': active_tools[0].tool}) %}
            {% else %}
                {% set _ = _tpe.set_active_probe(None) %}
                {% set _ = tpe.update({'active_tool_number': -1}) %}
            {% endif %}
        {% endif %}
    {% endif %}
    # /\ /\ /\ /\ /\ /\ /\ /\ 
    {% set tn_detected  = (tc.detected_tool_number) if tc.has_detection else tpe.get('active_tool_number', -1) %}
    {% set tn           = tc.tool_number %}
    # ╰────────────────────────────────────────────────────────────────────────╯
    
    # ╭──────────────────────────────── Ensure you dont crash ────────────────────────────────╮
    {% if tn in [None, -1] and provided_tn is none %}
        { action_respond_info('<i>If you think this is a mistake, run <c>DOCK_TUNER RESET=1</c>') }
        { action_raise_error('DOCK_TUNER: no tool selected please provide <c>T</c>') }
    {% elif tn_detected != -1 and provided_tn is not none and not state.get('ui_is_open', False) %}
        { action_respond_info('<i>If you think this is a mistake, run <c>DETECT_ACTIVE_TOOL_PROBE</c>') if tpe else '' }
        { action_raise_error('DOCK_TUNER: please only provide <c>T</c> after dropping the tool off.') }
    {% elif not state.ui_is_open and (tn_detected != tn) %}
        # first time open, detected and active are desynced.
        { action_raise_error('detected tool (' ~ tn_detected ~ ') ≠ toolchangers tool number (' ~ tn ~ ')<br>Please reinitialize toolchanger (<code>INITIALIZE_TOOLCHANGER</code>)') }
    {% elif tn == -1 %}
        {% set tn = provided_tn %} # if for some reason it initializes with none mid run, dont fail with tn = -1
    {% endif %}
    # ╰───────────────────────────────────────────────────────────────────────────────────────╯

    {% if use_docking_mode and not state._docking_mode %}
        ENTER_DOCKING_MODE
        {% set _ = state.update({'_docking_mode': True}) %}
    {% endif %}

    {% set tool         = printer[tc.tool_names[tc.tool_numbers.index(tn)]] %}
    {% set tname_short  = tool.name|replace('tool ', '') %}
    {% set dock         = {'x': tool.params_park_x|float, 'y': tool.params_park_y|float, 'z': tool.params_park_z|float} %}
    {% set pick         = tool.params_pickup_path %}
    {% set drop         = tool.params_dropoff_path %}
    {% set ps           = (tool.params_path_speed or 1000)|float %}
    {% set safe_y       = (tool.params_safe_y or 120)|float %}
    {% set y_safe_off   = safe_y - dock.y %}

    {% macro ui(m) %}{ action_respond_info('action:prompt_' ~ m) }{% endmacro %}
    
    {% macro but(m, sec=None) %}
        { ui('button_group_start') if sec in ['first', 'both'] else '' }
        { ui('button ' ~ m) }
        { ui('button_group_end')   if sec in ['last', 'both']  else '' }
    {% endmacro %}

    # what actually gets called to update the dock pos. i save it to save variables.
    {% macro update_dock_pos(ax, val) %}
        {% if variable_helper is defined %}
            {% import variable_helper as svh with context %}
            { svh.svf_update('dock_' ~ tname_short|lower ~ '.' ~ ax, val) }
        {% endif %}
        SET_TOOL_PARAMETER T={tool.tool_number} PARAMETER={ 'params_park_' ~ ax } VALUE={val}
    {% endmacro %}

    # ╭──────────────────────────────── Path movement macros ────────────────────────────────╮
    {%- macro is_dup_node(a, b) -%}
        {%- for k in ['x','y','z','verify'] if a.get(k, None)|float(None) != b.get(k, None)|float(None) -%}
        {%- else -%} # didnt run at all, its duplicate.
            True
        {%- endfor -%}
    {%- endmacro -%}

    {%- macro move_step(s) -%}
        {%- set parmesan, keys = [], ['x', 'y', 'z'] -%}
        {%- set home = printer.gcode_move.homing_origin if ignore_gcode_offsets else dict.fromkeys(keys, 0.0) -%}
        {%- for ax in keys %}
            {%- set position = (dock[ax] + s[ax] - home[ax])|round(2) -%}
            {%- set _ = parmesan.append(ax|upper ~ position) -%}
        {%- endfor -%}
        {%- set _ = parmesan.append('F' ~ (ps * s.f * state.get('speed_multiplier', 1.0))|round(2) ) -%}
        {'\nG90'}
        {'\nG0 ' ~ parmesan|join(' ')}
        { ('\n' ~ detect_cmd) if 'verify' in s and detect_cmd else '' }
    {%- endmacro -%}

    {% macro walk(dir, stop_kind, stop_arg = 0) %}
        {% set ns = namespace(i=state.idx, last=0, moved=0, done=0) %}
        {% if ns.i < 0 %}
            {% set ns.i = (N - 1 if dir > 0 else 0) %}
        {% endif %}
        {% set ns.last = ns.i %}
        {% for _ in range(N) if not ns.done %}
            {% set j = (ns.i + dir) % N %} # wraparound
            {% set A = c[j] %}
            {% if not is_dup_node(A, c[ns.last]) %}
                { move_step(A) }
                {% set ns.last = j %}
                {% set _ = state.update({'idx': j}) %}
                {% set ns.moved = ns.moved + 1 %}
            {% endif %}
            {% set ns.i = j %}
            {% if stop_kind == 'index' and j == stop_arg %}{% set ns.done = 1 %}{% endif %}
            {% if stop_kind == 'safe'  and A.get('y', none) == y_safe_off %}{% set ns.done = 1 %}{% endif %}
            {% if stop_kind == 'count' and ns.moved >= stop_arg %}{% set ns.done = 1 %}{% endif %}
        {% endfor %}
    {% endmacro %}
    # ╰──────────────────────────────────────────────────────────────────────────────────────╯
    
    # ╭──────────────────────────────── Path preperation ────────────────────────────────╮
    {%- macro normalize_path(path) -%}
        # {'x': 1.0, 'y': 2.0}, {'x': 1.0, 'z': 3.0}  
        # gets padded to:
        # {'x': 1.0, 'y': 2.0, 'z':0.0, 'f':1.0}, {'x': 1.0, 'y': 2.0, 'z':3.0, 'f':1.0}
        {% set last_pos_buffer = {'x': 0.0, 'y': 0.0, 'z': 0.0, 'f': 1.0} %}
        {% for step in path %}
            {% for axis in last_pos_buffer.keys() %}
                {% set _ = step.setdefault(axis, last_pos_buffer.get(axis)|float) %}
                {% set _ = last_pos_buffer.update({ axis: step.get(axis)|float }) %}
            {% endfor %}
        {% endfor %}
    {%- endmacro -%}

    {%- macro upsample_path(path, factor=path_interpolation) -%}
        # interpolate the steps
        {% set factor, N = factor|int,path|length  %}
        {% for idx in range(N - 1, 0, -1) if factor > 1 %}
            {% set a, b = path[idx - 1], path[idx] %}
            {% set ax, ay, az, af = a.get('x')|float, a.get('y')|float, a.get('z')|float, a.get('f', 1.0)|float %}
            {% set bx, by, bz, bf = b.get('x')|float, b.get('y')|float, b.get('z')|float, b.get('f', 1.0)|float %}
            {% for k in range(factor - 1) %}
                {% set t = (factor - 1 - k) / factor %}
                {% set node = {
                    'x': (ax + (bx - ax) * t)|round(4),
                    'y': (ay + (by - ay) * t)|round(4),
                    'z': (az + (bz - az) * t)|round(4),
                    'f': (af + (bf - af) * t)|round(4)
                } %}
                {% set _ = path.insert(idx, node) %}
            {% endfor %}
        {% endfor %}
    {%- endmacro -%}
    # ╰──────────────────────────────────────────────────────────────────────────────────╯

    # ╭───────────────────────────────────────── UI ─────────────────────────────────────────╮
    {% macro create_ui() %}
        {% set C_SLOW, C_FAST, C_RESET = (120,200,160),
                                         (225,120,145), 
                                         (155,150,205) 
                                         %}
        {% set axis_colors = {'X': (200, 110, 120), 
                              'Y': (120, 185, 150), 
                              'Z': (120, 150, 210),
                            } %}
        {% set step_alphas = { -0.5: 0.6, 
                               -0.1: 0.5, 
                                0.1: 0.5, 
                                0.5: 0.6,
                            } %}
        { ui('begin Dock Tuner (' ~ tname_short ~ ')') }

        { ui('text Step through the path') }
        { but('[ ↶ --- ]|' ~ NAME ~ ' STEP=-1 T=' ~ tn ~ '|rgba(80,145,160,0.80)',  'first') }
        { but('[ --- ↷ ]|' ~ NAME ~ ' STEP=1 T='  ~ tn ~ '|rgba(215,150,100,0.82)', 'last')  }
        { ui('text Run through the path') }
        { but('[ ⭮ run pick ]|'     ~ NAME ~ ' RUN=PICK T=' ~ tn ~ '|rgba(72,150,160,0.84)',  'first') }
        { but('[ run drop ⭯ ]|'     ~ NAME ~ ' RUN=DROP T=' ~ tn ~ '|rgba(220,155,110,0.86)', 'last') }
        { but('[❔check detect ]|'  ~ NAME ~ ' CHECK=1 T='  ~ tn ~ '|rgba(' ~ C_RESET|join(',') ~ ',' ~ 0.7 ~ ')',  'first') }
        { ui('show') }

        # --------------------------------- adjusting the docking speed ---------------------------------
        { ui('text tune docking speed') }
        
        {% set alpha = 0.1 if (1.0 - state.get('speed_multiplier', 1.0))|abs <= 0.01 else 0.7 %}
        { but('×' ~ ('%.2f' % 1.0) ~ '|' ~ NAME ~ ' SPD=' ~ 1 ~ ' T=' ~ tn ~ '|' ~ 'rgba(' ~ C_RESET|join(',') ~ ',' ~ alpha ~ ')', 'last') }
        { ui('button_group_start') }
        {% for mult in [ 0.25, 0.50, 1.50, 2.00 ] %}
            {% set is_active = (mult - state.get('speed_multiplier', 1.0))|abs <= 0.01 %}
            {% set rgb = C_SLOW if mult < 1 else (C_FAST if mult > 1 else C_RESET) %}
            {% set col = 'rgba(' ~ rgb|join(',') ~ ',' ~ (0.1 if is_active else 0.7) ~ ')' %}
            { but('×' ~ ('%.2f' % mult) ~ '|' ~ NAME ~ ' SPD=' ~ mult ~ ' T=' ~ tn ~ '|' ~ col) }
        {% endfor %}
        { ui('button_group_end') }
        { ui('footer_button [ ✖ ]|' ~ NAME ~ ' CLOSE=1 T=' ~ tn ~ '|red') }
        { ui('show') }

        # --------------------------------- adjusting the dock location ---------------------------------
        { ui('text tune dock position') }
        {% for ax, col in axis_colors.items() %}
            { ui('button_group_start') }
            {% for inc, alpha in step_alphas.items() %}
                {% set sgn = '+' if inc > 0 else '' %}
                {% set color = 'rgba(' ~ col|join(',') ~ ',' ~ alpha ~ ')' %}
                { but(ax ~ sgn ~ inc ~ '|' ~ NAME ~ ' AX=' ~ ax ~ ' AM=' ~ inc ~ ' T=' ~ tn ~ '|' ~ color) }
            {% endfor %}
            { ui('button_group_end') }
        {% endfor %}
        { but('[ ♻ ] Reset docking position|' ~ NAME ~ ' RESET_DOCK=1 T=' ~ tn ~ '|rgba(' ~ C_RESET|join(',') ~ ',' ~ 0.7 ~ ')', 'both') }
        { ui('show') }
        {'POPUP_DIALOG_CTRL TARGET="Dock Tuner" EXACT=0' if 'gcode_macro POPUP_DIALOG_CTRL' in printer else ''}
    {% endmacro %}
    # ╰──────────────────────────────────────────────────────────────────────────────────────╯

    # ╭───────────────────────────────── build the actual path to run ─────────────────────────────────╮
    {% set _, _ = normalize_path(pick), normalize_path(drop) %}
    {% set _, _ = upsample_path(pick),  upsample_path(drop) %}

    {% set fast_speed  = (pick|map(attribute='f')|list + drop|map(attribute='f')|list)|max * 2.0 %}
    # {% set fast_speed  = (pick + drop)|max(attribute='f') * 2.0 %}
    {% set verify_step = pick|selectattr('verify')|list|first %}

    {% set safe_node  = {'y': y_safe_off, 'z': 0, 'f': fast_speed } %} # start at dock, at safe_y

    {% set drop_approach_z = drop|map(attribute='z')|list|max %}  # either up or down

    {% set pick_approach_z = pick|map(attribute='z')|list|min %}  # if pick or drop
    {% set pick_leave_z    = pick|map(attribute='z')|list|max %}  # if pick or drop

    {% set y_half_pick = (y_safe_off + pick[0].get('y', 0)|float) / 2.0 %}
    {% set y_half_drop = (y_safe_off + drop[0].get('y', 0)|float) / 2.0 %}

    {% set c = [] %}

    {% set _ = c.append(safe_node) %}
    {% set _ = c.append({'y': y_half_pick, 'z': pick_approach_z, 'f': fast_speed}) %}
    {% set _ = c.append({'x': pick[0].get('x', 0)|float, 'z': pick[0].get('z', 0)|float, 'y': y_half_pick, 'f': fast_speed}) %}
    {% set _ = c.append({'x': pick[0].get('x', 0)|float, 'z': pick[0].get('z', 0)|float, 'y': pick[0].get('y', 0)|float, 'f': fast_speed}) %}

    {% set pick_start = c|length %}
    {% set _ = c.extend(pick) %}
    {% set pick_end   = c|length - 1 %}

    {% set pu_verify = pick_start + pick.index(verify_step) if verify_step else -1 %}

    {% set _ = c.append({'y': y_half_pick, 'z': pick_leave_z, 'f': fast_speed}) %}
    {% set _ = c.append(safe_node) %} # <- you start here
    {% set _ = c.append({'y': y_half_drop, 'z': drop_approach_z, 'f': fast_speed}) %}
    {% set _ = c.append({'x': drop[0].get('x', 0)|float, 'z': drop[0].get('z', 0)|float, 'y': y_half_drop, 'f': fast_speed}) %}
    {% set _ = c.append({'x': drop[0].get('x', 0)|float, 'z': drop[0].get('z', 0)|float, 'y': drop[0].get('y', 0)|float, 'f': fast_speed}) %}

    {% set drop_start = c|length %}
    {% set _ = c.extend(drop) %}
    {% set drop_end   = c|length - 1 %}

    {% set _ = normalize_path(c) %}

    {% set N    = c|length %}
    {% set cur  = N - 1 if state.idx < 0 else state.idx %}
    # ╰────────────────────────────────────────────────────────────────────────────────────────────────╯

    # ╭───────────────────────────────── Actual logic in here ─────────────────────────────────╮
    {% if 'STEP' in params %}
        {% set amnt = params.STEP|int %}
        {% set dir = -1 if amnt < 0 else 1 %}
        { walk(dir, 'count', amnt|abs) }

    {% elif 'RUN' in params %}
        {% if params.RUN == 'PICK' %}
            { walk(1, 'index', pick_end) }
            { walk(1, 'safe') }
            RESPOND TYPE=echo MSG="DOCK_TUNER: pickup → end complete (moved to safe_y)"

        {% elif params.RUN == 'DROP' %}
            {% set in_pickup = (cur >= pick_start and cur <= pick_end) %}
            {% set allow_forward = True %}
            {% if in_pickup and pu_verify != -1 %}
                {% set allow_forward = False if cur < pu_verify else allow_forward %}
                {% set allow_forward = False if cur >= pu_verify and (tn_detected != tn and tn_detected != -1) else allow_forward %}
            {% endif %}
            {% if allow_forward %}
                { walk(1, 'index', drop_end) }
                { walk(1, 'safe') }
                RESPOND TYPE=echo MSG="DOCK_TUNER: dropoff→end complete (moved to safe_y)"
            {% else %}
                { walk(-1, 'safe') }
                RESPOND TYPE=echo MSG="DOCK_TUNER: reversed to safe_y"
            {% endif %}
        {% endif %}

    {% elif 'CHECK' in params %}
        {'DETECT_ACTIVE_TOOL_PROBE' if tpe else ''}
        RESPOND TYPE=echo MSG="detected tool: {tc.tool_names[tn_detected] if tn_detected not in [-1, None] else None}"

    {% elif 'AX' in params and 'AM' in params %}

        {% set ax = params.AX|lower %}
        {% set am = params.AM|float %}
        {% set newv = (dock[ax]|float + am)|round(3) %}
        { update_dock_pos(ax, newv) }
        G91
        G0 { ' ' ~ ax|upper ~ am }
        G90

    {% elif 'RESET_DOCK' in params %}
        {% for ax, val in state.orig_dock.items() %}
            { update_dock_pos(ax, val) }
        {% endfor %}

    {% elif 'CLOSE' in params %}
        { ui('end') }
        {% set _ = state.update({'ui_is_open': False}) %}
        {% set out = [] %}
        {% for ax in ( 'x', 'y', 'z' ) %}
            {% set _ = out.append('params_park_' ~ ax ~ ': ' ~ ('%.2f' % dock[ax])) %}
            SAVE_TOOL_PARAMETER T={tn} PARAMETER={'params_park_' ~ ax}
        {% endfor %}
        {%- set block -%}
            <div style='margin:6px 0 3px 0;'><b>{NAME}</b><br>New docking position is:</div>

            <div class='accent--text text--lighten-1'
                 style='display:block; width:fit-content; max-width:100%;
                        background:rgba(0,0,0,0.35); border:2px solid currentColor;
                        border-radius:4px; padding:0.5em; box-sizing:border-box;'>
                <pre class='text--primary'
                     style='margin:0; display:inline-block; max-width:100%;
                            white-space:pre; overflow:auto; line-height:1.25em;
                            padding:0 1em; box-sizing:border-box;'>{ out|join('<br>') }</pre>
            </div>

            <blockquote class='accent--text text--lighten-1'
                        style='display:inline-block; width:fit-content; max-width:100%;
                               margin-top:0.6em; white-space:normal;
                               overflow-wrap:anywhere; word-break:break-word;
                               padding:0.5em 0.75em; border-left:3px solid currentColor;
                               background:rgba(255,255,255,0.06); line-height:1.25em;'>
                <span class='text--primary'>
                    Either manually save these values,<br>
                    or comment out the parking position in your config and call <b><code>SAVE_CONFIG</code></b>
                </span>
            </blockquote>
        {%- endset -%}
        { action_respond_info(block|replace('\n','')) }
        {% if state.get('_docking_mode', False) and use_docking_mode %}
            EXIT_DOCKING_MODE
            {% set _ = state.update({'_docking_mode': False}) %}
        {% endif %}

    {% elif 'RESET' in params %}
        {% if state.get('_docking_mode', False) and use_docking_mode %}
            EXIT_DOCKING_MODE
        {% endif %}
        {% set state = {'ui_is_open': False, 'idx': -1, '_docking_mode': False} %}

    {% elif 'SPD' in params %}
        {% set _ = state.update({'speed_multiplier': params.SPD|float|round(2)}) %}
        { create_ui() }
    {% else %}
        { create_ui() }
        # if provided_tn gets to here, we have no tool equipped and start at IDX 0
        {% set start_idx = pick_end + 2 if provided_tn is none else 0 %}
        { move_step(c[start_idx]) }
        {% set _ = state.update({'ui_is_open': True,
                                 'orig_dock': dock,
                                 'idx': start_idx
                                }) %}
    {% endif %}
    # ╰────────────────────────────────────────────────────────────────────────────────────────╯
    # always maintain state
    SET_GCODE_VARIABLE MACRO={NAME} VARIABLE=state VALUE="{state}"
    M400

[gcode_macro RESPOND]
rename_existing: _RESPOND_DOCK_TUNER_INFERRED
gcode:
    _RESPOND_DOCK_TUNER_INFERRED {rawparams}
    # just make sure its not part of a UI element, and actually a close
    {% if 'action:prompt_end' in rawparams and not 'RESPOND' in rawparams %}
        {% set state = printer['gcode_macro DOCK_TUNER'].state %}
        {% if state.get('ui_is_open', False) %}
            {% set _ = state.update({'ui_is_open': False}) %}
            {% if state._docking_mode and ('EXIT_DOCKING_MODE' in printer.gcode.commands) %}
                EXIT_DOCKING_MODE
                {% set _ = state.pop('_docking_mode', None) %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=DOCK_TUNER VARIABLE=state VALUE="{state}"
        {% endif %}
    {% endif %}