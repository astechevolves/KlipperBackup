#####################################################################
#                  Load Filament
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Load filament through active hotend with lll-buffed buffer assist and AUTO handoff

variable_default_material: "PETG"

variable_pla_load_temp: 220
variable_petg_load_temp: 240
variable_tpu_load_temp: 225
variable_abs_load_temp: 250
variable_asa_load_temp: 250
variable_default_load_temp: 240

variable_load_distance: 20
variable_purge_distance: 50
variable_retract_after_purge: 0.6

variable_load_speed: 30
variable_purge_speed: 10
variable_retract_speed: 30

variable_temp_wait_margin: 2
variable_restore_previous_temp: 0 # Restore nozzle temp to whatever it already was after macro complete?

# Bucket/staging location used before purge and after wipe.
variable_bucket_x: 310.0
variable_bucket_y: 1.0
variable_bucket_z: 5.0
variable_bucket_spd_xy: 9000
variable_bucket_spd_z: 1500

# End-of-load tip cleanup.
variable_tip_wipe_after_load: 1         # 1 = fan burst + _WIPE_NOZZLE after basic purge.
variable_fan_burst_speed: 255           # M106 fan value used before the wipe.
variable_fan_burst_pause_ms: 500        # Pause after fan burst before wiping.
variable_fan_after_wipe: 0              # Fan value after wipe completes.

# Optional poop pellet purge after the basic load cleanup.
variable_run_poop_purge: 1              # 1 = call POOP_PELLET_SHOOT after basic load cleanup.
variable_poop_purge_temp_offset: 20.0   # POOP_PELLET_SHOOT TEMP = load_temp + this offset.
variable_poop_restore_temp: 0           # Pass-through RESTORE_TEMP for POOP_PELLET_SHOOT.

# Buffer behavior during load.
variable_buffer_auto_before_load: 1             # 1 = return active buffer to AUTO before load setup.
variable_buffer_assist_during_load: 1           # 1 = bump buffer after the hotend extruder starts turning.
variable_buffer_assist_lead_distance: 2.0       # Hotend extrudes this much before the buffer bump starts.
variable_buffer_assist_distance: 16             # Positive distance bumps filament toward the hotend during load.
variable_buffer_assist_speed: 50.0              # Buffer bump speed for the firmware MOVE_DIST assist.
variable_buffer_assist_overlap_distance: 10.0   # Hotend pull distance after buffer bump before returning buffer to AUTO.
variable_buffer_assist_auto_after: 1            # 1 = return active buffer to AUTO after the bump, before purge.

gcode:
    {% set v = printer["gcode_macro LOAD_FILAMENT"] %}

    #################################################################
    # Prompt only when no material or temp was passed.
    #################################################################

    {% set prompt_speed = params.SPEED|default(params.PURGE_SPEED|default(v.purge_speed))|float %}
    {% set material_prompt_needed = params.MATERIAL is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to load."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_LOAD_MATERIAL MATERIAL=PLA SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_LOAD_MATERIAL MATERIAL=PETG SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_LOAD_MATERIAL MATERIAL=TPU SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_LOAD_MATERIAL MATERIAL=ABS SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ASA|_KS_LOAD_MATERIAL MATERIAL=ASA SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

        {% set material = params.MATERIAL|default(v.default_material)|upper|string %}

        {% if params.TEMP is defined %}
            {% set load_temp = params.TEMP|float %}
        {% elif material in ["PLA", "PLA+"] %}
            {% set load_temp = v.pla_load_temp|float %}
        {% elif material in ["PETG", "PET"] %}
            {% set load_temp = v.petg_load_temp|float %}
        {% elif material in ["TPU", "TPE"] %}
            {% set load_temp = v.tpu_load_temp|float %}
        {% elif material == "ABS" %}
            {% set load_temp = v.abs_load_temp|float %}
        {% elif material == "ASA" %}
            {% set load_temp = v.asa_load_temp|float %}
        {% else %}
            {% set load_temp = v.default_load_temp|float %}
        {% endif %}

        {% set load_distance = params.LOAD_DISTANCE|default(v.load_distance)|float %}
        {% set purge_distance = params.PURGE_DISTANCE|default(v.purge_distance)|float %}
        {% set retract_after_purge = params.RETRACT_AFTER_PURGE|default(v.retract_after_purge)|float %}

        {% set load_speed = [params.LOAD_SPEED|default(v.load_speed)|float, max_extrude_speed]|min %}
        {% set purge_speed = [params.PURGE_SPEED|default(params.SPEED|default(v.purge_speed))|float, max_extrude_speed]|min %}
        {% set retract_speed = [params.RETRACT_SPEED|default(v.retract_speed)|float, max_extrude_speed]|min %}

        {% set temp_wait_margin = params.TEMP_WAIT_MARGIN|default(v.temp_wait_margin)|float %}
        {% set restore_previous_temp = params.RESTORE_TEMP|default(v.restore_previous_temp)|int %}
        {% set buffer_auto_before_load = params.BUFFER_AUTO|default(v.buffer_auto_before_load)|int %}
        {% set buffer_assist_during_load = params.BUFFER_ASSIST|default(v.buffer_assist_during_load)|int %}
        {% set buffer_assist_lead_distance = params.BUFFER_ASSIST_LEAD_DISTANCE|default(v.buffer_assist_lead_distance)|float %}
        {% set buffer_assist_distance = params.BUFFER_ASSIST_DISTANCE|default(v.buffer_assist_distance)|float %}
        {% set buffer_assist_speed = params.BUFFER_ASSIST_SPEED|default(v.buffer_assist_speed)|float %}
        {% set buffer_assist_overlap_distance = params.BUFFER_ASSIST_OVERLAP_DISTANCE|default(v.buffer_assist_overlap_distance)|float %}
        {% set buffer_assist_auto_after = params.BUFFER_ASSIST_AUTO_AFTER|default(v.buffer_assist_auto_after)|int %}
        {% set tip_wipe_after_load = params.TIP_WIPE|default(v.tip_wipe_after_load)|int %}
        {% set run_poop_purge = params.POOP_PURGE|default(v.run_poop_purge)|int %}
        {% set poop_temp = params.POOP_TEMP|default(load_temp + (v.poop_purge_temp_offset|float))|float %}
        {% set poop_restore_temp = params.POOP_RESTORE_TEMP|default(v.poop_restore_temp)|int %}
        {% set previous_target = printer[active_extruder].target|float %}

        {% set bucket_x = v.bucket_x|float %}
        {% set bucket_y = v.bucket_y|float %}
        {% set bucket_z = v.bucket_z|float %}
        {% set current_z = printer.toolhead.position.z|float %}
        {% set safe_bucket_z = [current_z, bucket_z]|max %}

        {% if buffer_assist_during_load and buffer_assist_lead_distance < 0 %}
            {action_raise_error("LOAD_FILAMENT BUFFER_ASSIST_LEAD_DISTANCE cannot be negative when BUFFER_ASSIST=1.")}
        {% endif %}

        {% if buffer_assist_during_load and buffer_assist_distance <= 0 %}
            {action_raise_error("LOAD_FILAMENT BUFFER_ASSIST_DISTANCE must be greater than 0 when BUFFER_ASSIST=1.")}
        {% endif %}

        {% if buffer_assist_during_load and buffer_assist_speed <= 0 %}
            {action_raise_error("LOAD_FILAMENT BUFFER_ASSIST_SPEED must be greater than 0 when BUFFER_ASSIST=1.")}
        {% endif %}

        {% if buffer_assist_during_load and buffer_assist_overlap_distance < 0 %}
            {action_raise_error("LOAD_FILAMENT BUFFER_ASSIST_OVERLAP_DISTANCE cannot be negative when BUFFER_ASSIST=1.")}
        {% endif %}

        M117 Loading {material}

        #################################################################
        # Conditional homing before bucket motion.
        #################################################################

        {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
            _CG28
        {% endif %}

        SAVE_GCODE_STATE NAME=load_filament_state

        #################################################################
        # Return buffer to AUTO before hotend extrusion setup.
        # This gives lll-buffed native logic a chance to settle before the
        # deliberate load-assist bump takes over.
        #################################################################

        {% if buffer_auto_before_load %}
            BUFFER_ARM_ACTIVE_TOOL
        {% endif %}

        #################################################################
        # Heat only the currently active hotend extruder.
        #################################################################

        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={load_temp}

        # Clear the dock collision zone before any XY travel toward the bucket.
        # This prevents high-Z toolhead travel from clipping parked tool docks.
        _CLEAR_DOCK_ZONE_IF_HIGH

        # Re-read Z after the clearance macro because it may have lowered the toolhead.
        {% set current_z = printer.toolhead.position.z|float %}
        {% set safe_bucket_z = [current_z, bucket_z]|max %}

        G90
        G1 Z{safe_bucket_z} F{v.bucket_spd_z}
        G1 X{bucket_x} Y{bucket_y} F{v.bucket_spd_xy}
        G1 Z{bucket_z} F{v.bucket_spd_z}
        TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={load_temp - temp_wait_margin}

        #################################################################
        # Hotend load with optional buffer-side bump.
        # The hotend extruder starts first, then the buffer bumps forward
        # with WAIT=0 while the remaining hotend load continues.
        #################################################################

        M83
        G92 E0

        {% if load_distance > 0 %}
            {% if buffer_assist_during_load %}
                {% set lead_distance = [buffer_assist_lead_distance, load_distance]|min %}
                {% set after_lead_distance = load_distance - lead_distance %}
                {% set overlap_distance = [buffer_assist_overlap_distance, after_lead_distance]|min %}
                {% set final_load_distance = after_lead_distance - overlap_distance %}

                {% if lead_distance > 0 %}
                    # Start the hotend extruder first so the gears are already turning before the buffer bump.
                    G1 E{lead_distance} F{(load_speed * 60)|int}
                    M400
                {% endif %}

                M117 Buffer load bump
                _DEBUG_MSG MSG="LOAD_FILAMENT: buffer bump DISTANCE={buffer_assist_distance} SPEED={buffer_assist_speed} OVERLAP={overlap_distance}"

                # Start a bounded buffer push. Keep AUTO=0 here so the MOVE_DIST command is not immediately interrupted.
                BUFFER_MOVE_ACTIVE_TOOL DISTANCE={buffer_assist_distance} SPEED={buffer_assist_speed} WAIT=0 AUTO=0

                {% if overlap_distance > 0 %}
                    # Pull a short amount while the buffer bump is happening.
                    # Keep this short so AUTO can be restored before the buffer has a chance to starve.
                    G1 E{overlap_distance} F{(load_speed * 60)|int}
                    M400
                {% endif %}

                {% if buffer_assist_auto_after %}
                    # Put the buffer back in AUTO before the remaining load and main purge.
                    BUFFER_ARM_ACTIVE_TOOL
                {% endif %}

                {% if final_load_distance > 0 %}
                    # Continue loading with the buffer already back in native AUTO mode.
                    G1 E{final_load_distance} F{(load_speed * 60)|int}
                    M400
                {% endif %}
            {% else %}
                # Normal hotend load with no buffer bump.
                G1 E{load_distance} F{(load_speed * 60)|int}
                M400
            {% endif %}
        {% endif %}

        #################################################################
        # Main purge after load assist.
        # At this point the buffer has been returned to AUTO if configured,
        # so purge flow is supported by native lll-buffed logic.
        #################################################################

        {% if purge_distance > 0 %}
            # Main purge confirms the hotend is flowing after the filament path is engaged.
            G1 E{purge_distance} F{(purge_speed * 60)|int}
            M400
        {% endif %}

        {% if retract_after_purge > 0 %}
            # Small retract reduces ooze before wipe/poop cleanup.
            G1 E-{retract_after_purge} F{(retract_speed * 60)|int}
            M400
        {% endif %}

        G92 E0

        #################################################################
        # Fan burst + nozzle wipe after the basic purge.
        # When POOP_PURGE=1, skip this older immediate wipe because
        # POOP_PELLET_SHOOT now owns the staged cool/wipe/probe sequence.
        #################################################################

        {% if tip_wipe_after_load and not run_poop_purge %}
            M106 S{v.fan_burst_speed|int}
            G4 P{v.fan_burst_pause_ms|int}

            # Stage at the bucket before entering the normal wipe macro.
            G90
            G1 Z{safe_bucket_z} F{v.bucket_spd_z}
            G1 X{bucket_x} Y{bucket_y} F{v.bucket_spd_xy}
            G1 Z{bucket_z} F{v.bucket_spd_z}

            _WIPE_NOZZLE

            # First commanded XY location after the wipe is the bucket.
            G90
            G1 X{bucket_x} Y{bucket_y} F{v.bucket_spd_xy}
            G1 Z{bucket_z} F{v.bucket_spd_z}

            M106 S{v.fan_after_wipe|int}
        {% endif %}

        RESTORE_GCODE_STATE NAME=load_filament_state MOVE=0

        #################################################################
        # Optional poop pellet purge.
        # POOP_PELLET_SHOOT owns its own pellet geometry, but should pull
        # bucket/staging location from LOAD_FILAMENT in its own macro.
        #################################################################

        {% if run_poop_purge %}
            POOP_PELLET_SHOOT TEMP={poop_temp} RESTORE_TEMP={poop_restore_temp}
        {% else %}
            {% if restore_previous_temp == 1 %}
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={previous_target}
            {% else %}
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET=0
            {% endif %}
        {% endif %}

        M117 {material} load complete
    {% endif %}

    
#####################################################################
#                  Unload Filament
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Tip-form unload active hotend, staged buffer pulls, then long pull only if hotend sensor proves clear

variable_default_material: "PETG"

variable_pla_unload_temp: 210
variable_petg_unload_temp: 215
variable_tpu_unload_temp: 205
variable_abs_unload_temp: 240
variable_asa_unload_temp: 240
variable_default_unload_temp: 215

# Final hotend retract after tip forming and first buffer pull.
variable_retract_distance: 350
variable_retract_speed: 80

# Tip-form enable and tuning.
# All _UNLOAD_TIP_FORM behavior is tuned here so unload has one control panel.
variable_tip_form_enabled: 1
variable_tip_filament_diameter: 1.75
variable_tip_ramming_volume: 8.0
variable_tip_ramming_speed: 25.0
variable_tip_unloading_start_distance: 5.0
variable_tip_unloading_speed_start: 20.0
variable_tip_unloading_speed: 25.0
variable_tip_cooling_tube_position: 30.0
variable_tip_cooling_tube_length: 10.0
variable_tip_initial_cooling_speed: 20.0
variable_tip_final_cooling_speed: 50.0
variable_tip_cooling_moves: 1
variable_tip_use_skinnydip: 1
variable_tip_skinnydip_distance: 10.0
variable_tip_dip_insertion_speed: 20.0
variable_tip_dip_extraction_speed: 30.0
variable_tip_melt_zone_pause: 400
variable_tip_cooling_zone_pause: 250

# Buffer behavior.
variable_buffer_auto_before_unload: 0            # Default 0: do not let native AUTO push back during unload.
variable_buffer_pre_retract_pull_distance: 200   # Buffer pull after tip form but before final hotend retract.
variable_buffer_post_retract_pull_distance: 200  # Buffer pull after final hotend retract, before sensor check.
variable_buffer_long_pull_distance: 1800         # Runs only if hotend sensor is clear after staged pulls.
variable_buffer_pull_speed: 50                   # Normal speed for staged and long buffer pulls.
variable_buffer_sensor_settle_delay: 0.50        # Extra seconds after staged pulls before reading hotend sensor.

# Spool breakaway before buffer pulls.
# These pulses help start a full/heavy spool rolling before the normal buffer retract.
# They are intentionally controlled here, not in a helper macro, so unload tuning stays in one place.
variable_buffer_breakaway_enabled: 1             # 1 = run slow breakaway pulses before the first staged pull and before long pull.
variable_buffer_breakaway_distance: 8.0          # Distance for each slow reverse pulse.
variable_buffer_breakaway_speed: 6.0             # Slow speed to overcome static spool friction without skipping.
variable_buffer_breakaway_count: 5               # Number of pulses. Total added pull = distance * count.
variable_buffer_breakaway_pause_ms: 300          # Pause after each pulse so the spool can start rotating.

variable_temp_wait_margin: 3
variable_restore_previous_temp: 0

gcode:
    {% set v = printer["gcode_macro UNLOAD_FILAMENT"] %}
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    #################################################################
    # Prompt only when no material or temp was passed.
    #################################################################

    {% set prompt_speed = params.SPEED|default(params.RETRACT_SPEED|default(v.retract_speed))|float %}
    {% set material_prompt_needed = params.MATERIAL is not defined and params.FILAMENT is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to unload."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_UNLOAD_MATERIAL MATERIAL=PLA SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_UNLOAD_MATERIAL MATERIAL=PETG SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_UNLOAD_MATERIAL MATERIAL=TPU SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_UNLOAD_MATERIAL MATERIAL=ABS SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ASA|_KS_UNLOAD_MATERIAL MATERIAL=ASA SPEED={prompt_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

        {% set is_paused = printer.pause_resume.is_paused if "pause_resume" in printer else False %}

        {% if printer.idle_timeout.state == "Printing" and not is_paused %}
            {action_raise_error("UNLOAD_FILAMENT disabled while actively printing.")}
        {% endif %}

        {% if params.MATERIAL is defined %}
            {% set material = params.MATERIAL|upper|string %}
        {% elif params.FILAMENT is defined %}
            {% set material = params.FILAMENT|upper|string %}
        {% else %}
            {% set material = v.default_material|upper|string %}
        {% endif %}

        {% if params.TEMP is defined %}
            {% set unload_temp = params.TEMP|float %}
        {% elif material in ["PLA", "PLA+"] %}
            {% set unload_temp = v.pla_unload_temp|float %}
        {% elif material in ["PETG", "PET"] %}
            {% set unload_temp = v.petg_unload_temp|float %}
        {% elif material in ["TPU", "TPE"] %}
            {% set unload_temp = v.tpu_unload_temp|float %}
        {% elif material == "ABS" %}
            {% set unload_temp = v.abs_unload_temp|float %}
        {% elif material == "ASA" %}
            {% set unload_temp = v.asa_unload_temp|float %}
        {% else %}
            {% set unload_temp = v.default_unload_temp|float %}
        {% endif %}

        {% if active_extruder == "extruder" %}
            {% set hotend_sensor = map.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set hotend_sensor = map.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set hotend_sensor = map.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set hotend_sensor = map.tool3_hotend_sensor|string %}
        {% else %}
            {% set hotend_sensor = "" %}
        {% endif %}

        {% set tip_form_enabled = params.TIP_FORM|default(v.tip_form_enabled)|int %}
        {% set retract_distance = params.RETRACT_DISTANCE|default(v.retract_distance)|float %}
        {% set retract_speed = [params.RETRACT_SPEED|default(params.SPEED|default(v.retract_speed))|float, max_extrude_speed]|min %}

        {% set buffer_auto_before_unload = params.BUFFER_AUTO|default(v.buffer_auto_before_unload)|int %}
        {% set buffer_pre_retract_pull_distance = params.BUFFER_PRE_RETRACT_PULL_DISTANCE|default(v.buffer_pre_retract_pull_distance)|float %}
        {% set buffer_post_retract_pull_distance = params.BUFFER_POST_RETRACT_PULL_DISTANCE|default(v.buffer_post_retract_pull_distance)|float %}
        {% set buffer_long_pull_distance = params.BUFFER_LONG_PULL_DISTANCE|default(v.buffer_long_pull_distance)|float %}
        {% set buffer_pull_speed = params.BUFFER_PULL_SPEED|default(v.buffer_pull_speed)|float %}
        {% set buffer_sensor_settle_delay = params.BUFFER_SENSOR_SETTLE_DELAY|default(v.buffer_sensor_settle_delay)|float %}

        {% set buffer_breakaway_enabled = params.BUFFER_BREAKAWAY|default(v.buffer_breakaway_enabled)|int %}
        {% set buffer_breakaway_distance = params.BUFFER_BREAKAWAY_DISTANCE|default(v.buffer_breakaway_distance)|float %}
        {% set buffer_breakaway_speed = params.BUFFER_BREAKAWAY_SPEED|default(v.buffer_breakaway_speed)|float %}
        {% set buffer_breakaway_count = params.BUFFER_BREAKAWAY_COUNT|default(v.buffer_breakaway_count)|int %}
        {% set buffer_breakaway_pause_ms = params.BUFFER_BREAKAWAY_PAUSE_MS|default(v.buffer_breakaway_pause_ms)|int %}

        {% set temp_wait_margin = params.TEMP_WAIT_MARGIN|default(v.temp_wait_margin)|float %}
        {% set restore_previous_temp = params.RESTORE_TEMP|default(v.restore_previous_temp)|int %}
        {% set previous_target = printer[active_extruder].target|float %}

        {% if buffer_pull_speed <= 0 %}
            {action_raise_error("UNLOAD_FILAMENT BUFFER_PULL_SPEED must be greater than 0.")}
        {% endif %}

        {% if buffer_breakaway_enabled and buffer_breakaway_distance <= 0 %}
            {action_raise_error("UNLOAD_FILAMENT BUFFER_BREAKAWAY_DISTANCE must be greater than 0 when BUFFER_BREAKAWAY=1.")}
        {% endif %}

        {% if buffer_breakaway_enabled and buffer_breakaway_speed <= 0 %}
            {action_raise_error("UNLOAD_FILAMENT BUFFER_BREAKAWAY_SPEED must be greater than 0 when BUFFER_BREAKAWAY=1.")}
        {% endif %}

        {% if buffer_breakaway_enabled and buffer_breakaway_count <= 0 %}
            {action_raise_error("UNLOAD_FILAMENT BUFFER_BREAKAWAY_COUNT must be greater than 0 when BUFFER_BREAKAWAY=1.")}
        {% endif %}

        {% if buffer_breakaway_enabled and buffer_breakaway_pause_ms < 0 %}
            {action_raise_error("UNLOAD_FILAMENT BUFFER_BREAKAWAY_PAUSE_MS cannot be negative.")}
        {% endif %}

        {% if v.tip_filament_diameter|float <= 0 %}
            {action_raise_error("UNLOAD_FILAMENT variable_tip_filament_diameter must be greater than 0.")}
        {% endif %}

        M117 Unloading {material}

        SAVE_GCODE_STATE NAME=unload_filament_state

        #################################################################
        # Cancel stale delayed stages before storing new runtime state.
        # active is set last so a delayed stage cannot read partial values.
        #################################################################

        UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_SENSOR_CHECK DURATION=0
        UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_FINISH DURATION=0

        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=material VALUE="'{material}'"
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=active_extruder VALUE="'{active_extruder}'"
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=hotend_sensor VALUE="'{hotend_sensor}'"
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=previous_target VALUE={previous_target}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=restore_previous_temp VALUE={restore_previous_temp}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_long_pull_distance VALUE={buffer_long_pull_distance}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_pull_speed VALUE={buffer_pull_speed}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_sensor_settle_delay VALUE={buffer_sensor_settle_delay}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_breakaway_enabled VALUE={buffer_breakaway_enabled}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_breakaway_distance VALUE={buffer_breakaway_distance}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_breakaway_speed VALUE={buffer_breakaway_speed}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_breakaway_count VALUE={buffer_breakaway_count}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_breakaway_pause_ms VALUE={buffer_breakaway_pause_ms}
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=active VALUE=1

        #################################################################
        # Default unload behavior avoids AUTO because AUTO can push filament
        # back toward the hotend while we are trying to prove it is clear.
        # BUFFER_AUTO=1 is left available only for intentional testing.
        #################################################################

        {% if buffer_auto_before_unload %}
            BUFFER_ARM_ACTIVE_TOOL
        {% else %}
            BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
        {% endif %}

        # Home if needed.
        _CG28

        #################################################################
        # Heat/cool to unload temp using the active hotend only.
        # Move to the LOAD_FILAMENT bucket so any ooze stays controlled.
        #################################################################

        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}

        _CLEAR_DOCK_ZONE_IF_HIGH

        {% set load = printer["gcode_macro LOAD_FILAMENT"] %}
        {% set bucket_x = load.bucket_x|float %}
        {% set bucket_y = load.bucket_y|float %}
        {% set bucket_z = load.bucket_z|float %}
        {% set bucket_spd_xy = load.bucket_spd_xy|float %}
        {% set bucket_spd_z = load.bucket_spd_z|float %}
        {% set current_z = printer.toolhead.position.z|float %}
        {% set safe_bucket_z = [current_z, bucket_z]|max %}

        G90
        G1 Z{safe_bucket_z} F{bucket_spd_z}
        G1 X{bucket_x} Y{bucket_y} F{bucket_spd_xy}
        G1 Z{bucket_z} F{bucket_spd_z}

        TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={unload_temp - temp_wait_margin} MAXIMUM={unload_temp + temp_wait_margin}

        #################################################################
        # Tip form and deliberate staged buffer pulls.
        # AUTO is not relied on to unwind the buffer. These MOVE_DIST calls
        # intentionally pull the buffer back before the final sensor gate.
        #################################################################

        M83
        G92 E0

        {% if tip_form_enabled %}
            _UNLOAD_TIP_FORM
        {% endif %}

        {% if buffer_breakaway_enabled and (buffer_pre_retract_pull_distance > 0 or buffer_post_retract_pull_distance > 0) %}
            M117 Buffer spool breakaway
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer breakaway COUNT={buffer_breakaway_count} DISTANCE=-{buffer_breakaway_distance} SPEED={buffer_breakaway_speed} PAUSE_MS={buffer_breakaway_pause_ms}"

            # Slow pulsed pulls start a full/heavy spool moving before the normal staged unload pulls.
            # These pulses add to the total buffer pull distance by design.
            {% for i in range(buffer_breakaway_count) %}
                BUFFER_MOVE_ACTIVE_TOOL DISTANCE=-{buffer_breakaway_distance} SPEED={buffer_breakaway_speed} WAIT=1 AUTO=0
                G4 P{buffer_breakaway_pause_ms}
            {% endfor %}
        {% endif %}

        {% if buffer_pre_retract_pull_distance > 0 %}
            M117 Buffer pre-retract pull
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer pre-retract pull DISTANCE=-{buffer_pre_retract_pull_distance} SPEED={buffer_pull_speed}"

            # Pull buffer slack backward after tip form, before the hotend final retract.
            # WAIT=1 keeps the following hotend retract from starting until this bounded move finishes.
            BUFFER_MOVE_ACTIVE_TOOL DISTANCE=-{buffer_pre_retract_pull_distance} SPEED={buffer_pull_speed} WAIT=1 AUTO=0
        {% endif %}

        {% if retract_distance > 0 %}
            # Final hotend-side unload after tip forming and the first deliberate buffer pull.
            G1 E-{retract_distance} F{(retract_speed * 60)|int}
            M400
        {% endif %}

        {% if buffer_post_retract_pull_distance > 0 %}
            M117 Buffer post-retract pull
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer post-retract pull DISTANCE=-{buffer_post_retract_pull_distance} SPEED={buffer_pull_speed}"

            # Pull another bounded amount after the hotend retract.
            # The delayed sensor check below runs after this command sequence finishes.
            BUFFER_MOVE_ACTIVE_TOOL DISTANCE=-{buffer_post_retract_pull_distance} SPEED={buffer_pull_speed} WAIT=1 AUTO=0
        {% endif %}

        G92 E0

        RESTORE_GCODE_STATE NAME=unload_filament_state MOVE=0

        #################################################################
        # Stop/disable active buffer output before checking the hotend
        # sensor. This prevents native buffer motion from pushing filament
        # back into the extruder before the delayed check runs.
        #################################################################

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

        # Sensor gate. If the hotend still sees filament, the long pull is
        # skipped so we do not yank 1800mm against a stuck tip.
        UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_SENSOR_CHECK DURATION={buffer_sensor_settle_delay}

        M117 {material} staged unload complete
    {% endif %}

#####################################################################
#                  Unload Tip Forming Helper
#####################################################################

[gcode_macro _UNLOAD_TIP_FORM]
description: Internal tip-forming motion used by UNLOAD_FILAMENT. Tunables live in UNLOAD_FILAMENT only.
gcode:
    {% set v = printer["gcode_macro UNLOAD_FILAMENT"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

    # Pull all tip-form values from UNLOAD_FILAMENT so there is one tuning location.
    {% set filament_diameter = v.tip_filament_diameter|float %}
    {% set ramming_volume = v.tip_ramming_volume|float %}
    {% set ramming_speed = [v.tip_ramming_speed|float, max_extrude_speed]|min %}
    {% set unloading_start_distance = v.tip_unloading_start_distance|float %}
    {% set unloading_speed_start = [v.tip_unloading_speed_start|float, max_extrude_speed]|min %}
    {% set unloading_speed = [v.tip_unloading_speed|float, max_extrude_speed]|min %}
    {% set cooling_tube_position = v.tip_cooling_tube_position|float %}
    {% set cooling_tube_length = v.tip_cooling_tube_length|float %}
    {% set initial_cooling_speed = [v.tip_initial_cooling_speed|float, max_extrude_speed]|min %}
    {% set final_cooling_speed = [v.tip_final_cooling_speed|float, max_extrude_speed]|min %}
    {% set cooling_moves = v.tip_cooling_moves|int %}
    {% set use_skinnydip = v.tip_use_skinnydip|int %}
    {% set skinnydip_distance = v.tip_skinnydip_distance|float %}
    {% set dip_insertion_speed = [v.tip_dip_insertion_speed|float, max_extrude_speed]|min %}
    {% set dip_extraction_speed = [v.tip_dip_extraction_speed|float, max_extrude_speed]|min %}
    {% set melt_zone_pause = v.tip_melt_zone_pause|int %}
    {% set cooling_zone_pause = v.tip_cooling_zone_pause|int %}

    {% set filament_radius = filament_diameter / 2.0 %}
    {% set filament_area = 3.14159 * filament_radius * filament_radius %}
    {% set ramming_length = ramming_volume / filament_area %}
    {% set remaining_to_cooling = cooling_tube_position - unloading_start_distance %}

    _STATUS_MSG MSG="Tip forming filament"
    _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: ram={ramming_volume}mm3/{ramming_length|round(2)}mm, cooling_tube_position={cooling_tube_position}, cooling_tube_length={cooling_tube_length}, cooling_moves={cooling_moves}, skinnydip={use_skinnydip}"

    M83
    G92 E0
    M400

    {% if ramming_length > 0 %}
        # Push a controlled volume forward before the retract to shape the molten zone.
        G1 E{ramming_length} F{(ramming_speed * 60)|int}
        M400
    {% endif %}

    {% if unloading_start_distance > 0 %}
        # Fast initial pull starts separating the filament from the melt zone.
        G1 E-{unloading_start_distance} F{(unloading_speed_start * 60)|int}
        M400
    {% endif %}

    {% if remaining_to_cooling > 0 %}
        # Pull to the configured cooling tube position before cooling strokes.
        G1 E-{remaining_to_cooling} F{(unloading_speed * 60)|int}
        M400
    {% endif %}

    {% for i in range(cooling_moves) %}
        {% if i == 0 %}
            # First cooling stroke can be slower to avoid stretching a bad tip.
            G1 E-{cooling_tube_length} F{(initial_cooling_speed * 60)|int}
        {% else %}
            # Later strokes use the final cooling speed once the tip is more stable.
            G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        {% endif %}
        M400

        # Push back through the cooling zone so the filament shape is worked both directions.
        G1 E{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endfor %}

    {% if cooling_tube_length > 0 %}
        # Finish on a pull so the tip ends above the melt zone before optional skinnydip.
        G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endif %}

    {% if use_skinnydip == 1 %}
        _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: skinny dip distance={skinnydip_distance}"

        # Briefly dip back into the melt zone to smooth the tip, then pull back out.
        G1 E{skinnydip_distance} F{(dip_insertion_speed * 60)|int}
        G4 P{melt_zone_pause}
        G1 E-{skinnydip_distance} F{(dip_extraction_speed * 60)|int}
        G4 P{cooling_zone_pause}
        M400
    {% endif %}

#####################################################################
#                  Unload Sensor Check - Long Pull Gate
#####################################################################

[delayed_gcode _UNLOAD_FILAMENT_SENSOR_CHECK]
gcode:
    {% set s = printer["gcode_macro _UNLOAD_FILAMENT_CONTINUE_STATE"] %}
    {% set sensor_name = s.hotend_sensor|string %}

    {% if s.active|int == 1 %}
        # Disable before reading the sensor so the buffer cannot push filament
        # forward and corrupt the check.
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

        {% if sensor_name|length > 0 and sensor_name in printer %}
            {% set hotend_detected = printer[sensor_name].filament_detected|int %}

            {% if hotend_detected == 0 %}
                M117 Hotend clear - long buffer pull
                _DEBUG_MSG MSG="_UNLOAD_FILAMENT_SENSOR_CHECK: {sensor_name} clear, allowing long buffer pull DISTANCE=-{s.buffer_long_pull_distance} SPEED={s.buffer_pull_speed}"

                {% if s.buffer_long_pull_distance|float > 0 %}
                    {% set long_distance = s.buffer_long_pull_distance|float %}
                    {% set pull_speed = s.buffer_pull_speed|float %}
                    {% set settle_delay = s.buffer_sensor_settle_delay|float %}
                    {% set finish_delay = (long_distance / pull_speed) + settle_delay %}

                    {% set breakaway_enabled = s.buffer_breakaway_enabled|int %}
                    {% set breakaway_distance = s.buffer_breakaway_distance|float %}
                    {% set breakaway_speed = s.buffer_breakaway_speed|float %}
                    {% set breakaway_count = s.buffer_breakaway_count|int %}
                    {% set breakaway_pause_ms = s.buffer_breakaway_pause_ms|int %}

                    {% if breakaway_enabled and breakaway_distance > 0 and breakaway_speed > 0 and breakaway_count > 0 %}
                        M117 Buffer long-pull breakaway
                        _DEBUG_MSG MSG="_UNLOAD_FILAMENT_SENSOR_CHECK: long-pull breakaway COUNT={breakaway_count} DISTANCE=-{breakaway_distance} SPEED={breakaway_speed} PAUSE_MS={breakaway_pause_ms}"

                        # Restart spool motion before the long pull.
                        # This helps if the staged pulls stopped and the spool settled again.
                        {% for i in range(breakaway_count) %}
                            BUFFER_MOVE_ACTIVE_TOOL DISTANCE=-{breakaway_distance} SPEED={breakaway_speed} WAIT=1 AUTO=0
                            G4 P{breakaway_pause_ms}
                        {% endfor %}
                    {% endif %}

                    # Long pull only runs after the hotend sensor proves clear.
                    # AUTO stays off so the buffer does not immediately push again.
                    BUFFER_MOVE_ACTIVE_TOOL DISTANCE=-{long_distance} SPEED={pull_speed} WAIT=0 AUTO=0

                    UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_FINISH DURATION={finish_delay}
                {% else %}
                    UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_FINISH DURATION=0.1
                {% endif %}
            {% else %}
                M117 Hotend still loaded - long pull skipped
                M118 UNLOAD_FILAMENT: {sensor_name} still detects filament after staged pulls; skipping long buffer pull.
                UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_FINISH DURATION=0.1
            {% endif %}
        {% else %}
            M118 UNLOAD_FILAMENT: no valid hotend sensor mapped; skipping long buffer pull.
            UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_FINISH DURATION=0.1
        {% endif %}
    {% endif %}

#####################################################################
#                  Unload Finish
#####################################################################

[delayed_gcode _UNLOAD_FILAMENT_FINISH]
gcode:
    {% set s = printer["gcode_macro _UNLOAD_FILAMENT_CONTINUE_STATE"] %}

    {% if s.active|int == 1 %}
        # Leave the buffer disabled/off after unload. Do not return to AUTO
        # here because AUTO can feed filament forward again on a sensor change.
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

        {% if s.restore_previous_temp|int == 1 %}
            SET_HEATER_TEMPERATURE HEATER={s.active_extruder} TARGET={s.previous_target}
        {% endif %}

        M117 {s.material} unload complete
        _BEEP 
        SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_CONTINUE_STATE VARIABLE=active VALUE=0
    {% endif %}


#####################################################################
#                  Unload Filament Continuation State
#####################################################################

[gcode_macro _UNLOAD_FILAMENT_CONTINUE_STATE]
description: Internal runtime state used by delayed UNLOAD_FILAMENT buffer pull stages. Do not tune here.
variable_active: 0
variable_material: ""
variable_active_extruder: ""
variable_hotend_sensor: ""
variable_previous_target: 0.0
variable_restore_previous_temp: 0
variable_buffer_long_pull_distance: 0.0
variable_buffer_pull_speed: 0.0
variable_buffer_sensor_settle_delay: 0.0
variable_buffer_breakaway_enabled: 0
variable_buffer_breakaway_distance: 0.0
variable_buffer_breakaway_speed: 0.0
variable_buffer_breakaway_count: 0
variable_buffer_breakaway_pause_ms: 0
gcode:
    # Runtime storage only. Tune UNLOAD_FILAMENT, not this helper.


#####################################################################
#                  KlipperScreen Material Prompt Helpers
#####################################################################

[gcode_macro _KS_END_PROMPT]
description: Close active KlipperScreen/Moonraker action prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _KS_MATERIAL_MENU_VARS]
description: Shared material prompt settings for KlipperScreen load/unload menus
variable_materials: "PLA,PETG,ABS,ASA,TPU,PC,NYLON"
variable_load_speed: 120
variable_unload_speed: 80
variable_buttons_per_row: 3
gcode:
    # Variable storage macro only.
    {action_respond_info("_KS_MATERIAL_MENU_VARS stores material menu settings.")}


[gcode_macro KS_LOAD_MATERIAL_MENU]
description: Open KlipperScreen material prompt for LOAD_FILAMENT
gcode:
    {% set vars = printer["gcode_macro _KS_MATERIAL_MENU_VARS"] %}
    {% set material_string = params.MATERIALS|default(vars.materials)|string %}
    {% set material_list = material_string.split(",") %}
    {% set speed = params.SPEED|default(vars.load_speed)|float %}
    {% set requested_per_row = params.PER_ROW|default(vars.buttons_per_row)|int %}
    {% set per_row = 3 if requested_per_row < 1 else requested_per_row %}

    RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
    RESPOND TYPE=command MSG="action:prompt_text Choose material to load."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"

    {% for raw_material in material_list %}
        {% set material = raw_material|trim|upper %}

        {% if material %}
            RESPOND TYPE=command MSG="action:prompt_button {material}|_KS_LOAD_MATERIAL MATERIAL={material} SPEED={speed}|primary"
        {% endif %}

        {% if loop.index is divisibleby(per_row) and not loop.last %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
    {% endfor %}

    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro KS_UNLOAD_MATERIAL_MENU]
description: Open KlipperScreen material prompt for UNLOAD_FILAMENT
gcode:
    {% set vars = printer["gcode_macro _KS_MATERIAL_MENU_VARS"] %}
    {% set material_string = params.MATERIALS|default(vars.materials)|string %}
    {% set material_list = material_string.split(",") %}
    {% set speed = params.SPEED|default(vars.unload_speed)|float %}
    {% set requested_per_row = params.PER_ROW|default(vars.buttons_per_row)|int %}
    {% set per_row = 3 if requested_per_row < 1 else requested_per_row %}

    RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
    RESPOND TYPE=command MSG="action:prompt_text Choose material to unload."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"

    {% for raw_material in material_list %}
        {% set material = raw_material|trim|upper %}

        {% if material %}
            RESPOND TYPE=command MSG="action:prompt_button {material}|_KS_UNLOAD_MATERIAL MATERIAL={material} SPEED={speed}|warning"
        {% endif %}

        {% if loop.index is divisibleby(per_row) and not loop.last %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
    {% endfor %}

    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _KS_LOAD_MATERIAL]
description: Close material prompt and call LOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}
    {% set speed = params.SPEED|default(120)|float %}

    # Close the prompt before starting the load routine so the screen is not left covered.
    RESPOND TYPE=command MSG="action:prompt_end"

    LOAD_FILAMENT MATERIAL={material} SPEED={speed}


[gcode_macro _KS_UNLOAD_MATERIAL]
description: Close material prompt and call UNLOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}
    {% set speed = params.SPEED|default(80)|float %}

    # Close the prompt before starting the unload routine so the screen is not left covered.
    RESPOND TYPE=command MSG="action:prompt_end"

    UNLOAD_FILAMENT MATERIAL={material} SPEED={speed}
