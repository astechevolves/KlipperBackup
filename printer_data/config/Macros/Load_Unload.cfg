
#####################################################################
#                  KlipperScreen Material Prompt Helpers
#####################################################################

[gcode_macro _KS_END_PROMPT]
description: Close active KlipperScreen/Moonraker action prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _KS_LOAD_MATERIAL]
description: Close material prompt and call LOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}

    _KS_END_PROMPT
    LOAD_FILAMENT MATERIAL={material}


[gcode_macro _KS_UNLOAD_MATERIAL]
description: Close material prompt and call UNLOAD_FILAMENT with selected material
gcode:
    {% set material = params.MATERIAL|default("PETG")|upper|string %}
    {% set speed = params.SPEED|default(50)|float %}

    _KS_END_PROMPT
    UNLOAD_FILAMENT MATERIAL={material} SPEED={speed}

[gcode_macro LOAD_FILAMENT]
description: Load filament into active tool using buffer capture/fill, synced hotend load, then POOP_PELLET_SHOOT cleanup

variable_load_distance: 10

variable_load_temp: 240
variable_pla_load_temp: 220
variable_petg_load_temp: 240
variable_tpu_load_temp: 225
variable_abs_load_temp: 250

variable_home_temp: 150
variable_home_cool_target: 145
variable_purge_bucket_x: 310
variable_purge_bucket_y: 0
variable_purge_bucket_z: 5
variable_travel_speed: 9000
variable_z_travel_speed: 1200

variable_verify_buffer_before_load: 1
variable_buffer_auto_during_load: 1
variable_keep_buffer_active: 0

# Buffer capture before hotend extrusion.
variable_capture_buffer_before_load: 1
variable_capture_buffer_step_distance: 10
variable_capture_buffer_step_speed: 30
variable_capture_buffer_step_accel: 300
variable_capture_buffer_max_steps: 80

# Fill Buffer0 neck after toolhead sensor detects filament.
variable_capture_buffer_fill_after_sensor: 1
variable_capture_buffer_fill_percent: 100
variable_capture_buffer_fill_step: 5
variable_capture_buffer_fill_speed: 30
variable_capture_buffer_fill_accel: 300
variable_capture_buffer_fill_max_steps: 20

variable_capture_buffer_fail_beeps: 3

gcode:
    {% set material_prompt_needed = params.MATERIAL is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to load."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_LOAD_MATERIAL MATERIAL=PLA|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_LOAD_MATERIAL MATERIAL=PETG|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_LOAD_MATERIAL MATERIAL=TPU|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_LOAD_MATERIAL MATERIAL=ABS|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_velocity = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %}
        {% set material = params.MATERIAL|default("PLA")|upper|string %}
        {% set direct_feed_override = params.DIRECT_FEED|default(0)|int %}
        {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

        {% if active_extruder == "extruder" %}
            {% set buffer_entrance_sensor = sensors.tool0_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set buffer_entrance_sensor = sensors.tool1_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set buffer_entrance_sensor = sensors.tool2_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set buffer_entrance_sensor = sensors.tool3_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set buffer_entrance_sensor = "" %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set buffer_entrance_detected = 1 if buffer_entrance_sensor|length > 0 and buffer_entrance_sensor in printer and printer[buffer_entrance_sensor].filament_detected|int == 1 else 0 %}
        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        # Entrance wins. Direct-feed only applies when entrance is clear and the toolhead sensor sees filament.
        {% set use_buffer_for_load = 1 if direct_feed_override == 0 and buffer_entrance_detected == 1 else 0 %}
        {% set use_direct_feed_for_load = 1 if direct_feed_override == 1 or (buffer_entrance_detected == 0 and toolhead_detected == 1) else 0 %}

        {% set load_distance = params.LOAD_DISTANCE|default(load_distance)|float %}

        {% if params.TEMP is defined %}
            {% set load_temp = params.TEMP|float %}
        {% elif material == "PLA" %}
            {% set load_temp = pla_load_temp|float %}
        {% elif material == "PETG" %}
            {% set load_temp = petg_load_temp|float %}
        {% elif material == "TPU" %}
            {% set load_temp = tpu_load_temp|float %}
        {% elif material == "ABS" %}
            {% set load_temp = abs_load_temp|float %}
        {% else %}
            {% set load_temp = load_temp|float %}
        {% endif %}

        {% set home_temp = params.HOME_TEMP|default(home_temp)|float %}
        {% set home_cool_target = params.HOME_COOL_TARGET|default(home_cool_target)|float %}
        {% set bucket_x = params.BUCKET_X|default(purge_bucket_x)|float %}
        {% set bucket_y = params.BUCKET_Y|default(purge_bucket_y)|float %}
        {% set bucket_z = params.BUCKET_Z|default(purge_bucket_z)|float %}
        {% set travel_speed = params.TRAVEL_SPEED|default(travel_speed)|float %}
        {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(z_travel_speed)|float %}
        {% set verify_buffer_before_load = params.VERIFY_BUFFER|default(verify_buffer_before_load)|int %}
        {% set buffer_auto_during_load = params.BUFFER_AUTO_DURING_LOAD|default(buffer_auto_during_load)|int %}
        {% set keep_buffer_active = params.KEEP_BUFFER_ACTIVE|default(keep_buffer_active)|int %}
        {% set capture_buffer_before_load = params.CAPTURE_BUFFER|default(capture_buffer_before_load)|int %}
        {% set capture_buffer_step_distance = params.CAPTURE_BUFFER_STEP_DISTANCE|default(capture_buffer_step_distance)|float %}
        {% set capture_buffer_step_speed = params.CAPTURE_BUFFER_STEP_SPEED|default(capture_buffer_step_speed)|float %}
        {% set capture_buffer_step_accel = params.CAPTURE_BUFFER_STEP_ACCEL|default(capture_buffer_step_accel)|float %}
        {% set capture_buffer_max_steps = params.CAPTURE_BUFFER_MAX_STEPS|default(capture_buffer_max_steps)|int %}
        {% set capture_buffer_fill_after_sensor = params.CAPTURE_BUFFER_FILL_AFTER_SENSOR|default(capture_buffer_fill_after_sensor)|int %}
        {% set capture_buffer_fill_percent = params.CAPTURE_BUFFER_FILL_PERCENT|default(capture_buffer_fill_percent)|float %}
        {% set capture_buffer_fill_step = params.CAPTURE_BUFFER_FILL_STEP|default(capture_buffer_fill_step)|float %}
        {% set capture_buffer_fill_speed = params.CAPTURE_BUFFER_FILL_SPEED|default(capture_buffer_fill_speed)|float %}
        {% set capture_buffer_fill_accel = params.CAPTURE_BUFFER_FILL_ACCEL|default(capture_buffer_fill_accel)|float %}
        {% set capture_buffer_fill_max_steps = params.CAPTURE_BUFFER_FILL_MAX_STEPS|default(capture_buffer_fill_max_steps)|int %}
        {% set capture_buffer_fail_beeps = params.CAPTURE_BUFFER_FAIL_BEEPS|default(capture_buffer_fail_beeps)|int %}

        _STATUS_MSG MSG="Loading {material} filament"
        _DEBUG_MSG MSG="LOAD_FILAMENT: material={material}, active_extruder={active_extruder}, load_temp={load_temp}, load_distance={load_distance}, buffer_sensor={buffer_entrance_sensor}, buffer_detected={buffer_entrance_detected}, toolhead_sensor={toolhead_sensor}, toolhead_detected={toolhead_detected}, direct_feed_override={direct_feed_override}, use_buffer={use_buffer_for_load}, use_direct_feed={use_direct_feed_for_load}"

        {% if use_buffer_for_load == 0 and use_direct_feed_for_load == 0 %}
            _BEEP
            { action_raise_error("LOAD_FILAMENT: no filament detected at buffer entrance or toolhead sensor.") }
        {% endif %}

        {% if use_buffer_for_load == 0 %}
            _STATUS_MSG MSG="Direct-feed load mode - buffer ignored"
            BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
        {% endif %}

        M117 Loading {material}

        {% set nozzle_temp = printer[active_extruder].temperature|float %}
        {% set homed_axes = printer.toolhead.homed_axes %}
        {% set printer_homed = 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %}

        {% if printer_homed and nozzle_temp > home_temp %}
            _DEBUG_MSG MSG="LOAD_FILAMENT: printer homed and nozzle above home_temp, skipping warmup/home prep"
        {% elif not printer_homed and nozzle_temp > home_temp %}
            M117 Nozzle too hot, waiting until cool to home
            _STATUS_MSG MSG="Cooling nozzle before homing"
            _DEBUG_MSG MSG="LOAD_FILAMENT: nozzle_temp={nozzle_temp}, home_temp={home_temp}, home_cool_target={home_cool_target}"
            M104 S{home_cool_target}
            TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={home_temp}
            _CG28
        {% elif not printer_homed and nozzle_temp <= home_temp %}
            _STATUS_MSG MSG="Homing printer"
            M104 S{home_temp}
            _CG28
        {% else %}
            _DEBUG_MSG MSG="LOAD_FILAMENT: printer homed and nozzle cool, setting standby temp"
            M104 S{home_temp}
        {% endif %}

        SAVE_GCODE_STATE NAME=load_state

        M104 S{load_temp}
        G90

        M117 Moving to purge bucket
        _STATUS_MSG MSG="Moving to purge bucket"
        _DEBUG_MSG MSG="LOAD_FILAMENT: bucket_x={bucket_x}, bucket_y={bucket_y}, bucket_z={bucket_z}, travel_speed={travel_speed}, z_travel_speed={z_travel_speed}"
        G1 Z{bucket_z} F{z_travel_speed}
        G1 X{bucket_x} F{travel_speed}
        G1 Y{bucket_y} F{travel_speed}

        G91

        M117 Heating nozzle
        _STATUS_MSG MSG="Heating {material} to {load_temp}C"
        M109 S{load_temp}
        _BEEP

        #################################################################
        # Buffer setup for load
        #################################################################

        {% if use_buffer_for_load == 1 %}
            _STATUS_MSG MSG="Buffer load path active"
            _DEBUG_MSG MSG="LOAD_FILAMENT: stopping auto/percent loops before load capture/sync"
            STOP_CENTER_BUFFER_0
            DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
            STOP_PERCENT_MOVE_BUFFER0
            BUFFER_SYNC_OFF_0
        {% else %}
            _STATUS_MSG MSG="Buffer load assist skipped - direct feed"
        {% endif %}

        M83
        G92 E0

        #################################################################
        # Store continuation values for delayed capture/fill state machines.
        #################################################################

        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=material VALUE="'{material}'"
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=load_temp VALUE={load_temp}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=load_distance VALUE={load_distance}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=max_velocity VALUE={max_velocity}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_x VALUE={bucket_x}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_y VALUE={bucket_y}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_z VALUE={bucket_z}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=travel_speed VALUE={travel_speed}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=z_travel_speed VALUE={z_travel_speed}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=use_buffer_for_load VALUE={use_buffer_for_load}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_auto_during_load VALUE={buffer_auto_during_load}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=keep_buffer_active VALUE={keep_buffer_active}

        #################################################################
        # Initial hotend load gate
        #################################################################

        {% if capture_buffer_before_load == 1 and use_buffer_for_load == 1 and toolhead_detected == 0 %}
            {% if toolhead_sensor|length == 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: toolhead filament sensor is not configured, cannot safely capture buffer filament before load.") }
            {% elif toolhead_sensor not in printer %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: configured toolhead filament sensor not found: " ~ toolhead_sensor) }
            {% elif capture_buffer_step_distance <= 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: CAPTURE_BUFFER_STEP_DISTANCE must be greater than 0.") }
            {% elif capture_buffer_max_steps <= 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: CAPTURE_BUFFER_MAX_STEPS must be greater than 0.") }
            {% else %}
                _STATUS_MSG MSG="Capturing buffered filament at toolhead sensor"
                _DEBUG_MSG MSG="LOAD_FILAMENT: starting capture feeler loop. step={capture_buffer_step_distance}mm, speed={capture_buffer_step_speed}, accel={capture_buffer_step_accel}, max_steps={capture_buffer_max_steps}, fill_after_sensor={capture_buffer_fill_after_sensor}, fill_percent={capture_buffer_fill_percent}"

                _LOAD_CAPTURE_BUFFER_START_ACTIVE_TOOL STEP_DISTANCE={capture_buffer_step_distance} STEP_SPEED={capture_buffer_step_speed} STEP_ACCEL={capture_buffer_step_accel} MAX_STEPS={capture_buffer_max_steps} FILL_AFTER_SENSOR={capture_buffer_fill_after_sensor} FILL_PERCENT={capture_buffer_fill_percent} FILL_STEP={capture_buffer_fill_step} FILL_SPEED={capture_buffer_fill_speed} FILL_ACCEL={capture_buffer_fill_accel} FILL_MAX_STEPS={capture_buffer_fill_max_steps} FAIL_BEEPS={capture_buffer_fail_beeps}
            {% endif %}

        {% elif capture_buffer_before_load == 1 and use_buffer_for_load == 1 and toolhead_detected == 1 and capture_buffer_fill_after_sensor == 1 %}
            _STATUS_MSG MSG="Toolhead sensor already has filament; filling Buffer0 before hotend load"
            _DEBUG_MSG MSG="LOAD_FILAMENT: toolhead sensor already detects filament, running fill to {capture_buffer_fill_percent}% before synced hotend load"

            _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL TARGET={capture_buffer_fill_percent} STEP={capture_buffer_fill_step} SPEED={capture_buffer_fill_speed} ACCEL={capture_buffer_fill_accel} MAX_STEPS={capture_buffer_fill_max_steps}

        {% else %}
            _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE
        {% endif %}

    {% endif %}

[gcode_macro _LOAD_FILAMENT_CONTINUE_STATE]
description: Runtime state used by delayed LOAD_FILAMENT capture/fill continuation
variable_material: "PLA"
variable_load_distance: 10.0
variable_max_velocity: 300.0
variable_purge_distance: 50.0
variable_purge_chunk: 5.0
variable_purge_speed: 120.0
variable_bucket_x: 310.0
variable_bucket_y: 0.0
variable_bucket_z: 5.0
variable_travel_speed: 9000.0
variable_z_travel_speed: 1200.0
variable_use_buffer_for_load: 0
variable_buffer_auto_during_load: 0
variable_keep_buffer_active: 0
gcode:
    # Runtime storage only.

[gcode_macro _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE]
description: Continue LOAD_FILAMENT after buffer capture/fill completes, then run POOP_PELLET_SHOOT cleanup
gcode:
    {% set s = printer["gcode_macro _LOAD_FILAMENT_CONTINUE_STATE"] %}

    {% set material = s.material|string %}
    {% set load_temp = s.load_temp|float %}
    {% set load_distance = s.load_distance|float %}
    {% set max_velocity = s.max_velocity|float %}
    {% set use_buffer_for_load = s.use_buffer_for_load|int %}

    _STATUS_MSG MSG="Loading {material} into hotend"
    _DEBUG_MSG MSG="LOAD_FILAMENT_CONTINUE: hotend load after capture/fill. material={material}, load_temp={load_temp}, load_distance={load_distance}, use_buffer={use_buffer_for_load}"

    M83
    G92 E0

    {% if use_buffer_for_load == 1 %}
        # Known E+ load move is synced directly so Buffer0 feeds with the hotend extruder.
        STOP_CENTER_BUFFER_0
        STOP_PERCENT_MOVE_BUFFER0
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
        BUFFER_SYNC_ON_0
    {% endif %}

    # Push filament from the toolhead sensor/load position into the hotend.
    # The actual purge and nozzle cleanup are handed off to POOP_PELLET_SHOOT.
    G1 E{load_distance} F{max_velocity}
    M400

    {% if use_buffer_for_load == 1 %}
        # Desync before handing off to the standalone poop macro.
        # POOP_PELLET_SHOOT owns its own buffer centering/sync/cleanup sequence.
        BUFFER_SYNC_OFF_0
        M400
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_print_only VALUE=1
    {% endif %}

    M117 {material} loaded - running poop purge
    _STATUS_MSG MSG="{material} loaded - running POOP_PELLET_SHOOT at {load_temp}C"
    _DEBUG_MSG MSG="LOAD_FILAMENT_CONTINUE: calling POOP_PELLET_SHOOT TEMP={load_temp}"

    # Restore caller state before starting the standalone poop macro.
    # This prevents load_state from being restored while POOP_PELLET_SHOOT is running delayed stages.
    RESTORE_GCODE_STATE NAME=load_state

    # Pass the material-selected load temp into the poop macro.
    # POOP_PELLET_SHOOT must honor TEMP= for this to affect its purge temperature.
    POOP_PELLET_SHOOT TEMP={load_temp}
    

#####################################################################
#                  Delayed Buffer Load Capture State Machine
#####################################################################

[gcode_macro _LOAD_CAPTURE_BUFFER_STATE]
description: Runtime state for delayed Buffer0 load capture
variable_active: 0
variable_step_index: 0
variable_step_distance: 10.0
variable_step_speed: 30.0
variable_step_accel: 300.0
variable_max_steps: 80
variable_fill_after_sensor: 1
variable_fill_percent: 100.0
variable_fill_step: 5.0
variable_fill_speed: 30.0
variable_fill_accel: 300.0
variable_fill_max_steps: 20
variable_fail_beeps: 3
gcode:
    # Runtime storage only.


[gcode_macro _LOAD_CAPTURE_BUFFER_START_ACTIVE_TOOL]
description: Start delayed Buffer0 feeler loop until active toolhead sensor detects filament
gcode:
    {% set step_distance = params.STEP_DISTANCE|default(10)|float %}
    {% set step_speed = params.STEP_SPEED|default(30)|float %}
    {% set step_accel = params.STEP_ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(80)|int %}
    {% set fill_after_sensor = params.FILL_AFTER_SENSOR|default(1)|int %}
    {% set fill_percent = params.FILL_PERCENT|default(100)|float %}
    {% set fill_step = params.FILL_STEP|default(5)|float %}
    {% set fill_speed = params.FILL_SPEED|default(30)|float %}
    {% set fill_accel = params.FILL_ACCEL|default(300)|float %}
    {% set fill_max_steps = params.FILL_MAX_STEPS|default(20)|int %}
    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}

    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_index VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_distance VALUE={step_distance}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_speed VALUE={step_speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_accel VALUE={step_accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=max_steps VALUE={max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_after_sensor VALUE={fill_after_sensor}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_percent VALUE={fill_percent}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_step VALUE={fill_step}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_speed VALUE={fill_speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_accel VALUE={fill_accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_max_steps VALUE={fill_max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fail_beeps VALUE={fail_beeps}

    UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_TICK DURATION=0.01


[delayed_gcode _LOAD_CAPTURE_BUFFER_TICK]
gcode:
    {% set st = printer["gcode_macro _LOAD_CAPTURE_BUFFER_STATE"] %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% set active = st.active|int %}
    {% set step_index = st.step_index|int %}
    {% set step_distance = st.step_distance|float %}
    {% set step_speed = st.step_speed|float %}
    {% set step_accel = st.step_accel|float %}
    {% set max_steps = st.max_steps|int %}
    {% set fill_after_sensor = st.fill_after_sensor|int %}
    {% set fill_percent = st.fill_percent|float %}
    {% set fill_step = st.fill_step|float %}
    {% set fill_speed = st.fill_speed|float %}
    {% set fill_accel = st.fill_accel|float %}
    {% set fill_max_steps = st.fill_max_steps|int %}
    {% set fail_beeps = st.fail_beeps|int %}

    {% if active == 1 %}
        {% if active_extruder == "extruder" %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        {% if toolhead_sensor|length == 0 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_CAPTURE_BUFFER: no toolhead filament sensor configured for " ~ active_extruder) }

        {% elif toolhead_sensor not in printer %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_CAPTURE_BUFFER: configured toolhead sensor not found: " ~ toolhead_sensor) }

        {% elif toolhead_detected == 1 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            _STATUS_MSG MSG="Toolhead sensor detected filament; filling Buffer0"
            _DEBUG_MSG MSG="LOAD_CAPTURE_BUFFER: toolhead sensor caught filament at step={step_index}; fill_after_sensor={fill_after_sensor}, fill_percent={fill_percent}"

            {% if fill_after_sensor == 1 %}
                _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL TARGET={fill_percent} STEP={fill_step} SPEED={fill_speed} ACCEL={fill_accel} MAX_STEPS={fill_max_steps}
            {% else %}
                _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE
            {% endif %}

        {% elif step_index >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_FILAMENT aborted: toolhead filament sensor never detected filament after Buffer0 capture steps. Not starting hotend load.") }

        {% else %}
            _DEBUG_MSG MSG="LOAD_CAPTURE_BUFFER: feeler step={step_index + 1}/{max_steps}, move={step_distance}mm, speed={step_speed}, accel={step_accel}"

            MOVE_BUFFER0 DISTANCE={step_distance} SPEED={step_speed} ACCEL={step_accel}
            M400

            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_index VALUE={step_index + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_TICK DURATION=0.01
        {% endif %}
    {% endif %}


[gcode_macro _LOAD_CAPTURE_BUFFER_FILL_STATE]
description: Runtime state for delayed Buffer0 fill after capture
variable_active: 0
variable_target: 100.0
variable_step: 5.0
variable_speed: 30.0
variable_accel: 300.0
variable_max_steps: 20
variable_step_index: 0
variable_tolerance: 1.0
gcode:
    # Runtime storage only.


[gcode_macro _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL]
description: Start delayed blocking fill of active tool buffer before hotend load
gcode:
    {% set target = params.TARGET|default(100)|float %}
    {% set step = params.STEP|default(5)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(20)|int %}
    {% set tolerance = params.TOLERANCE|default(1)|float %}

    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=accel VALUE={accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=max_steps VALUE={max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step_index VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=tolerance VALUE={tolerance}

    UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_FILL_TICK DURATION=0.01


[delayed_gcode _LOAD_CAPTURE_BUFFER_FILL_TICK]
gcode:
    {% set st = printer["gcode_macro _LOAD_CAPTURE_BUFFER_FILL_STATE"] %}
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}
    {% set active = st.active|int %}
    {% set target = st.target|float %}
    {% set step = st.step|float %}
    {% set speed = st.speed|float %}
    {% set accel = st.accel|float %}
    {% set max_steps = st.max_steps|int %}
    {% set step_index = st.step_index|int %}
    {% set tolerance = st.tolerance|float %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% if active == 1 %}
        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set pct = 0.0 %}
            {% set valid = 1 %}
        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set pct = 25.0 %}
            {% set valid = 1 %}
        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set pct = 50.0 %}
            {% set valid = 1 %}
        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set pct = 75.0 %}
            {% set valid = 1 %}
        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set pct = 100.0 %}
            {% set valid = 1 %}
        {% else %}
            {% set state = "INVALID" %}
            {% set pct = -1.0 %}
            {% set valid = 0 %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

        {% set error = target - pct %}
        {% set abs_error = error|abs %}

        {% if valid == 0 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _BEEP
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("Buffer0 fill before load stopped: invalid Hall state H3=" ~ h3 ~ " H2=" ~ h2 ~ " H1=" ~ h1) }

        {% elif abs_error <= tolerance or pct >= target %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _DEBUG_MSG MSG="Buffer0 fill before load complete: state={state}, current={pct}%, target={target}%"
            _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE

        {% elif step_index >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _BEEP
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("Buffer0 fill before load stopped: max steps reached. state=" ~ state ~ " current=" ~ pct ~ "% target=" ~ target ~ "%") }

        {% else %}
            {% if error > 0 %}
                {% set move_distance = step * move_sign %}
            {% else %}
                {% set move_distance = step * move_sign * -1 %}
            {% endif %}

            _DEBUG_MSG MSG="Buffer0 fill before load step {step_index + 1}/{max_steps}: state={state}, current={pct}%, target={target}%, move={move_distance}mm"

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
            M400

            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step_index VALUE={step_index + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_FILL_TICK DURATION=0.01
        {% endif %}
    {% endif %}


#####################################################################
#                  Unload Tip Forming Helper
#####################################################################

[gcode_macro _UNLOAD_TIP_FORM]
description: Optional tip-forming motion used by UNLOAD_FILAMENT

variable_enabled: 1
variable_filament_diameter: 1.75
variable_ramming_volume: 8.0
variable_ramming_speed: 25.0
variable_unloading_start_distance: 5.0
variable_unloading_speed_start: 80.0
variable_unloading_speed: 25.0
variable_cooling_tube_position: 30.0
variable_cooling_tube_length: 10.0
variable_initial_cooling_speed: 20.0
variable_final_cooling_speed: 80.0
variable_cooling_moves: 1
variable_use_skinnydip: 1
variable_skinnydip_distance: 10.0
variable_dip_insertion_speed: 20.0
variable_dip_extraction_speed: 30.0
variable_melt_zone_pause: 400
variable_cooling_zone_pause: 250

gcode:
    {% set v = printer["gcode_macro _UNLOAD_TIP_FORM"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

    {% set ramming_volume = params.RAMMING_VOLUME|default(v.ramming_volume)|float %}
    {% set ramming_speed = [params.RAMMING_SPEED|default(v.ramming_speed)|float, max_extrude_speed]|min %}
    {% set unloading_start_distance = params.UNLOADING_START_DISTANCE|default(v.unloading_start_distance)|float %}
    {% set unloading_speed_start = [params.UNLOADING_SPEED_START|default(v.unloading_speed_start)|float, max_extrude_speed]|min %}
    {% set unloading_speed = [params.UNLOADING_SPEED|default(v.unloading_speed)|float, max_extrude_speed]|min %}
    {% set cooling_tube_position = params.COOLING_TUBE_POSITION|default(v.cooling_tube_position)|float %}
    {% set cooling_tube_length = params.COOLING_TUBE_LENGTH|default(v.cooling_tube_length)|float %}
    {% set initial_cooling_speed = [params.INITIAL_COOLING_SPEED|default(v.initial_cooling_speed)|float, max_extrude_speed]|min %}
    {% set final_cooling_speed = [params.FINAL_COOLING_SPEED|default(v.final_cooling_speed)|float, max_extrude_speed]|min %}
    {% set cooling_moves = params.COOLING_MOVES|default(v.cooling_moves)|int %}
    {% set use_skinnydip = params.USE_SKINNYDIP|default(v.use_skinnydip)|int %}
    {% set skinnydip_distance = params.SKINNYDIP_DISTANCE|default(v.skinnydip_distance)|float %}
    {% set dip_insertion_speed = [params.DIP_INSERTION_SPEED|default(v.dip_insertion_speed)|float, max_extrude_speed]|min %}
    {% set dip_extraction_speed = [params.DIP_EXTRACTION_SPEED|default(v.dip_extraction_speed)|float, max_extrude_speed]|min %}
    {% set melt_zone_pause = params.MELT_ZONE_PAUSE|default(v.melt_zone_pause)|int %}
    {% set cooling_zone_pause = params.COOLING_ZONE_PAUSE|default(v.cooling_zone_pause)|int %}

    {% set filament_radius = v.filament_diameter|float / 2.0 %}
    {% set filament_area = 3.14159 * filament_radius * filament_radius %}
    {% set ramming_length = ramming_volume / filament_area %}
    {% set remaining_to_cooling = cooling_tube_position - unloading_start_distance %}

    _STATUS_MSG MSG="Tip forming filament"
    _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: ram={ramming_volume}mm3/{ramming_length|round(2)}mm, cooling_tube_position={cooling_tube_position}, cooling_tube_length={cooling_tube_length}, cooling_moves={cooling_moves}, skinnydip={use_skinnydip}"

    M83
    G92 E0
    M400

    {% if ramming_length > 0 %}
        G1 E{ramming_length} F{(ramming_speed * 60)|int}
        M400
    {% endif %}

    {% if unloading_start_distance > 0 %}
        G1 E-{unloading_start_distance} F{(unloading_speed_start * 60)|int}
        M400
    {% endif %}

    {% if remaining_to_cooling > 0 %}
        G1 E-{remaining_to_cooling} F{(unloading_speed * 60)|int}
        M400
    {% endif %}

    {% for i in range(cooling_moves) %}
        {% if i == 0 %}
            G1 E-{cooling_tube_length} F{(initial_cooling_speed * 60)|int}
        {% else %}
            G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        {% endif %}
        M400

        G1 E{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endfor %}

    {% if cooling_tube_length > 0 %}
        G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endif %}

    {% if use_skinnydip == 1 %}
        _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: skinny dip distance={skinnydip_distance}"
        G1 E{skinnydip_distance} F{(dip_insertion_speed * 60)|int}
        G4 P{melt_zone_pause}
        G1 E-{skinnydip_distance} F{(dip_extraction_speed * 60)|int}
        G4 P{cooling_zone_pause}
        M400
    {% endif %}


#####################################################################
#                  Buffer0 Current Helper
#####################################################################
# Purpose:
# - Optional current control for Buffer0 standalone retract/sync moves.
# - CURRENT=CONFIG restores the configured run_current from buffer0.cfg.
# - Macro name keeps the buffer number only at the very end.
#####################################################################

[gcode_macro _SET_CURRENT_BUFFER0]
description: Set Buffer0 TMC current or restore config current
gcode:
    {% set current = params.CURRENT|default("CONFIG")|string %}

    {% if "tmc2208 extruder_stepper buffer0_motor" in printer.configfile.settings %}
        {% set cfg_current = printer.configfile.settings["tmc2208 extruder_stepper buffer0_motor"].run_current|float %}
    {% elif "tmc2209 extruder_stepper buffer0_motor" in printer.configfile.settings %}
        {% set cfg_current = printer.configfile.settings["tmc2209 extruder_stepper buffer0_motor"].run_current|float %}
    {% else %}
        {% set cfg_current = 0.35 %}
    {% endif %}

    {% if current|upper == "CONFIG" %}
        SET_TMC_CURRENT STEPPER=buffer0_motor CURRENT={cfg_current}
        _DEBUG_MSG MSG="_SET_CURRENT_BUFFER0: restored config current={cfg_current}"
    {% else %}
        SET_TMC_CURRENT STEPPER=buffer0_motor CURRENT={current|float}
        _DEBUG_MSG MSG="_SET_CURRENT_BUFFER0: set current={current}"
    {% endif %}
#####################################################################
#                  Final Buffer Retract After Fresh Sensor Check
#####################################################################
# Purpose:
# - Reads the active toolhead filament sensor and buffer entrance sensor fresh.
# - Long Buffer0 rewind is allowed only when:
#   - hotend/toolhead sensor is clear
#   - buffer entrance sensor still detects filament
#
# Critical safety distinction:
# - FINAL_DISTANCE is for Buffer0 only.
# - FINAL_DISTANCE must never be used in a hotend G1 E move.
# - This macro does not change Buffer0 motor current.
#####################################################################

[gcode_macro _UNLOAD_FINAL_BUFFER_RETRACT_IF_CLEAR_FRESH]
description: Fresh sensor check, then run final long Buffer0 retract if filament is safely clear
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    {% set final_distance = params.FINAL_DISTANCE|default(0)|float %}
    {% set final_speed = params.FINAL_SPEED|default(50)|float %}
    {% set final_accel = params.FINAL_ACCEL|default(500)|float %}
    {% set final_settle = params.FINAL_SETTLE|default(1.0)|float %}

    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}
    {% set fail_beep_delay_ms = params.FAIL_BEEP_DELAY_MS|default(400)|int %}

    {% if active_extruder == "extruder" %}
        {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% set entrance_sensor = sensors.tool0_entrance_sensor|string %}
        {% set tool_name = "Tool0" %}
    {% elif active_extruder == "extruder1" %}
        {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% set entrance_sensor = sensors.tool1_entrance_sensor|string %}
        {% set tool_name = "Tool1" %}
    {% elif active_extruder == "extruder2" %}
        {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% set entrance_sensor = sensors.tool2_entrance_sensor|string %}
        {% set tool_name = "Tool2" %}
    {% elif active_extruder == "extruder3" %}
        {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% set entrance_sensor = sensors.tool3_entrance_sensor|string %}
        {% set tool_name = "Tool3" %}
    {% else %}
        {% set toolhead_sensor = "" %}
        {% set entrance_sensor = "" %}
        {% set tool_name = "UNKNOWN" %}
    {% endif %}

    {% set toolhead_sensor_valid = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer else 0 %}
    {% set entrance_sensor_valid = 1 if entrance_sensor|length > 0 and entrance_sensor in printer else 0 %}

    {% set toolhead_detected = 1 if toolhead_sensor_valid == 1 and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}
    {% set entrance_detected = 1 if entrance_sensor_valid == 1 and printer[entrance_sensor].filament_detected|int == 1 else 0 %}

    {% set final_time = (final_distance / final_speed) if (final_distance > 0 and final_speed > 0) else 0 %}

    {% if final_distance <= 0 %}
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: skipped because final Buffer0 rewind distance <= 0"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif toolhead_sensor_valid == 0 %}
        _STATUS_MSG MSG="Unload warning: toolhead sensor not configured/found"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: invalid toolhead_sensor={toolhead_sensor}; skipping final long Buffer0 rewind"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif entrance_sensor_valid == 0 %}
        _STATUS_MSG MSG="Unload warning: buffer entrance sensor not configured/found"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: invalid entrance_sensor={entrance_sensor}; skipping final long Buffer0 rewind"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif toolhead_detected == 1 %}
        _STATUS_MSG MSG="Unload failed: filament still detected at {tool_name}"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: toolhead_sensor={toolhead_sensor} still detects filament; final Buffer0-only rewind skipped"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif entrance_detected == 0 %}
        _STATUS_MSG MSG="Unload warning: buffer entrance no longer detects filament"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: entrance_sensor={entrance_sensor} is clear; final rewind skipped to avoid pulling air / wrong path"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% else %}
        _STATUS_MSG MSG="Toolhead clear and buffer entrance active - rewinding filament"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: tool={tool_name}, toolhead_detected={toolhead_detected}, entrance_detected={entrance_detected}, Buffer0-only rewind distance={final_distance}, speed={final_speed}, accel={final_accel}"

        # Service move safety:
        # - Auto buffer control must be off.
        # - Percent moves must be stopped.
        # - Sync must be off because this is Buffer0-only movement.
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
        STOP_PERCENT_MOVE_BUFFER0
        BUFFER_SYNC_OFF_0
        M400

        # Negative Buffer0 move pulls filament back toward the reel/spool.
        # This is Buffer0-only. Do not replace with G1 E-...
        MOVE_BUFFER0 DISTANCE={final_distance * -1} SPEED={final_speed} ACCEL={final_accel}
        M400

        {% if final_settle > 0 %}
            G4 P{(final_settle * 1000)|int}
        {% endif %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% endif %}


#####################################################################
#                  Final Unload Buffer Check Pull + Long Retract
#####################################################################
# Purpose:
# - After synced hotend/buffer unload finishes, pull Buffer0 back a short
#   distance to move filament fully into the PTFE/buffer path.
# - Then call a fresh sensor-check helper.
# - Long rewind only runs if:
#   - hotend/toolhead sensor is clear
#   - buffer entrance sensor still detects filament
#
# Critical safety distinction:
# - CHECK_PULL_DISTANCE is short Buffer0-only movement.
# - FINAL_DISTANCE is long Buffer0-only rewind.
# - Neither is a hotend G1 E move.
# - This macro does not change Buffer0 motor current.
#####################################################################

[gcode_macro _UNLOAD_RETRY_THEN_FINAL_BUFFER_RETRACT]
description: Pull Buffer0 back briefly, then fresh-check sensors and run final rewind if safe
gcode:
    {% set final_distance = params.FINAL_DISTANCE|default(0)|float %}
    {% set final_speed = params.FINAL_SPEED|default(50)|float %}
    {% set final_accel = params.FINAL_ACCEL|default(500)|float %}
    {% set final_settle = params.FINAL_SETTLE|default(1.0)|float %}

    {% set check_pull_distance = params.CHECK_PULL_DISTANCE|default(100)|float %}
    {% set check_pull_speed = params.CHECK_PULL_SPEED|default(35)|float %}
    {% set check_pull_accel = params.CHECK_PULL_ACCEL|default(300)|float %}
    {% set check_pull_settle = params.CHECK_PULL_SETTLE|default(0.5)|float %}

    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}
    {% set fail_beep_delay_ms = params.FAIL_BEEP_DELAY_MS|default(400)|int %}

    {% set check_pull_time = (check_pull_distance / check_pull_speed) if (check_pull_distance > 0 and check_pull_speed > 0) else 0 %}

    {% if final_distance <= 0 %}
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: skipped because final Buffer0 rewind distance <= 0"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% else %}
        #################################################################
        # Short Buffer0-only pull before final sensor check
        #
        # This pulls the released filament farther into the PTFE/buffer path
        # before deciding whether the long rewind is safe.
        #################################################################

        {% if check_pull_distance > 0 %}
            _STATUS_MSG MSG="Pulling filament into buffer path"
            _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: Buffer0-only check pull distance={check_pull_distance}, speed={check_pull_speed}, accel={check_pull_accel}"

            DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
            STOP_PERCENT_MOVE_BUFFER0
            BUFFER_SYNC_OFF_0
            M400

            # Negative Buffer0 move pulls filament back toward the reel/spool.
            MOVE_BUFFER0 DISTANCE={check_pull_distance * -1} SPEED={check_pull_speed} ACCEL={check_pull_accel}
            M400

            {% if check_pull_settle > 0 %}
                G4 P{((check_pull_time + check_pull_settle) * 1000)|int}
            {% endif %}
        {% endif %}

        #################################################################
        # Fresh sensor check happens in a separate macro call.
        #
        # Klipper/Jinja evaluates sensor state when this next macro starts,
        # after the queued Buffer0 check pull above has completed.
        #################################################################

        _UNLOAD_FINAL_BUFFER_RETRACT_IF_CLEAR_FRESH FINAL_DISTANCE={final_distance} FINAL_SPEED={final_speed} FINAL_ACCEL={final_accel} FINAL_SETTLE={final_settle} FAIL_BEEPS={fail_beeps} FAIL_BEEP_DELAY_MS={fail_beep_delay_ms}
    {% endif %}


#####################################################################
#                  Unload Filament
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active tool using synced Buffer0 assist, then Buffer0-only rewind if safe

#####################################################################
# Material temperature profiles
#####################################################################

variable_default_material: "PETG"          # Default material if MATERIAL= / FILAMENT= is not passed.
variable_default_filament: "PETG"          # Legacy alias; keep matched to default_material.

variable_pla_unload_temp: 200              # PLA unload/tip-form temp.
variable_petg_unload_temp: 215             # PETG unload/tip-form temp.
variable_tpu_unload_temp: 205              # TPU unload temp.
variable_abs_unload_temp: 230              # ABS unload/tip-form temp.
variable_asa_unload_temp: 230              # ASA unload/tip-form temp.
variable_default_unload_temp: 210          # Fallback temp for unknown material.
variable_unload_temp_window: 2             # Allowed +/- temp window before unload continues.

#####################################################################
# Pre-unload melt-zone cool-down
#####################################################################

variable_pre_unload_cool_enabled: 1        # 1 = cool before reheating to unload temp.
variable_pre_unload_cool_temp: 160         # Cool-down target before reheating.
variable_pre_unload_cool_window: 3         # Cool wait allows nozzle this many C above target.
variable_pre_unload_cool_soak: 30          # Seconds to soak after cooling before reheating.

#####################################################################
# Hotend unload motion
#####################################################################

variable_push_distance: 3                  # Basic-mode forward push before retract.
variable_retract_distance: 220             # Basic-mode total hotend retract distance.
variable_push_speed: 5                     # Basic-mode push speed in mm/s.
variable_neck_retract_distance: 20         # Basic-mode first controlled retract distance.
variable_neck_retract_speed: 35            # Basic-mode neck retract speed in mm/s.
variable_retract_speed: 80                 # Basic-mode remaining retract speed in mm/s.
variable_move_to_bucket: 1                 # 1 = move over purge/poop bucket before heat/unload.

#####################################################################
# Buffer centering before sync
#####################################################################

variable_center_buffer_enabled: 1          # 1 = run CENTER_BUFFER_0 before syncing Buffer0 to hotend motion.
variable_center_buffer_speed: 20           # Speed passed to CENTER_BUFFER_0.
variable_center_buffer_accel: 300          # Accel passed to CENTER_BUFFER_0.
variable_center_buffer_max_steps: 120      # Max steps passed to CENTER_BUFFER_0.
variable_center_buffer_settle: 3.0         # Extra wait after centering; useful if CENTER_BUFFER_0 uses delayed movement.

#####################################################################
# Tip-form synced unload motion
#####################################################################

variable_tipform_final_retract_distance: 300 # Final synced hotend retract distance after _UNLOAD_TIP_FORM.
variable_tipform_final_retract_speed: 80     # Final synced hotend retract speed in mm/s.
variable_sync_lead_time: 0.20                # Seconds after BUFFER_SYNC_ON_0 before E motion begins.
variable_sync_settle: 0.25                   # Seconds after E motion before BUFFER_SYNC_OFF_0.

#####################################################################
# Buffer-only check pull before final long rewind
#####################################################################

variable_buffer_check_pull_distance: 100   # Short Buffer0-only pull before checking sensors.
variable_buffer_check_pull_speed: 35       # Speed for short Buffer0-only pull.
variable_buffer_check_pull_accel: 300      # Accel for short Buffer0-only pull.
variable_buffer_check_pull_settle: 0.5     # Extra wait after short Buffer0-only pull before fresh sensor check.

#####################################################################
# Final buffer-only retract after hotend unload
#####################################################################

variable_final_buffer_retract_enabled: 1   # 1 = run long Buffer0 rewind if sensors confirm safe state.
variable_final_buffer_retract_distance: 2000 # Long Buffer0-only rewind back toward roll/spool.
variable_final_buffer_retract_speed: 50    # Speed for long Buffer0-only rewind.
variable_final_buffer_retract_accel: 500   # Accel for long Buffer0-only rewind.
variable_final_buffer_retract_settle: 1.0  # Extra wait after long Buffer0-only rewind.

variable_final_buffer_fail_beeps: 3        # Beep count if long rewind is skipped.
variable_final_buffer_fail_beep_delay_ms: 400 # Delay between failure beeps.

gcode:
    {% set speed = params.SPEED|default(50)|float %}
    {% set tip_v = printer["gcode_macro _UNLOAD_TIP_FORM"] %}
    {% set tip_form_enabled = params.TIP_FORM|default(tip_v.enabled)|int %}

    #################################################################
    # KlipperScreen material prompt
    #################################################################

    {% set material_prompt_needed = params.MATERIAL is not defined and params.FILAMENT is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to unload."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_UNLOAD_MATERIAL MATERIAL=PLA SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_UNLOAD_MATERIAL MATERIAL=PETG SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_UNLOAD_MATERIAL MATERIAL=TPU SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_UNLOAD_MATERIAL MATERIAL=ABS SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}
        {% set load_v = printer["gcode_macro LOAD_FILAMENT"] %}
        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}
        {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
        {% set direct_feed_override = params.DIRECT_FEED|default(0)|int %}

        #################################################################
        # Active tool sensor mapping
        #################################################################

        {% if active_extruder == "extruder" %}
            {% set buffer_entrance_sensor = sensors.tool0_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set buffer_entrance_sensor = sensors.tool1_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set buffer_entrance_sensor = sensors.tool2_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set buffer_entrance_sensor = sensors.tool3_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set buffer_entrance_sensor = "" %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set buffer_entrance_detected = 1 if buffer_entrance_sensor|length > 0 and buffer_entrance_sensor in printer and printer[buffer_entrance_sensor].filament_detected|int == 1 else 0 %}
        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        # Entrance wins. Buffer mode is used only when the entrance sensor is live.
        {% set use_buffer_for_unload = 1 if direct_feed_override == 0 and buffer_entrance_detected == 1 else 0 %}
        {% set use_direct_feed_for_unload = 1 if direct_feed_override == 1 or (buffer_entrance_detected == 0 and toolhead_detected == 1) else 0 %}

        #################################################################
        # Material selection
        #################################################################

        {% if params.MATERIAL is defined %}
            {% set material = params.MATERIAL|upper|string %}
        {% elif params.FILAMENT is defined %}
            {% set material = params.FILAMENT|upper|string %}
        {% else %}
            {% set material = default_material|upper|string %}
        {% endif %}

        {% if material in ["PLA", "PLA+"] %}
            {% set material_unload_temp = pla_unload_temp|float %}
        {% elif material in ["PETG", "PET"] %}
            {% set material_unload_temp = petg_unload_temp|float %}
        {% elif material in ["TPU", "TPE"] %}
            {% set material_unload_temp = tpu_unload_temp|float %}
        {% elif material == "ABS" %}
            {% set material_unload_temp = abs_unload_temp|float %}
        {% elif material == "ASA" %}
            {% set material_unload_temp = asa_unload_temp|float %}
        {% else %}
            {% set material_unload_temp = default_unload_temp|float %}
        {% endif %}

        {% set unload_temp = params.TEMP|default(material_unload_temp)|float %}
        {% set unload_temp_window = params.TEMP_WINDOW|default(unload_temp_window)|float %}
        {% set unload_temp_min = unload_temp - unload_temp_window %}
        {% set unload_temp_max = unload_temp + unload_temp_window %}

        #################################################################
        # Parameter overrides
        #################################################################

        {% set pre_unload_cool_enabled = params.PRE_UNLOAD_COOL|default(pre_unload_cool_enabled)|int %}
        {% set pre_unload_cool_temp = params.PRE_UNLOAD_COOL_TEMP|default(pre_unload_cool_temp)|float %}
        {% set pre_unload_cool_window = params.PRE_UNLOAD_COOL_WINDOW|default(pre_unload_cool_window)|float %}
        {% set pre_unload_cool_soak = params.PRE_UNLOAD_COOL_SOAK|default(pre_unload_cool_soak)|float %}
        {% set pre_unload_cool_max = pre_unload_cool_temp + pre_unload_cool_window %}

        {% set push_distance = params.PUSH_DISTANCE|default(push_distance)|float %}
        {% set retract_distance = params.RETRACT_DISTANCE|default(retract_distance)|float %}
        {% set push_speed = [params.PUSH_SPEED|default(push_speed)|float, max_extrude_speed]|min %}
        {% set neck_retract_distance = params.NECK_RETRACT_DISTANCE|default(neck_retract_distance)|float %}
        {% set neck_retract_speed = [params.NECK_RETRACT_SPEED|default(neck_retract_speed)|float, max_extrude_speed]|min %}
        {% set retract_speed = [params.RETRACT_SPEED|default(retract_speed)|float, max_extrude_speed]|min %}
        {% set final_retract_distance = [retract_distance - neck_retract_distance, 0]|max %}
        {% set move_to_bucket = params.MOVE_TO_BUCKET|default(move_to_bucket)|int %}

        {% set center_buffer_enabled = params.CENTER_BUFFER|default(center_buffer_enabled)|int %}
        {% set center_buffer_speed = params.CENTER_BUFFER_SPEED|default(center_buffer_speed)|float %}
        {% set center_buffer_accel = params.CENTER_BUFFER_ACCEL|default(center_buffer_accel)|float %}
        {% set center_buffer_max_steps = params.CENTER_BUFFER_MAX_STEPS|default(center_buffer_max_steps)|int %}
        {% set center_buffer_settle = params.CENTER_BUFFER_SETTLE|default(center_buffer_settle)|float %}

        {% set tipform_final_retract_distance = params.TIPFORM_FINAL_RETRACT_DISTANCE|default(tipform_final_retract_distance)|float %}
        {% set tipform_final_retract_speed = [params.TIPFORM_FINAL_RETRACT_SPEED|default(tipform_final_retract_speed)|float, max_extrude_speed]|min %}
        {% set sync_lead_time = params.SYNC_LEAD_TIME|default(sync_lead_time)|float %}
        {% set sync_settle = params.SYNC_SETTLE|default(sync_settle)|float %}

        {% set buffer_check_pull_distance = params.BUFFER_CHECK_PULL_DISTANCE|default(buffer_check_pull_distance)|float %}
        {% set buffer_check_pull_speed = params.BUFFER_CHECK_PULL_SPEED|default(buffer_check_pull_speed)|float %}
        {% set buffer_check_pull_accel = params.BUFFER_CHECK_PULL_ACCEL|default(buffer_check_pull_accel)|float %}
        {% set buffer_check_pull_settle = params.BUFFER_CHECK_PULL_SETTLE|default(buffer_check_pull_settle)|float %}

        {% set bucket_x = params.BUCKET_X|default(load_v.purge_bucket_x)|float %}
        {% set bucket_y = params.BUCKET_Y|default(load_v.purge_bucket_y)|float %}
        {% set bucket_z = params.BUCKET_Z|default(load_v.purge_bucket_z)|float %}
        {% set travel_speed = params.TRAVEL_SPEED|default(load_v.travel_speed)|float %}
        {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(load_v.z_travel_speed)|float %}

        {% set final_buffer_retract_enabled = params.FINAL_BUFFER_RETRACT|default(final_buffer_retract_enabled)|int %}
        {% set final_buffer_retract_distance = params.FINAL_BUFFER_RETRACT_DISTANCE|default(final_buffer_retract_distance)|float %}
        {% set final_buffer_retract_speed = params.FINAL_BUFFER_RETRACT_SPEED|default(final_buffer_retract_speed)|float %}
        {% set final_buffer_retract_accel = params.FINAL_BUFFER_RETRACT_ACCEL|default(final_buffer_retract_accel)|float %}
        {% set final_buffer_retract_settle = params.FINAL_BUFFER_RETRACT_SETTLE|default(final_buffer_retract_settle)|float %}
        {% set do_final_buffer_retract = final_buffer_retract_enabled == 1 and final_buffer_retract_distance > 0 and use_buffer_for_unload == 1 %}

        {% set final_buffer_fail_beeps = params.FINAL_BUFFER_FAIL_BEEPS|default(final_buffer_fail_beeps)|int %}
        {% set final_buffer_fail_beep_delay_ms = params.FINAL_BUFFER_FAIL_BEEP_DELAY_MS|default(final_buffer_fail_beep_delay_ms)|int %}

        #################################################################
        # Safety gates
        #################################################################

        {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
            { action_respond_info("UNLOAD_FILAMENT disabled while actively printing.") }

        {% elif use_buffer_for_unload == 0 and use_direct_feed_for_unload == 0 %}
            _BEEP
            { action_raise_error("UNLOAD_FILAMENT: no filament detected at buffer entrance or toolhead sensor.") }

        {% else %}
            _STATUS_MSG MSG="Unloading {material}"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: active_extruder={active_extruder}, material={material}, unload_temp={unload_temp}, tip_form={tip_form_enabled}, buffer_sensor={buffer_entrance_sensor}, buffer_detected={buffer_entrance_detected}, toolhead_sensor={toolhead_sensor}, toolhead_detected={toolhead_detected}, use_buffer={use_buffer_for_unload}, use_direct_feed={use_direct_feed_for_unload}, final_rewind={final_buffer_retract_distance}"

            M117 Unloading {material}
            SAVE_GCODE_STATE NAME=unload_state

            #################################################################
            # 1. Home
            #################################################################

            _STATUS_MSG MSG="Homing before unload"
            _CG28

            #################################################################
            # 2. Move over poop/purge bucket before heating
            #################################################################

            {% if move_to_bucket == 1 %}
                _STATUS_MSG MSG="Moving to purge bucket"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: bucket_x={bucket_x}, bucket_y={bucket_y}, bucket_z={bucket_z}, travel_speed={travel_speed}, z_travel_speed={z_travel_speed}"
                G90
                G1 Z{bucket_z} F{z_travel_speed}
                G1 X{bucket_x} F{travel_speed}
                G1 Y{bucket_y} F{travel_speed}
            {% endif %}

            #################################################################
            # 3. Prepare Buffer0 service state
            #################################################################

            {% if use_buffer_for_unload == 1 %}
                _STATUS_MSG MSG="Preparing Buffer0"
                STOP_CENTER_BUFFER_0
                DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
                STOP_PERCENT_MOVE_BUFFER0
                BUFFER_SYNC_OFF_0
                M400
            {% else %}
                _STATUS_MSG MSG="Direct-feed unload mode - buffer ignored"
                BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
            {% endif %}

            #################################################################
            # 4. Start temperature staging while already over bucket
            #################################################################

            {% if pre_unload_cool_enabled == 1 %}
                _STATUS_MSG MSG="Cooling nozzle before unload"
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={pre_unload_cool_temp}
            {% else %}
                _STATUS_MSG MSG="Heating nozzle for unload"
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}
            {% endif %}

            #################################################################
            # 5. Center Buffer0 before sync
            #################################################################

            {% if center_buffer_enabled == 1 and use_buffer_for_unload == 1 %}
                _STATUS_MSG MSG="Centering Buffer0"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: CENTER_BUFFER_0 SPEED={center_buffer_speed}, ACCEL={center_buffer_accel}, MAX_STEPS={center_buffer_max_steps}, SETTLE={center_buffer_settle}"

                CENTER_BUFFER_0 SPEED={center_buffer_speed} ACCEL={center_buffer_accel} MAX_STEPS={center_buffer_max_steps}
                M400

                {% if center_buffer_settle > 0 %}
                    G4 P{(center_buffer_settle * 1000)|int}
                {% endif %}
            {% endif %}

            #################################################################
            # 6. Finish temperature staging
            #################################################################

            {% if pre_unload_cool_enabled == 1 %}
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: cooling {active_extruder} to <= {pre_unload_cool_max}C before reheating to {unload_temp}C"
                TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={pre_unload_cool_max}

                {% if pre_unload_cool_soak > 0 %}
                    _STATUS_MSG MSG="Soaking cooled melt zone"
                    G4 P{(pre_unload_cool_soak * 1000)|int}
                {% endif %}

                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}
            {% endif %}

            _STATUS_MSG MSG="Waiting for unload temp"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: waiting for {active_extruder} to reach {unload_temp_min}-{unload_temp_max}C"
            TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={unload_temp_min} MAXIMUM={unload_temp_max}

            _BEEP
            M83
            G92 E0
            M400

            #################################################################
            # 7. Sync motors, tip form, and unload
            #
            # Buffer0 follows hotend E motion during tip forming and final
            # unload. This removes separate current/tension tricks.
            #################################################################

            {% if use_buffer_for_unload == 1 %}
                _STATUS_MSG MSG="Syncing Buffer0"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: BUFFER_SYNC_ON_0 before unload motion"
                BUFFER_SYNC_ON_0

                {% if sync_lead_time > 0 %}
                    G4 P{(sync_lead_time * 1000)|int}
                {% endif %}
            {% endif %}

            {% if tip_form_enabled == 1 %}
                _STATUS_MSG MSG="Tip forming filament"
                _UNLOAD_TIP_FORM {rawparams}

                {% if tipform_final_retract_distance > 0 %}
                    _STATUS_MSG MSG="Final synced unload retract"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: tipform_final_retract_distance={tipform_final_retract_distance}, tipform_final_retract_speed={tipform_final_retract_speed}"
                    G1 E-{tipform_final_retract_distance} F{(tipform_final_retract_speed * 60)|int}
                    M400
                {% endif %}

            {% else %}
                {% if push_distance > 0 %}
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: basic push_distance={push_distance}, push_speed={push_speed}"
                    G1 E{push_distance} F{(push_speed * 60)|int}
                    M400
                {% endif %}

                {% if neck_retract_distance > 0 %}
                    _STATUS_MSG MSG="Necking filament"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: neck_retract_distance={neck_retract_distance}, neck_retract_speed={neck_retract_speed}"
                    G1 E-{neck_retract_distance} F{(neck_retract_speed * 60)|int}
                    M400
                {% endif %}

                {% if final_retract_distance > 0 %}
                    _STATUS_MSG MSG="Retracting from hotend"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: final_retract_distance={final_retract_distance}, retract_speed={retract_speed}"
                    G1 E-{final_retract_distance} F{(retract_speed * 60)|int}
                    M400
                {% endif %}
            {% endif %}

            #################################################################
            # 8. Unsync motors
            #################################################################

            {% if use_buffer_for_unload == 1 %}
                {% if sync_settle > 0 %}
                    G4 P{(sync_settle * 1000)|int}
                {% endif %}

                _STATUS_MSG MSG="Unsyncing Buffer0"
                BUFFER_SYNC_OFF_0
                M400
            {% endif %}

            #################################################################
            # 9. Buffer0-only pullback, then sensor-gated final rewind
            #################################################################

            {% if do_final_buffer_retract %}
                _UNLOAD_RETRY_THEN_FINAL_BUFFER_RETRACT FINAL_DISTANCE={final_buffer_retract_distance} FINAL_SPEED={final_buffer_retract_speed} FINAL_ACCEL={final_buffer_retract_accel} FINAL_SETTLE={final_buffer_retract_settle} CHECK_PULL_DISTANCE={buffer_check_pull_distance} CHECK_PULL_SPEED={buffer_check_pull_speed} CHECK_PULL_ACCEL={buffer_check_pull_accel} CHECK_PULL_SETTLE={buffer_check_pull_settle} FAIL_BEEPS={final_buffer_fail_beeps} FAIL_BEEP_DELAY_MS={final_buffer_fail_beep_delay_ms}
            {% elif use_buffer_for_unload == 1 %}
                BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
            {% endif %}

            M117 {material} unload complete
            _STATUS_MSG MSG="{material} unload complete"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: complete"
            _BEEP

            RESTORE_GCODE_STATE NAME=unload_state
        {% endif %}
    {% endif %}
