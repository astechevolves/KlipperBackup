#####################################################################
#                  Purge Model Cleaning Routine
#####################################################################
# Purpose:
# - Service/manual purge routine for LOAD_FILAMENT / UNLOAD_FILAMENT workflows.
# - Probes at the center of the small purge model, prints it as a nozzle-cleaning purge,
#   knocks/wipes it toward the purge bucket, and parks back over the bucket.
#
# Source:
# - Generated from uploaded OrcaSlicer G-code: Pasted text.txt
# - Removed PRINT_START / PRINT_END / temp commands / progress commands / object exclusion / thumbnails.
# - Removed slicer SET_VELOCITY_LIMIT overrides so this routine does not leave printer accel changed.
# - Kept movement, extrusion resets, retractions/wipes, Z spiral movement, and M106 fan commands.
# - Removed the initial slicer M106 S0 so variable_spiral_fan can turn cooling on immediately.
#
# Call manually or from a load/unload macro with:
#   PURGE_MODEL_CLEAN_0
#####################################################################

[gcode_macro PURGE_MODEL_CLEAN_0]
description: Print purge model for filament service, wipe it into bucket, and park over bucket
variable_model_center_x:       283.244       # Center of the sliced purge model footprint
variable_model_center_y:        62.305       # Center of the sliced purge model footprint
variable_probe_clearance_z:     10.0         # Safe Z used before moving to the probe point
variable_safe_travel_z:         25.0         # Safe Z used when moving around after the model is printed
variable_bucket_x:             310.0         # Purge bucket / poop bucket X position
variable_bucket_y:               0.0         # Purge bucket / poop bucket Y position
variable_bucket_park_z:         20.0         # Final Z park height over the bucket
variable_knock_z:                1.0         # Z height used to catch/push the purge model off the bed
variable_knock_start_y_offset:   8.0         # Starts each shove behind the purge model before pushing toward the bucket
variable_knock_passes:           3           # Number of shove passes toward the bucket
variable_knock_speed:         3000.0         # XY feedrate for knocking the purge model loose
variable_travel_speed:       12000.0         # XY feedrate for non-contact travel moves
variable_z_speed:             1500.0         # Z feedrate for lifts/drops
variable_spiral_fan:           255           # Fan speed before starting the purge model
variable_fan_off_after:          1           # Turns part cooling fan off after wipe/park when set to 1
gcode:
    SAVE_GCODE_STATE NAME=purge_model_clean_0

    # Absolute XY/Z keeps the fixed purge model and wipe path deterministic.
    G90

    # Relative extrusion matches the uploaded OrcaSlicer output.
    M83

    # Home only if needed before moving to the purge model area.
    _CG28

    # Lift before moving across the bed so the nozzle cannot drag.
    G1 Z{variable_probe_clearance_z} F{variable_z_speed}

    # Move to the purge model center so the local Z reference matches this tiny footprint.
    G1 X{variable_model_center_x} Y{variable_model_center_y} F{variable_travel_speed}

    # Single-point Z reference for this cleaning object only.
    _PURGE_MODEL_SINGLE_POINT_PROBE_0

    # Reset extrusion before the service purge object starts.
    G92 E0

    # Force fan on before the object starts; the embedded model still keeps slicer M106 changes.
    M106 S{variable_spiral_fan}

    # Print the stripped movement-only purge model.
    _PRINT_PURGE_MODEL_0

    # Make sure all model motion is complete before trying to shove it into the bucket.
    M400

    # Knock/wipe the printed purge model toward the bucket and park over the bucket.
    _WIPE_PURGE_MODEL_TO_BUCKET_0

    # Leave fan off after the cleaning routine unless explicitly disabled above.
    {% if variable_fan_off_after|int == 1 %}
        M106 S0
    {% endif %}

    # Restore caller coordinate/extrusion modes without moving away from the bucket park position.
    RESTORE_GCODE_STATE NAME=purge_model_clean_0 MOVE=0


[gcode_macro _PURGE_MODEL_SINGLE_POINT_PROBE_0]
description: Single-point Z reference at purge model center
gcode:
    # Default behavior: assumes G28 Z probes/homes Z at the current XY location.
    # If safe_z_home or homing_override moves elsewhere, replace this helper body
    # with the correct Cartographer/tool-probe single-point Z command.
    G28 Z


[gcode_macro _WIPE_PURGE_MODEL_TO_BUCKET_0]
description: Knock purge model loose and push it into the purge bucket
gcode:
    {% set p = printer["gcode_macro PURGE_MODEL_CLEAN_0"] %}
    {% set passes = p.knock_passes|int %}
    {% set start_y = (p.model_center_y|float) + (p.knock_start_y_offset|float) %}

    # Absolute positioning keeps the wipe path repeatable and easy to audit.
    G90

    {% for i in range(passes) %}
        # Start slightly behind the model, then drop down to catch it near the base.
        G1 Z{p.safe_travel_z} F{p.z_speed}
        G1 X{p.model_center_x} Y{start_y} F{p.travel_speed}
        G1 Z{p.knock_z} F{p.z_speed}

        # Sweep through the model center and continue toward the bucket.
        G1 X{p.model_center_x} Y{p.model_center_y} F{p.knock_speed}
        G1 X{p.bucket_x} Y{p.bucket_y} F{p.knock_speed}
    {% endfor %}

    # End parked over the bucket so any remaining ooze/stringing lands where it belongs.
    G1 Z{p.safe_travel_z} F{p.z_speed}
    G1 X{p.bucket_x} Y{p.bucket_y} F{p.travel_speed}
    G1 Z{p.bucket_park_z} F{p.z_speed}


