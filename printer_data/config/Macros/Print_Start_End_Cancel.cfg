[gcode_macro PRINT_START]
description: Beacon print start with requested-tool filament check, Beacon homing/QGL/mesh, clean all used print tools, buffer auto, and purge line

# --- Purge bucket / brush staging ---
variable_bucket_entry_x:   310
variable_bucket_y:         1.0
variable_bucket_exit_y:    50
variable_bucket_z:         5
variable_bucket_spd_xy:    9000
variable_bucket_spd_z:     1500

# --- Beacon / mesh prep ---
variable_mesh_nozzle_temp: 160         # If a hot tool is parked or cleaned before print, lower its target to this standby temp.

# --- Buffer behavior ---
variable_buffer_auto_before_purge: 1   # 1 = return all installed buffers to AUTO before purge/print.

gcode:
  {% set TOOL = params.TOOL | default(0) | int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set MESH_NOZZLE_TEMP = params.MESH_NOZZLE_TEMP | default(mesh_nozzle_temp) | int %}
  {% set BUFFER_AUTO = params.BUFFER_AUTO | default(buffer_auto_before_purge) | int %}
  {% set DIRECT_FEED = params.DIRECT_FEED | default(0) | int %}

  # Pull tool/sensor info from the central buffer/tool map.
  # This keeps _BUFFER_USAGE_STATE as the single source of truth for sensor names.
  {% set buffer_state = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

  # Clear the previous print's monitored sensor set before this PRINT_START
  # decides which slicer-used tools should be armed.
  _DISABLE_TOOLHEAD_FILAMENT_SENSORS

  {% if TOOL == 0 %}
    {% set tool_extruder = "extruder" %}
  {% elif TOOL == 1 %}
    {% set tool_extruder = "extruder1" %}
  {% elif TOOL == 2 %}
    {% set tool_extruder = "extruder2" %}
  {% elif TOOL == 3 %}
    {% set tool_extruder = "extruder3" %}
  {% elif TOOL == 4 %}
    {% set tool_extruder = "extruder4" %}
  {% else %}
    {% set tool_extruder = "extruder" %}
  {% endif %}

  {% set starting_extruder = printer.toolhead.extruder|string %}

  #####################################################################
  # Build used-tool clean order.
  #
  # USED_TOOLS is expected from the slicer and may be formatted like:
  #   0,1
  #   T0,T1
  #   [0,1]
  #
  # The requested starting TOOL is intentionally removed from the early
  # portion of the order, then appended last so LINE_PURGE uses the first
  # print tool immediately after its final wipe.
  #####################################################################

  {% set USED_TOOLS_RAW = params.USED_TOOLS | default("") | string %}
  {% if USED_TOOLS_RAW|trim|length == 0 %}
    {% set USED_TOOLS_RAW = TOOL|string %}
  {% endif %}

  {% set used_tools_normalized = USED_TOOLS_RAW|replace("["," ")|replace("]"," ")|replace("("," ")|replace(")"," ")|replace("{"," ")|replace("}"," ")|replace(","," ")|replace(";"," ")|replace("|"," ")|replace("T"," ")|replace("t"," ")|replace("'"," ")|replace('"'," ") %}
  {% set tool_order = namespace(clean_order="", seen=",") %}

  {% for token in used_tools_normalized.split() %}
    {% if token in ["0", "1", "2", "3", "4"] %}
      {% set parsed_tool = token|int %}
      {% set parsed_marker = "," ~ parsed_tool|string ~ "," %}

      {% if parsed_tool != TOOL and parsed_marker not in tool_order.seen %}
        {% set tool_order.clean_order = tool_order.clean_order ~ parsed_tool|string ~ "," %}
        {% set tool_order.seen = tool_order.seen ~ parsed_tool|string ~ "," %}
      {% endif %}
    {% endif %}
  {% endfor %}

  {% set tool_order.clean_order = tool_order.clean_order ~ TOOL|string %}

  #####################################################################
  # Validate filament sensors for every slicer-reported used print tool.
  #
  # This expands the old single-tool check. If the print is going to use a
  # tool, fail early before heating, wiping, or handing off to print motion.
  #####################################################################

  {% set sensor_check = namespace(blocked=0) %}

  {% for check_token in tool_order.clean_order.split(",") %}
    {% if check_token|length > 0 %}
      {% set check_tool = check_token|int %}
      {% set check_sensor_key = "tool" ~ check_tool ~ "_hotend_sensor" %}
      {% set check_sensor = buffer_state[check_sensor_key] | default("") | string %}

      {% if check_sensor|length == 0 %}
        RESPOND TYPE=error MSG="PRINT_START blocked: no hotend filament sensor configured for T{check_tool} in _BUFFER_USAGE_STATE"
        {% set sensor_check.blocked = 1 %}

      {% elif check_sensor not in printer %}
        RESPOND TYPE=error MSG="PRINT_START blocked: configured sensor '{check_sensor}' for T{check_tool} does not exist"
        {% set sensor_check.blocked = 1 %}

      {% elif not printer[check_sensor].filament_detected %}
        RESPOND TYPE=error MSG="PRINT_START blocked: no filament detected in T{check_tool} hotend sensor '{check_sensor}'"
        {% set sensor_check.blocked = 1 %}

      {% else %}
        RESPOND TYPE=command MSG="PRINT_START: filament detected in T{check_tool} using {check_sensor}"
      {% endif %}
    {% endif %}
  {% endfor %}

  {% if sensor_check.blocked %}
    M117 Used-tool sensor failed
    PAUSE

  {% else %}
    RESPOND TYPE=command MSG="PRINT_START: used-tool clean order is {tool_order.clean_order}; T{TOOL} cleans last before LINE_PURGE."

    # Arm runout monitoring only for slicer-used tools.
    # If a used tool goes empty while parked, that is a real fault.
    # Empty unused tools stay ignored.
    _SET_USED_TOOL_FILAMENT_SENSORS USED_TOOLS="{tool_order.clean_order}"

    

    #####################################################################
    # Warm all slicer-reported used tools to standby temp early.
    #
    # This happens only after filament sensor validation passes. It reduces
    # the wait time later when each used tool is selected for cleaning, while
    # keeping parked tools cool enough to limit PETG ooze in the docks.
    #
    # MESH_NOZZLE_TEMP is reused as the standby/pre-clean target so there is
    # one existing knob for parked-tool prep temperature.
    #####################################################################

    {% if MESH_NOZZLE_TEMP > 0 %}
      M117 Warming used tools
      RESPOND TYPE=command MSG="PRINT_START: warming used tools {tool_order.clean_order} to standby target {MESH_NOZZLE_TEMP}C."

      {% for warm_token in tool_order.clean_order.split(",") %}
        {% if warm_token|length > 0 %}
          {% set warm_tool = warm_token|int %}

          {% if warm_tool == 0 %}
            {% set warm_extruder = "extruder" %}
          {% elif warm_tool == 1 %}
            {% set warm_extruder = "extruder1" %}
          {% elif warm_tool == 2 %}
            {% set warm_extruder = "extruder2" %}
          {% elif warm_tool == 3 %}
            {% set warm_extruder = "extruder3" %}
          {% elif warm_tool == 4 %}
            {% set warm_extruder = "extruder4" %}
          {% else %}
            {% set warm_extruder = "" %}
          {% endif %}

          {% if warm_extruder|length > 0 and warm_extruder in printer %}
            RESPOND TYPE=command MSG="PRINT_START: setting T{warm_tool} / {warm_extruder} standby target to {MESH_NOZZLE_TEMP}C."
            SET_HEATER_TEMPERATURE HEATER={warm_extruder} TARGET={MESH_NOZZLE_TEMP}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    
    M117 Starting print
    _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS

    #####################################################################
    # Toolhead LED print-use indication.
    #
    # Logos stay static tool identity colors.
    # Nozzle LEDs:
    #   - white for T0 and slicer-reported used print tools
    #   - static/logo color for idle tools
    # Top-hat LEDs remain the machine status indicator.
    #####################################################################

    SET_TOOLHEADS_STATIC
    _PRINT_START_TOOL_NOZZLE_STATE TOOL={TOOL} USED_TOOLS="{params.USED_TOOLS|default('')}"

    #####################################################################
    # Disable crash detection during homing/probing if StealthChanger probe
    # crash detection is available.
    #####################################################################

    {% if printer.tool_probe_endstop is defined %}
      M117 Disabling crash detection
      STOP_CRASH_DETECTION
    {% endif %}

    #####################################################################
    # Toolchanger setup.
    #
    # Beacon is mounted to the carriage, so the machine does not need to grab
    # T0 or clean a nozzle before homing, QGL, or mesh.
    #####################################################################

    M117 Initializing toolchanger
    INITIALIZE_TOOLCHANGER
    M400

    #####################################################################
    # Start bed heating early.
    #
    # M140 starts the bed ramp without blocking. That gives us time to dock
    # the currently mounted tool and move the empty shuttle away before the
    # blocking M190 wait.
    #####################################################################

    {% if BED_TEMP > 0 %}
      M117 Heating bed
      RESPOND TYPE=command MSG="PRINT_START: starting bed heat to {BED_TEMP}C while docking active tool."
      M140 S{BED_TEMP}
    {% endif %}

    #####################################################################
    # Dock currently mounted tool before Beacon homing/QGL/mesh.
    #
    # The toolchanger performs a 1 mm Z safety lift at the beginning of its
    # drop-off path. If the carriage is already near position_max, lower it
    # enough to provide safe headroom before calling UNSELECT_TOOL.
    #
    # The corrective move is relative so the active tool's Z offset cannot
    # alter the intended physical movement.
    #####################################################################

    M117 Docking active tool
    RESPOND TYPE=command MSG="PRINT_START: docking active tool before Beacon homing/QGL/mesh."

    G28
    M400

    {% set current_z = printer.toolhead.position[2]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set unselect_safe_z = max_z - 5.0 %}

    # If already within 5 mm of maximum Z, lower to the guard position.
    # On the current 345 mm Z configuration, this lowers to physical Z340.
    {% if "z" in printer.toolhead.homed_axes and current_z > unselect_safe_z %}
      {% set lower_distance = current_z - unselect_safe_z %}

      RESPOND TYPE=command MSG="PRINT_START: current physical Z {current_z|round(3)} is too close to maximum Z {max_z|round(3)}; lowering {lower_distance|round(3)} mm before UNSELECT_TOOL."

      G91
      G1 Z-{lower_distance} F{bucket_spd_z}
      G90
      M400
    {% endif %}

    UNSELECT_TOOL
    M400

    #####################################################################
    # Keep an already-hot starting tool from oozing excessively during Beacon
    # calibration. This does not heat a cold tool for mesh work.
    #####################################################################

    {% if starting_extruder in printer and MESH_NOZZLE_TEMP > 0 %}
      {% if printer[starting_extruder].target|float > MESH_NOZZLE_TEMP %}
        RESPOND TYPE=command MSG="PRINT_START: lowering {starting_extruder} target to {MESH_NOZZLE_TEMP}C during Beacon calibration."
        SET_HEATER_TEMPERATURE HEATER={starting_extruder} TARGET={MESH_NOZZLE_TEMP}
      {% endif %}
    {% endif %}

    #####################################################################
    # Finish bed heat before Beacon QGL/mesh.
    #
    # Beacon calibration should happen with the bed at print temperature so
    # the machine is closer to print conditions.
    #####################################################################

    {% if BED_TEMP > 0 %}
      M117 Waiting for bed
      RESPOND TYPE=command MSG="PRINT_START: waiting for bed to reach {BED_TEMP}C before Beacon QGL/mesh."
      M190 S{BED_TEMP}
    {% endif %}

    #####################################################################
    # Beacon QGL with empty shuttle.
    #
    # _CQGL handles Beacon-aware QGL and skips if already applied.
    #####################################################################

    M117 Beacon QGL
    _CQGL

    #####################################################################
    # Beacon adaptive mesh with empty shuttle.
    #
    # Do not force T0 for mesh. Beacon is carriage-mounted, and tool offsets
    # are handled outside of the bed mesh measurement.
    #####################################################################

    M117 Running Beacon adaptive mesh
    RESPOND TYPE=command MSG="PRINT_START: running adaptive mesh with Beacon and empty shuttle."
    BED_MESH_CALIBRATE ADAPTIVE=1

    #####################################################################
    # Clean all slicer-reported used print tools.
    #
    # Non-starting used tools are cleaned first, then returned to standby
    # target to reduce dock ooze.
    #
    # The next tool in the clean order is preheated while the current tool
    # is wiping. This reduces the wait after the next pickup without heating
    # every docked tool to print temp at once.
    #
    # The requested starting TOOL is cleaned last and remains selected/hot
    # so LINE_PURGE happens with the first print nozzle.
    #####################################################################

    {% set clean_tools = tool_order.clean_order.split(",") %}

    {% for clean_token in clean_tools %}
      {% if clean_token|length > 0 %}
        {% set clean_tool = clean_token|int %}

        {% if clean_tool == 0 %}
          {% set clean_extruder = "extruder" %}
          {% set clean_temp = params.T0_TEMP | default(TOOL_TEMP) | int %}
        {% elif clean_tool == 1 %}
          {% set clean_extruder = "extruder1" %}
          {% set clean_temp = params.T1_TEMP | default(TOOL_TEMP) | int %}
        {% elif clean_tool == 2 %}
          {% set clean_extruder = "extruder2" %}
          {% set clean_temp = params.T2_TEMP | default(TOOL_TEMP) | int %}
        {% elif clean_tool == 3 %}
          {% set clean_extruder = "extruder3" %}
          {% set clean_temp = params.T3_TEMP | default(TOOL_TEMP) | int %}
        {% elif clean_tool == 4 %}
          {% set clean_extruder = "extruder4" %}
          {% set clean_temp = params.T4_TEMP | default(TOOL_TEMP) | int %}
        {% else %}
          {% set clean_extruder = "extruder" %}
          {% set clean_temp = TOOL_TEMP %}
        {% endif %}

        #################################################################
        # Determine the next tool to clean.
        #
        # Only this next tool is bumped from standby to clean temp. Tools
        # later in the order are left at the existing standby target so they
        # are not sitting hot in the dock longer than needed.
        #################################################################

        {% set next_extruder = "" %}
        {% set next_temp = 0 %}

        {% if not loop.last %}
          {% set next_index = loop.index0 + 1 %}
          {% set next_token = clean_tools[next_index] %}

          {% if next_token|length > 0 %}
            {% set next_tool = next_token|int %}

            {% if next_tool == 0 %}
              {% set next_extruder = "extruder" %}
              {% set next_temp = params.T0_TEMP | default(TOOL_TEMP) | int %}
            {% elif next_tool == 1 %}
              {% set next_extruder = "extruder1" %}
              {% set next_temp = params.T1_TEMP | default(TOOL_TEMP) | int %}
            {% elif next_tool == 2 %}
              {% set next_extruder = "extruder2" %}
              {% set next_temp = params.T2_TEMP | default(TOOL_TEMP) | int %}
            {% elif next_tool == 3 %}
              {% set next_extruder = "extruder3" %}
              {% set next_temp = params.T3_TEMP | default(TOOL_TEMP) | int %}
            {% elif next_tool == 4 %}
              {% set next_extruder = "extruder4" %}
              {% set next_temp = params.T4_TEMP | default(TOOL_TEMP) | int %}
            {% endif %}
          {% endif %}
        {% endif %}

        M117 Cleaning T{clean_tool}
        RESPOND TYPE=command MSG="PRINT_START: selecting T{clean_tool} for pre-print wipe at {clean_temp}C."
        T{clean_tool}
        M400

        # Seat the selected tool's buffer before any wipe/purge/extrusion.
        # This uses the same normal-high target concept as LOAD_FILAMENT stage 2.
        BUFFER_SEAT_ACTIVE_TOOL

        # Stage the selected tool at the bucket before heating/wiping.
        G90
        G1 Z{bucket_z} F{bucket_spd_z}
        G1 X{bucket_entry_x} F{bucket_spd_xy}
        G1 Y{bucket_y} F{bucket_spd_xy}
        M400

        {% if clean_temp > 0 %}
          RESPOND TYPE=command MSG="PRINT_START: heating T{clean_tool} / {clean_extruder} to {clean_temp}C for wipe."
          SET_HEATER_TEMPERATURE HEATER={clean_extruder} TARGET={clean_temp}
          TEMPERATURE_WAIT SENSOR={clean_extruder} MINIMUM={clean_temp - 2}
        {% else %}
          RESPOND TYPE=command MSG="PRINT_START: T{clean_tool} has no valid clean temp; wiping without heat wait."
        {% endif %}

        {% if next_extruder|length > 0 and next_temp > 0 and next_extruder in printer %}
          RESPOND TYPE=command MSG="PRINT_START: preheating next clean tool {next_extruder} to {next_temp}C while T{clean_tool} wipes."
          SET_HEATER_TEMPERATURE HEATER={next_extruder} TARGET={next_temp}
        {% endif %}

        # Drop nozzle pressure before wiping. This is intentionally not
        # unretracted here because the next tool move/dock is where PETG was
        # slowly oozing after the wipe.
        SAVE_GCODE_STATE NAME=PRINT_START_CLEAN_RETRACT
        M83
        G1 E-2.0 F1500
        RESTORE_GCODE_STATE NAME=PRINT_START_CLEAN_RETRACT

        M117 Wiping T{clean_tool}
        _WIPE_NOZZLE
        M400

        # Return to bucket staging height/location after wipe so the next
        # toolchange starts from a predictable position.
        G90
        G1 Z{bucket_z} F{bucket_spd_z}
        G1 X{bucket_entry_x} F{bucket_spd_xy}
        G1 Y{bucket_y} F{bucket_spd_xy}
        M400

        {% if clean_tool != TOOL %}
          {% if MESH_NOZZLE_TEMP > 0 %}
            RESPOND TYPE=command MSG="PRINT_START: lowering cleaned non-starting T{clean_tool} to standby target {MESH_NOZZLE_TEMP}C."
            SET_HEATER_TEMPERATURE HEATER={clean_extruder} TARGET={MESH_NOZZLE_TEMP}
          {% else %}
            RESPOND TYPE=command MSG="PRINT_START: turning off cleaned non-starting T{clean_tool}."
            SET_HEATER_TEMPERATURE HEATER={clean_extruder} TARGET=0
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    
     #####################################################################
    # Return all installed buffers to native AUTO logic before purge/print.
    #
    # AUTO does not force immediate motion. It hands control back to each
    # lll-buffed firmware/sensor state machine so every installed buffer is
    # armed before tool changes happen during the print.
    #####################################################################

    {% if BUFFER_AUTO %}
      M117 Buffers auto
      BUFFER_AUTO_ALL_BUFFERS
    {% endif %}

    #####################################################################
    # Final status before purge.
    #
    # These are intentionally done before LINE_PURGE so the purge line is the
    # last action in PRINT_START. PETG strings if the nozzle pauses at the end
    # of the purge before the slicer takes over.
    #####################################################################

    _set_Top_Hat_LEDs_by_name COLOR=white

    # Set printing flag before the purge so there is no post-purge dwell.
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=True

    M117 Print start
    RESPOND TYPE=command MSG="PRINT_START: final action is LINE_PURGE; handing directly to slicer after purge."

    #####################################################################
    # Purge line.
    #####################################################################

    M117 Purging
    # Choose between typical KAMP line or Voron Logo
    # LINE_PURGE
    VORON_PURGE

  {% endif %}
  
#####################################################################
#                  Print End / Pause / Resume / Cancel
#####################################################################

[gcode_macro PRINT_END]
description: Print end, retract, park, shut down heaters, and disable buffers

variable_z_lift: 50
variable_x_park: 348
variable_y_park: 348
variable_park_speed: 12000
variable_z_speed: 3000
variable_retract_distance: 2.0
variable_retract_speed: 3600
variable_disable_buffers: 1

gcode:
  {% set v = printer["gcode_macro PRINT_END"] %}
  {% set th = printer.toolhead %}

  {% set z_safe = [th.position.z|float + v.z_lift|float, th.axis_maximum.z|float]|min %}
  {% set x_park = params.X|default(v.x_park)|float %}
  {% set y_park = params.Y|default(v.y_park)|float %}
  {% set disable_buffers = params.DISABLE_BUFFERS|default(v.disable_buffers)|int %}

  M117 Ending print

  # Print is ending, so no toolhead runout sensor should remain armed.
  _DISABLE_TOOLHEAD_FILAMENT_SENSORS

  _RESTORE_MOTION_LIMITS

  #####################################################################
  # Hotend-only retract before shutdown.
  #####################################################################

  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-{v.retract_distance} F{v.retract_speed}
    M400
  {% endif %}

  #####################################################################
  # Disable installed buffers after print motion is done.
  # OFF/DISABLE is a momentary motor disable; firmware may re-enable later
  # if sensor state changes. At print end, everything should be stationary.
  #####################################################################

  {% if disable_buffers %}
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1
  {% endif %}

  #####################################################################
  # Park only on homed axes so a bad end/cancel does not create motion errors.
  #####################################################################

  G90

  {% if "z" in printer.toolhead.homed_axes %}
    G0 Z{z_safe} F{v.z_speed}
  {% endif %}

  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G0 X{x_park} Y{y_park} F{v.park_speed}
  {% endif %}

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  TURN_OFF_HEATERS
  M107

  _TOP_HAT_PRINT_END_FLASH 

  # Clear printing flag - returns display to idle/standby
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=False

  M117 Print end complete

[gcode_macro PAUSE]
description: Pause print, retract hotend, and park safely
rename_existing: PAUSE_BASE

variable_retract_distance: 1.0
variable_retract_speed: 2100
variable_z_lift: 5.0
variable_x_park: 178
variable_y_park: 340
variable_park_speed: 12000
variable_z_speed: 1200
variable_disable_buffer: 0

gcode:
  {% set v = printer["gcode_macro PAUSE"] %}
  {% set already_paused = printer.pause_resume.is_paused|default(False) %}
  {% set th = printer.toolhead %}

  {% set x_park = params.X|default(v.x_park)|float %}
  {% set y_park = params.Y|default(v.y_park)|float %}
  {% set z_lift = params.Z|default(v.z_lift)|float %}
  {% set disable_buffer = params.DISABLE_BUFFER|default(v.disable_buffer)|int %}

  {% if already_paused %}
    RESPOND TYPE=command MSG="PAUSE ignored: print is already paused"
    M117 Already paused

  {% else %}

# description: Toolchanger-aware pause with KNOMI integration that shows how to prevent parking during tool loss or docking errors.
# gcode:
#     {% set tc = printer.toolchanger if "toolchanger" in printer else {} %}
#     {% set in_tc_error = (tc.status|default("") == "error") %}

#     # Check if tool is lost
#     {% set tool_lost = False %}
#     {% if tc.tool_number is defined and tc.tool_number >= 0 %}
#         {% set tool_name = "tool T" ~ tc.tool_number %}
#         {% set tool_obj = printer[tool_name] if tool_name in printer else None %}
#         {% if tool_obj and tool_obj.detect_state != 1 %}
#             {% set tool_lost = True %}
#         {% endif %}
#     {% endif %}

#     # Execute base pause
#     PAUSE_BASE

#     # Set paused flag for KNOMI display
#     SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=True

#     # Conditional parking based on toolchanger state
#     {% if in_tc_error or tool_lost %}
#         # Do NOT park - toolhead at dock or tool lost
#         {% if tool_lost %}
#             M117 Tool lost - Paused (DO NOT MOVE!)
#         {% else %}
#             M117 TC Error - Paused at dock
#         {% endif %}
#     {% else %}
#         # Safe to park
#         _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
#     {% endif %}

    
    
    # Set paused flag for KNOMI display
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=True
    
    M117 Pausing print

    # Let Klipper/Moonraker latch the pause state before we do park moves.
    PAUSE_BASE

    # Save modal state before using relative extrusion/Z moves.
    SAVE_GCODE_STATE NAME=PAUSE_PARK_STATE

    #####################################################################
    # Hotend-only retract.
    #####################################################################

    {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E-{v.retract_distance} F{v.retract_speed}
    {% else %}
      RESPOND TYPE=command MSG="PAUSE: skipping retract; active extruder cannot extrude"
    {% endif %}

    #####################################################################
    # Optional buffer disable.
    #
    # Default is off because a normal pause should not disturb buffer state
    # unless you explicitly want the active buffer disabled.
    #####################################################################

    {% if disable_buffer %}
      BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% endif %}

    #####################################################################
    # Park only if the required axes are homed.
    #####################################################################

    G90

    {% if "z" in th.homed_axes %}
      {% set z_target = [th.position.z|float + z_lift, th.axis_maximum.z|float]|min %}
      G1 Z{z_target} F{v.z_speed}
    {% endif %}

    {% if "x" in th.homed_axes and "y" in th.homed_axes %}
      G1 X{x_park} Y{y_park} F{v.park_speed}
    {% else %}
      RESPOND TYPE=command MSG="PAUSE: XY not homed; skipping park move"
    {% endif %}

    # Restore modal state without moving back to the print position.
    # RESUME_BASE owns the actual return-to-print move.
    RESTORE_GCODE_STATE NAME=PAUSE_PARK_STATE MOVE=0

    M117 Paused
  {% endif %}

[gcode_macro RESUME]
description: Resume paused print
rename_existing: RESUME_BASE

variable_unretract_distance: 1.0
variable_unretract_speed: 2100
variable_arm_buffer: 1

gcode:
  {% set v = printer["gcode_macro RESUME"] %}
  {% set is_paused = printer.pause_resume.is_paused|default(False) %}
  {% set arm_buffer = params.ARM_BUFFER|default(v.arm_buffer)|int %}
  {% set velocity = params.VELOCITY|default("")|string %}

  {% if not is_paused %}
    RESPOND TYPE=command MSG="RESUME ignored: printer is not paused"
    M117 Not paused

  {% else %}
    # Clear paused flag
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=False
    
    M117 Resuming print

    #####################################################################
    # Return buffer to AUTO before unretract/resume.
    #####################################################################

    {% if arm_buffer %}
      BUFFER_ARM_ACTIVE_TOOL
    {% endif %}

    #####################################################################
    # Hotend-only unretract.
    #####################################################################

    SAVE_GCODE_STATE NAME=RESUME_UNRETRACT_STATE

    {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E{v.unretract_distance} F{v.unretract_speed}
    {% else %}
      RESPOND TYPE=command MSG="RESUME: skipping unretract; active extruder cannot extrude"
    {% endif %}

    RESTORE_GCODE_STATE NAME=RESUME_UNRETRACT_STATE MOVE=0

    {% if velocity|length > 0 %}
      RESUME_BASE VELOCITY={velocity}
    {% else %}
      RESUME_BASE
    {% endif %}

    M117 Printing
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel print, lift Z, park if possible, disable buffers, and clear print state
rename_existing: BASE_CANCEL_PRINT

variable_z_lift: 50
variable_x_park: 178
variable_y_park: 340
variable_park_speed: 12000
variable_z_speed: 3000
variable_retract_distance: 2.0
variable_retract_speed: 3600
variable_disable_buffers: 1

gcode:
  {% set v = printer["gcode_macro CANCEL_PRINT"] %}
  {% set th = printer.toolhead %}

  {% set z_target = [th.position.z|float + v.z_lift|float, th.axis_maximum.z|float]|min %}
  {% set z_move = z_target - th.position.z|float %}
  {% set disable_buffers = params.DISABLE_BUFFERS|default(v.disable_buffers)|int %}

  # Clear all KNOMI status flags
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=False
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=False

  # Cancel should clear all armed runout monitoring immediately.
  _DISABLE_TOOLHEAD_FILAMENT_SENSORS

  M117 Cancelling print
  
  _RESTORE_MOTION_LIMITS
  M400

  #####################################################################
  # Hotend-only retract before shutdown if the active extruder is hot.
  #####################################################################

  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-{v.retract_distance} F{v.retract_speed}
    M400
  {% endif %}

  #####################################################################
  # Park only on homed axes.
  #####################################################################

  {% if "z" in printer.toolhead.homed_axes and z_move > 0 %}
    G91
    G1 Z{z_move} F{v.z_speed}
    G90
  {% endif %}

  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G0 X{v.x_park} Y{v.y_park} F{v.park_speed}
  {% endif %}

  TURN_OFF_HEATERS
  M107

  #####################################################################
  # Disable installed buffers before parking/shutdown.
  # This avoids leaving a buffer in HOLD/MANUAL/MOVE state after cancel.
  #####################################################################

  {% if disable_buffers %}
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1
  {% endif %}
  
  # Set top-hat LEDs red when a print is intentionally cancelled.
  _set_Top_Hat_LEDs_by_name COLOR="red"

  CLEAR_PAUSE
  BASE_CANCEL_PRINT

  M117 Cancel complete