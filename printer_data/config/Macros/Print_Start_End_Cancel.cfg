[gcode_macro PRINT_START]
description: Print start with T0 preclean, T0 reference homing/QGL, T0 adaptive mesh, final print tool heat, buffer auto, and purge line

# --- Purge bucket / brush staging ---
variable_bucket_entry_x:   310
variable_bucket_y:         1.0
variable_bucket_exit_y:    50
variable_bucket_z:         5
variable_bucket_spd_xy:    9000
variable_bucket_spd_z:     1500

# --- Nozzle prep temps ---
variable_wipe_temp:        190
variable_mesh_nozzle_temp: 160

# --- T0 pre-clean behavior before reference G28/QGL ---
variable_preclean_enable:           1       # 1 = clean T0 before reference homing/QGL.
variable_preclean_temp_default:     240     # Fallback clean temp if material is unknown and TOOL_TEMP is not higher.
variable_preclean_temp_pla:         220
variable_preclean_temp_petg:        245
variable_preclean_temp_abs:         255
variable_preclean_temp_asa:         255
variable_preclean_temp_tpu:         225
variable_preclean_cool_delta:       30      # First wipe happens after nozzle cools this many C from clean temp.
variable_preclean_hold_temp:        150     # Second wipe happens after nozzle cools to this temp range.
variable_preclean_hold_deadband:    5       # Wait until T0 is at or below hold_temp + this value.
variable_preclean_fan_speed:        1.0     # 0.0-1.0 part fan blast while cooling/wiping.
variable_preclean_bucket_z:         10      # Higher than normal bucket_z because QGL has not been redone yet.

# --- Buffer behavior ---
variable_buffer_auto_before_purge: 1          # 1 = return all installed buffers to AUTO before purge/print.

gcode:
  {% set TOOL = params.TOOL | default(0) | int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set TOOL_QGL_TEMP = params.TOOL_QGL_TEMP | default(150) | int %}
  {% set WIPE_TEMP = params.WIPE_TEMP | default(wipe_temp) | int %}
  {% set MESH_NOZZLE_TEMP = params.MESH_NOZZLE_TEMP | default(mesh_nozzle_temp) | int %}
  {% set BUFFER_AUTO = params.BUFFER_AUTO | default(buffer_auto_before_purge) | int %}
  {% set DIRECT_FEED = params.DIRECT_FEED | default(0) | int %}
  {% set FILAMENT = params.FILAMENT | default("DEFAULT") | upper | string %}

  # T0 is the reference/mesh tool. Other tool offsets are expected to be relative to T0.
  {% set mesh_extruder = "extruder" %}

  # Pull the requested tool's hotend filament sensor from the central buffer/tool map.
  # This keeps _BUFFER_USAGE_STATE as the single source of truth for sensor names.
  {% set buffer_state = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
  {% set hotend_sensor_key = "tool" ~ TOOL ~ "_hotend_sensor" %}
  {% set hotend_sensor = buffer_state[hotend_sensor_key] | default("") | string %}

  {% if TOOL == 0 %}
    {% set tool_extruder = "extruder" %}
  {% elif TOOL == 1 %}
    {% set tool_extruder = "extruder1" %}
  {% elif TOOL == 2 %}
    {% set tool_extruder = "extruder2" %}
  {% elif TOOL == 3 %}
    {% set tool_extruder = "extruder3" %}
  {% elif TOOL == 4 %}
    {% set tool_extruder = "extruder4" %}
  {% else %}
    {% set tool_extruder = "extruder" %}
  {% endif %}

  # Resolve a material-based clean temperature. TOOL_TEMP can still push this higher.
  {% if "PETG" in FILAMENT %}
    {% set material_clean_temp = preclean_temp_petg | int %}
  {% elif "ASA" in FILAMENT %}
    {% set material_clean_temp = preclean_temp_asa | int %}
  {% elif "ABS" in FILAMENT %}
    {% set material_clean_temp = preclean_temp_abs | int %}
  {% elif "TPU" in FILAMENT %}
    {% set material_clean_temp = preclean_temp_tpu | int %}
  {% elif "PLA" in FILAMENT %}
    {% set material_clean_temp = preclean_temp_pla | int %}
  {% else %}
    {% set material_clean_temp = preclean_temp_default | int %}
  {% endif %}

  # Default clean temp is the higher of the material clean temp or the requested first-layer temp.
  # PRECLEAN_TEMP can override this from the slicer/console when needed.
  {% set auto_clean_temp = TOOL_TEMP if TOOL_TEMP > material_clean_temp else material_clean_temp %}
  {% set PRECLEAN_TEMP = params.PRECLEAN_TEMP | default(auto_clean_temp) | int %}
  {% set PRECLEAN_FIRST_WIPE_TEMP = PRECLEAN_TEMP - (preclean_cool_delta | int) %}
  {% set PRECLEAN_HOLD_TEMP = params.PRECLEAN_HOLD_TEMP | default(preclean_hold_temp) | int %}
  {% set PRECLEAN_FAN_PWM = (255 * (preclean_fan_speed | float)) | int %}

  {% if hotend_sensor|length == 0 %}
    RESPOND TYPE=error MSG="PRINT_START blocked: no hotend filament sensor configured for T{TOOL} in _BUFFER_USAGE_STATE"
    M117 T{TOOL} sensor missing
    PAUSE

  {% elif hotend_sensor not in printer %}
    RESPOND TYPE=error MSG="PRINT_START blocked: configured sensor '{hotend_sensor}' does not exist"
    M117 Filament sensor missing
    PAUSE

  {% elif not printer[hotend_sensor].filament_detected %}
    RESPOND TYPE=error MSG="PRINT_START blocked: no filament detected in T{TOOL} hotend sensor"
    M117 T{TOOL} no filament
    PAUSE

  {% else %}
    RESPOND TYPE=command MSG="PRINT_START: filament detected in T{TOOL} using {hotend_sensor}"

    # Wake displays if asleep
    KNOMI_WAKE

    M117 Starting print
    _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS
    BUFFER_AUTO_ALL_BUFFERS
    #####################################################################
    # Toolhead LED print-use indication.
    #
    # Logos stay static tool identity colors.
    # Nozzle LEDs:
    #   - white for T0 and slicer-reported used print tools
    #   - static/logo color for idle tools
    # Top-hat LEDs remain the machine status indicator.
    #####################################################################

    SET_TOOLHEADS_STATIC
    _PRINT_START_TOOL_NOZZLE_STATE TOOL={TOOL} USED_TOOLS="{params.USED_TOOLS|default('')}"

    # Disable crash detection during homing/probing if StealthChanger probe
    # crash detection is available.
    {% if printer.tool_probe_endstop is defined %}
      M117 Disabling crash detection
      STOP_CRASH_DETECTION
    {% endif %}

    #####################################################################
    # Initial toolchanger setup and safety home.
    #
    # This first _CG28 is only to establish enough position/state for safe
    # toolchanger motion. It may happen with whatever tool is currently mounted.
    #####################################################################

    M117 Initializing toolchanger
    INITIALIZE_TOOLCHANGER

    M117 Initial homing for toolchange safety
    _CG28

    #####################################################################
    # Select T0 for pre-clean and reference work.
    #####################################################################

    M117 Selecting reference tool T0
    T0

    #####################################################################
    # T0 pre-clean before reference homing/QGL.
    #
    # This removes residue from the previous print before the final reference
    # G28/QGL. The nozzle is heated over the bucket, fan-blasted while cooling,
    # wiped once after a 30C-ish drop, then cooled to about 150C and wiped again.
    #####################################################################

    {% if preclean_enable %}
      M117 T0 pre-clean heat
      RESPOND TYPE=command MSG="PRINT_START: T0 preclean FILAMENT={FILAMENT}, CLEAN_TEMP={PRECLEAN_TEMP}, FIRST_WIPE_AT<={PRECLEAN_FIRST_WIPE_TEMP}, HOLD_TEMP={PRECLEAN_HOLD_TEMP}"

      # Move T0 to the bucket before heating so any drool lands in the bucket.
      G90
      G1 Z{preclean_bucket_z} F{bucket_spd_z}
      G1 X{bucket_entry_x} F{bucket_spd_xy}
      G1 Y{bucket_y} F{bucket_spd_xy}

      # Heat T0 hot enough to soften the current material profile.
      M104 S{PRECLEAN_TEMP}
      M109 S{PRECLEAN_TEMP}

      # Start cooling immediately and use the part fan as an air blast.
      M104 S{PRECLEAN_HOLD_TEMP}
      M106 S{PRECLEAN_FAN_PWM}

      # First wipe after the nozzle has dropped by the configured delta.
      M117 Cooling T0 for first wipe
      TEMPERATURE_WAIT SENSOR={mesh_extruder} MAXIMUM={PRECLEAN_FIRST_WIPE_TEMP}

      M117 T0 hot residue wipe
      _WIPE_NOZZLE

      # Return to bucket staging height/location after wipe.
      G90
      G1 Z{preclean_bucket_z} F{bucket_spd_z}
      G1 X{bucket_entry_x} F{bucket_spd_xy}
      G1 Y{bucket_y} F{bucket_spd_xy}

      # Wait until T0 is down around the reference/probing-safe hold temp.
      M117 Waiting T0 near reference temp
      TEMPERATURE_WAIT SENSOR={mesh_extruder} MAXIMUM={PRECLEAN_HOLD_TEMP + preclean_hold_deadband}

      M117 T0 cool cleanup wipe
      _WIPE_NOZZLE

      # Turn off the fan blast after the second wipe so probing/mesh behavior is stable.
      M107

      # Return to bucket staging height/location after wipe.
      G90
      G1 Z{bucket_z} F{bucket_spd_z}
      G1 X{bucket_entry_x} F{bucket_spd_xy}
      G1 Y{bucket_y} F{bucket_spd_xy}
    {% endif %}

    #####################################################################
    # Reference-tool homing and QGL with clean T0 nozzle.
    #
    # T0 is treated as the primary/reference tool. This intentionally redoes
    # the reference G28/QGL after pre-clean so offsets and mesh start from a
    # clean nozzle condition.
    #####################################################################

    # Hold T0 at the normal reference temperature before final reference work.
    M104 S{TOOL_QGL_TEMP}
    {% if mesh_extruder in printer %}
      TEMPERATURE_WAIT SENSOR={mesh_extruder} MAXIMUM={TOOL_QGL_TEMP + 5}
    {% endif %}

    M117 Re-homing with clean T0
    G28

    M117 Reference QGL with clean T0
    _CQGL

    #####################################################################
    # Force T0 for bed mesh and mesh-prep wipe.
    #
    # Even when the reference home/QGL state is already valid, the currently
    # mounted tool may be T1/T2/etc. Mesh must be probed with T0 because the
    # other tool offsets are relative to the T0 reference.
    #####################################################################

    M117 Selecting mesh reference tool T0
    T0
    #####################################################################
    # Start bed heat after QGL.
    #####################################################################

    M117 Heating bed for mesh
    RESPOND TYPE=command MSG="PRINT_START: heating bed to {BED_TEMP}C. T0 stays mounted because mesh and tool offsets are referenced from T0."
    M140 S{BED_TEMP}

    #####################################################################
    # Move T0 to purge bucket at a controlled Z height.
    #####################################################################

    M117 Staging T0 for mesh wipe
    RESPOND TYPE=command MSG="PRINT_START: parking T0 at bucket while bed heats so any ooze stays off the bed."
    G90
    G1 Z{bucket_z} F{bucket_spd_z}
    G1 X{bucket_entry_x} F{bucket_spd_xy}
    G1 Y{bucket_y} F{bucket_spd_xy}

    #####################################################################
    # Mesh-prep temperature hold and wipe.
    #
    # Pre-clean already handled the hot residue removal. This section makes
    # sure T0 is held at mesh temp, bed is ready, and the nozzle gets one more
    # clean wipe before probing mesh.
    #####################################################################

    M117 T0 mesh-wipe temp
    RESPOND TYPE=command MSG="PRINT_START: setting T0 to {MESH_NOZZLE_TEMP}C for the final pre-mesh wipe."
    M104 S{MESH_NOZZLE_TEMP}

    M117 Bed heat; T0 parked
    RESPOND TYPE=command MSG="PRINT_START: waiting for bed. T0 is intentionally parked at the bucket for the mesh-prep wipe."
    M190 S{BED_TEMP}

    {% if mesh_extruder in printer %}
      M117 Waiting T0 for mesh wipe
      RESPOND TYPE=command MSG="PRINT_START: waiting for T0 to reach mesh-safe wipe temp before adaptive mesh."
      TEMPERATURE_WAIT SENSOR={mesh_extruder} MAXIMUM={MESH_NOZZLE_TEMP + 5}
    {% endif %}

    M117 Wiping T0 before mesh
    RESPOND TYPE=command MSG="PRINT_START: wiping clean T0 nozzle before adaptive mesh."
    _WIPE_NOZZLE

    # Small T0 hotend-only retract after wiping to reduce ooze before mesh.
    {% if mesh_extruder in printer %}
      {% set mesh_min_extrude_temp = printer.configfile.settings[mesh_extruder].min_extrude_temp|float %}
      {% if MESH_NOZZLE_TEMP >= mesh_min_extrude_temp %}
        M83
        G1 E-0.4 F2400
        M82
      {% endif %}
    {% endif %}

    # Return to bucket staging height/location after wipe.
    G90
    G1 Z{bucket_z} F{bucket_spd_z}
    G1 X{bucket_entry_x} F{bucket_spd_xy}
    G1 Y{bucket_y} F{bucket_spd_xy}

    #####################################################################
    # Adaptive mesh with clean, lower-temp T0 nozzle.
    #####################################################################

    M117 Running adaptive mesh with T0
    BED_MESH_CALIBRATE ADAPTIVE=1

    #####################################################################
    # Park T0 at the bucket staging height before switching to print tool.
    #####################################################################

    G90
    G1 Z{bucket_z} F{bucket_spd_z}
    G1 X{bucket_entry_x} F{bucket_spd_xy}
    G1 Y{bucket_y} F{bucket_spd_xy}

    #####################################################################
    # Switch to requested initial print tool after T0 mesh is complete.
    #####################################################################

    {% if TOOL > 0 %}
      # Shut down T0 before swapping away from the reference/mesh tool.
      M104 T0 S0

      M117 Selecting print tool T{TOOL}
      T{TOOL}

      # Return the requested print tool to the same bucket staging location
      # before final heat/wipe/purge.
      G90
      G1 Z{bucket_z} F{bucket_spd_z}
      G1 X{bucket_entry_x} F{bucket_spd_xy}
      G1 Y{bucket_y} F{bucket_spd_xy}
    {% endif %}

    #####################################################################
    # Final print-tool heat, wipe, and purge.
    #####################################################################

    M117 Heating final print temp
    M104 S{TOOL_TEMP}

    M117 Waiting on T{TOOL} S{TOOL_TEMP}C
    M109 S{TOOL_TEMP}

    M117 Final T{TOOL} nozzle wipe
    _WIPE_NOZZLE

    # Bump Z to the bucket staging height before travel to purge/print.
    G90
    G1 Z{bucket_z} F{bucket_spd_z}

    #####################################################################
    # Return all installed buffers to native AUTO logic before purge/print.
    #
    # AUTO does not force immediate motion. It hands control back to each
    # lll-buffed firmware/hall-sensor state machine so every installed
    # buffer is armed before tool changes happen during the print.
    #####################################################################

    {% if BUFFER_AUTO %}
      M117 Buffers auto
      BUFFER_AUTO_ALL_BUFFERS
    {% endif %}

    #####################################################################
    # Purge line.
    #
    # Klipper only extrudes through the active hotend. The lll-buffed
    # firmware handles the physical buffer behavior in AUTO.
    #####################################################################

    M117 Purging line
    LINE_PURGE

    #####################################################################
    # Re-enable crash detection after all probing and purge prep.
    #####################################################################

    # {% if printer.tool_probe_endstop is defined %}
    #   M117 Re-enabling crash detection
    #   START_CRASH_DETECTION
    # {% endif %}

    _set_Top_Hat_LEDs_by_name COLOR=white
    M117 Print start complete

    # Set printing flag - this shows the print progress overlay
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=True
    
  {% endif %}

  
#####################################################################
#                  Print End / Pause / Resume / Cancel
#####################################################################

[gcode_macro PRINT_END]
description: Print end, retract, park, shut down heaters, and disable buffers

variable_z_lift: 50
variable_x_park: 348
variable_y_park: 348
variable_park_speed: 12000
variable_z_speed: 3000
variable_retract_distance: 2.0
variable_retract_speed: 3600
variable_disable_buffers: 1

gcode:
  {% set v = printer["gcode_macro PRINT_END"] %}
  {% set th = printer.toolhead %}

  {% set z_safe = [th.position.z|float + v.z_lift|float, th.axis_maximum.z|float]|min %}
  {% set x_park = params.X|default(v.x_park)|float %}
  {% set y_park = params.Y|default(v.y_park)|float %}
  {% set disable_buffers = params.DISABLE_BUFFERS|default(v.disable_buffers)|int %}

  M117 Ending print
  _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS

  #####################################################################
  # Optional return to T0 after a clean print.
  #
  # This keeps T0 staged for the next print, but avoids trying to select a
  # tool if the printer is not homed. Tool selection while the toolchanger is
  # uninitialized can throw errors during weird pause/resume/cancel paths.
  #####################################################################

  {% if printer.toolchanger is defined and "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
    M117 Returning to T0 for next print
    INITIALIZE_TOOLCHANGER
    T0
  {% else %}
    RESPOND TYPE=command MSG="PRINT_END: skipping T0 return; toolchanger missing or printer not fully homed"
  {% endif %}

  M220 S100
  M221 S100
  SET_PRESSURE_ADVANCE ADVANCE=0

  #####################################################################
  # Hotend-only retract before shutdown.
  #####################################################################

  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-{v.retract_distance} F{v.retract_speed}
    M400
  {% endif %}

  #####################################################################
  # Disable installed buffers after print motion is done.
  # OFF/DISABLE is a momentary motor disable; firmware may re-enable later
  # if sensor state changes. At print end, everything should be stationary.
  #####################################################################

  {% if disable_buffers %}
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1
  {% endif %}

  #####################################################################
  # Park only on homed axes so a bad end/cancel does not create motion errors.
  #####################################################################

  G90

  {% if "z" in printer.toolhead.homed_axes %}
    G0 Z{z_safe} F{v.z_speed}
  {% endif %}

  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G0 X{x_park} Y{y_park} F{v.park_speed}
  {% endif %}

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  TURN_OFF_HEATERS
  M107

  _TOP_HAT_PRINT_END_FLASH 

  # Clear printing flag - returns display to idle/standby
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=False

  M117 Print end complete

[gcode_macro PAUSE]
description: Pause print, retract hotend, and park safely
rename_existing: PAUSE_BASE

variable_retract_distance: 1.0
variable_retract_speed: 2100
variable_z_lift: 5.0
variable_x_park: 348
variable_y_park: 348
variable_park_speed: 12000
variable_z_speed: 1200
variable_disable_buffer: 0

gcode:
  {% set v = printer["gcode_macro PAUSE"] %}
  {% set already_paused = printer.pause_resume.is_paused|default(False) %}
  {% set th = printer.toolhead %}

  {% set x_park = params.X|default(v.x_park)|float %}
  {% set y_park = params.Y|default(v.y_park)|float %}
  {% set z_lift = params.Z|default(v.z_lift)|float %}
  {% set disable_buffer = params.DISABLE_BUFFER|default(v.disable_buffer)|int %}

  {% if already_paused %}
    RESPOND TYPE=command MSG="PAUSE ignored: print is already paused"
    M117 Already paused

  {% else %}

# description: Toolchanger-aware pause with KNOMI integration that shows how to prevent parking during tool loss or docking errors.
# gcode:
#     {% set tc = printer.toolchanger if "toolchanger" in printer else {} %}
#     {% set in_tc_error = (tc.status|default("") == "error") %}

#     # Check if tool is lost
#     {% set tool_lost = False %}
#     {% if tc.tool_number is defined and tc.tool_number >= 0 %}
#         {% set tool_name = "tool T" ~ tc.tool_number %}
#         {% set tool_obj = printer[tool_name] if tool_name in printer else None %}
#         {% if tool_obj and tool_obj.detect_state != 1 %}
#             {% set tool_lost = True %}
#         {% endif %}
#     {% endif %}

#     # Execute base pause
#     PAUSE_BASE

#     # Set paused flag for KNOMI display
#     SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=True

#     # Conditional parking based on toolchanger state
#     {% if in_tc_error or tool_lost %}
#         # Do NOT park - toolhead at dock or tool lost
#         {% if tool_lost %}
#             M117 Tool lost - Paused (DO NOT MOVE!)
#         {% else %}
#             M117 TC Error - Paused at dock
#         {% endif %}
#     {% else %}
#         # Safe to park
#         _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
#     {% endif %}

    
    
    # Set paused flag for KNOMI display
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=True
    
    M117 Pausing print

    # Let Klipper/Moonraker latch the pause state before we do park moves.
    PAUSE_BASE

    # Save modal state before using relative extrusion/Z moves.
    SAVE_GCODE_STATE NAME=PAUSE_PARK_STATE

    #####################################################################
    # Hotend-only retract.
    #####################################################################

    {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E-{v.retract_distance} F{v.retract_speed}
    {% else %}
      RESPOND TYPE=command MSG="PAUSE: skipping retract; active extruder cannot extrude"
    {% endif %}

    #####################################################################
    # Optional buffer disable.
    #
    # Default is off because a normal pause should not disturb buffer state
    # unless you explicitly want the active buffer disabled.
    #####################################################################

    {% if disable_buffer %}
      BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% endif %}

    #####################################################################
    # Park only if the required axes are homed.
    #####################################################################

    G90

    {% if "z" in th.homed_axes %}
      {% set z_target = [th.position.z|float + z_lift, th.axis_maximum.z|float]|min %}
      G1 Z{z_target} F{v.z_speed}
    {% endif %}

    {% if "x" in th.homed_axes and "y" in th.homed_axes %}
      G1 X{x_park} Y{y_park} F{v.park_speed}
    {% else %}
      RESPOND TYPE=command MSG="PAUSE: XY not homed; skipping park move"
    {% endif %}

    # Restore modal state without moving back to the print position.
    # RESUME_BASE owns the actual return-to-print move.
    RESTORE_GCODE_STATE NAME=PAUSE_PARK_STATE MOVE=0

    M117 Paused
  {% endif %}

[gcode_macro RESUME]
description: Resume paused print
rename_existing: RESUME_BASE

variable_unretract_distance: 1.0
variable_unretract_speed: 2100
variable_arm_buffer: 1

gcode:
  {% set v = printer["gcode_macro RESUME"] %}
  {% set is_paused = printer.pause_resume.is_paused|default(False) %}
  {% set arm_buffer = params.ARM_BUFFER|default(v.arm_buffer)|int %}
  {% set velocity = params.VELOCITY|default("")|string %}

  {% if not is_paused %}
    RESPOND TYPE=command MSG="RESUME ignored: printer is not paused"
    M117 Not paused

  {% else %}
    # Clear paused flag
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=False
    
    M117 Resuming print

    #####################################################################
    # Return buffer to AUTO before unretract/resume.
    #####################################################################

    {% if arm_buffer %}
      BUFFER_ARM_ACTIVE_TOOL
    {% endif %}

    #####################################################################
    # Hotend-only unretract.
    #####################################################################

    SAVE_GCODE_STATE NAME=RESUME_UNRETRACT_STATE

    {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E{v.unretract_distance} F{v.unretract_speed}
    {% else %}
      RESPOND TYPE=command MSG="RESUME: skipping unretract; active extruder cannot extrude"
    {% endif %}

    RESTORE_GCODE_STATE NAME=RESUME_UNRETRACT_STATE MOVE=0

    {% if velocity|length > 0 %}
      RESUME_BASE VELOCITY={velocity}
    {% else %}
      RESUME_BASE
    {% endif %}

    M117 Printing
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel print, lift Z, park if possible, disable buffers, and clear print state
rename_existing: BASE_CANCEL_PRINT

variable_z_lift: 50
variable_x_park: 348
variable_y_park: 348
variable_park_speed: 12000
variable_z_speed: 3000
variable_retract_distance: 2.0
variable_retract_speed: 3600
variable_disable_buffers: 1

gcode:
  {% set v = printer["gcode_macro CANCEL_PRINT"] %}
  {% set th = printer.toolhead %}

  {% set z_target = [th.position.z|float + v.z_lift|float, th.axis_maximum.z|float]|min %}
  {% set z_move = z_target - th.position.z|float %}
  {% set disable_buffers = params.DISABLE_BUFFERS|default(v.disable_buffers)|int %}

  # Clear all KNOMI status flags
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=printing VALUE=False
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=paused VALUE=False

  M117 Cancelling print
  _BUFFER_APPLY_DEFAULTS_ALL_BUFFERS
  M400

  #####################################################################
  # Hotend-only retract before shutdown if the active extruder is hot.
  #####################################################################

  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-{v.retract_distance} F{v.retract_speed}
    M400
  {% endif %}

  #####################################################################
  # Park only on homed axes.
  #####################################################################

  {% if "z" in printer.toolhead.homed_axes and z_move > 0 %}
    G91
    G1 Z{z_move} F{v.z_speed}
    G90
  {% endif %}

  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G0 X{v.x_park} Y{v.y_park} F{v.park_speed}
  {% endif %}

  TURN_OFF_HEATERS
  M107

  #####################################################################
  # Disable installed buffers before parking/shutdown.
  # This avoids leaving a buffer in HOLD/MANUAL/MOVE state after cancel.
  #####################################################################

  {% if disable_buffers %}
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1
  {% endif %}
  
  # Set top-hat LEDs red when a print is intentionally cancelled.
  _set_Top_Hat_LEDs_by_name COLOR="red"

  CLEAR_PAUSE
  BASE_CANCEL_PRINT

  M117 Cancel complete