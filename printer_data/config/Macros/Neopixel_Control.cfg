[gcode_macro _TOP_HAT_LED_STATUS]
description: Apply status color to top-hat LEDs only
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set status = params.STATUS|default("ready")|lower|string %}
    {% set enable = params.ENABLE|default(1)|int %}

    {% if status not in vars.status_colors %}
        RESPOND TYPE=error MSG="_TOP_HAT_LED_STATUS: unknown status '{status}'"

    {% elif enable %}
        {% set colors = vars.status_colors[status] %}
        {% set hat_color = colors.hat|default("off")|string %}

        # Top hat is the global machine status indicator.
        _set_Top_Hat_LEDs_by_name COLOR={hat_color}
    {% endif %}


[gcode_macro _TOOLHEAD_LED_STATUS]
description: Apply status color to toolhead nozzle LEDs, with optional logo control
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set status = params.STATUS|default("ready")|lower|string %}

    # Default behavior:
    #   NOZZLE=1  Status changes nozzle LEDs.
    #   LOGO=0    Status does not change logo LEDs, preserving static tool identity colors.
    {% set use_nozzle = params.NOZZLE|default(1)|int %}
    {% set use_logo = params.LOGO|default(0)|int %}

    # TOOL parameter wins. Otherwise use the active toolchanger tool if available.
    {% if params.TOOL is defined %}
        {% set requested_tool = params.TOOL|int %}
    {% elif printer.toolchanger is defined %}
        {% set requested_tool = printer.toolchanger.tool_number|default(vars.default_tool)|int %}
    {% else %}
        {% set requested_tool = vars.default_tool|int %}
    {% endif %}

    # Clamp invalid tool numbers so status calls do not target a missing LED chain.
    {% if requested_tool < 0 or requested_tool >= vars.tool_count|int %}
        {% set tool = vars.default_tool|int %}
    {% else %}
        {% set tool = requested_tool %}
    {% endif %}

    {% if status not in vars.status_colors %}
        RESPOND TYPE=error MSG="_TOOLHEAD_LED_STATUS: unknown status '{status}'"

    {% else %}
        {% set colors = vars.status_colors[status] %}
        {% set nozzle_color = colors.nozzle|default("")|string %}
        {% set logo_color = colors.logo|default("")|string %}

        # Use the named-color helper. _set_nozzle_leds and _set_logo_leds are
        # direct RGBW helpers and do not accept COLOR=.
        {% if use_nozzle and nozzle_color|length > 0 %}
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={nozzle_color} TRANSMIT=1
        {% endif %}

        # Logo LEDs remain static unless LOGO=1 is explicitly passed.
        {% if use_logo and logo_color|length > 0 %}
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR={logo_color} TRANSMIT=1
        {% endif %}
    {% endif %}


