########################## DIAG MACROS ############################
[gcode_macro TOP_HAT_DIAG_PATTERN]
description: Put the top-hat LEDs into a repeating RGB index pattern for one-photo diagnosis
gcode:
    {% set led = "Top_Hat_LEDs" %}
    {% set led_object = "neopixel " ~ led %}
    {% set led_count = printer[led_object].color_data|length %}

    # Start from all-off so stale state is not part of the photo.
    SET_LED LED={led} RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    G4 P500

    # Expected physical result from input end:
    #   1 red, 2 green, 3 blue, 4 red, 5 green, 6 blue...
    #
    # This intentionally does NOT send WHITE. The pasted top-hat config is GRB,
    # so this test checks the strip as a 3-channel RGB/GRB device first.
    {% for index in range(1, led_count + 1) %}
        {% set pattern_pos = (index - 1) % 3 %}

        {% if pattern_pos == 0 %}
            {% set red = 1.0 %}
            {% set green = 0.0 %}
            {% set blue = 0.0 %}
        {% elif pattern_pos == 1 %}
            {% set red = 0.0 %}
            {% set green = 1.0 %}
            {% set blue = 0.0 %}
        {% else %}
            {% set red = 0.0 %}
            {% set green = 0.0 %}
            {% set blue = 1.0 %}
        {% endif %}

        {% if index < led_count %}
            SET_LED LED={led} INDEX={index} RED={red} GREEN={green} BLUE={blue} TRANSMIT=0
        {% else %}
            SET_LED LED={led} INDEX={index} RED={red} GREEN={green} BLUE={blue} TRANSMIT=1
        {% endif %}
    {% endfor %}
    