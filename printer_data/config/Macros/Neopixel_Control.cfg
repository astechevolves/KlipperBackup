[gcode_macro _set_Top_Hat_LEDs]
description: Set one or more LEDs on the top hat LED chain using direct RGB/RGBW values
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1)|int %}

    # Read the live neopixel config so this macro follows the actual strip type.
    # RGB/GRB chains must not receive WHITE, or packet width/addressing shifts.
    # RGBW/GRBW chains need WHITE included so the white channel does not retain stale state.
    {% set led_section = "neopixel " ~ led %}
    {% set color_order = printer.configfile.config[led_section].color_order|default("GRB")|upper|string %}
    {% set has_white = "W" in color_order %}

    {% for led_index in idx %}
        {% set transmit = transmit_last if loop.last else 0 %}

        {% if has_white %}
            SET_LED LED={led} RED={red} GREEN={green} BLUE={blue} WHITE={white} INDEX={led_index|int} TRANSMIT={transmit}
        {% else %}
            SET_LED LED={led} RED={red} GREEN={green} BLUE={blue} INDEX={led_index|int} TRANSMIT={transmit}
        {% endif %}
    {% endfor %}

[gcode_macro _set_Top_Hat_LEDs_by_name]
description: Set top hat LEDs using a palette color name
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set color_name = params.COLOR|default("off")|lower|string %}
    {% set transmit = params.TRANSMIT|default(1)|int %}

    {% if color_name not in vars.palette %}
        RESPOND TYPE=error MSG="_set_Top_Hat_LEDs_by_name: unknown palette color '{color_name}'"

    {% else %}
        {% set color = vars.palette[color_name] %}

        _set_Top_Hat_LEDs LED={vars.hat_led_name} RED={color.r} GREEN={color.g} BLUE={color.b} WHITE={color.w} IDX="{vars.hat_idx}" TRANSMIT={transmit}
    {% endif %}


[gcode_macro _set_hat_leds]
description: Set top hat LEDs using direct RGBW values
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set transmit = params.TRANSMIT|default(1)|int %}

    _set_Top_Hat_LEDs LED={vars.hat_led_name} RED={red} GREEN={green} BLUE={blue} WHITE={white} IDX="{vars.hat_idx}" TRANSMIT={transmit}


[gcode_macro set_logo_leds_off]
