gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set tool = params.TOOL|default(vars.default_tool)|int %}

    _set_logo_leds TOOL={tool} RED=0 BLUE=0 GREEN=0 WHITE=0 TRANSMIT=1


