#####################################
#       TOOLHEAD STATIC HELPERS     #
#####################################

[gcode_macro SET_TOOLHEADS_STATIC]
description: Set one, all, or all non-active toolheads to their configured static colors
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set tool_count = vars.tool_count|int %}
    {% set all_tools = params.ALL|default(1)|int %}
    {% set except_active = params.EXCEPT_ACTIVE|default(0)|int %}

    # Resolve the active tool for EXCEPT_ACTIVE=1.
    # ACTIVE can override toolchanger detection for testing.
    {% if params.ACTIVE is defined %}
        {% set requested_active = params.ACTIVE|int %}
    {% elif printer.toolchanger is defined %}
        {% set requested_active = printer.toolchanger.tool_number|default(vars.default_tool)|int %}
    {% else %}
        {% set requested_active = vars.default_tool|int %}
    {% endif %}

    # Clamp invalid active tool numbers so bad state does not target a missing LED chain.
    {% if requested_active < 0 or requested_active >= tool_count %}
        {% set active_tool = vars.default_tool|int %}
    {% else %}
        {% set active_tool = requested_active %}
    {% endif %}

    # Resolve the single target tool for ALL=0.
    # TOOL overrides active-tool detection for manual LED testing.
    {% if params.TOOL is defined %}
        {% set requested_tool = params.TOOL|int %}
    {% elif printer.toolchanger is defined %}
        {% set requested_tool = printer.toolchanger.tool_number|default(vars.default_tool)|int %}
    {% else %}
        {% set requested_tool = vars.default_tool|int %}
    {% endif %}

    # Clamp invalid requested tool numbers so bad input does not target a missing LED chain.
    {% if requested_tool < 0 or requested_tool >= tool_count %}
        {% set single_tool = vars.default_tool|int %}
    {% else %}
        {% set single_tool = requested_tool %}
    {% endif %}

    {% for tool in range(tool_count) %}
        {% set tool_key = tool|string %}

        # Static tool colors are palette names. Use the configured fallback if the tool key is not listed.
        {% if tool_key in vars.tool_static_colors %}
            {% set color_name = vars.tool_static_colors[tool_key] %}
        {% else %}
            {% set color_name = vars.tool_static_colors['default'] %}
        {% endif %}

        {% if all_tools %}
            {% if not except_active or tool != active_tool %}
                # Set logo and nozzle separately to avoid stale mixed pixel state.
                _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR={color_name} TRANSMIT=1
                _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={color_name} TRANSMIT=1
            {% endif %}
        {% elif tool == single_tool %}
            # Set only the requested/current toolhead to its static identity color.
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR={color_name} TRANSMIT=1
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={color_name} TRANSMIT=1
        {% endif %}
    {% endfor %}


[gcode_macro _PRINT_START_TOOL_NOZZLE_STATE]
description: Set used tool nozzle LEDs white and idle tool nozzle LEDs to static tool colors
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}

    # TOOL is the first/active print tool from PRINT_START.
    {% set print_tool = params.TOOL|default(vars.default_tool)|int %}

    # USED_TOOLS comes from the slicer as a comma-separated list.
    # T0 is always added because it is used for reference homing/QGL/mesh.
    # print_tool is added as a fallback so the first print tool is marked even if USED_TOOLS is missing.
    {% set used_tools_raw = "0," ~ print_tool ~ "," ~ params.USED_TOOLS|default("")|string %}
    {% set used_tools = "," ~ used_tools_raw|replace(" ", "") ~ "," %}

    {% for tool in range(vars.tool_count|int) %}
        {% set tool_key = tool|string %}

        # Pull each tool's idle color from the static tool color map.
        # This keeps idle nozzle color matched to the logo/static identity color.
        {% if tool_key in vars.tool_static_colors %}
            {% set idle_color = vars.tool_static_colors[tool_key] %}
        {% else %}
            {% set idle_color = vars.tool_static_colors['default'] %}
        {% endif %}

        {% if "," ~ tool_key ~ "," in used_tools %}
            # Tools involved in startup/print get white nozzle LEDs.
            # Logos are not touched here; they stay static identity colors.
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR="white" TRANSMIT=1
        {% else %}
            # Inactive tools keep nozzle LEDs matched to their static/logo color.
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={idle_color} TRANSMIT=1
        {% endif %}
    {% endfor %}

#####################################################################
#                  Top Hat Error State Watcher
#####################################################################

[gcode_macro _TOP_HAT_ERROR_WATCH_STATE]
description: Runtime latch for top-hat error LED watcher
variable_error_latched: 0
gcode:
    # State-only macro. Variables are used by the delayed_gcode watcher.


[delayed_gcode _TOP_HAT_ERROR_WATCH]
initial_duration: 2.0
gcode:
    {% set state = printer.print_stats.state|default("")|string|lower %}
    {% set watch = printer["gcode_macro _TOP_HAT_ERROR_WATCH_STATE"] %}

    # When Klipper marks the print as errored, latch the top-hat LEDs red once.
    {% if state == "error" and watch.error_latched|int == 0 %}
        _set_Top_Hat_LEDs_by_name COLOR="red"
        SET_GCODE_VARIABLE MACRO=_TOP_HAT_ERROR_WATCH_STATE VARIABLE=error_latched VALUE=1
    {% endif %}

    # Clear the latch after the print state leaves error so a later error can trigger again.
    {% if state != "error" and watch.error_latched|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_TOP_HAT_ERROR_WATCH_STATE VARIABLE=error_latched VALUE=0
    {% endif %}

    # Keep watching while Klipper is running.
    UPDATE_DELAYED_GCODE ID=_TOP_HAT_ERROR_WATCH DURATION=2.0


#####################################################################
#                  Top Hat Print-End Flash
#####################################################################

[gcode_macro _TOP_HAT_PRINT_END_FLASH]
description: Random-looking multi-zone color flash for the top-hat LEDs at print end
variable_led_name: "Top_Hat_LEDs"
variable_brightness: 1.0
variable_flash_ms: 140
variable_dark_ms: 45
variable_repeat_count: 10
variable_final_red: 0.5
variable_final_green: 0.5
variable_final_blue: 0.5
gcode:
    {% set vars = printer["gcode_macro _TOP_HAT_PRINT_END_FLASH"] %}

    # Pull LED count from the live neopixel object so [neopixel] chain_count stays the source of truth.
    {% set led_object = "neopixel " ~ vars.led_name %}
    {% set led_count = printer[led_object].color_data|length %}

    # Allow temporary tuning from the console without editing the macro.
    {% set brightness_in = params.BRIGHTNESS|default(vars.brightness)|float %}
    {% set brightness = 1.0 if brightness_in > 1.0 else (0.0 if brightness_in < 0.0 else brightness_in) %}
    {% set flash_ms = params.FLASH_MS|default(vars.flash_ms)|int %}
    {% set dark_ms = params.DARK_MS|default(vars.dark_ms)|int %}
    {% set repeat_count = params.REPEAT|default(vars.repeat_count)|int %}

    # Final color defaults to dim white so the finished print is still visible.
    {% set final_red = params.FINAL_RED|default(vars.final_red)|float %}
    {% set final_green = params.FINAL_GREEN|default(vars.final_green)|float %}
    {% set final_blue = params.FINAL_BLUE|default(vars.final_blue)|float %}

    # RGB palette used for the pseudo-random flashing pattern.
    {% set palette = [
        ("RED",     1.00, 0.00, 0.00),
        ("ORANGE",  1.00, 0.25, 0.00),
        ("YELLOW",  1.00, 0.75, 0.00),
        ("GREEN",   0.00, 1.00, 0.00),
        ("CYAN",    0.00, 1.00, 1.00),
        ("BLUE",    0.00, 0.00, 1.00),
        ("PURPLE",  0.35, 0.00, 1.00),
        ("MAGENTA", 1.00, 0.00, 0.65),
        ("PINK",    1.00, 0.15, 0.35),
        ("WHITE",   1.00, 1.00, 1.00)
    ] %}

    # Scrambled order keeps the animation from looking like a simple rainbow chase.
    {% set order = [5, 0, 7, 2, 4, 8, 1, 6, 3, 9] %}

    # Each frame gives every LED/segment a different color, then flashes dark.
    {% for cycle in range(repeat_count) %}
        {% for frame in range(order|length) %}

            {% for led in range(1, led_count + 1) %}
                {% set color_index = order[(frame + led + (cycle * 3)) % (order|length)] %}
                {% set c = palette[color_index] %}

                # TRANSMIT=0 batches all LED updates; the final LED transmits the whole frame.
                {% if led < led_count %}
                    SET_LED LED={vars.led_name} INDEX={led} RED={(c[1] * brightness)|round(3)} GREEN={(c[2] * brightness)|round(3)} BLUE={(c[3] * brightness)|round(3)} TRANSMIT=0
                {% else %}
                    SET_LED LED={vars.led_name} INDEX={led} RED={(c[1] * brightness)|round(3)} GREEN={(c[2] * brightness)|round(3)} BLUE={(c[3] * brightness)|round(3)} TRANSMIT=1
                {% endif %}
            {% endfor %}

            G4 P{flash_ms}

            # Flash the chain dark between color frames.
            SET_LED LED={vars.led_name} RED=0.0 GREEN=0.0 BLUE=0.0
            G4 P{dark_ms}

        {% endfor %}
    {% endfor %}

    # Leave the top hat on a calm inspection light after the celebration flash.
    SET_LED LED={vars.led_name} RED={final_red} GREEN={final_green} BLUE={final_blue}


#####################################
#       STATUS DISPATCH HELPERS     #
#####################################

[gcode_macro _TOP_HAT_LED_STATUS]
description: Apply status color to top-hat LEDs only
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set status = params.STATUS|default("ready")|lower|string %}
    {% set enable = params.ENABLE|default(1)|int %}

    {% if status not in vars.status_colors %}
        RESPOND TYPE=error MSG="_TOP_HAT_LED_STATUS: unknown status '{status}'"

    {% elif enable %}
        {% set colors = vars.status_colors[status] %}
        {% set hat_color = colors.hat|default("off")|string %}

        # Top hat is the global machine status indicator.
        _set_Top_Hat_LEDs_by_name COLOR={hat_color}
    {% endif %}


[gcode_macro _TOOLHEAD_LED_STATUS]
description: Apply status color to toolhead nozzle LEDs, with optional logo control
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}
    {% set status = params.STATUS|default("ready")|lower|string %}

    # Default behavior:
    #   NOZZLE=1  Status changes nozzle LEDs.
    #   LOGO=0    Status does not change logo LEDs, preserving static tool identity colors.
    {% set use_nozzle = params.NOZZLE|default(1)|int %}
    {% set use_logo = params.LOGO|default(0)|int %}

    # TOOL parameter wins. Otherwise use the active toolchanger tool if available.
    {% if params.TOOL is defined %}
        {% set requested_tool = params.TOOL|int %}
    {% elif printer.toolchanger is defined %}
        {% set requested_tool = printer.toolchanger.tool_number|default(vars.default_tool)|int %}
    {% else %}
        {% set requested_tool = vars.default_tool|int %}
    {% endif %}

    # Clamp invalid tool numbers so status calls do not target a missing LED chain.
    {% if requested_tool < 0 or requested_tool >= vars.tool_count|int %}
        {% set tool = vars.default_tool|int %}
    {% else %}
        {% set tool = requested_tool %}
    {% endif %}

    {% if status not in vars.status_colors %}
        RESPOND TYPE=error MSG="_TOOLHEAD_LED_STATUS: unknown status '{status}'"

    {% else %}
        {% set colors = vars.status_colors[status] %}
        {% set nozzle_color = colors.nozzle|default("")|string %}
        {% set logo_color = colors.logo|default("")|string %}

        # Use the named-color helper. _set_nozzle_leds and _set_logo_leds are
        # direct RGBW helpers and do not accept COLOR=.
        {% if use_nozzle and nozzle_color|length > 0 %}
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR={nozzle_color} TRANSMIT=1
        {% endif %}

        # Logo LEDs remain static unless LOGO=1 is explicitly passed.
        {% if use_logo and logo_color|length > 0 %}
            _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR={logo_color} TRANSMIT=1
        {% endif %}
    {% endif %}


#####################################
#        STATUS MACROS              #
#####################################

[gcode_macro status_all_off]
description: Turn off every configured toolhead LED chain and the top hat LEDs
gcode:
    {% set vars = printer["gcode_macro _Toolhead_vars"] %}

    # This is the true all-off command; it does not preserve static tool colors.
    {% for tool in range(vars.tool_count|int) %}
        _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="logo" COLOR="off" TRANSMIT=1
        _set_Toolhead_LEDs_by_name TOOL={tool} LEDS="nozzle" COLOR="off" TRANSMIT=1
    {% endfor %}

    _set_Top_Hat_LEDs_by_name COLOR="off" TRANSMIT=1


[gcode_macro status_off]
description: Apply off status to top hat and active/resolved toolhead LEDs
gcode:
    _TOP_HAT_LED_STATUS STATUS=off
    _TOOLHEAD_LED_STATUS STATUS=off {% if params.TOOL is defined %}TOOL={params.TOOL}{% endif %} {% if params.NOZZLE is defined %}NOZZLE={params.NOZZLE}{% endif %} {% if params.LOGO is defined %}LOGO={params.LOGO}{% endif %}


