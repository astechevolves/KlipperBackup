    {% if tool == 0 and entrance_detected == 1 %}
        _DEBUG_MSG MSG="BUFFER_PREPRINT_PRELOAD_TOOL: tool={tool}, target={target}, step={step}, speed={speed}, accel={accel}, max_steps={max_steps}, entrance_detected={entrance_detected}, hotend_detected={hotend_detected}"
        MOVE_TO_PERCENT_BUFFER0 PERCENT={target} STEP={step} SPEED={speed} ACCEL={accel} MAX_STEPS={max_steps}
    {% elif tool == 0 %}
        _STATUS_MSG MSG="Buffer preload skipped - direct-feed/no-buffer mode"
        _DEBUG_MSG MSG="BUFFER_PREPRINT_PRELOAD_TOOL: skipped. tool={tool}, entrance_sensor={entrance_sensor}, entrance_detected={entrance_detected}, hotend_sensor={hotend_sensor}, hotend_detected={hotend_detected}"
