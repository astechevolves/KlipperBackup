#####################################################################
#                  Load Filament
#####################################################################
# Purpose:
# - Common load macro for the currently active toolhead.
# - If called without MATERIAL= or TEMP=, opens a material prompt.
# - Accepts MATERIAL=PLA/PETG/TPU/ABS and selects the matching load temp.
# - TEMP= can still override the material-selected temp manually.
# - Homes safely, moves to the purge bucket, heats, then loads/purges.
# - Buffer/direct-feed is decided from live sensors only:
#   - buffer entrance detected = buffer mode
#   - entrance clear + toolhead sensor detected = direct-feed mode
#   - both clear = no-filament error
# - DIRECT_FEED=1 forces all buffer behavior to be skipped.
#####################################################################

[gcode_macro LOAD_FILAMENT]

#####################################################################
# General load / purge tuning
#####################################################################

variable_load_distance: 10
variable_purge_distance: 85
variable_purge_chunk: 5
variable_purge_speed: 120                  # Purge extrusion speed in mm/min. 120 = 2mm/s filament feed

#####################################################################
# Material load temperature tuning
#####################################################################

variable_load_temp: 240
variable_pla_load_temp: 220
variable_petg_load_temp: 240
variable_tpu_load_temp: 225
variable_abs_load_temp: 250

#####################################################################
# Homing / bucket tuning
#####################################################################

variable_home_temp: 150
variable_home_cool_target: 145
variable_purge_bucket_x: 310
variable_purge_bucket_y: 0
variable_purge_bucket_z: 5
variable_travel_speed: 9000
variable_z_travel_speed: 1200

#####################################################################
# Buffer control
#####################################################################

variable_verify_buffer_before_load: 1
variable_buffer_auto_during_load: 1
variable_keep_buffer_active: 0

# Buffer capture before hotend extrusion.
# If the buffer entrance sees filament but the hotend sensor does not,
# run a blocking sensor-feedback loop before allowing the hotend
# extruder to move.
#
# Important:
# - This is NOT the 1800mm initial stage move.
# - The 1800mm long stage belongs in buffer0.cfg STAGE_FILAMENT_BUFFER0
#   when filament is first inserted at the buffer entrance.
# - This loop acts like a feeler: move a small step, recheck T0 sensor,
#   repeat until the T0 sensor detects filament or max steps is reached.
variable_capture_buffer_before_load: 1
variable_capture_buffer_step_distance: 10       # Blocking feeler step distance in mm.
variable_capture_buffer_step_speed: 30          # Blocking feeler move speed in mm/s.
variable_capture_buffer_step_accel: 300         # Blocking feeler move acceleration in mm/s^2.
variable_capture_buffer_max_steps: 80           # 80 * 10mm = 800mm maximum capture search distance.

# After the T0/toolhead sensor catches filament, fill the Buffer0 neck before
# hotend extrusion starts. The T0 sensor can be physically upstream of the
# extruder entrance, so detecting filament there does not guarantee the
# extruder gears can grab yet.
variable_capture_buffer_fill_after_sensor: 1    # 1 = blocking-fill Buffer0 after T0 sensor detects filament.
variable_capture_buffer_fill_percent: 100       # Target buffer percent after capture; 100 = fully filled/extended.
variable_capture_buffer_fill_step: 5            # Blocking fill step size in mm.
variable_capture_buffer_fill_speed: 30          # Blocking fill speed in mm/s.
variable_capture_buffer_fill_accel: 300         # Blocking fill acceleration in mm/s^2.
variable_capture_buffer_fill_max_steps: 20      # Safety limit for fill-to-percent loop.

variable_capture_buffer_fail_beeps: 3           # Alert count if capture fails before max steps.

gcode:
    {% set prompt_purge_speed = params.PURGE_SPEED|default(params.SPEED|default(purge_speed))|float %}

    #################################################################
    # KlipperScreen stock Load button safety gate
    #################################################################

    {% set material_prompt_needed = params.MATERIAL is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to load."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_LOAD_MATERIAL MATERIAL=PLA PURGE_SPEED={prompt_purge_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_LOAD_MATERIAL MATERIAL=PETG PURGE_SPEED={prompt_purge_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_LOAD_MATERIAL MATERIAL=TPU PURGE_SPEED={prompt_purge_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_LOAD_MATERIAL MATERIAL=ABS PURGE_SPEED={prompt_purge_speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}

        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_velocity = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %}
        {% set material = params.MATERIAL|default("PLA")|upper|string %}
        {% set direct_feed_override = params.DIRECT_FEED|default(0)|int %}

        {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

        {% if active_extruder == "extruder" %}
            {% set buffer_entrance_sensor = sensors.tool0_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set buffer_entrance_sensor = sensors.tool1_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set buffer_entrance_sensor = sensors.tool2_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set buffer_entrance_sensor = sensors.tool3_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set buffer_entrance_sensor = "" %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set buffer_entrance_detected = 1 if buffer_entrance_sensor|length > 0 and buffer_entrance_sensor in printer and printer[buffer_entrance_sensor].filament_detected|int == 1 else 0 %}
        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        # Entrance wins. Direct-feed only applies when entrance is clear and the toolhead sensor sees filament.
        {% set use_buffer_for_load = 1 if direct_feed_override == 0 and buffer_entrance_detected == 1 else 0 %}
        {% set use_direct_feed_for_load = 1 if direct_feed_override == 1 or (buffer_entrance_detected == 0 and toolhead_detected == 1) else 0 %}

        {% set load_distance = params.LOAD_DISTANCE|default(load_distance)|float %}
        {% set purge_distance = params.PURGE_DISTANCE|default(purge_distance)|float %}
        {% set purge_chunk = params.PURGE_CHUNK|default(purge_chunk)|float %}
        {% set purge_speed = params.PURGE_SPEED|default(params.SPEED|default(purge_speed))|float %}

        {% if params.TEMP is defined %}
            {% set load_temp = params.TEMP|float %}
        {% elif material == "PLA" %}
            {% set load_temp = pla_load_temp|float %}
        {% elif material == "PETG" %}
            {% set load_temp = petg_load_temp|float %}
        {% elif material == "TPU" %}
            {% set load_temp = tpu_load_temp|float %}
        {% elif material == "ABS" %}
            {% set load_temp = abs_load_temp|float %}
        {% else %}
            {% set load_temp = load_temp|float %}
        {% endif %}

        {% set home_temp = params.HOME_TEMP|default(home_temp)|float %}
        {% set home_cool_target = params.HOME_COOL_TARGET|default(home_cool_target)|float %}

        {% set bucket_x = params.BUCKET_X|default(purge_bucket_x)|float %}
        {% set bucket_y = params.BUCKET_Y|default(purge_bucket_y)|float %}
        {% set bucket_z = params.BUCKET_Z|default(purge_bucket_z)|float %}
        {% set travel_speed = params.TRAVEL_SPEED|default(travel_speed)|float %}
        {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(z_travel_speed)|float %}

        {% set verify_buffer_before_load = params.VERIFY_BUFFER|default(verify_buffer_before_load)|int %}
        {% set buffer_auto_during_load = params.BUFFER_AUTO_DURING_LOAD|default(buffer_auto_during_load)|int %}
        {% set keep_buffer_active = params.KEEP_BUFFER_ACTIVE|default(keep_buffer_active)|int %}

        {% set capture_buffer_before_load = params.CAPTURE_BUFFER|default(capture_buffer_before_load)|int %}
        {% set capture_buffer_step_distance = params.CAPTURE_BUFFER_STEP_DISTANCE|default(capture_buffer_step_distance)|float %}
        {% set capture_buffer_step_speed = params.CAPTURE_BUFFER_STEP_SPEED|default(capture_buffer_step_speed)|float %}
        {% set capture_buffer_step_accel = params.CAPTURE_BUFFER_STEP_ACCEL|default(capture_buffer_step_accel)|float %}
        {% set capture_buffer_max_steps = params.CAPTURE_BUFFER_MAX_STEPS|default(capture_buffer_max_steps)|int %}
        {% set capture_buffer_fill_after_sensor = params.CAPTURE_BUFFER_FILL_AFTER_SENSOR|default(capture_buffer_fill_after_sensor)|int %}
        {% set capture_buffer_fill_percent = params.CAPTURE_BUFFER_FILL_PERCENT|default(capture_buffer_fill_percent)|float %}
        {% set capture_buffer_fill_step = params.CAPTURE_BUFFER_FILL_STEP|default(capture_buffer_fill_step)|float %}
        {% set capture_buffer_fill_speed = params.CAPTURE_BUFFER_FILL_SPEED|default(capture_buffer_fill_speed)|float %}
        {% set capture_buffer_fill_accel = params.CAPTURE_BUFFER_FILL_ACCEL|default(capture_buffer_fill_accel)|float %}
        {% set capture_buffer_fill_max_steps = params.CAPTURE_BUFFER_FILL_MAX_STEPS|default(capture_buffer_fill_max_steps)|int %}
        {% set capture_buffer_fail_beeps = params.CAPTURE_BUFFER_FAIL_BEEPS|default(capture_buffer_fail_beeps)|int %}

        _STATUS_MSG MSG="Loading {material} filament"
        _DEBUG_MSG MSG="LOAD_FILAMENT: material={material}, active_extruder={active_extruder}, load_temp={load_temp}, load_distance={load_distance}, purge_distance={purge_distance}, purge_chunk={purge_chunk}, purge_speed={purge_speed}, buffer_sensor={buffer_entrance_sensor}, buffer_detected={buffer_entrance_detected}, toolhead_sensor={toolhead_sensor}, toolhead_detected={toolhead_detected}, direct_feed_override={direct_feed_override}, use_buffer={use_buffer_for_load}, use_direct_feed={use_direct_feed_for_load}, buffer_auto_during_load={buffer_auto_during_load}"

        {% if use_buffer_for_load == 0 and use_direct_feed_for_load == 0 %}
            _BEEP
            { action_raise_error("LOAD_FILAMENT: no filament detected at buffer entrance or toolhead sensor.") }
        {% endif %}

        {% if use_buffer_for_load == 0 %}
            _STATUS_MSG MSG="Direct-feed load mode - buffer ignored"
            BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
        {% endif %}

        M117 Loading {material}

        {% set nozzle_temp = printer[active_extruder].temperature|float %}
        {% set homed_axes = printer.toolhead.homed_axes %}
        {% set printer_homed = 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %}

        {% if printer_homed and nozzle_temp > home_temp %}
            _DEBUG_MSG MSG="LOAD_FILAMENT: printer homed and nozzle above home_temp, skipping warmup/home prep"

        {% elif not printer_homed and nozzle_temp > home_temp %}
            M117 Nozzle too hot, waiting until cool to home
            _STATUS_MSG MSG="Cooling nozzle before homing"
            _DEBUG_MSG MSG="LOAD_FILAMENT: nozzle_temp={nozzle_temp}, home_temp={home_temp}, home_cool_target={home_cool_target}"
            M104 S{home_cool_target}
            TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={home_temp}
            _CG28

        {% elif not printer_homed and nozzle_temp <= home_temp %}
            _STATUS_MSG MSG="Homing printer"
            M104 S{home_temp}
            _CG28

        {% else %}
            _DEBUG_MSG MSG="LOAD_FILAMENT: printer homed and nozzle cool, setting standby temp"
            M104 S{home_temp}
        {% endif %}

        SAVE_GCODE_STATE NAME=load_state

        M104 S{load_temp}
        G90

        M117 Moving to purge bucket
        _STATUS_MSG MSG="Moving to purge bucket"
        _DEBUG_MSG MSG="LOAD_FILAMENT: bucket_x={bucket_x}, bucket_y={bucket_y}, bucket_z={bucket_z}, travel_speed={travel_speed}, z_travel_speed={z_travel_speed}"
        G1 Z{bucket_z} F{z_travel_speed}
        G1 X{bucket_x} F{travel_speed}
        G1 Y{bucket_y} F{travel_speed}

        G91

        M117 Heating nozzle
        _STATUS_MSG MSG="Heating {material} to {load_temp}C"
        M109 S{load_temp}
        _BEEP

        #################################################################
        # Buffer setup for load
        #################################################################

        {% if buffer_auto_during_load == 1 and use_buffer_for_load == 1 %}
            _STATUS_MSG MSG="Buffer load assist armed"
            _DEBUG_MSG MSG="LOAD_FILAMENT: disabling normal auto maintain before load-specific assist"
            DISABLE_AUTO_BUFFER0
            STOP_PERCENT_MOVE_BUFFER0
        {% elif use_buffer_for_load == 0 %}
            _STATUS_MSG MSG="Buffer load assist skipped - direct feed"
            _DEBUG_MSG MSG="LOAD_FILAMENT: buffer skipped because direct-feed/no-buffer mode is active"
        {% else %}
            _STATUS_MSG MSG="Buffer load assist skipped"
            _DEBUG_MSG MSG="LOAD_FILAMENT: BUFFER_AUTO_DURING_LOAD=0"
        {% endif %}

        M83
        G92 E0

        #################################################################
        # Load continuation state
        #
        # Klipper macros are expanded before moves finish, so a true
        # sensor-feedback loop cannot recursively call itself inside the
        # same macro. The capture/fill steps below use delayed_gcode
        # state machines. When those finish, they call
        # _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE to run the hotend load.
        #################################################################

        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=material VALUE="'{material}'"
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=load_distance VALUE={load_distance}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=max_velocity VALUE={max_velocity}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=purge_distance VALUE={purge_distance}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=purge_chunk VALUE={purge_chunk}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=purge_speed VALUE={purge_speed}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_x VALUE={bucket_x}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_y VALUE={bucket_y}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=bucket_z VALUE={bucket_z}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=travel_speed VALUE={travel_speed}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=z_travel_speed VALUE={z_travel_speed}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=use_buffer_for_load VALUE={use_buffer_for_load}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=buffer_auto_during_load VALUE={buffer_auto_during_load}
        SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT_CONTINUE_STATE VARIABLE=keep_buffer_active VALUE={keep_buffer_active}

        #################################################################
        # Initial hotend load gate
        #
        # Buffer mode sequence:
        # 1. If T0/toolhead sensor is clear, run the capture feeler loop.
        # 2. Once T0/toolhead sensor catches filament, fill Buffer0.
        # 3. Only then continue to hotend load/purge.
        #
        # Direct-feed mode skips all buffer capture/fill work.
        #################################################################

        {% if capture_buffer_before_load == 1 and use_buffer_for_load == 1 and toolhead_detected == 0 %}
            {% if toolhead_sensor|length == 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: toolhead filament sensor is not configured, cannot safely capture buffer filament before load.") }

            {% elif toolhead_sensor not in printer %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: configured toolhead filament sensor not found: " ~ toolhead_sensor) }

            {% elif capture_buffer_step_distance <= 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: CAPTURE_BUFFER_STEP_DISTANCE must be greater than 0.") }

            {% elif capture_buffer_max_steps <= 0 %}
                _BEEP
                { action_raise_error("LOAD_FILAMENT: CAPTURE_BUFFER_MAX_STEPS must be greater than 0.") }

            {% else %}
                _STATUS_MSG MSG="Capturing buffered filament at toolhead sensor"
                _DEBUG_MSG MSG="LOAD_FILAMENT: starting delayed blocking capture before hotend extrusion. step={capture_buffer_step_distance}mm, speed={capture_buffer_step_speed}, accel={capture_buffer_step_accel}, max_steps={capture_buffer_max_steps}, fill_after_sensor={capture_buffer_fill_after_sensor}, fill_percent={capture_buffer_fill_percent}, entrance_sensor={buffer_entrance_sensor}, toolhead_sensor={toolhead_sensor}"

                DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
                STOP_PERCENT_MOVE_BUFFER0

                _LOAD_CAPTURE_BUFFER_START_ACTIVE_TOOL STEP_DISTANCE={capture_buffer_step_distance} STEP_SPEED={capture_buffer_step_speed} STEP_ACCEL={capture_buffer_step_accel} MAX_STEPS={capture_buffer_max_steps} FILL_AFTER_SENSOR={capture_buffer_fill_after_sensor} FILL_PERCENT={capture_buffer_fill_percent} FILL_STEP={capture_buffer_fill_step} FILL_SPEED={capture_buffer_fill_speed} FILL_ACCEL={capture_buffer_fill_accel} FILL_MAX_STEPS={capture_buffer_fill_max_steps} FAIL_BEEPS={capture_buffer_fail_beeps}
            {% endif %}

        {% elif capture_buffer_before_load == 1 and use_buffer_for_load == 1 and toolhead_detected == 1 and capture_buffer_fill_after_sensor == 1 %}
            _STATUS_MSG MSG="Toolhead sensor already has filament; filling Buffer0 before hotend load"
            _DEBUG_MSG MSG="LOAD_FILAMENT: toolhead sensor already detects filament, running blocking delayed fill to {capture_buffer_fill_percent}% before hotend extrusion"

            DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
            STOP_PERCENT_MOVE_BUFFER0

            _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL TARGET={capture_buffer_fill_percent} STEP={capture_buffer_fill_step} SPEED={capture_buffer_fill_speed} ACCEL={capture_buffer_fill_accel} MAX_STEPS={capture_buffer_fill_max_steps}

        {% elif buffer_auto_during_load == 1 and verify_buffer_before_load == 1 and use_buffer_for_load == 1 %}
            _STATUS_MSG MSG="Preloading Buffer0"
            _DEBUG_MSG MSG="LOAD_FILAMENT: PRELOAD_FOR_HOTEND_LOAD_BUFFER0 before initial E load"
            PRELOAD_FOR_HOTEND_LOAD_BUFFER0
            M400
            _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE

        {% else %}
            _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE
        {% endif %}

    {% endif %}

#####################################################################
#                  Load Filament Continuation State
#####################################################################
# Purpose:
# - Stores values needed after the delayed capture/fill state machine
#   completes.
# - This avoids recursive macros while keeping the real motion order:
#   heat -> capture -> fill buffer -> hotend load -> purge.
#####################################################################

[gcode_macro _LOAD_FILAMENT_CONTINUE_STATE]
description: Runtime state used by delayed LOAD_FILAMENT capture/fill continuation
variable_material: "PLA"
variable_load_distance: 10.0
variable_max_velocity: 300.0
variable_purge_distance: 50.0
variable_purge_chunk: 5.0
variable_purge_speed: 120.0
variable_bucket_x: 310.0
variable_bucket_y: 0.0
variable_bucket_z: 5.0
variable_travel_speed: 9000.0
variable_z_travel_speed: 1200.0
variable_use_buffer_for_load: 0
variable_buffer_auto_during_load: 0
variable_keep_buffer_active: 0
gcode:
    # Runtime storage only.


[gcode_macro _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE]
description: Continue LOAD_FILAMENT after buffer capture/fill completes
gcode:
    {% set s = printer["gcode_macro _LOAD_FILAMENT_CONTINUE_STATE"] %}

    {% set material = s.material|string %}
    {% set load_distance = s.load_distance|float %}
    {% set max_velocity = s.max_velocity|float %}
    {% set purge_distance = s.purge_distance|float %}
    {% set purge_chunk = s.purge_chunk|float %}
    {% set speed = s.purge_speed|float %}
    {% set bucket_x = s.bucket_x|float %}
    {% set bucket_y = s.bucket_y|float %}
    {% set bucket_z = s.bucket_z|float %}
    {% set travel_speed = s.travel_speed|float %}
    {% set z_travel_speed = s.z_travel_speed|float %}
    {% set use_buffer_for_load = s.use_buffer_for_load|int %}
    {% set buffer_auto_during_load = s.buffer_auto_during_load|int %}
    {% set keep_buffer_active = s.keep_buffer_active|int %}

    _STATUS_MSG MSG="Loading into hotend"
    _DEBUG_MSG MSG="LOAD_FILAMENT_CONTINUE: starting hotend load after capture/fill. material={material}, load_distance={load_distance}, purge_distance={purge_distance}, purge_chunk={purge_chunk}, purge_speed={speed}, use_buffer={use_buffer_for_load}"

    M83
    G92 E0

    G1 E{load_distance} F{max_velocity}
    M400

    #################################################################
    # Purge
    #################################################################

    {% set purge_loops = (purge_distance / purge_chunk)|round(0, 'floor')|int %}
    {% set purge_remainder = purge_distance - (purge_loops * purge_chunk) %}

    _STATUS_MSG MSG="Purging {material}"
    _DEBUG_MSG MSG="LOAD_FILAMENT_CONTINUE: purge_loops={purge_loops}, purge_remainder={purge_remainder}, purge_speed={speed}"

    {% for i in range(purge_loops) %}
        {% if buffer_auto_during_load == 1 and use_buffer_for_load == 1 %}
            PRELOAD_FOR_HOTEND_LOAD_BUFFER0
            M400
        {% endif %}

        G1 E{purge_chunk} F{speed}
        M400
    {% endfor %}

    {% if purge_remainder > 0 %}
        {% if buffer_auto_during_load == 1 and use_buffer_for_load == 1 %}
            PRELOAD_FOR_HOTEND_LOAD_BUFFER0
            M400
        {% endif %}

        G1 E{purge_remainder} F{speed}
        M400
    {% endif %}

    M400
    _WAIT TIME=20

    G1 E-0.6 F1800
    M400
    _WAIT TIME=6

    G90
    G1 Z{bucket_z} F{z_travel_speed}
    G1 X{bucket_x} Y{bucket_y} F{travel_speed}

    _STATUS_MSG MSG="Wiping nozzle"
    _WIPE_NOZZLE

    G90
    G1 Z{bucket_z} F{z_travel_speed}
    G1 X{bucket_x} Y{bucket_y} F{travel_speed}

    {% if use_buffer_for_load == 1 %}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_print_only VALUE=1
    {% endif %}

    {% if keep_buffer_active == 0 or use_buffer_for_load == 0 %}
        _STATUS_MSG MSG="Disabling buffer"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% else %}
        _STATUS_MSG MSG="Buffer auto maintain left enabled"
        _DEBUG_MSG MSG="LOAD_FILAMENT_CONTINUE: KEEP_BUFFER_ACTIVE=1, leaving active-tool buffer auto maintain enabled"
        BUFFER_ARM_ACTIVE_TOOL
    {% endif %}

    M117 {material} load complete
    _STATUS_MSG MSG="{material} load complete"

    RESTORE_GCODE_STATE NAME=load_state


#####################################################################
#                  Delayed Buffer Load Capture State Machine
#####################################################################
# Purpose:
# - Avoids recursive macros.
# - Moves Buffer0 one blocking step, returns control to Klipper, then
#   rechecks the toolhead filament sensor on the next delayed tick.
# - When the toolhead sensor detects filament, starts a delayed blocking
#   fill of Buffer0, then continues LOAD_FILAMENT.
#####################################################################

[gcode_macro _LOAD_CAPTURE_BUFFER_STATE]
description: Runtime state for delayed Buffer0 load capture
variable_active: 0
variable_step_index: 0
variable_step_distance: 10.0
variable_step_speed: 30.0
variable_step_accel: 300.0
variable_max_steps: 80
variable_fill_after_sensor: 1
variable_fill_percent: 100.0
variable_fill_step: 5.0
variable_fill_speed: 30.0
variable_fill_accel: 300.0
variable_fill_max_steps: 20
variable_fail_beeps: 3
gcode:
    # Runtime storage only.


[gcode_macro _LOAD_CAPTURE_BUFFER_START_ACTIVE_TOOL]
description: Start delayed Buffer0 feeler loop until active toolhead sensor detects filament
gcode:
    {% set step_distance = params.STEP_DISTANCE|default(10)|float %}
    {% set step_speed = params.STEP_SPEED|default(30)|float %}
    {% set step_accel = params.STEP_ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(80)|int %}
    {% set fill_after_sensor = params.FILL_AFTER_SENSOR|default(1)|int %}
    {% set fill_percent = params.FILL_PERCENT|default(100)|float %}
    {% set fill_step = params.FILL_STEP|default(5)|float %}
    {% set fill_speed = params.FILL_SPEED|default(30)|float %}
    {% set fill_accel = params.FILL_ACCEL|default(300)|float %}
    {% set fill_max_steps = params.FILL_MAX_STEPS|default(20)|int %}
    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}

    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_index VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_distance VALUE={step_distance}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_speed VALUE={step_speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_accel VALUE={step_accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=max_steps VALUE={max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_after_sensor VALUE={fill_after_sensor}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_percent VALUE={fill_percent}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_step VALUE={fill_step}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_speed VALUE={fill_speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_accel VALUE={fill_accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fill_max_steps VALUE={fill_max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=fail_beeps VALUE={fail_beeps}

    UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_TICK DURATION=0.01


[delayed_gcode _LOAD_CAPTURE_BUFFER_TICK]
gcode:
    {% set st = printer["gcode_macro _LOAD_CAPTURE_BUFFER_STATE"] %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}

    {% set active = st.active|int %}
    {% set step_index = st.step_index|int %}
    {% set step_distance = st.step_distance|float %}
    {% set step_speed = st.step_speed|float %}
    {% set step_accel = st.step_accel|float %}
    {% set max_steps = st.max_steps|int %}
    {% set fill_after_sensor = st.fill_after_sensor|int %}
    {% set fill_percent = st.fill_percent|float %}
    {% set fill_step = st.fill_step|float %}
    {% set fill_speed = st.fill_speed|float %}
    {% set fill_accel = st.fill_accel|float %}
    {% set fill_max_steps = st.fill_max_steps|int %}
    {% set fail_beeps = st.fail_beeps|int %}

    {% if active == 1 %}
        {% if active_extruder == "extruder" %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        {% if toolhead_sensor|length == 0 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_CAPTURE_BUFFER: no toolhead filament sensor configured for " ~ active_extruder) }

        {% elif toolhead_sensor not in printer %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_CAPTURE_BUFFER: configured toolhead sensor not found: " ~ toolhead_sensor) }

        {% elif toolhead_detected == 1 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            _STATUS_MSG MSG="Toolhead sensor detected filament; filling Buffer0"
            _DEBUG_MSG MSG="LOAD_CAPTURE_BUFFER: T0/toolhead sensor caught filament at step={step_index}; fill_after_sensor={fill_after_sensor}, fill_percent={fill_percent}"

            {% if fill_after_sensor == 1 %}
                _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL TARGET={fill_percent} STEP={fill_step} SPEED={fill_speed} ACCEL={fill_accel} MAX_STEPS={fill_max_steps}
            {% else %}
                _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE
            {% endif %}

        {% elif step_index >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=active VALUE=0
            {% for i in range(fail_beeps) %}
                _BEEP
                G4 P400
            {% endfor %}
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("LOAD_FILAMENT aborted: toolhead filament sensor never detected filament after Buffer0 capture steps. Not starting hotend load.") }

        {% else %}
            _DEBUG_MSG MSG="LOAD_CAPTURE_BUFFER: feeler step={step_index + 1}/{max_steps}, move={step_distance}mm, speed={step_speed}, accel={step_accel}"

            MOVE_BUFFER0 DISTANCE={step_distance} SPEED={step_speed} ACCEL={step_accel}
            M400

            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_STATE VARIABLE=step_index VALUE={step_index + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_TICK DURATION=0.01
        {% endif %}
    {% endif %}


#####################################################################
#                  Delayed Blocking Buffer Fill State Machine
#####################################################################
# Purpose:
# - Avoids recursive fill macros.
# - Moves Buffer0 one blocking Hall-feedback step per delayed tick.
# - Continues LOAD_FILAMENT only after target percent is reached.
#####################################################################

[gcode_macro _LOAD_CAPTURE_BUFFER_FILL_STATE]
description: Runtime state for delayed Buffer0 fill after capture
variable_active: 0
variable_target: 100.0
variable_step: 5.0
variable_speed: 30.0
variable_accel: 300.0
variable_max_steps: 20
variable_step_index: 0
variable_tolerance: 1.0
gcode:
    # Runtime storage only.


[gcode_macro _LOAD_CAPTURE_BUFFER_FILL_START_ACTIVE_TOOL]
description: Start delayed blocking fill of active tool buffer before hotend load
gcode:
    {% set target = params.TARGET|default(100)|float %}
    {% set step = params.STEP|default(5)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(20)|int %}
    {% set tolerance = params.TOLERANCE|default(1)|float %}

    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=accel VALUE={accel}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=max_steps VALUE={max_steps}
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step_index VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=tolerance VALUE={tolerance}

    UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_FILL_TICK DURATION=0.01


[delayed_gcode _LOAD_CAPTURE_BUFFER_FILL_TICK]
gcode:
    {% set st = printer["gcode_macro _LOAD_CAPTURE_BUFFER_FILL_STATE"] %}
    {% set vars = printer["gcode_macro _VARS_BUFFER0"] %}

    {% set active = st.active|int %}
    {% set target = st.target|float %}
    {% set step = st.step|float %}
    {% set speed = st.speed|float %}
    {% set accel = st.accel|float %}
    {% set max_steps = st.max_steps|int %}
    {% set step_index = st.step_index|int %}
    {% set tolerance = st.tolerance|float %}
    {% set move_sign = vars.percent_move_sign|int %}

    {% if active == 1 %}
        {% set h1 = printer["gcode_button " ~ vars.hall1_object].state|string %}
        {% set h2 = printer["gcode_button " ~ vars.hall2_object].state|string %}
        {% set h3 = printer["gcode_button " ~ vars.hall3_object].state|string %}

        {% set h1p = h1|upper == "PRESSED" %}
        {% set h2p = h2|upper == "PRESSED" %}
        {% set h3p = h3|upper == "PRESSED" %}

        {% if (not h3p) and h2p and h1p %}
            {% set state = "FULL_RETRACTED" %}
            {% set pct = 0.0 %}
            {% set valid = 1 %}
        {% elif h3p and h2p and h1p %}
            {% set state = "LOW_BUFFER" %}
            {% set pct = 25.0 %}
            {% set valid = 1 %}
        {% elif h3p and (not h2p) and h1p %}
            {% set state = "HALF_EXTENDED" %}
            {% set pct = 50.0 %}
            {% set valid = 1 %}
        {% elif h3p and (not h2p) and (not h1p) %}
            {% set state = "HIGH_BUFFER" %}
            {% set pct = 75.0 %}
            {% set valid = 1 %}
        {% elif h3p and h2p and (not h1p) %}
            {% set state = "FULL_EXTENDED" %}
            {% set pct = 100.0 %}
            {% set valid = 1 %}
        {% else %}
            {% set state = "INVALID" %}
            {% set pct = -1.0 %}
            {% set valid = 0 %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall1 VALUE="'{h1}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall2 VALUE="'{h2}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=last_hall3 VALUE="'{h3}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_state VALUE="'{state}'"
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_percent VALUE={pct}
        SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=buffer_valid VALUE={valid}

        {% set error = target - pct %}
        {% set abs_error = error|abs %}

        {% if valid == 0 %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _BEEP
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("Buffer0 fill before load stopped: invalid Hall state H3=" ~ h3 ~ " H2=" ~ h2 ~ " H1=" ~ h1) }

        {% elif abs_error <= tolerance or pct >= target %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _DEBUG_MSG MSG="Buffer0 fill before load complete: state={state}, current={pct}%, target={target}%"
            _LOAD_FILAMENT_CONTINUE_AFTER_CAPTURE

        {% elif step_index >= max_steps %}
            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=active VALUE=0
            _BEEP
            RESTORE_GCODE_STATE NAME=load_state
            { action_raise_error("Buffer0 fill before load stopped: max steps reached. state=" ~ state ~ " current=" ~ pct ~ "% target=" ~ target ~ "%") }

        {% else %}
            {% if error > 0 %}
                {% set move_distance = step * move_sign %}
            {% else %}
                {% set move_distance = step * move_sign * -1 %}
            {% endif %}

            _DEBUG_MSG MSG="Buffer0 fill before load step {step_index + 1}/{max_steps}: state={state}, current={pct}%, target={target}%, move={move_distance}mm"

            MOVE_BUFFER0 DISTANCE={move_distance} SPEED={speed} ACCEL={accel}
            M400

            SET_GCODE_VARIABLE MACRO=_LOAD_CAPTURE_BUFFER_FILL_STATE VARIABLE=step_index VALUE={step_index + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_CAPTURE_BUFFER_FILL_TICK DURATION=0.01
        {% endif %}
    {% endif %}


#####################################################################
#                  Active Tool Buffer Unload Tension Router
#####################################################################
# Purpose:
# - Shared router for UNLOAD_FILAMENT.
# - Starts/stops Buffer0 pull assist for the active tool.
# - Pull direction is negative because retract pulls filament back
#   toward the buffer.
#####################################################################

[gcode_macro BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL]
description: Start unload pull assist on the buffer paired to the active toolhead
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set distance = params.DISTANCE|default(100)|float %}
    {% set speed = params.SPEED|default(25)|float %}
    {% set accel = params.ACCEL|default(300)|float %}
    {% set current = params.CURRENT|default("CONFIG")|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    {% if active_extruder == "extruder" %}
        {% set entrance_sensor = sensors.tool0_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool0_hotend_sensor|string %}
    {% elif active_extruder == "extruder1" %}
        {% set entrance_sensor = sensors.tool1_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool1_hotend_sensor|string %}
    {% elif active_extruder == "extruder2" %}
        {% set entrance_sensor = sensors.tool2_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool2_hotend_sensor|string %}
    {% elif active_extruder == "extruder3" %}
        {% set entrance_sensor = sensors.tool3_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool3_hotend_sensor|string %}
    {% else %}
        {% set entrance_sensor = "" %}
        {% set hotend_sensor = "" %}
    {% endif %}

    {% set entrance_detected = 1 if entrance_sensor|length > 0 and entrance_sensor in printer and printer[entrance_sensor].filament_detected|int == 1 else 0 %}
    {% set hotend_detected = 1 if hotend_sensor|length > 0 and hotend_sensor in printer and printer[hotend_sensor].filament_detected|int == 1 else 0 %}

    {% if active_extruder == "extruder" and entrance_detected == 1 %}
        _DEBUG_MSG MSG="BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL: active_extruder={active_extruder}, distance={distance}, speed={speed}, accel={accel}, current={current}, entrance_detected={entrance_detected}, hotend_detected={hotend_detected}"

        DISABLE_AUTO_BUFFER0
        STOP_PERCENT_MOVE_BUFFER0

        {% if current|upper != "CONFIG" %}
            SET_TMC_CURRENT STEPPER=buffer0_motor CURRENT={current|float}
        {% endif %}

        MANUAL_STEPPER STEPPER=buffer0_motor ENABLE=1
        MANUAL_STEPPER STEPPER=buffer0_motor SET_POSITION=0
        MANUAL_STEPPER STEPPER=buffer0_motor MOVE={distance * -1} SPEED={speed} ACCEL={accel} SYNC=0

    {% elif active_extruder == "extruder" %}
        _STATUS_MSG MSG="Buffer unload tension skipped - direct-feed/no-buffer mode"
        _DEBUG_MSG MSG="BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL: skipped. entrance_sensor={entrance_sensor}, entrance_detected={entrance_detected}, hotend_sensor={hotend_sensor}, hotend_detected={hotend_detected}"
    {% else %}
        M118 No unload tension start route for active extruder: {active_extruder}
    {% endif %}

[gcode_macro BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL]
description: Stop unload pull assist on the buffer paired to the active toolhead
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set current = params.CURRENT|default("CONFIG")|string %}
    {% set cfg_current = printer.configfile.settings["tmc2208 manual_stepper buffer0_motor"].run_current|float %}

    {% if active_extruder == "extruder" %}
        _DEBUG_MSG MSG="BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL: active_extruder={active_extruder}, release={release}, current={current}, cfg_current={cfg_current}"

        {% if current|upper == "CONFIG" %}
            SET_TMC_CURRENT STEPPER=buffer0_motor CURRENT={cfg_current}
        {% else %}
            SET_TMC_CURRENT STEPPER=buffer0_motor CURRENT={current|float}
        {% endif %}

        {% if release == 1 %}
            MANUAL_STEPPER STEPPER=buffer0_motor ENABLE=0
        {% endif %}

    {% else %}
        M118 No unload tension stop route for active extruder: {active_extruder}
    {% endif %}


#####################################################################
#                  Unload Tip Forming Helper
#####################################################################
# Purpose:
# - Optional Happy-Hare-style tip-forming motion helper.
# - UNLOAD_FILAMENT calls this when _UNLOAD_TIP_FORM variable_enabled is 1.
# - This helper only handles hotend/extruder tip-forming movement.
# - UNLOAD_FILAMENT still owns temp selection, material prompt, buffer preload,
#   buffer pull, final hotend retract, final buffer retract, and cooldown behavior.
#####################################################################

[gcode_macro _UNLOAD_TIP_FORM]
description: Optional tip-forming motion used by UNLOAD_FILAMENT

variable_enabled: 1
variable_filament_diameter: 1.75

variable_ramming_volume: 8.0
variable_ramming_speed: 25.0

variable_unloading_start_distance: 5.0
variable_unloading_speed_start: 80.0
variable_unloading_speed: 25.0

variable_cooling_tube_position: 30.0
variable_cooling_tube_length: 10.0

variable_initial_cooling_speed: 20.0
variable_final_cooling_speed: 80.0
variable_cooling_moves: 1

variable_use_skinnydip: 1
variable_skinnydip_distance: 10.0
variable_dip_insertion_speed: 20.0
variable_dip_extraction_speed: 30.0
variable_melt_zone_pause: 400
variable_cooling_zone_pause: 250

gcode:
    {% set v = printer["gcode_macro _UNLOAD_TIP_FORM"] %}
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

    {% set ramming_volume = params.RAMMING_VOLUME|default(v.ramming_volume)|float %}
    {% set ramming_speed = [params.RAMMING_SPEED|default(v.ramming_speed)|float, max_extrude_speed]|min %}

    {% set unloading_start_distance = params.UNLOADING_START_DISTANCE|default(v.unloading_start_distance)|float %}
    {% set unloading_speed_start = [params.UNLOADING_SPEED_START|default(v.unloading_speed_start)|float, max_extrude_speed]|min %}
    {% set unloading_speed = [params.UNLOADING_SPEED|default(v.unloading_speed)|float, max_extrude_speed]|min %}

    {% set cooling_tube_position = params.COOLING_TUBE_POSITION|default(v.cooling_tube_position)|float %}
    {% set cooling_tube_length = params.COOLING_TUBE_LENGTH|default(v.cooling_tube_length)|float %}
    {% set initial_cooling_speed = [params.INITIAL_COOLING_SPEED|default(v.initial_cooling_speed)|float, max_extrude_speed]|min %}
    {% set final_cooling_speed = [params.FINAL_COOLING_SPEED|default(v.final_cooling_speed)|float, max_extrude_speed]|min %}
    {% set cooling_moves = params.COOLING_MOVES|default(v.cooling_moves)|int %}

    {% set use_skinnydip = params.USE_SKINNYDIP|default(v.use_skinnydip)|int %}
    {% set skinnydip_distance = params.SKINNYDIP_DISTANCE|default(v.skinnydip_distance)|float %}
    {% set dip_insertion_speed = [params.DIP_INSERTION_SPEED|default(v.dip_insertion_speed)|float, max_extrude_speed]|min %}
    {% set dip_extraction_speed = [params.DIP_EXTRACTION_SPEED|default(v.dip_extraction_speed)|float, max_extrude_speed]|min %}
    {% set melt_zone_pause = params.MELT_ZONE_PAUSE|default(v.melt_zone_pause)|int %}
    {% set cooling_zone_pause = params.COOLING_ZONE_PAUSE|default(v.cooling_zone_pause)|int %}

    {% set filament_radius = v.filament_diameter|float / 2.0 %}
    {% set filament_area = 3.14159 * filament_radius * filament_radius %}
    {% set ramming_length = ramming_volume / filament_area %}
    {% set remaining_to_cooling = cooling_tube_position - unloading_start_distance %}

    _STATUS_MSG MSG="Tip forming filament"
    _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: ram={ramming_volume}mm3/{ramming_length|round(2)}mm, cooling_tube_position={cooling_tube_position}, cooling_tube_length={cooling_tube_length}, cooling_moves={cooling_moves}, skinnydip={use_skinnydip}"

    M83
    G92 E0
    M400

    {% if ramming_length > 0 %}
        G1 E{ramming_length} F{(ramming_speed * 60)|int}
        M400
    {% endif %}

    {% if unloading_start_distance > 0 %}
        G1 E-{unloading_start_distance} F{(unloading_speed_start * 60)|int}
        M400
    {% endif %}

    {% if remaining_to_cooling > 0 %}
        G1 E-{remaining_to_cooling} F{(unloading_speed * 60)|int}
        M400
    {% endif %}

    {% for i in range(cooling_moves) %}
        {% if i == 0 %}
            G1 E-{cooling_tube_length} F{(initial_cooling_speed * 60)|int}
        {% else %}
            G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        {% endif %}
        M400

        G1 E{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endfor %}

    {% if cooling_tube_length > 0 %}
        G1 E-{cooling_tube_length} F{(final_cooling_speed * 60)|int}
        M400
    {% endif %}

    {% if use_skinnydip == 1 %}
        _DEBUG_MSG MSG="_UNLOAD_TIP_FORM: skinny dip distance={skinnydip_distance}"
        G1 E{skinnydip_distance} F{(dip_insertion_speed * 60)|int}
        G4 P{melt_zone_pause}
        G1 E-{skinnydip_distance} F{(dip_extraction_speed * 60)|int}
        G4 P{cooling_zone_pause}
        M400
    {% endif %}


[gcode_macro _UNLOAD_FINAL_BUFFER_RETRACT_IF_CLEAR_FRESH]
description: Fresh sensor check, then run final long buffer retract if filament is clear
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    {% set final_distance = params.FINAL_DISTANCE|default(0)|float %}
    {% set final_speed = params.FINAL_SPEED|default(50)|float %}
    {% set final_accel = params.FINAL_ACCEL|default(500)|float %}
    {% set final_current = params.FINAL_CURRENT|default("CONFIG")|string %}
    {% set final_settle = params.FINAL_SETTLE|default(1.0)|float %}

    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}
    {% set fail_beep_delay_ms = params.FAIL_BEEP_DELAY_MS|default(400)|int %}

    {% if active_extruder == "extruder" %}
        {% set sensor = sensors.tool0_hotend_sensor|string %}
    {% elif active_extruder == "extruder1" %}
        {% set sensor = sensors.tool1_hotend_sensor|string %}
    {% elif active_extruder == "extruder2" %}
        {% set sensor = sensors.tool2_hotend_sensor|string %}
    {% elif active_extruder == "extruder3" %}
        {% set sensor = sensors.tool3_hotend_sensor|string %}
    {% else %}
        {% set sensor = "" %}
    {% endif %}

    {% set final_time = (final_distance / final_speed) if (final_distance > 0 and final_speed > 0) else 0 %}
    {% set sensor_valid = 1 if sensor|length > 0 and sensor in printer else 0 %}
    {% set sensor_detected = 1 if sensor_valid == 1 and printer[sensor].filament_detected|int == 1 else 0 %}

    {% if final_distance <= 0 %}
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: skipped because final distance <= 0"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif sensor_valid == 0 %}
        _STATUS_MSG MSG="Unload warning: final retract sensor not configured/found"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: invalid sensor={sensor}; skipping final long retract"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif sensor_detected == 1 %}
        _STATUS_MSG MSG="Unload failed: filament still detected at toolhead"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: final long retract skipped because sensor={sensor} still detects filament"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% else %}
        _STATUS_MSG MSG="Toolhead clear - retracting filament back to buffer"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT_FRESH: sensor={sensor} clear; final_distance={final_distance}, speed={final_speed}, accel={final_accel}, current={final_current}"

        {% if final_current|upper == "CONFIG" %}
            BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={final_distance} SPEED={final_speed} ACCEL={final_accel}
        {% else %}
            BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={final_current} DISTANCE={final_distance} SPEED={final_speed} ACCEL={final_accel}
        {% endif %}

        G4 P{((final_time + final_settle) * 1000)|int}

        {% if final_current|upper == "CONFIG" %}
            BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=1
        {% else %}
            BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={final_current} RELEASE=1
        {% endif %}
    {% endif %}

#####################################################################
#                  Final Unload Sensor Retry + Long Buffer Retract
#####################################################################
# Purpose:
# - Reads the active toolhead filament sensor fresh after UNLOAD_FILAMENT
#   has finished tip forming and final hotend retract.
# - If the sensor is clear, immediately runs the long buffer retract.
# - If the sensor still sees filament, starts a lighter Buffer0 pull,
#   runs one extra hotend retract, then calls the fresh-check helper.
#####################################################################

[gcode_macro _UNLOAD_RETRY_THEN_FINAL_BUFFER_RETRACT]
description: Retry light buffer pull plus extra hotend retract if toolhead sensor still detects filament
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

    {% set final_distance = params.FINAL_DISTANCE|default(0)|float %}
    {% set final_speed = params.FINAL_SPEED|default(50)|float %}
    {% set final_accel = params.FINAL_ACCEL|default(500)|float %}
    {% set final_current = params.FINAL_CURRENT|default("CONFIG")|string %}
    {% set final_settle = params.FINAL_SETTLE|default(1.0)|float %}

    {% set retry_enabled = params.RETRY_ENABLED|default(1)|int %}
    {% set retry_distance = params.RETRY_DISTANCE|default(120)|float %}
    {% set retry_speed = params.RETRY_SPEED|default(25)|float %}
    {% set retry_accel = params.RETRY_ACCEL|default(300)|float %}
    {% set retry_current = params.RETRY_CURRENT|default(0.25)|string %}
    {% set retry_lead_time = params.RETRY_LEAD_TIME|default(0.10)|float %}
    {% set retry_settle = params.RETRY_SETTLE|default(0.50)|float %}

    {% set hotend_retry_enabled = params.HOTEND_RETRY_ENABLED|default(1)|int %}
    {% set hotend_retry_distance = params.HOTEND_RETRY_DISTANCE|default(50)|float %}
    {% set hotend_retry_speed = [params.HOTEND_RETRY_SPEED|default(80)|float, max_extrude_speed]|min %}
    {% set hotend_retry_settle = params.HOTEND_RETRY_SETTLE|default(0.25)|float %}

    {% set fail_beeps = params.FAIL_BEEPS|default(3)|int %}
    {% set fail_beep_delay_ms = params.FAIL_BEEP_DELAY_MS|default(400)|int %}

    {% if active_extruder == "extruder" %}
        {% set sensor = sensors.tool0_hotend_sensor|string %}
    {% elif active_extruder == "extruder1" %}
        {% set sensor = sensors.tool1_hotend_sensor|string %}
    {% elif active_extruder == "extruder2" %}
        {% set sensor = sensors.tool2_hotend_sensor|string %}
    {% elif active_extruder == "extruder3" %}
        {% set sensor = sensors.tool3_hotend_sensor|string %}
    {% else %}
        {% set sensor = "" %}
    {% endif %}

    {% set retry_time = (retry_distance / retry_speed) if (retry_distance > 0 and retry_speed > 0) else 0 %}
    {% set hotend_retry_time = (hotend_retry_distance / hotend_retry_speed) if (hotend_retry_distance > 0 and hotend_retry_speed > 0) else 0 %}
    {% set retry_motion_time = retry_lead_time + hotend_retry_time + hotend_retry_settle %}
    {% set retry_wait_after = [retry_time + retry_settle - retry_motion_time, 0]|max %}

    {% set sensor_valid = 1 if sensor|length > 0 and sensor in printer else 0 %}
    {% set sensor_detected = 1 if sensor_valid == 1 and printer[sensor].filament_detected|int == 1 else 0 %}

    {% if final_distance <= 0 %}
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: skipped because final distance <= 0"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif sensor_valid == 0 %}
        _STATUS_MSG MSG="Unload warning: final retract sensor not configured/found"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: invalid sensor={sensor}; skipping final long retract"

        {% for i in range(fail_beeps) %}
            _BEEP
            G4 P{fail_beep_delay_ms}
        {% endfor %}

        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

    {% elif sensor_detected == 1 and retry_enabled == 1 %}
        _STATUS_MSG MSG="Filament still detected - running final recovery"
        _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: sensor={sensor} still detects filament; retry buffer distance={retry_distance}, current={retry_current}, speed={retry_speed}, hotend_retry={hotend_retry_distance}mm@{hotend_retry_speed}mm/s"

        {% if retry_distance > 0 %}
            {% if retry_current|upper == "CONFIG" %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={retry_distance} SPEED={retry_speed} ACCEL={retry_accel}
            {% else %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={retry_current} DISTANCE={retry_distance} SPEED={retry_speed} ACCEL={retry_accel}
            {% endif %}

            G4 P{(retry_lead_time * 1000)|int}
        {% endif %}

        {% if hotend_retry_enabled == 1 and hotend_retry_distance > 0 %}
            M83
            G92 E0
            _STATUS_MSG MSG="Extra hotend retract to clear toolhead sensor"
            _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: extra hotend retract distance={hotend_retry_distance}, speed={hotend_retry_speed}"
            G1 E-{hotend_retry_distance} F{(hotend_retry_speed * 60)|int}
            M400

            {% if hotend_retry_settle > 0 %}
                G4 P{(hotend_retry_settle * 1000)|int}
            {% endif %}
        {% endif %}

        {% if retry_wait_after > 0 %}
            _DEBUG_MSG MSG="UNLOAD_FINAL_RETRACT: retry_wait_after={retry_wait_after}"
            G4 P{(retry_wait_after * 1000)|int}
        {% endif %}

        {% if retry_distance > 0 %}
            {% if retry_current|upper == "CONFIG" %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=0
            {% else %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={retry_current} RELEASE=0
            {% endif %}
        {% endif %}

        _UNLOAD_FINAL_BUFFER_RETRACT_IF_CLEAR_FRESH FINAL_DISTANCE={final_distance} FINAL_SPEED={final_speed} FINAL_ACCEL={final_accel} FINAL_CURRENT="{final_current}" FINAL_SETTLE={final_settle} FAIL_BEEPS={fail_beeps} FAIL_BEEP_DELAY_MS={fail_beep_delay_ms}

    {% else %}
        _UNLOAD_FINAL_BUFFER_RETRACT_IF_CLEAR_FRESH FINAL_DISTANCE={final_distance} FINAL_SPEED={final_speed} FINAL_ACCEL={final_accel} FINAL_CURRENT="{final_current}" FINAL_SETTLE={final_settle} FAIL_BEEPS={fail_beeps} FAIL_BEEP_DELAY_MS={fail_beep_delay_ms}
    {% endif %}
#####################################################################
#                  Unload Filament
#####################################################################
[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the currently active tool using optional tip forming and staged buffer pull assist

#####################################################################
# Material temperature profiles
#####################################################################

variable_default_material: "PETG"          # Default material used when MATERIAL= is not passed.
variable_default_filament: "PETG"          # Legacy/alternate default name; keep matched to default_material.

variable_pla_unload_temp: 200              # PLA unload/tip-form temp. Lower reduces stringing, too low can jam.
variable_petg_unload_temp: 215             # PETG unload/tip-form temp. PETG often needs a little more heat than PLA.
variable_tpu_unload_temp: 205              # TPU unload temp. Usually kept lower and slower due to flex.
variable_abs_unload_temp: 230              # ABS unload/tip-form temp.
variable_asa_unload_temp: 230              # ASA unload/tip-form temp.
variable_default_unload_temp: 210          # Fallback temp if material is unknown.
variable_unload_temp_window: 2             # Allowed +/- temp window before unload begins.

#####################################################################
# Pre-unload melt-zone cool-down
#####################################################################

variable_pre_unload_cool_enabled: 1        # 1 = cool before unload, 0 = unload directly at unload temp.
variable_pre_unload_cool_temp: 160         # Cool-down target before reheating.
variable_pre_unload_cool_window: 3         # Cool wait allows nozzle to be this many C above target before continuing.
variable_pre_unload_cool_soak: 30          # Seconds to sit after cooling before reheating.

#####################################################################
# Hotend unload motion
#####################################################################

variable_push_distance: 3                  # Small forward push before retract.
variable_retract_distance: 220             # Total basic hotend retract distance.
variable_push_speed: 5                     # Speed of the forward push in mm/s.
variable_neck_retract_distance: 20         # First controlled retract distance.
variable_neck_retract_speed: 35            # Speed of necking retract in mm/s.
variable_retract_speed: 80                 # Speed for remaining hotend retract in mm/s.
variable_move_to_bucket: 1                 # 1 = move to purge bucket before unload if homed.

#####################################################################
# Tip-form final eject motion
#####################################################################

variable_tipform_buffer_preload_enabled: 1 # 1 = preload buffer slack while cooling/warming.
variable_tipform_buffer_preload_percent: 50 # Buffer target while cooling/warming before tip forming.
variable_tipform_buffer_preload_step: 5    # Step size in mm for buffer preload percent move.
variable_tipform_buffer_preload_speed: 30  # Buffer preload speed in mm/s.
variable_tipform_buffer_preload_accel: 300 # Buffer preload acceleration in mm/s^2.
variable_tipform_buffer_preload_settle: 3.0 # Seconds to wait after preload if used.

variable_tipform_final_retract_distance: 230 # Final hotend retract after tip forming.
variable_tipform_final_retract_speed: 80   # Final hotend retract speed in mm/s.

#####################################################################
# Tip-form buffer receive pull
#####################################################################

variable_tipform_receive_pull_current: 0.25 # Lower current used while receiving the final eject.
variable_tipform_receive_pull_distance: 300 # Non-blocking Buffer0 pull distance started before final hotend retract.
variable_tipform_receive_pull_speed: 40     # Buffer receive-pull speed in mm/s.
variable_tipform_receive_pull_accel: 250    # Buffer receive-pull acceleration in mm/s^2.
variable_tipform_receive_pull_lead_time: 0.20 # Seconds buffer pulls before final hotend retract begins.
variable_tipform_receive_pull_settle: 0.25  # Extra wait after final hotend retract so buffer move can finish.

#####################################################################
# Toolhead-sensor retry before final long buffer retract
#####################################################################
# Purpose:
# - After the normal final eject, the existing helper checks the toolhead
#   filament sensor fresh.
# - If the sensor still sees filament, it starts a light-current Buffer0
#   pull, then runs one more hotend retract.
# - Then it checks the sensor fresh again.
# - Only then does it either run the long buffer retract or beep/fail.
#####################################################################

variable_sensor_retry_pull_enabled: 1       # 1 = try one recovery sequence if toolhead sensor still detects filament.
variable_sensor_retry_pull_distance: 120    # Light Buffer0 pull distance during recovery.
variable_sensor_retry_pull_speed: 25        # Light Buffer0 pull speed in mm/s.
variable_sensor_retry_pull_accel: 300       # Light Buffer0 pull acceleration in mm/s^2.
variable_sensor_retry_pull_current: 0.25    # Light Buffer0 current for recovery pull.
variable_sensor_retry_pull_lead_time: 0.10  # Seconds Buffer0 pulls before extra hotend retract starts.
variable_sensor_retry_pull_settle: 0.5      # Extra seconds after recovery before fresh sensor recheck.

variable_sensor_retry_hotend_retract_enabled: 1 # 1 = add extra hotend retract during recovery.
variable_sensor_retry_hotend_retract_distance: 50 # Extra hotend retract distance if filament has not cleared sensor.
variable_sensor_retry_hotend_retract_speed: 80    # Extra hotend retract speed in mm/s.
variable_sensor_retry_hotend_retract_settle: 0.25 # Extra wait after hotend retry retract.

variable_final_buffer_fail_beeps: 3         # Beeps if final long retract is skipped.
variable_final_buffer_fail_beep_delay_ms: 400 # Delay between final-retract failure beeps.

#####################################################################
# Buffer unload assist
#####################################################################

variable_buffer_hard_pull_current: 0.50
variable_buffer_hard_pull_distance: 90
variable_buffer_hard_pull_speed: 40
variable_buffer_hard_pull_accel: 250
variable_buffer_hard_pull_settle: 0.25

variable_buffer_normal_pull_current: "CONFIG"
variable_buffer_tension_distance: 200
variable_buffer_tension_speed: 25
variable_buffer_tension_accel: 300
variable_buffer_tension_lead_time: 0.05
variable_buffer_tension_dwell: 2.0

#####################################################################
# Final buffer-only retract after hotend unload
#####################################################################

variable_final_buffer_retract_enabled: 1
variable_final_buffer_retract_distance: 2000
variable_final_buffer_retract_speed: 50
variable_final_buffer_retract_accel: 500
variable_final_buffer_retract_current: .4
variable_final_buffer_retract_settle: 1.0

gcode:
    {% set speed = params.SPEED|default(50)|float %}
    {% set tip_v = printer["gcode_macro _UNLOAD_TIP_FORM"] %}
    {% set tip_form_enabled = params.TIP_FORM|default(tip_v.enabled)|int %}

    #################################################################
    # KlipperScreen stock Unload button safety gate
    #################################################################

    {% set material_prompt_needed = params.MATERIAL is not defined and params.FILAMENT is not defined and params.TEMP is not defined %}

    {% if material_prompt_needed %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
        RESPOND TYPE=command MSG="action:prompt_text Select material to unload."
        RESPOND TYPE=command MSG="action:prompt_button PLA|_KS_UNLOAD_MATERIAL MATERIAL=PLA SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_KS_UNLOAD_MATERIAL MATERIAL=PETG SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|_KS_UNLOAD_MATERIAL MATERIAL=TPU SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_KS_UNLOAD_MATERIAL MATERIAL=ABS SPEED={speed}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_KS_END_PROMPT|warning"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}

        {% set load_v = printer["gcode_macro LOAD_FILAMENT"] %}
        {% set active_extruder = printer.toolhead.extruder|string %}
        {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}
        {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
        {% set direct_feed_override = params.DIRECT_FEED|default(0)|int %}

        {% if active_extruder == "extruder" %}
            {% set buffer_entrance_sensor = sensors.tool0_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool0_hotend_sensor|string %}
        {% elif active_extruder == "extruder1" %}
            {% set buffer_entrance_sensor = sensors.tool1_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool1_hotend_sensor|string %}
        {% elif active_extruder == "extruder2" %}
            {% set buffer_entrance_sensor = sensors.tool2_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool2_hotend_sensor|string %}
        {% elif active_extruder == "extruder3" %}
            {% set buffer_entrance_sensor = sensors.tool3_entrance_sensor|string %}
            {% set toolhead_sensor = sensors.tool3_hotend_sensor|string %}
        {% else %}
            {% set buffer_entrance_sensor = "" %}
            {% set toolhead_sensor = "" %}
        {% endif %}

        {% set buffer_entrance_detected = 1 if buffer_entrance_sensor|length > 0 and buffer_entrance_sensor in printer and printer[buffer_entrance_sensor].filament_detected|int == 1 else 0 %}
        {% set toolhead_detected = 1 if toolhead_sensor|length > 0 and toolhead_sensor in printer and printer[toolhead_sensor].filament_detected|int == 1 else 0 %}

        # Entrance wins. Direct-feed only applies when entrance is clear and the toolhead sensor sees filament.
        {% set use_buffer_for_unload = 1 if direct_feed_override == 0 and buffer_entrance_detected == 1 else 0 %}
        {% set use_direct_feed_for_unload = 1 if direct_feed_override == 1 or (buffer_entrance_detected == 0 and toolhead_detected == 1) else 0 %}

        #################################################################
        # Select material profile
        #################################################################

        {% if params.MATERIAL is defined %}
            {% set material = params.MATERIAL|upper|string %}
        {% elif params.FILAMENT is defined %}
            {% set material = params.FILAMENT|upper|string %}
        {% else %}
            {% set material = default_material|upper|string %}
        {% endif %}

        {% if material in ["PLA", "PLA+"] %}
            {% set material_unload_temp = pla_unload_temp|float %}
        {% elif material in ["PETG", "PET"] %}
            {% set material_unload_temp = petg_unload_temp|float %}
        {% elif material in ["TPU", "TPE"] %}
            {% set material_unload_temp = tpu_unload_temp|float %}
        {% elif material == "ABS" %}
            {% set material_unload_temp = abs_unload_temp|float %}
        {% elif material == "ASA" %}
            {% set material_unload_temp = asa_unload_temp|float %}
        {% else %}
            {% set material_unload_temp = default_unload_temp|float %}
        {% endif %}

        {% set unload_temp = params.TEMP|default(material_unload_temp)|float %}
        {% set unload_temp_window = params.TEMP_WINDOW|default(unload_temp_window)|float %}
        {% set unload_temp_min = unload_temp - unload_temp_window %}
        {% set unload_temp_max = unload_temp + unload_temp_window %}

        #################################################################
        # Pre-unload cool-down overrides
        #################################################################

        {% set pre_unload_cool_enabled = params.PRE_UNLOAD_COOL|default(pre_unload_cool_enabled)|int %}
        {% set pre_unload_cool_temp = params.PRE_UNLOAD_COOL_TEMP|default(pre_unload_cool_temp)|float %}
        {% set pre_unload_cool_window = params.PRE_UNLOAD_COOL_WINDOW|default(pre_unload_cool_window)|float %}
        {% set pre_unload_cool_soak = params.PRE_UNLOAD_COOL_SOAK|default(pre_unload_cool_soak)|float %}
        {% set pre_unload_cool_max = pre_unload_cool_temp + pre_unload_cool_window %}

        #################################################################
        # Hotend unload motion overrides
        #################################################################

        {% set push_distance = params.PUSH_DISTANCE|default(push_distance)|float %}
        {% set retract_distance = params.RETRACT_DISTANCE|default(retract_distance)|float %}
        {% set push_speed = [params.PUSH_SPEED|default(push_speed)|float, max_extrude_speed]|min %}
        {% set neck_retract_distance = params.NECK_RETRACT_DISTANCE|default(neck_retract_distance)|float %}
        {% set neck_retract_speed = [params.NECK_RETRACT_SPEED|default(neck_retract_speed)|float, max_extrude_speed]|min %}
        {% set retract_speed = [params.RETRACT_SPEED|default(retract_speed)|float, max_extrude_speed]|min %}
        {% set final_retract_distance = [retract_distance - neck_retract_distance, 0]|max %}
        {% set move_to_bucket = params.MOVE_TO_BUCKET|default(move_to_bucket)|int %}

        #################################################################
        # Tip-form final eject overrides
        #################################################################

        {% set tipform_buffer_preload_enabled = params.TIPFORM_BUFFER_PRELOAD|default(tipform_buffer_preload_enabled)|int %}
        {% set tipform_buffer_preload_percent = params.TIPFORM_BUFFER_PRELOAD_PERCENT|default(tipform_buffer_preload_percent)|float %}
        {% set tipform_buffer_preload_step = params.TIPFORM_BUFFER_PRELOAD_STEP|default(tipform_buffer_preload_step)|float %}
        {% set tipform_buffer_preload_speed = params.TIPFORM_BUFFER_PRELOAD_SPEED|default(tipform_buffer_preload_speed)|float %}
        {% set tipform_buffer_preload_accel = params.TIPFORM_BUFFER_PRELOAD_ACCEL|default(tipform_buffer_preload_accel)|float %}
        {% set tipform_buffer_preload_settle = params.TIPFORM_BUFFER_PRELOAD_SETTLE|default(tipform_buffer_preload_settle)|float %}

        {% set tipform_final_retract_distance = params.TIPFORM_FINAL_RETRACT_DISTANCE|default(tipform_final_retract_distance)|float %}
        {% set tipform_final_retract_speed = [params.TIPFORM_FINAL_RETRACT_SPEED|default(tipform_final_retract_speed)|float, max_extrude_speed]|min %}

        #################################################################
        # Tip-form buffer receive-pull overrides
        #################################################################

        {% set tipform_receive_pull_current = params.TIPFORM_RECEIVE_PULL_CURRENT|default(tipform_receive_pull_current)|string %}
        {% set tipform_receive_pull_use_config_current = tipform_receive_pull_current|upper == "CONFIG" %}
        {% set tipform_receive_pull_distance = params.TIPFORM_RECEIVE_PULL_DISTANCE|default(tipform_receive_pull_distance)|float %}
        {% set tipform_receive_pull_speed = params.TIPFORM_RECEIVE_PULL_SPEED|default(tipform_receive_pull_speed)|float %}
        {% set tipform_receive_pull_accel = params.TIPFORM_RECEIVE_PULL_ACCEL|default(tipform_receive_pull_accel)|float %}
        {% set tipform_receive_pull_lead_time = params.TIPFORM_RECEIVE_PULL_LEAD_TIME|default(tipform_receive_pull_lead_time)|float %}
        {% set tipform_receive_pull_settle = params.TIPFORM_RECEIVE_PULL_SETTLE|default(tipform_receive_pull_settle)|float %}

        #################################################################
        # Toolhead-sensor retry pull overrides
        #################################################################

        {% set sensor_retry_pull_enabled = params.SENSOR_RETRY_PULL|default(sensor_retry_pull_enabled)|int %}
        {% set sensor_retry_pull_distance = params.SENSOR_RETRY_PULL_DISTANCE|default(sensor_retry_pull_distance)|float %}
        {% set sensor_retry_pull_speed = params.SENSOR_RETRY_PULL_SPEED|default(sensor_retry_pull_speed)|float %}
        {% set sensor_retry_pull_accel = params.SENSOR_RETRY_PULL_ACCEL|default(sensor_retry_pull_accel)|float %}
        {% set sensor_retry_pull_current = params.SENSOR_RETRY_PULL_CURRENT|default(sensor_retry_pull_current)|string %}
        {% set sensor_retry_pull_use_config_current = sensor_retry_pull_current|upper == "CONFIG" %}
        {% set sensor_retry_pull_lead_time = params.SENSOR_RETRY_PULL_LEAD_TIME|default(sensor_retry_pull_lead_time)|float %}
        {% set sensor_retry_pull_settle = params.SENSOR_RETRY_PULL_SETTLE|default(sensor_retry_pull_settle)|float %}

        {% set sensor_retry_hotend_retract_enabled = params.SENSOR_RETRY_HOTEND_RETRACT|default(sensor_retry_hotend_retract_enabled)|int %}
        {% set sensor_retry_hotend_retract_distance = params.SENSOR_RETRY_HOTEND_RETRACT_DISTANCE|default(sensor_retry_hotend_retract_distance)|float %}
        {% set sensor_retry_hotend_retract_speed = [params.SENSOR_RETRY_HOTEND_RETRACT_SPEED|default(sensor_retry_hotend_retract_speed)|float, max_extrude_speed]|min %}
        {% set sensor_retry_hotend_retract_settle = params.SENSOR_RETRY_HOTEND_RETRACT_SETTLE|default(sensor_retry_hotend_retract_settle)|float %}

        #################################################################
        # Purge bucket / travel values pulled from LOAD_FILAMENT
        #################################################################

        {% set bucket_x = params.BUCKET_X|default(load_v.purge_bucket_x)|float %}
        {% set bucket_y = params.BUCKET_Y|default(load_v.purge_bucket_y)|float %}
        {% set bucket_z = params.BUCKET_Z|default(load_v.purge_bucket_z)|float %}
        {% set travel_speed = params.TRAVEL_SPEED|default(load_v.travel_speed)|float %}
        {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(load_v.z_travel_speed)|float %}

        #################################################################
        # Buffer hard pull overrides
        #################################################################

        {% set buffer_hard_pull_current = params.BUFFER_HARD_PULL_CURRENT|default(buffer_hard_pull_current)|float %}
        {% set buffer_hard_pull_distance = params.BUFFER_HARD_PULL_DISTANCE|default(buffer_hard_pull_distance)|float %}
        {% set buffer_hard_pull_speed = params.BUFFER_HARD_PULL_SPEED|default(buffer_hard_pull_speed)|float %}
        {% set buffer_hard_pull_accel = params.BUFFER_HARD_PULL_ACCEL|default(buffer_hard_pull_accel)|float %}
        {% set buffer_hard_pull_settle = params.BUFFER_HARD_PULL_SETTLE|default(buffer_hard_pull_settle)|float %}

        #################################################################
        # Buffer normal pull overrides
        #################################################################

        {% set buffer_normal_pull_current = params.BUFFER_NORMAL_PULL_CURRENT|default(buffer_normal_pull_current)|string %}
        {% set buffer_use_config_current = buffer_normal_pull_current|upper == "CONFIG" %}
        {% set buffer_tension_distance = params.BUFFER_TENSION_DISTANCE|default(buffer_tension_distance)|float %}
        {% set buffer_tension_speed = params.BUFFER_TENSION_SPEED|default(buffer_tension_speed)|float %}
        {% set buffer_tension_accel = params.BUFFER_TENSION_ACCEL|default(buffer_tension_accel)|float %}
        {% set buffer_tension_lead_time = params.BUFFER_TENSION_LEAD_TIME|default(buffer_tension_lead_time)|float %}
        {% set buffer_tension_dwell = params.BUFFER_TENSION_DWELL|default(buffer_tension_dwell)|float %}
        {% set buffer_remaining_distance = [buffer_tension_distance - buffer_hard_pull_distance, 0]|max %}

        #################################################################
        # Final buffer-only retract overrides
        #################################################################

        {% set final_buffer_retract_enabled = params.FINAL_BUFFER_RETRACT|default(final_buffer_retract_enabled)|int %}
        {% set final_buffer_retract_distance = params.FINAL_BUFFER_RETRACT_DISTANCE|default(final_buffer_retract_distance)|float %}
        {% set final_buffer_retract_speed = params.FINAL_BUFFER_RETRACT_SPEED|default(final_buffer_retract_speed)|float %}
        {% set final_buffer_retract_accel = params.FINAL_BUFFER_RETRACT_ACCEL|default(final_buffer_retract_accel)|float %}
        {% set final_buffer_retract_current = params.FINAL_BUFFER_RETRACT_CURRENT|default(final_buffer_retract_current)|string %}
        {% set final_buffer_retract_settle = params.FINAL_BUFFER_RETRACT_SETTLE|default(final_buffer_retract_settle)|float %}
        {% set do_final_buffer_retract = final_buffer_retract_enabled == 1 and final_buffer_retract_distance > 0 and use_buffer_for_unload == 1 %}
        {% set final_buffer_fail_beeps = params.FINAL_BUFFER_FAIL_BEEPS|default(final_buffer_fail_beeps)|int %}
        {% set final_buffer_fail_beep_delay_ms = params.FINAL_BUFFER_FAIL_BEEP_DELAY_MS|default(final_buffer_fail_beep_delay_ms)|int %}

        #################################################################
        # Timing estimates
        #################################################################

        {% set push_time = (push_distance / push_speed) if (push_distance > 0 and push_speed > 0) else 0 %}
        {% set neck_time = (neck_retract_distance / neck_retract_speed) if (neck_retract_distance > 0 and neck_retract_speed > 0) else 0 %}
        {% set final_time = (final_retract_distance / retract_speed) if (final_retract_distance > 0 and retract_speed > 0) else 0 %}
        {% set tipform_final_time = (tipform_final_retract_distance / tipform_final_retract_speed) if (tipform_final_retract_distance > 0 and tipform_final_retract_speed > 0) else 0 %}

        {% set hard_pull_time = (buffer_hard_pull_distance / buffer_hard_pull_speed) if (buffer_hard_pull_distance > 0 and buffer_hard_pull_speed > 0) else 0 %}
        {% set normal_pull_time = (buffer_remaining_distance / buffer_tension_speed) if (buffer_remaining_distance > 0 and buffer_tension_speed > 0) else 0 %}
        {% set normal_pull_wait = normal_pull_time + buffer_tension_dwell %}

        {% set basic_hotend_motion_time = buffer_tension_lead_time + push_time + neck_time + final_time %}
        {% set tipform_final_motion_time = buffer_tension_lead_time + tipform_final_time %}

        {% set hard_pull_wait_after_basic = [hard_pull_time + buffer_hard_pull_settle - basic_hotend_motion_time, 0]|max %}
        {% set hard_pull_wait_after_tipform = [hard_pull_time + buffer_hard_pull_settle - tipform_final_motion_time, 0]|max %}

        {% set tipform_receive_pull_time = (tipform_receive_pull_distance / tipform_receive_pull_speed) if (tipform_receive_pull_distance > 0 and tipform_receive_pull_speed > 0) else 0 %}
        {% set tipform_receive_motion_time = tipform_receive_pull_lead_time + tipform_final_time %}
        {% set tipform_receive_wait_after = [tipform_receive_pull_time + tipform_receive_pull_settle - tipform_receive_motion_time, 0]|max %}

        {% set sensor_retry_pull_time = (sensor_retry_pull_distance / sensor_retry_pull_speed) if (sensor_retry_pull_distance > 0 and sensor_retry_pull_speed > 0) else 0 %}
        {% set sensor_retry_hotend_retract_time = (sensor_retry_hotend_retract_distance / sensor_retry_hotend_retract_speed) if (sensor_retry_hotend_retract_distance > 0 and sensor_retry_hotend_retract_speed > 0) else 0 %}
        {% set sensor_retry_motion_time = sensor_retry_pull_lead_time + sensor_retry_hotend_retract_time + sensor_retry_hotend_retract_settle %}
        {% set sensor_retry_pull_wait = [sensor_retry_pull_time + sensor_retry_pull_settle - sensor_retry_motion_time, 0]|max %}

        {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
            { action_respond_info("UNLOAD_FILAMENT disabled while actively printing.") }

        {% elif use_buffer_for_unload == 0 and use_direct_feed_for_unload == 0 %}
            _BEEP
            { action_raise_error("UNLOAD_FILAMENT: no filament detected at buffer entrance or toolhead sensor.") }

        {% else %}
            _STATUS_MSG MSG="Unloading {material}"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: extruder={active_extruder}, material={material}, temp={unload_temp}, pre_cool={pre_unload_cool_enabled}, pre_cool_temp={pre_unload_cool_temp}, tip_form={tip_form_enabled}, buffer_sensor={buffer_entrance_sensor}, buffer_detected={buffer_entrance_detected}, toolhead_sensor={toolhead_sensor}, toolhead_detected={toolhead_detected}, direct_feed_override={direct_feed_override}, use_buffer={use_buffer_for_unload}, use_direct_feed={use_direct_feed_for_unload}, final_buffer_retract={final_buffer_retract_distance}mm"

            M117 Unloading {material} from {active_extruder}

            SAVE_GCODE_STATE NAME=unload_state

            BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR={0 if use_buffer_for_unload == 1 else 1}

            {% if use_buffer_for_unload == 0 %}
                _STATUS_MSG MSG="Direct-feed unload mode - buffer ignored"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer skipped because direct-feed/no-buffer mode is active"
            {% endif %}

            #################################################################
            # Temperature staging
            #################################################################

            {% if pre_unload_cool_enabled == 1 %}
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={pre_unload_cool_temp}
            {% else %}
                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}
            {% endif %}

            #################################################################
            # Cooling/warming-time buffer slack preload
            #################################################################

            {% if tip_form_enabled == 1 and tipform_buffer_preload_enabled == 1 and use_buffer_for_unload == 1 %}
                _STATUS_MSG MSG="Preloading buffer slack before tip form"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer preload percent={tipform_buffer_preload_percent}, step={tipform_buffer_preload_step}, speed={tipform_buffer_preload_speed}, accel={tipform_buffer_preload_accel}"

                _UNLOAD_PRELOAD_BUFFER_TO_PERCENT_BLOCKING PERCENT={tipform_buffer_preload_percent} SPEED={tipform_buffer_preload_speed} ACCEL={tipform_buffer_preload_accel}
                M400
            {% elif tip_form_enabled == 1 and tipform_buffer_preload_enabled == 1 %}
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: buffer preload skipped - direct-feed/no-buffer mode"
            {% endif %}

            {% set homed_axes = printer.toolhead.homed_axes %}
            {% set printer_homed = 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %}

            {% if move_to_bucket == 1 and printer_homed %}
                _STATUS_MSG MSG="Moving to purge bucket"
                G90
                G1 Z{bucket_z} F{z_travel_speed}
                G1 X{bucket_x} F{travel_speed}
                G1 Y{bucket_y} F{travel_speed}
            {% elif move_to_bucket == 1 and not printer_homed %}
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: printer not homed, skipping purge bucket move"
            {% endif %}

            {% if pre_unload_cool_enabled == 1 %}
                M117 Cooling {material} before unload
                _STATUS_MSG MSG="Cooling nozzle before {material} unload"
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: cooling {active_extruder} to <= {pre_unload_cool_max}C before reheating to {unload_temp}C"

                TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={pre_unload_cool_max}

                {% if pre_unload_cool_soak > 0 %}
                    _STATUS_MSG MSG="Soaking cooled melt zone"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: pre-unload cool soak={pre_unload_cool_soak}s"
                    G4 P{(pre_unload_cool_soak * 1000)|int}
                {% endif %}

                SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}
            {% endif %}

            M117 Waiting for {material} unload temp
            _STATUS_MSG MSG="Heating nozzle for {material} unload"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: waiting for {active_extruder} to reach {unload_temp_min}-{unload_temp_max}C before buffer pull/retract"
            TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={unload_temp_min} MAXIMUM={unload_temp_max}

            _BEEP

            M83
            G92 E0
            M400

            {% if tip_form_enabled == 1 %}
                #################################################################
                # Tip-form path
                #################################################################

                _UNLOAD_TIP_FORM {rawparams}

                {% if tipform_receive_pull_distance > 0 and use_buffer_for_unload == 1 %}
                    _STATUS_MSG MSG="Starting buffer receive pull"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: tipform receive pull distance={tipform_receive_pull_distance}, current={tipform_receive_pull_current}, speed={tipform_receive_pull_speed}, accel={tipform_receive_pull_accel}, lead={tipform_receive_pull_lead_time}"

                    {% if tipform_receive_pull_use_config_current %}
                        BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={tipform_receive_pull_distance} SPEED={tipform_receive_pull_speed} ACCEL={tipform_receive_pull_accel}
                    {% else %}
                        BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={tipform_receive_pull_current} DISTANCE={tipform_receive_pull_distance} SPEED={tipform_receive_pull_speed} ACCEL={tipform_receive_pull_accel}
                    {% endif %}

                    G4 P{(tipform_receive_pull_lead_time * 1000)|int}

                {% elif use_buffer_for_unload == 0 %}
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: tipform receive pull skipped - direct-feed/no-buffer mode"
                {% endif %}

                {% if tipform_final_retract_distance > 0 %}
                    _STATUS_MSG MSG="Final tip-form retract"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: tipform_final_retract_distance={tipform_final_retract_distance}, tipform_final_retract_speed={tipform_final_retract_speed}"
                    G1 E-{tipform_final_retract_distance} F{(tipform_final_retract_speed * 60)|int}
                    M400
                {% endif %}

                {% if tipform_receive_wait_after > 0 and use_buffer_for_unload == 1 and tipform_receive_pull_distance > 0 %}
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: tipform_receive_wait_after={tipform_receive_wait_after}"
                    G4 P{(tipform_receive_wait_after * 1000)|int}
                {% endif %}

                {% if use_buffer_for_unload == 1 and tipform_receive_pull_distance > 0 %}
                    BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=0
                {% endif %}

            {% else %}
                #################################################################
                # Basic unload path
                #################################################################

                {% if buffer_hard_pull_distance > 0 and use_buffer_for_unload == 1 %}
                    _STATUS_MSG MSG="Starting buffer pull"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: hard buffer pull distance={buffer_hard_pull_distance}, current={buffer_hard_pull_current}, speed={buffer_hard_pull_speed}, accel={buffer_hard_pull_accel}"
                    BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_hard_pull_current} DISTANCE={buffer_hard_pull_distance} SPEED={buffer_hard_pull_speed} ACCEL={buffer_hard_pull_accel}
                    G4 P{(buffer_tension_lead_time * 1000)|int}
                {% endif %}

                {% if push_distance > 0 %}
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: push_distance={push_distance}, push_speed={push_speed}"
                    G1 E{push_distance} F{(push_speed * 60)|int}
                    M400
                {% endif %}

                {% if neck_retract_distance > 0 %}
                    _STATUS_MSG MSG="Necking filament tip"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: neck_retract_distance={neck_retract_distance}, neck_retract_speed={neck_retract_speed}"
                    G1 E-{neck_retract_distance} F{(neck_retract_speed * 60)|int}
                    M400
                {% endif %}

                {% if final_retract_distance > 0 %}
                    _STATUS_MSG MSG="Retracting from hotend"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: final_hotend_retract_distance={final_retract_distance}, retract_speed={retract_speed}"
                    G1 E-{final_retract_distance} F{(retract_speed * 60)|int}
                    M400
                {% endif %}

                {% if hard_pull_wait_after_basic > 0 and use_buffer_for_unload == 1 %}
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: hard_pull_wait_after_basic={hard_pull_wait_after_basic}"
                    G4 P{(hard_pull_wait_after_basic * 1000)|int}
                {% endif %}
            {% endif %}

            #################################################################
            # Buffer pull stages
            #################################################################

            {% if use_buffer_for_unload == 1 and tip_form_enabled == 0 %}
                {% if buffer_hard_pull_distance > 0 %}
                    {% if buffer_use_config_current %}
                        BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=0
                    {% else %}
                        BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} RELEASE=0
                    {% endif %}
                {% endif %}

                {% if buffer_remaining_distance > 0 %}
                    _STATUS_MSG MSG="Pulling filament back"
                    _DEBUG_MSG MSG="UNLOAD_FILAMENT: normal buffer pull distance={buffer_remaining_distance}, current={buffer_normal_pull_current}, speed={buffer_tension_speed}, accel={buffer_tension_accel}"

                    {% if buffer_use_config_current %}
                        BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={buffer_remaining_distance} SPEED={buffer_tension_speed} ACCEL={buffer_tension_accel}
                    {% else %}
                        BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} DISTANCE={buffer_remaining_distance} SPEED={buffer_tension_speed} ACCEL={buffer_tension_accel}
                    {% endif %}

                    G4 P{(normal_pull_wait * 1000)|int}

                    {% if buffer_use_config_current %}
                        BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE={0 if do_final_buffer_retract else 1}
                    {% else %}
                        BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} RELEASE={0 if do_final_buffer_retract else 1}
                    {% endif %}

                {% else %}
                    BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE={0 if do_final_buffer_retract else 1}
                {% endif %}

            {% elif use_buffer_for_unload == 1 and tip_form_enabled == 1 %}
                _DEBUG_MSG MSG="UNLOAD_FILAMENT: skipping generic buffer pull stages because tip-form receive pull already ran"

            {% else %}
                BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
            {% endif %}

            #################################################################
            # Fresh sensor-check helper owns final retry and long retract
            #################################################################

            {% if do_final_buffer_retract %}
                _UNLOAD_RETRY_THEN_FINAL_BUFFER_RETRACT FINAL_DISTANCE={final_buffer_retract_distance} FINAL_SPEED={final_buffer_retract_speed} FINAL_ACCEL={final_buffer_retract_accel} FINAL_CURRENT="{final_buffer_retract_current}" FINAL_SETTLE={final_buffer_retract_settle} RETRY_ENABLED={sensor_retry_pull_enabled} RETRY_DISTANCE={sensor_retry_pull_distance} RETRY_SPEED={sensor_retry_pull_speed} RETRY_ACCEL={sensor_retry_pull_accel} RETRY_CURRENT="{sensor_retry_pull_current}" RETRY_LEAD_TIME={sensor_retry_pull_lead_time} RETRY_SETTLE={sensor_retry_pull_settle} HOTEND_RETRY_ENABLED={sensor_retry_hotend_retract_enabled} HOTEND_RETRY_DISTANCE={sensor_retry_hotend_retract_distance} HOTEND_RETRY_SPEED={sensor_retry_hotend_retract_speed} HOTEND_RETRY_SETTLE={sensor_retry_hotend_retract_settle} FAIL_BEEPS={final_buffer_fail_beeps} FAIL_BEEP_DELAY_MS={final_buffer_fail_beep_delay_ms}
            {% endif %}

            M117 {material} unload complete
            _STATUS_MSG MSG="{material} unload complete"
            _DEBUG_MSG MSG="UNLOAD_FILAMENT: complete"
            _BEEP

            RESTORE_GCODE_STATE NAME=unload_state
        {% endif %}

    {% endif %}

    
#####################################################################
# Tool / Buffer Extruder States
#####################################################################

[gcode_macro _RESTORE_HOTEND_FOR_BUFFER]
description: Restore active extruder to the hotend paired with a buffer extruder
gcode:
  {% set buffer = params.BUFFER|default(printer.toolhead.extruder)|string %}

  {% if buffer == "extruder" %}
    {action_raise_error("Cannot restore from buffer: active extruder is already 'extruder'")}
  {% endif %}

  {% set buffer_num = buffer|replace("extruder", "")|int %}

  {% if buffer_num < 1 or (buffer_num % 2) == 0 %}
    {action_raise_error(buffer ~ " is not a buffer extruder in the paired numbering map")}
  {% endif %}

  {% set hotend_num = buffer_num - 1 %}

  {% if hotend_num == 0 %}
    {% set hotend_extruder = "extruder" %}
  {% else %}
    {% set hotend_extruder = "extruder" ~ hotend_num %}
  {% endif %}

  ACTIVATE_EXTRUDER EXTRUDER={hotend_extruder}


#####################################################################
# Basic functions, overrides, and Stock macro mods
#####################################################################

[gcode_macro _BEEP]
gcode:
    M300 S500 P500


[gcode_macro _WAIT]
description: Wait/dwell for a number of seconds
gcode:
    {% set time = params.TIME|default(3)|float %}
    _DEBUG_MSG MSG="WAIT START {time}s"
    M400
    G4 P{(time * 1000)|int}
    _DEBUG_MSG MSG="WAIT DONE"


[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}


[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False


[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False


[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    BTT_BED_MESH_CALIBRATE {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False


[gcode_macro M600]
description: Filament change
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    START_BEEPING
    PAUSE
    STOP_BEEPING
    G91
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28

    G0 X175 Y175 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32


[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% set L = 0.5 %}
    {% if S <= 0 %}
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %}
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %}
    {% endif %}
    SET_PIN PIN=_beeper VALUE={L} CYCLE_TIME={F}
    G4 P{P}
    SET_PIN PIN=_beeper VALUE=0


[gcode_macro DEBUG_ACTIVE_EXTRUDER]
gcode:
    M118 Active extruder is {printer.toolhead.extruder}

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

[gcode_macro _STATUS_MSG]
description: Print a basic user-facing macro status message
gcode:
    {% set msg = params.MSG|default("")|string %}
    {% set vars = printer["gcode_macro _MACRO_MESSAGES"] %}

    {% if vars.status_enabled|int == 1 and msg != "" %}
        M118 {msg}
    {% endif %}


[gcode_macro _DEBUG_MSG]
description: Print a detailed debug message when macro debug is enabled
gcode:
    {% set msg = params.MSG|default("")|string %}
    {% set vars = printer["gcode_macro _MACRO_MESSAGES"] %}

    {% if vars.debug|int == 1 and msg != "" %}
        M118 DEBUG: {msg}
    {% endif %}

#######################################################################################
# Checking speed capabilities
#######################################################################################

[gcode_macro TEST_Z_STABILITY]
description: QGL -> Z cycle -> QGL drift check

variable_cycles: 20
variable_z_low: 50
variable_z_high: 250
variable_speed: 1800

gcode:
    {% set cycles = params.CYCLES|default(printer["gcode_macro TEST_Z_STABILITY"].cycles)|int %}
    {% set z_low = params.Z_LOW|default(printer["gcode_macro TEST_Z_STABILITY"].z_low)|float %}
    {% set z_high = params.Z_HIGH|default(printer["gcode_macro TEST_Z_STABILITY"].z_high)|float %}
    {% set speed = params.SPEED|default(printer["gcode_macro TEST_Z_STABILITY"].speed)|int %}

    M117 Z Stability Test: Baseline QGL
    RESPOND MSG="--- Z TEST: BASELINE QGL ---"

    G28
    QUAD_GANTRY_LEVEL

    G90
    G0 Z{z_high} F{speed}

    M117 Z Cycling...
    RESPOND MSG="--- Z TEST: CYCLING {cycles} TIMES ({z_low}↔{z_high}) @ {speed} ---"

    {% for i in range(cycles) %}
        G0 Z{z_low} F{speed}
        G0 Z{z_high} F{speed}
    {% endfor %}

    M400

    M117 Z Stability Test: Post QGL
    RESPOND MSG="--- Z TEST: POST QGL ---"

    QUAD_GANTRY_LEVEL

    M117 Z Stability Test Done


[gcode_macro TEST_SPEED]
description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU
gcode:
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(50)|int %}
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% if x_min < 0 %}
        {% set x_min = 0 %}
    {% endif %}

    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% if y_min < 0 %}
        {% set y_min = 0 %}
    {% endif %}

    {% set x_min = x_min + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = y_min + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}

    {% set x_center_min = x_center - (smallpatternsize/2) %}
    {% set x_center_max = x_center + (smallpatternsize/2) %}
    {% set y_center_min = y_center - (smallpatternsize/2) %}
    {% set y_center_max = y_center + (smallpatternsize/2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED

    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }

    M400
    G28

    {% if printer.configfile.settings.quad_gantry_level %}
        {% if printer.quad_gantry_level.applied == False %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}
    {% endif %}

    G90
    G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION

    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}

        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    M400
    G28
    G90
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED