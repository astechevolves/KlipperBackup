
[display_status]

[delayed_gcode _BOOT_INIT_TOOLCHANGER]
initial_duration: 5
gcode:
    INITIALIZE_TOOLCHANGER


#####################################################################
#                  Macro Message Control
#####################################################################

[gcode_macro _MACRO_MESSAGES]
description: Shared message controls for macros.cfg
variable_status_enabled: 0                    # 1 = show basic progress messages.
variable_debug: 1                             # 1 = show detailed debug messages.
gcode:
    # Variable storage only.


#####################################################################
#                  Buffer / Toolhead Sensor Map
#####################################################################
# Purpose:
# - Central map for installed buffers, tool-to-buffer pairing, and sensors.
# - Does not store live buffer/direct-feed state.
# - Buffer/direct-feed decisions are made from live sensor states.
#
# Mode decision used by load/unload/routers:
# - Buffer mode: buffer entrance sensor = detected.
# - Direct-feed mode: buffer entrance sensor = clear AND toolhead sensor = detected.
# - No-filament state: both sensors clear.
# - DIRECT_FEED=1 can force buffer bypass for side-feed/special cases.
#
# Tool/extruder mapping:
# - Tool0 hotend = extruder
# - Tool1 hotend = extruder1
# - Tool2 hotend = extruder2
# - Tool3 hotend = extruder3
#
# Buffer mapping:
# - Tool0 uses Buffer0
# - Tool1 uses Buffer1
# - Tool2 uses Buffer2
# - Tool3 uses Buffer3
#
# installed_buffers:
# - Comma-separated list of physically installed buffers.
# - Only add a buffer number after matching macros/config exist.
#####################################################################

[gcode_macro _BUFFER_USAGE_STATE]
description: Central buffer/tool/sensor map

variable_installed_buffers: "0"              # Installed buffer numbers. Later: "0,1,2,3,4"

variable_tool0_buffer: 0
variable_tool1_buffer: 1
variable_tool2_buffer: 2
variable_tool3_buffer: 3
variable_tool4_buffer: 4

# Use the full Klipper object name for each buffer entrance sensor.
variable_tool0_entrance_sensor: "filament_switch_sensor buffer0_entrance"
variable_tool1_entrance_sensor: ""
variable_tool2_entrance_sensor: ""
variable_tool3_entrance_sensor: ""
variable_tool4_entrance_sensor: ""

# Use the full Klipper object name for each toolhead/nozzle sensor.
variable_tool0_hotend_sensor: "filament_switch_sensor T0_filament_sensor"
variable_tool1_hotend_sensor: ""
variable_tool2_hotend_sensor: ""
variable_tool3_hotend_sensor: ""
variable_tool4_hotend_sensor: ""

gcode:
    # Central map only.


#####################################################################
#                  Buffer0 Entrance Sensor Event Handlers
#####################################################################

[gcode_macro ENTRANCE_INSERT_BUFFER0]
description: Handle Buffer0 entrance filament insert event
gcode:
    _STATUS_MSG MSG="Buffer0 entrance filament detected"
    _DEBUG_MSG MSG="ENTRANCE_INSERT_BUFFER0: insert event only; no mode state stored"


[gcode_macro ENTRANCE_RUNOUT_BUFFER0]
description: Handle Buffer0 entrance filament runout/clear event
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        _STATUS_MSG MSG="Buffer0 entrance clear during print - warning only"
        _DEBUG_MSG MSG="ENTRANCE_RUNOUT_BUFFER0: print continues; no mode state changed"
        _BEEP
    {% else %}
        _STATUS_MSG MSG="Buffer0 entrance sensor clear"
        _DEBUG_MSG MSG="ENTRANCE_RUNOUT_BUFFER0: event only; no mode state stored"
    {% endif %}


#####################################################################
#                  Print Start
#####################################################################

[gcode_macro PRINT_START]
description: Start print with clean nozzle, adaptive mesh, Buffer0 sync purge, and auto buffer handoff

# --- Purge bucket ---
variable_bucket_entry_x:   310
variable_bucket_y:         0
variable_bucket_exit_y:    50
variable_bucket_spd_xy:    9000

# --- Nozzle prep temps ---
variable_wipe_temp:        190
variable_mesh_nozzle_temp: 160

gcode:
  {% set TOOL = params.TOOL | default(0)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set TOOL_QGL_TEMP = params.TOOL_QGL_TEMP | default(150) | int %}
  {% set WIPE_TEMP = params.WIPE_TEMP | default(wipe_temp) | int %}
  {% set MESH_NOZZLE_TEMP = params.MESH_NOZZLE_TEMP | default(mesh_nozzle_temp) | int %}
  {% set direct_feed_override = params.DIRECT_FEED|default(0)|int %}

  {% if TOOL == 0 %}
    {% set tool_extruder = "extruder" %}
  {% elif TOOL == 1 %}
    {% set tool_extruder = "extruder1" %}
  {% elif TOOL == 2 %}
    {% set tool_extruder = "extruder2" %}
  {% elif TOOL == 3 %}
    {% set tool_extruder = "extruder3" %}
  {% else %}
    {% set tool_extruder = "extruder" %}
  {% endif %}

  {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

  {% if TOOL == 0 %}
    {% set print_entrance_sensor = sensors.tool0_entrance_sensor|string %}
    {% set print_hotend_sensor = sensors.tool0_hotend_sensor|string %}
  {% elif TOOL == 1 %}
    {% set print_entrance_sensor = sensors.tool1_entrance_sensor|string %}
    {% set print_hotend_sensor = sensors.tool1_hotend_sensor|string %}
  {% elif TOOL == 2 %}
    {% set print_entrance_sensor = sensors.tool2_entrance_sensor|string %}
    {% set print_hotend_sensor = sensors.tool2_hotend_sensor|string %}
  {% elif TOOL == 3 %}
    {% set print_entrance_sensor = sensors.tool3_entrance_sensor|string %}
    {% set print_hotend_sensor = sensors.tool3_hotend_sensor|string %}
  {% else %}
    {% set print_entrance_sensor = "" %}
    {% set print_hotend_sensor = "" %}
  {% endif %}

  {% set print_entrance_detected = 1 if print_entrance_sensor|length > 0 and print_entrance_sensor in printer and printer[print_entrance_sensor].filament_detected|int == 1 else 0 %}
  {% set print_hotend_detected = 1 if print_hotend_sensor|length > 0 and print_hotend_sensor in printer and printer[print_hotend_sensor].filament_detected|int == 1 else 0 %}

  # Entrance wins. Direct-feed only applies when entrance is clear and the toolhead sensor sees filament.
  {% set print_use_buffer = 1 if direct_feed_override == 0 and print_entrance_detected == 1 else 0 %}
  {% set print_use_direct_feed = 1 if direct_feed_override == 1 or (print_entrance_detected == 0 and print_hotend_detected == 1) else 0 %}

  _STATUS_MSG MSG="Starting print"
  _DEBUG_MSG MSG="PRINT_START: TOOL={TOOL}, TOOL_TEMP={TOOL_TEMP}, BED_TEMP={BED_TEMP}, TOOL_QGL_TEMP={TOOL_QGL_TEMP}, WIPE_TEMP={WIPE_TEMP}, MESH_NOZZLE_TEMP={MESH_NOZZLE_TEMP}, entrance_sensor={print_entrance_sensor}, entrance_detected={print_entrance_detected}, hotend_sensor={print_hotend_sensor}, hotend_detected={print_hotend_detected}, direct_feed_override={direct_feed_override}, use_buffer={print_use_buffer}, use_direct_feed={print_use_direct_feed}"

  {% if print_use_buffer == 0 and print_use_direct_feed == 0 %}
    { action_raise_error("PRINT_START: no filament detected at buffer entrance or toolhead sensor for TOOL=" ~ TOOL) }
  {% endif %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    _STATUS_MSG MSG="Disabling crash detection"
    STOP_CRASH_DETECTION
  {% endif %}

  #####################################################################
  # Home and QGL before bed heat
  #####################################################################

  M104 S{TOOL_QGL_TEMP}

  M117 Homing
  _STATUS_MSG MSG="Homing printer"
  INITIALIZE_TOOLCHANGER
  _CG28

  T0 ; Ensure T0 is active for pre-print calibrations.

  M117 Quad Gantry Level
  _STATUS_MSG MSG="Quad gantry level"
  _CQGL

  #####################################################################
  # Start bed heat after QGL
  #####################################################################

  M117 Starting bed heat
  _STATUS_MSG MSG="Starting bed heat"
  M140 S{BED_TEMP}

  #####################################################################
  # Switch to requested initial tool before nozzle prep
  #####################################################################

  {% if TOOL > 0 %}
    _DEBUG_MSG MSG="PRINT_START: shutting down T0 and switching to T{TOOL}"
    M104 T0 S0
    T{TOOL}
  {% endif %}

  #####################################################################
  # Move to purge bucket
  #####################################################################

  M117 Moving to purge bucket
  _STATUS_MSG MSG="Moving to purge bucket"
  _DEBUG_MSG MSG="PRINT_START: bucket_entry_x={bucket_entry_x}, bucket_y={bucket_y}, bucket_spd_xy={bucket_spd_xy}"
  G90
  G1 X{bucket_entry_x} F{bucket_spd_xy}
  G1 Y{bucket_y} F{bucket_spd_xy}

  #####################################################################
  # Buffer prep during heat / mesh
  #
  # No percent preload or center routine is started here.
  # Buffer0 is force-synced early so any intentional E moves during
  # wipe/mesh prep mirror to the buffer. The auto decision loop remains
  # disabled until after LINE_PURGE.
  #####################################################################

  {% if print_use_buffer == 1 %}
    _STATUS_MSG MSG="Buffer service loops stopped"
    _DEBUG_MSG MSG="PRINT_START: stopping center/percent/auto loops and force-syncing Buffer0 before prep"

    STOP_CENTER_BUFFER_0                    # Cancels delayed center state machine if one was left armed.
    STOP_PERCENT_MOVE_BUFFER0               # Cancels delayed percent-positioning loop.
    DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0    # Stops auto Hall-state decisions but keeps motor enabled.

    BUFFER_SYNC_ON_0                        # Force Buffer0 to follow all upcoming active-hotend E moves.
    STATUS_BUFFER0
  {% else %}
    _STATUS_MSG MSG="Direct-feed print mode - buffer disabled"
    _DEBUG_MSG MSG="PRINT_START: buffer disabled, direct-feed/no-buffer mode"
    BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1
  {% endif %}

  #####################################################################
  # Heat nozzle to wipe temp, wipe, then return over bucket
  #####################################################################

  M117 Heating nozzle for wipe
  _STATUS_MSG MSG="Heating nozzle for wipe"
  _DEBUG_MSG MSG="PRINT_START: wipe nozzle heat TOOL={TOOL}, WIPE_TEMP={WIPE_TEMP}"
  M104 S{WIPE_TEMP}

  M117 Waiting on wipe temp
  _STATUS_MSG MSG="Waiting for wipe temp"
  M109 S{WIPE_TEMP}

  _STATUS_MSG MSG="First nozzle wipe"
  _WIPE_NOZZLE

  # Small retract after wiping to reduce ooze before mesh.
  # If Buffer0 is synced, it mirrors this tiny retract as well.
  {% if tool_extruder in printer %}
    {% set min_extrude_temp = printer.configfile.settings[tool_extruder].min_extrude_temp|float %}
    {% if WIPE_TEMP >= min_extrude_temp %}
      _DEBUG_MSG MSG="PRINT_START: retracting after wipe on {tool_extruder}"
      M83
      G1 E-0.4 F2400
      M82
    {% endif %}
  {% endif %}

  G90
  G1 X{bucket_entry_x} F{bucket_spd_xy}
  G1 Y{bucket_y} F{bucket_spd_xy}

  #####################################################################
  # Cool/hold nozzle lower for mesh, finish bed heat, wipe again
  #####################################################################

  M117 Setting mesh nozzle temp
  _STATUS_MSG MSG="Setting mesh nozzle temp"
  _DEBUG_MSG MSG="PRINT_START: mesh nozzle temp MESH_NOZZLE_TEMP={MESH_NOZZLE_TEMP}"
  M104 S{MESH_NOZZLE_TEMP}

  M117 Waiting for bed
  _STATUS_MSG MSG="Waiting for bed"
  M190 S{BED_TEMP}

  _STATUS_MSG MSG="Waiting for mesh nozzle temp"
  TEMPERATURE_WAIT SENSOR={tool_extruder} MAXIMUM={MESH_NOZZLE_TEMP + 5}

  _STATUS_MSG MSG="Final nozzle wipe before mesh"
  _WIPE_NOZZLE

  G90
  G1 X{bucket_entry_x} F{bucket_spd_xy}
  G1 Y{bucket_y} F{bucket_spd_xy}

  #####################################################################
  # Adaptive mesh with clean, lower-temp nozzle
  #####################################################################

  M117 Running adaptive mesh
  _STATUS_MSG MSG="Running bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1

  #####################################################################
  # Smart park and final nozzle heat
  #####################################################################

  SMART_PARK

  M117 Heating final print temp
  _STATUS_MSG MSG="Heating final nozzle temp"
  _DEBUG_MSG MSG="PRINT_START: final nozzle heat TOOL={TOOL}, TOOL_TEMP={TOOL_TEMP}"
  M104 S{TOOL_TEMP}

  M117 Waiting on T{TOOL} S{TOOL_TEMP}C
  _STATUS_MSG MSG="Waiting for final nozzle temp"
  M109 S{TOOL_TEMP}

  #####################################################################
  # Force Buffer0 sync for LINE_PURGE
  #
  # LINE_PURGE is a known extruder move, so Buffer0 should follow it
  # directly instead of letting the auto Hall-state logic decide.
  #####################################################################

  {% if print_use_buffer == 1 %}
    _STATUS_MSG MSG="Force-syncing buffer before purge"
    _DEBUG_MSG MSG="PRINT_START: force-sync Buffer0 before LINE_PURGE"

    STATUS_BUFFER0

    STOP_CENTER_BUFFER_0
    STOP_PERCENT_MOVE_BUFFER0
    DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0    # DISABLE_AUTO may desync; the next line deliberately re-syncs.

    BUFFER_SYNC_ON_0
  {% endif %}

  #####################################################################
  # Purge line
  #####################################################################

  _STATUS_MSG MSG="Purging line"
  LINE_PURGE

  #####################################################################
  # Hand Buffer0 back to auto sync control after purge
  #
  # KEEP_SYNC=1 prevents ENABLE_AUTO_BUFFER0 from intentionally dropping
  # sync immediately after the purge line.
  #####################################################################

  {% if print_use_buffer == 1 %}
    _STATUS_MSG MSG="Enabling buffer auto sync after purge"
    _DEBUG_MSG MSG="PRINT_START: enabling Buffer0 auto sync after LINE_PURGE"

    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=auto_print_only VALUE=1
    SET_GCODE_VARIABLE MACRO=_VARS_BUFFER0 VARIABLE=debug_hold VALUE=0

    ENABLE_AUTO_BUFFER0 KEEP_SYNC=1
  {% endif %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    _STATUS_MSG MSG="Re-enabling crash detection"
    START_CRASH_DETECTION
  {% endif %}

  _STATUS_MSG MSG="Print start complete"


#####################################################################
#                  Nozzle Wipe
#####################################################################

[gcode_macro _WIPE_NOZZLE]
description: Wipe nozzle using purge bucket / brush location from PRINT_START
variable_brush_top:        1
variable_clearance_z:      5
variable_brush_start:      251
variable_brush_width:      32
variable_wipe_qty:         3
variable_prep_spd_xy:      9000
variable_prep_spd_z:       1500
variable_wipe_spd_xy:      5000
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle

    {% set ps = printer["gcode_macro PRINT_START"] %}

    _DEBUG_MSG MSG="_WIPE_NOZZLE: bucket_x={ps.bucket_entry_x}, bucket_y={ps.bucket_y}, brush_top={brush_top}, brush_start={brush_start}, brush_width={brush_width}, wipe_qty={wipe_qty}"

    G90
    G1 X{ps.bucket_entry_x} F{ps.bucket_spd_xy}
    G1 Y{ps.bucket_y} F{ps.bucket_spd_xy}
    G1 Z{brush_top} F{prep_spd_z}
    G1 X{brush_start} F{wipe_spd_xy}

    {% for wipes in range(wipe_qty) %}
        G1 X{brush_start + brush_width} F{wipe_spd_xy}
        G1 X{brush_start} F{wipe_spd_xy}
    {% endfor %}

    RESTORE_GCODE_STATE NAME=clean_nozzle


#####################################################################
#                  Print End / Pause / Resume / Cancel
#####################################################################

[gcode_macro PRINT_END]
description: End print, retract, disable buffers, park, and shut down heaters
gcode:
  {% set th = printer.toolhead %}
  {% set z_lift = 50 %}
  {% set z_safe = [th.position.z + z_lift, th.axis_maximum.z]|min %}
  {% set x_park = 348 %}
  {% set y_park = 348 %}

  _STATUS_MSG MSG="Ending print"
  _DEBUG_MSG MSG="PRINT_END: current_z={th.position.z}, z_safe={z_safe}, x_park={x_park}, y_park={y_park}"

  M220 S100
  M221 S100
  SET_PRESSURE_ADVANCE ADVANCE=0

  G92 E0
  G1 E-2.0 F3600
  M400

  _STATUS_MSG MSG="Disabling buffers"
  BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1

  G90
  G0 Z{z_safe} F3000
  G0 X{x_park} Y{y_park} F12000

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  {% for tn in printer.toolchanger.tool_numbers %}
      _DEBUG_MSG MSG="PRINT_END: shutting down tool {tn}"
      M104 S0 T{tn}
      M107 T{tn}
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0
  {% endfor %}

  M140 S0
  _STATUS_MSG MSG="Print end complete"


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  _STATUS_MSG MSG="Pausing print"
  _DEBUG_MSG MSG="PAUSE: stopping Buffer0 delayed/service loops, leaving motor available"
  STOP_CENTER_BUFFER_0
  STOP_PERCENT_MOVE_BUFFER0
  DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}

  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}

  _STATUS_MSG MSG="Resuming print"
  _DEBUG_MSG MSG="RESUME: extrude={extrude}, params={get_params}"

  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  BUFFER_ARM_ACTIVE_TOOL
  RESUME_BASE {get_params}


[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}

  _DEBUG_MSG MSG="_TOOLHEAD_PARK_PAUSE_CANCEL: x_park={x_park}, y_park={y_park}, z_safe={z_safe}, extrude={extrude}"

  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}


[gcode_macro CANCEL_PRINT]
description: Cancel print, lift Z, clear print state
rename_existing: BASE_CANCEL_PRINT
gcode:
  {% set th = printer.toolhead %}
  {% set z_lift = 50 %}
  {% set z_target = [th.position.z + z_lift, th.axis_maximum.z]|min %}
  {% set z_move = z_target - th.position.z %}
  {% set x_park = 348 %}
  {% set y_park = 348 %}

  _STATUS_MSG MSG="Cancelling print"
  _DEBUG_MSG MSG="CANCEL_PRINT: current_z={th.position.z}, z_target={z_target}, z_move={z_move}, x_park={x_park}, y_park={y_park}"

  M400

  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-2.0 F3600
    M400
  {% endif %}

  _STATUS_MSG MSG="Disabling buffers"
  BUFFER_DISABLE_ALL_BUFFERS DISABLE_MOTOR=1

  {% if "z" in printer.toolhead.homed_axes and z_move > 0 %}
    G91
    G1 Z{z_move} F3000
    G90
  {% endif %}

  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G0 X{x_park} Y{y_park} F12000
  {% endif %}

  TURN_OFF_HEATERS
  M107
  CLEAR_PAUSE
  BASE_CANCEL_PRINT
  _STATUS_MSG MSG="Cancel complete"


#####################################################################
#                  Utility Positions / QGL
#####################################################################

[gcode_macro CENTER_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y163 Z20 F9000


[gcode_macro PRESENT_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y20 Z20 F9000


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        STATUS_CALIBRATING_Z
        _CG28
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    _FINE_QUAD_GANTRY_LEVEL


[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0
        G28 Z
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_CALIBRATED
        _BEEP
    {% else %}
        {action_respond_info("Fine QGL called without calling coarse QGL first!")}
        _QUAD_GANTRY_LEVEL
    {% endif %}


#####################################################################
#                  Active Tool Buffer Router
#####################################################################

[gcode_macro BUFFER_ARM_ACTIVE_TOOL]
description: Enable the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set sensors = printer["gcode_macro _BUFFER_USAGE_STATE"] %}

    {% if active_extruder == "extruder" %}
        {% set entrance_sensor = sensors.tool0_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool0_hotend_sensor|string %}
    {% elif active_extruder == "extruder1" %}
        {% set entrance_sensor = sensors.tool1_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool1_hotend_sensor|string %}
    {% elif active_extruder == "extruder2" %}
        {% set entrance_sensor = sensors.tool2_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool2_hotend_sensor|string %}
    {% elif active_extruder == "extruder3" %}
        {% set entrance_sensor = sensors.tool3_entrance_sensor|string %}
        {% set hotend_sensor = sensors.tool3_hotend_sensor|string %}
    {% else %}
        {% set entrance_sensor = "" %}
        {% set hotend_sensor = "" %}
    {% endif %}

    {% set entrance_detected = 1 if entrance_sensor|length > 0 and entrance_sensor in printer and printer[entrance_sensor].filament_detected|int == 1 else 0 %}
    {% set hotend_detected = 1 if hotend_sensor|length > 0 and hotend_sensor in printer and printer[hotend_sensor].filament_detected|int == 1 else 0 %}

    {% if active_extruder == "extruder" and entrance_detected == 1 %}
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: active_extruder={active_extruder}, entrance_detected={entrance_detected}, hotend_detected={hotend_detected}"
        STOP_CENTER_BUFFER_0
        STOP_PERCENT_MOVE_BUFFER0
        ENABLE_AUTO_BUFFER0
    {% elif active_extruder == "extruder" %}
        _STATUS_MSG MSG="Buffer skipped - direct-feed/no-buffer mode"
        _DEBUG_MSG MSG="BUFFER_ARM_ACTIVE_TOOL: skipped. active_extruder={active_extruder}, entrance_sensor={entrance_sensor}, entrance_detected={entrance_detected}, hotend_sensor={hotend_sensor}, hotend_detected={hotend_detected}"
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1
    {% else %}
        M118 No buffer enable route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro BUFFER_DISABLE_ACTIVE_TOOL]
description: Disable the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}

    {% if active_extruder == "extruder" %}
        _DEBUG_MSG MSG="BUFFER_DISABLE_ACTIVE_TOOL: active_extruder={active_extruder}, disable_motor={disable_motor}"
        STOP_CENTER_BUFFER_0
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR={disable_motor}
        STOP_PERCENT_MOVE_BUFFER0
    {% else %}
        M118 No buffer disable route for active extruder: {active_extruder}
    {% endif %}


[gcode_macro STOP_CENTER_BUFFER_0]
description: Stop active Buffer0 center loop
gcode:
    SET_GCODE_VARIABLE MACRO=CENTER_BUFFER_0 VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_CENTER_BUFFER_LOOP_0 DURATION=0

    {% if printer["gcode_macro _VARS_BUFFER0"].debug|int == 1 or printer["gcode_macro _VARS_BUFFER0"].debug_hold|int == 1 %}
        RESPOND TYPE=command MSG="CENTER_BUFFER_0 stopped"
    {% endif %}


[gcode_macro BUFFER_DISABLE_ALL_BUFFERS]
description: Disable all installed buffer regulators and optionally release motors
gcode:
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}
    {% set map = printer["gcode_macro _BUFFER_USAGE_STATE"] %}
    {% set installed = map.installed_buffers|string %}

    _DEBUG_MSG MSG="BUFFER_DISABLE_ALL_BUFFERS: disable_motor={disable_motor}, installed_buffers={installed}"

    {% for b in installed.split(",") %}
        {% set n = b|trim %}

        {% if n == "0" %}
            STOP_CENTER_BUFFER_0
            DISABLE_AUTO_BUFFER0 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER0

        {% elif n == "1" %}
            STOP_CENTER_BUFFER_1
            DISABLE_AUTO_BUFFER1 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER1

        {% elif n == "2" %}
            STOP_CENTER_BUFFER_2
            DISABLE_AUTO_BUFFER2 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER2

        {% elif n == "3" %}
            STOP_CENTER_BUFFER_3
            DISABLE_AUTO_BUFFER3 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER3

        {% elif n == "4" %}
            STOP_CENTER_BUFFER_4
            DISABLE_AUTO_BUFFER4 DISABLE_MOTOR={disable_motor}
            STOP_PERCENT_MOVE_BUFFER4

        {% elif n == "" %}
            # Ignore empty entries in installed_buffers.
        {% else %}
            M118 BUFFER_DISABLE_ALL_BUFFERS: no disable route for buffer {n}
        {% endif %}
    {% endfor %}


[gcode_macro BUFFER_POSITION_ACTIVE_TOOL]
description: Manual/service move of active tool buffer to requested percent
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set target = params.PERCENT|default(50)|float %}
    {% set step = params.STEP|default(5)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% set accel = params.ACCEL|default(300)|float %}
    {% set max_steps = params.MAX_STEPS|default(45)|int %}

    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        { action_respond_info("BUFFER_POSITION_ACTIVE_TOOL ignored while actively printing.") }
    {% elif active_extruder == "extruder" %}
        _DEBUG_MSG MSG="BUFFER_POSITION_ACTIVE_TOOL: active_extruder={active_extruder}, target={target}, step={step}, speed={speed}, accel={accel}, max_steps={max_steps}"
        DISABLE_AUTO_BUFFER0 DISABLE_MOTOR=0
        STOP_PERCENT_MOVE_BUFFER0
        MOVE_TO_PERCENT_BUFFER0 PERCENT={target} STEP={step} SPEED={speed} ACCEL={accel} MAX_STEPS={max_steps}
    {% else %}
        M118 No buffer position route for active extruder: {active_extruder}
    {% endif %}


