[display_status]

[gcode_macro PRINT_START]
# --- Purge bucket (single source of truth) ---
variable_bucket_entry_x:   310    # X position for safe approach to purge bucket
variable_bucket_y:         0      # Y position of purge bucket
variable_bucket_exit_y:    50     # Y position to move back onto bed
variable_bucket_spd_xy:    9000   # Travel speed for bucket moves

gcode:
  {% set TOOL = params.TOOL | default(0)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}

  {% set TOOL_QGL_TEMP = params.TOOL_QGL_TEMP | default(150) | int %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}

  M140 S{BED_TEMP}
  M104 S{TOOL_QGL_TEMP}

  M117 Homing
  INITIALIZE_TOOLCHANGER
  _CG28

  T0 ; Ensure we have T0 active for pre-print calibrations.

  M117 Quad Gantry Level
  _CQGL
  
  M117 Heating Bed
  M190 S{BED_TEMP}

  # Retract slightly to reduce ooze before bed mesh
  {% if printer.toolhead.extruder != "" %}
    {% set active_extruder = printer.toolhead.extruder %}
    {% set min_extrude_temp = printer.configfile.settings[active_extruder].min_extrude_temp|float %}

    {% if printer[active_extruder].temperature < min_extrude_temp %}
      M117 Waiting for min retract temp
      TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={min_extrude_temp}
    {% endif %}

    M117 Retracting before mesh to prevent ooze
    M83
    G1 E-0.4 F2400
    M82
  {% endif %}

  BED_MESH_CALIBRATE ADAPTIVE=1 ; Run adaptive bed mesh

  ; Switch to the initial printing tool and preheat it.
  {% if TOOL > 0 %}
    M104 T0 S0 ; Shutdown T0.
    T{params.TOOL} ; Switch to the initial printing tool
  {% endif %}

  # Move to purge bucket during heat-up
  M117 Moving to purge bucket
  G90
  G1 X{bucket_entry_x} F{bucket_spd_xy}
  G1 Y{bucket_y} F{bucket_spd_xy}

  M117 Waiting on T{params.TOOL} S{TOOL_TEMP}C
  M109 S{TOOL_TEMP}

  _WIPE_NOZZLE

  # Arm and preload the active tool's buffer before purge/print extrusion starts.
  M117 Arming active buffer
  BUFFER_POSITION_ACTIVE_TOOL_NEAR_OVERFILL PREFILL=0 MAX_MOVES=40 ARM_AFTER=1

  # Exit back into bed to head to print
  G1 Z10 F1500
  G1 Y{bucket_exit_y} F{bucket_spd_xy}

  LINE_PURGE
  SMART_PARK

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}

[gcode_macro _WIPE_NOZZLE]
variable_brush_top:        1      # Z height where nozzle contacts the brush (tune carefully)
variable_clearance_z:      5      # Safe Z height for travel moves
variable_brush_start:      251    # X position where brush begins
variable_brush_width:      32     # Width of brush in X direction
variable_wipe_qty:         3      # Number of wipe cycles (back+forth = 1)
variable_prep_spd_xy:      9000   # Travel speed for XY moves (mm/min)
variable_prep_spd_z:       1500   # Travel speed for Z moves (mm/min)
variable_wipe_spd_xy:      5000   # Speed during wiping motion (mm/min)

# Match PRINT_START purge bucket positioning
variable_bucket_entry_x:   310    # X position for safe approach to purge bucket
variable_bucket_y:         1      # Y position of nozzle while purging and ready to wipe
variable_bucket_exit_y:    50     # Y position to return onto bed after wipe

gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle

    {% set ps = printer["gcode_macro PRINT_START"] %} # Pull variables from start macro for bucket location

    G90

    # Move to purge bucket
    G1 X{ps.bucket_entry_x} F{ps.bucket_spd_xy}
    G1 Y{ps.bucket_y} F{ps.bucket_spd_xy}

    # Drop into brush and move into position for initial wipe
    G1 Z{brush_top} F{prep_spd_z}
    G1 X{brush_start} F{wipe_spd_xy}

    # Wipe back and forth X times
    {% for wipes in range(wipe_qty) %}
        G1 X{brush_start + brush_width} F{wipe_spd_xy}
        G1 X{brush_start} F{wipe_spd_xy}
    {% endfor %}

    RESTORE_GCODE_STATE NAME=clean_nozzle
    
[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set z_lift = 50 %}
  {% set z_safe = [th.position.z + z_lift, th.axis_maximum.z]|min %}
  {% set x_park = 348 %}
  {% set y_park = 348 %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%

  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-2.0 F3600 ; retract filament
  M400 ; wait for extrusion/retract to complete

  # Disable the active tool's buffer after print extrusion is finished.
  BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

  G90 ; absolute positioning
  G0 Z{z_safe} F3000 ; lift Z up 50mm, but do not exceed max Z
  G0 X{x_park} Y{y_park} F12000 ; park nozzle rear-right

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####

  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park position for x and y #####
  # default is your max position from your printer.cfg

  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

  
[gcode_macro CANCEL_PRINT]
description: Cancel print, lift Z, clear print state
rename_existing: BASE_CANCEL_PRINT
gcode:
  {% set th = printer.toolhead %}
  {% set z_lift = 50 %}
  {% set z_target = [th.position.z + z_lift, th.axis_maximum.z]|min %}
  {% set z_move = z_target - th.position.z %}
  {% set x_park = 348 %}
  {% set y_park = 348 %}

  M400

  # Retract only if hot enough
  {% if printer.toolhead.extruder != "" and printer[printer.toolhead.extruder].can_extrude %}
    G92 E0
    G1 E-2.0 F3600
    M400
  {% endif %}

  # Disable the active buffer on cancel so it does not keep polling/holding.
  BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1

  # Lift Z only
  {% if "z" in printer.toolhead.homed_axes and z_move > 0 %}
    G91
    G1 Z{z_move} F3000
    G90
  {% endif %}

  {% if "xy" in printer.toolhead.homed_axes %}
    G0 X{x_park} Y{y_park} F12000 ; park nozzle rear-right
  {% endif %}

  TURN_OFF_HEATERS
  M107

  BASE_CANCEL_PRINT
  
[gcode_macro CENTER_EXTRUDER]
gcode:
    _CG28
    G90
    G1 X172 Y163 F9000

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0 

[gcode_macro HOME_AND_QUAD_LEVEL]
gcode:
    _CG28
    _CQGL

[gcode_macro QUAD_GANTRY_LEVEL] # Allow QGL to run once with rough numbers and higher travel then fine tune that with less z travel which speeds it up
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        STATUS_CALIBRATING_Z
        _CG28
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0  # <- set your preferred probing height here!
        G28 Z # Redo the z height now that the bed has moved a bit and center the head ready for the next job. 
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
        STATUS_CALIBRATED
        _BEEP
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling coarse QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}


#####################################################################
#                  Active Tool Buffer Router
#####################################################################
# Purpose:
# - Shared router for all toolheads, need to uncomment/add as needed
# - LOAD_FILAMENT calls this instead of buffer-specific macros.
# - Each buffer-specific cfg owns its own regulator behavior.
#####################################################################

[gcode_macro BUFFER_ARM_ACTIVE_TOOL]
description: Arm the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set reset_overfill = params.RESET_OVERFILL|default(0)|int %}

    {% if active_extruder == "extruder" %}
        BUFFERZERO_TOOLZERO_ARM_FOR_EXTRUSION RESET_OVERFILL={reset_overfill}

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %}
    #     BUFFERONE_TOOLONE_ARM_FOR_EXTRUSION RESET_OVERFILL={reset_overfill}

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %}
    #     BUFFERTWO_TOOLTWO_ARM_FOR_EXTRUSION RESET_OVERFILL={reset_overfill}

    {% else %}
        M118 No buffer arm route for active extruder: {active_extruder}
    {% endif %}

[gcode_macro BUFFER_DISABLE_ACTIVE_TOOL]
description: Disable the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set disable_motor = params.DISABLE_MOTOR|default(1)|int %}

    {% if active_extruder == "extruder" %}
        BUFFERZERO_TOOLZERO_DISABLE_AUTO DISABLE_MOTOR={disable_motor}

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %}
    #     BUFFERONE_TOOLONE_DISABLE_AUTO DISABLE_MOTOR={disable_motor}

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %}
    #     BUFFERTWO_TOOLTWO_DISABLE_AUTO DISABLE_MOTOR={disable_motor}

    {% else %}
        M118 No buffer disable route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#                  Active Tool Buffer Regulator Router
#####################################################################
# Purpose:
# - Shared router for common macros like LOAD_FILAMENT.
# - Checks the currently active hotend/extruder.
# - Calls the regulator for the buffer paired to that active tool.
# - Extend this macro when Tool1/Buffer1, Tool2/Buffer2, etc. are added.
#####################################################################

[gcode_macro BUFFER_REGULATE_ACTIVE_TOOL]
description: Run one regulator check for the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %} # Current active hotend/extruder selected by the toolchanger.

    {% if active_extruder == "extruder" %} # Tool0 hotend; paired with Buffer0.
        _BUFFERZERO_TOOLZERO_REGULATE # Run one Buffer0 Hall-state regulator check.

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %} # Tool1 hotend; paired with Buffer1.
    #     _BUFFERONE_TOOLONE_REGULATE

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %} # Tool2 hotend; paired with Buffer2.
    #     _BUFFERTWO_TOOLTWO_REGULATE

    {% else %}
        M118 No buffer regulate route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#                  Active Tool Buffer Near-Overfill Router
#####################################################################
# Purpose:
# - Shared router for common LOAD_FILAMENT / UNLOAD_FILAMENT macros.
# - Positions the buffer paired to the currently active toolhead near the
#   overfill / spring-loaded side before load or unload starts.
# - This keeps common load/unload buttons while each buffer cfg owns its
#   own movement details.
#####################################################################

[gcode_macro BUFFER_POSITION_ACTIVE_TOOL_NEAR_OVERFILL]
description: Move the active tool's buffer toward the near-overfill spring-loaded state
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %} # Current active hotend/extruder selected by the toolchanger.

    {% if active_extruder == "extruder" %} # Tool0 hotend; paired with Buffer0.
        BUFFERZERO_TOOLZERO_POSITION_NEAR_OVERFILL {rawparams} # Position Buffer0 near overfill.

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %} # Tool1 hotend; paired with Buffer1.
    #     BUFFERONE_TOOLONE_POSITION_NEAR_OVERFILL {rawparams}

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %} # Tool2 hotend; paired with Buffer2.
    #     BUFFERTWO_TOOLTWO_POSITION_NEAR_OVERFILL {rawparams}

    {% else %}
        M118 No near-overfill buffer route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#                  Active Tool Buffer Blocking Regulator Router
#####################################################################
# Purpose:
# - Shared router for common macros like LOAD_FILAMENT.
# - Checks the currently active hotend/extruder.
# - Calls the blocking regulator for the buffer paired to that active tool.
# - Blocking regulation is used for load/unload macros where each buffer
#   correction needs to finish before the next hotend extrusion chunk.
#####################################################################

[gcode_macro BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING]
description: Run one blocking regulator check for the buffer paired to the currently active toolhead/extruder
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %} # Current active hotend/extruder selected by the toolchanger.

    {% if active_extruder == "extruder" %} # Tool0 hotend; paired with Buffer0.
        _BUFFERZERO_TOOLZERO_REGULATE_BLOCKING # Run one blocking Buffer0 Hall-state regulator check.

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %}
    #     _BUFFERONE_TOOLONE_REGULATE_BLOCKING

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %}
    #     _BUFFERTWO_TOOLTWO_REGULATE_BLOCKING

    {% else %}
        M118 No blocking buffer regulate route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#                  Load Filament
#####################################################################
# Purpose:
# - Common load macro for the currently active toolhead.
# - Homes safely, moves to the purge bucket, heats, verifies the active
#   buffer is at/near HALL1 overfill, then loads/purges through the
#   active hotend.
# - Buffer verify reuses the paired buffer's shared near-overfill macro.
# - Fresh entrance-sensor fill should use PREFILL=1 in buffer0.cfg.
# - LOAD_FILAMENT defaults to PREFILL=0 because filament may already be
#   partially staged near the extruder during load/unload testing.
# - Purge is chunked so the blocking buffer regulator can run between
#   completed extrusion segments.
#####################################################################

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 10                  # Length in mm to quickly push filament into the melt zone.
variable_purge_distance: 70                 # Length in mm to slowly purge/prime after loading.
variable_purge_chunk: 5                     # Purge chunk size in mm; smaller chunks give the buffer more chances to react.
variable_load_temp: 240                     # Final hotend temperature for loading/purging.
variable_home_temp: 150                     # Safe warm temp used around homing.
variable_home_cool_target: 145              # Target setpoint used when cooling before homing; should be below min extrusion temp.
variable_purge_bucket_x: 310                # X position for purge bucket.
variable_purge_bucket_y: 0                  # Y position for purge bucket.
variable_purge_bucket_z: 5                  # Z height used when moving to/from purge bucket.
variable_travel_speed: 9000                 # XY travel speed in mm/min.
variable_z_travel_speed: 1200               # Z travel speed in mm/min.

# Buffer positioning / verification
variable_verify_buffer_before_load: 1       # 1 checks/pushes active buffer to HALL1 overfill before hotend load.
variable_buffer_verify_prefill: 0           # Keep 0 for LOAD_FILAMENT; do not blind-prefill when filament may already be staged.
variable_buffer_verify_max_moves: 40        # Max checked near-overfill moves using buffer initial-fill increments.
variable_buffer_position_distance: 25       # Legacy one-step fallback distance if verify is disabled.
variable_buffer_position_speed: 30          # Legacy one-step fallback speed if verify is disabled.

variable_keep_buffer_active: 0              # 0 disables/releases buffer after manual load; 1 leaves regulator running.

gcode:
    {% set speed = params.SPEED|default(100)|float %} # Purge speed in mm/min; can override with SPEED=.
    {% set active_extruder = printer.toolhead.extruder|string %} # Currently active hotend/extruder from the selected toolhead.
    {% set max_velocity = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float * 60.0 %} # Max safe extrude-only speed converted from mm/s to mm/min.

    {% set load_distance = params.LOAD_DISTANCE|default(load_distance)|float %} # Override fast load distance.
    {% set purge_distance = params.PURGE_DISTANCE|default(purge_distance)|float %} # Override purge distance.
    {% set purge_chunk = params.PURGE_CHUNK|default(purge_chunk)|float %} # Override purge chunk size.
    {% set load_temp = params.TEMP|default(load_temp)|float %} # Override final load/purge temp.
    {% set home_temp = params.HOME_TEMP|default(home_temp)|float %} # Override safe homing temp.
    {% set home_cool_target = params.HOME_COOL_TARGET|default(home_cool_target)|float %} # Override cooldown target before homing.

    {% set bucket_x = params.BUCKET_X|default(purge_bucket_x)|float %} # Purge bucket X position; can override with BUCKET_X=.
    {% set bucket_y = params.BUCKET_Y|default(purge_bucket_y)|float %} # Purge bucket Y position; can override with BUCKET_Y=.
    {% set bucket_z = params.BUCKET_Z|default(purge_bucket_z)|float %} # Purge bucket Z height; can override with BUCKET_Z=.
    {% set travel_speed = params.TRAVEL_SPEED|default(travel_speed)|float %} # XY travel speed override.
    {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(z_travel_speed)|float %} # Z travel speed override.

    {% set verify_buffer_before_load = params.VERIFY_BUFFER|default(verify_buffer_before_load)|int %} # 1 verifies active buffer near-overfill before hotend load.
    {% set buffer_verify_prefill = params.BUFFER_VERIFY_PREFILL|default(buffer_verify_prefill)|int %} # Normally 0 for partial/staged filament.
    {% set buffer_verify_max_moves = params.BUFFER_VERIFY_MAX_MOVES|default(buffer_verify_max_moves)|int %} # Max checked buffer verify moves.
    {% set buffer_position_distance = params.BUFFER_POSITION_DISTANCE|default(buffer_position_distance)|float %} # Legacy fallback fixed move distance.
    {% set buffer_position_speed = params.BUFFER_POSITION_SPEED|default(buffer_position_speed)|float %} # Legacy fallback fixed move speed.
    {% set keep_buffer_active = params.KEEP_BUFFER_ACTIVE|default(keep_buffer_active)|int %} # 1 leaves active-tool regulator running after load.

    M117 Loading Filament # Display load status on printer UI.

    {% set nozzle_temp = printer[active_extruder].temperature|float %} # Current temp of the active toolhead nozzle.
    {% set homed_axes = printer.toolhead.homed_axes %} # String of currently homed axes.
    {% set printer_homed = 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %} # True only if XYZ are homed.

    {% if printer_homed and nozzle_temp > home_temp %}
        M117 Printer already homed and nozzle above {home_temp}C - skipping warmup/home prep

    {% elif not printer_homed and nozzle_temp > home_temp %}
        M117 Nozzle too hot, waiting until cool to home
        M104 S{home_cool_target} # Lower target so nozzle can cool before homing.
        TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={home_temp} # Wait until active nozzle is safe for homing.
        _CG28 # Home after the nozzle is cool enough.

    {% elif not printer_homed and nozzle_temp <= home_temp %}
        M104 S{home_temp} # Start warming while homing.
        _CG28 # Home printer while nozzle warms.

    {% else %}
        M104 S{home_temp} # Printer is homed and nozzle is cool; bring nozzle to standby/load-prep temp.
    {% endif %}

    SAVE_GCODE_STATE NAME=load_state # Save current positioning, extrusion mode, and feedrate state.

    M104 S{load_temp} # Start heating to final load/purge temp without waiting yet.
    G90 # Use absolute positioning for XYZ travel moves.

    M117 Moving to purge bucket # Display purge bucket move status.
    G1 Z{bucket_z} F{z_travel_speed} # Raise/move to purge bucket travel height.
    G1 X{bucket_x} F{travel_speed} # Move X first to reduce angled-move collision risk.
    G1 Y{bucket_y} F{travel_speed} # Move to purge bucket Y position.

    G91 # Switch to relative positioning before extrusion section.
    M109 S{load_temp} # Wait for hotend to reach final load/purge temp.
    _BEEP # Audible ready signal.

    {% if verify_buffer_before_load == 1 %}
        BUFFER_POSITION_ACTIVE_TOOL_NEAR_OVERFILL PREFILL={buffer_verify_prefill} MAX_MOVES={buffer_verify_max_moves} ARM_AFTER=1 # Checked push to HALL1 overfill using buffer shared increments.
    {% else %}
        BUFFER_POSITION_ACTIVE_TOOL_NEAR_OVERFILL MOVE={buffer_position_distance} SPEED={buffer_position_speed} MAX_MOVES=1 ARM_AFTER=1 # Legacy one-step positioning behavior.
    {% endif %}

    M83 # Force relative extrusion mode for load/purge/retract section.
    G92 E0 # Zero the active extruder position.

    BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING # Initial blocking regulator check before hotend starts pulling filament.
    G1 E{load_distance} F{max_velocity} # Fast initial load into the melt zone.
    M400 # Wait until the physical load move has completed.
    BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING # Blocking regulator check after load consumed slack.

    {% set purge_loops = (purge_distance / purge_chunk)|round(0, 'floor')|int %} # Number of full purge chunks.
    {% set purge_remainder = purge_distance - (purge_loops * purge_chunk) %} # Remaining purge distance after full chunks.

    {% for i in range(purge_loops) %}
        G1 E{purge_chunk} F{speed} # Extrude one purge chunk.
        M400 # Wait until the physical purge chunk has completed.
        BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING # Blocking regulator check after slack was consumed by that chunk.
    {% endfor %}

    {% if purge_remainder > 0 %}
        G1 E{purge_remainder} F{speed} # Extrude remaining purge distance.
        M400 # Wait until the physical remainder has completed.
        BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING # Final blocking Hall-state check after purge remainder.
    {% endif %}

    BUFFER_REGULATE_ACTIVE_TOOL_BLOCKING # Final blocking regulator check after all load/purge extrusion.

    M400 # Make sure all hotend extrusion moves are complete before ooze dwell.
    _WAIT TIME=20 # Wait over the purge bucket to let nozzle pressure bleed down.

    G1 E-0.6 F1800 # Small retract to reduce continued ooze/stringing.
    M400 # Make sure retract completes.
    _WAIT TIME=6 # Let retract settle before moving to wipe.

    G90 # Return to absolute positioning before bucket/wipe travel.
    G1 Z{bucket_z} F{z_travel_speed} # Return to purge bucket Z height.
    G1 X{bucket_x} Y{bucket_y} F{travel_speed} # Return/recenter over purge bucket before wipe.

    _WIPE_NOZZLE # Run nozzle wipe routine.

    G90 # Force absolute positioning again in case wipe changed motion mode.
    G1 Z{bucket_z} F{z_travel_speed} # Return to purge bucket Z height after wipe.
    G1 X{bucket_x} Y{bucket_y} F{travel_speed} # Return to purge bucket XY after wipe.

    {% if keep_buffer_active == 0 %}
        BUFFER_DISABLE_ACTIVE_TOOL DISABLE_MOTOR=1 # Disable active-tool buffer regulator and release motor after load.
    {% else %}
        M118 LOAD_FILAMENT: leaving active-tool buffer regulator running
    {% endif %}

    RESTORE_GCODE_STATE NAME=load_state # Restore the saved motion/extrusion state from before the macro.

#####################################################################
#                  Active Tool Buffer Unload Tension Router
#####################################################################
# Purpose:
# - Shared router for common UNLOAD_FILAMENT.
# - Starts/stops low-current buffer take-up tension for the currently
#   active toolhead without needing one unload button per tool.
#####################################################################

[gcode_macro BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL]
description: Start low-force unload tension on the buffer paired to the active toolhead
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %} # Current active hotend/extruder selected by the toolchanger.

    {% if active_extruder == "extruder" %} # Tool0 hotend; paired with Buffer0.
        BUFFERZERO_TOOLZERO_START_UNLOAD_TENSION {rawparams}

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %}
    #     BUFFERONE_TOOLONE_START_UNLOAD_TENSION {rawparams}

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %}
    #     BUFFERTWO_TOOLTWO_START_UNLOAD_TENSION {rawparams}

    {% else %}
        M118 No unload tension start route for active extruder: {active_extruder}
    {% endif %}

[gcode_macro BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL]
description: Stop low-force unload tension on the buffer paired to the active toolhead
gcode:
    {% set active_extruder = printer.toolhead.extruder|string %} # Current active hotend/extruder selected by the toolchanger.

    {% if active_extruder == "extruder" %} # Tool0 hotend; paired with Buffer0.
        BUFFERZERO_TOOLZERO_STOP_UNLOAD_TENSION {rawparams}

    # Future Tool1 / Buffer1 example:
    # {% elif active_extruder == "extruder2" %}
    #     BUFFERONE_TOOLONE_STOP_UNLOAD_TENSION {rawparams}

    # Future Tool2 / Buffer2 example:
    # {% elif active_extruder == "extruder4" %}
    #     BUFFERTWO_TOOLTWO_STOP_UNLOAD_TENSION {rawparams}

    {% else %}
        M118 No unload tension stop route for active extruder: {active_extruder}
    {% endif %}

#####################################################################
#                  Buffer0 Unload Tension Assist
#####################################################################
# Purpose:
# - Temporarily lowers Buffer0 TMC current.
# - Runs a long, slow negative Buffer0 move to act like a weak take-up
#   motor while the hotend extruder performs tip forming and unload.
# - Positive Buffer0 movement feeds toward Tool0 in your buffer0.cfg,
#   so unload tension uses a negative move away from Tool0.
#####################################################################

[gcode_macro BUFFERZERO_TOOLZERO_START_UNLOAD_TENSION]
description: Start low-force Buffer0 take-up tension for unload
gcode:
    {% set vars = printer["gcode_macro _BUFFERZERO_TOOLZERO_VARS"] %} # Pull Buffer0 shared variables.
    {% set current = params.CURRENT|default(0.18)|float %} # Temporary low run current for soft pull.
    {% set distance = params.DISTANCE|default(120)|float %} # Long negative take-up move distance in mm.
    {% set speed = params.SPEED|default(6)|float %} # Slow take-up speed in mm/s.
    {% set accel = params.ACCEL|default(100)|float %} # Gentle take-up acceleration.

    M118 Buffer0/Tool0: starting unload tension CURRENT={current} DISTANCE={distance} SPEED={speed}

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=system_enabled VALUE=0 # Disable automatic feed regulator during unload tension.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=1 # Treat tension as manual/service control.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=1 # Suppress regulator decisions during unload tension.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=continuous_fill VALUE=0 # Stop entrance-sensor initial-fill mode.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0 # Clear stale async state before starting tension.

    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_initial_fill_loop DURATION=0 # Cancel initial-fill loop.
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_regulator_loop DURATION=0 # Cancel regulator loop.
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_async_clear DURATION=0 # Cancel async-clear timer.
    UPDATE_DELAYED_GCODE ID=_bufferzero_toolzero_disable_motor DURATION=0 # Cancel pending motor release.

    SET_TMC_CURRENT STEPPER="buffer0_motor" CURRENT={current} # Lower Buffer0 motor current for soft tension.
    G4 P250 # Give TMC current change a moment to apply.

    MANUAL_STEPPER STEPPER={vars.buffer_stepper} ENABLE=1 # Enable Buffer0 motor.
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} SET_POSITION=0 # Reset manual-stepper position reference.
    MANUAL_STEPPER STEPPER={vars.buffer_stepper} MOVE=-{distance} SPEED={speed} ACCEL={accel} SYNC=0 # Start non-blocking take-up move away from Tool0.

[gcode_macro BUFFERZERO_TOOLZERO_STOP_UNLOAD_TENSION]
description: Stop Buffer0 unload tension and restore normal current
gcode:
    {% set normal_current = params.CURRENT|default(0.5)|float %} # Normal Buffer0 run current to restore.
    {% set release = params.RELEASE|default(1)|int %} # 1 releases Buffer0 motor hold after unload.

    M118 Buffer0/Tool0: stopping unload tension, restoring current={normal_current}

    SET_TMC_CURRENT STEPPER="buffer0_motor" CURRENT={normal_current} # Restore normal Buffer0 motor current.
    G4 P250 # Give TMC current change a moment to apply.

    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=manual_operation VALUE=0 # Clear manual lockout.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=service_operation VALUE=0 # Clear service lockout.
    SET_GCODE_VARIABLE MACRO=_BUFFERZERO_TOOLZERO_AUTO_STATE VARIABLE=async_active VALUE=0 # Clear async state flag.

    {% if release == 1 %}
        MANUAL_STEPPER STEPPER=buffer0_motor ENABLE=0 # Release Buffer0 motor hold.
    {% endif %}

#####################################################################
#                  Simple Unload Filament
#####################################################################
# Purpose:
# - Basic unload for the currently active tool.
# - Selects unload temp by FILAMENT= type, with TEMP= override.
# - Waits until the hotend is inside the unload temp window before motion.
# - Starts with a hard Buffer0 pull to help yank filament out of the hotend.
# - Drops Buffer0 back to CONFIG current for the remaining pull.
# - If CONFIG current is used, CURRENT= is omitted so the Buffer0 macro
#   pulls run_current directly from [tmc2208 manual_stepper buffer0_motor].
# - Optionally pushes filament forward, but default is 0 to avoid mushrooming.
# - Performs a slow necking retract first to thin the tip.
# - Performs a faster final retract after the tip is necked down.
# - Runs an optional final long buffer-only retract to pull filament back
#   toward the buffer after the hotend unload is complete.
# - Stops buffer assist and releases the buffer motor.
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Simple unload for currently active tool using filament-selectable temp and staged buffer pull assist

# ---- Filament temperature profiles ----
variable_default_filament: "PLA"           # Used if FILAMENT= is not passed.
variable_pla_unload_temp: 200              # PLA simple unload temp.
variable_petg_unload_temp: 215             # PETG simple unload temp.
variable_abs_unload_temp: 230              # ABS simple unload temp.
variable_asa_unload_temp: 230              # ASA simple unload temp.
variable_tpu_unload_temp: 205              # TPU simple unload temp.
variable_default_unload_temp: 210          # Fallback temp for unknown filament.
variable_unload_temp_window: 2             # Wait until nozzle is within +/- this many C of unload temp before motion.

# ---- Hotend unload motion ----
variable_push_distance: 0                  # Keep 0 for now; forward push was deforming the filament tip.
variable_retract_distance: 135             # Total hotend retract distance for unload.
variable_push_speed: 5                     # Forward push speed in mm/s if push is enabled.
variable_neck_retract_distance: 20         # First retract distance to neck down the molten filament.
variable_neck_retract_speed: 35            # First retract speed in mm/s.
variable_retract_speed: 80                 # Fast final retract speed in mm/s; capped by active extruder max.
variable_move_to_bucket: 1                 # 1 moves to purge bucket if printer is already homed.

# ---- Buffer unload assist ----
variable_buffer_hard_pull_current: 0.50    # Initial hard-pull current to help pull filament out of the hotend/extruder.
variable_buffer_hard_pull_distance: 90     # Initial hard-pull distance in mm.
variable_buffer_hard_pull_speed: 40        # Initial hard-pull speed in mm/s.
variable_buffer_hard_pull_accel: 250       # Initial hard-pull acceleration.
variable_buffer_hard_pull_settle: 0.25     # Extra safety time after calculated hard-pull completion.

variable_buffer_normal_pull_current: "CONFIG" # CONFIG means do not pass CURRENT=; buffer macro uses configured run_current.
variable_buffer_tension_distance: 200      # Total intended staged buffer pull distance before final long retract.
variable_buffer_tension_speed: 25          # Remaining buffer take-up speed in mm/s.
variable_buffer_tension_accel: 300         # Remaining buffer take-up acceleration.
variable_buffer_tension_lead_time: 0.05    # Short lead time before hotend motion.
variable_buffer_tension_dwell: 2.0         # Extra dwell after calculated normal buffer pull time.

# ---- Final buffer-only retract after hotend unload ----
variable_final_buffer_retract_enabled: 1      # 1 runs a long buffer-only retract after hotend unload.
variable_final_buffer_retract_distance: 1900  # Distance in mm to pull filament back toward the buffer.
variable_final_buffer_retract_speed: 50       # Speed in mm/s for final buffer-only retract.
variable_final_buffer_retract_accel: 500      # Acceleration for final buffer-only retract.
variable_final_buffer_retract_current: "CONFIG" # CONFIG uses buffer motor run_current.
variable_final_buffer_retract_settle: 1.0     # Extra dwell after calculated final retract time.

gcode:
    {% set load_v = printer["gcode_macro LOAD_FILAMENT"] %}

    {% set active_extruder = printer.toolhead.extruder|string %}
    {% set max_extrude_speed = printer.configfile.settings[active_extruder].max_extrude_only_velocity|float %}

    # ---- Select filament profile ----
    {% set filament = params.FILAMENT|default(default_filament)|upper %}

    {% if filament in ["PLA", "PLA+"] %}
        {% set material_unload_temp = pla_unload_temp|float %}
    {% elif filament in ["PETG", "PET"] %}
        {% set material_unload_temp = petg_unload_temp|float %}
    {% elif filament == "ABS" %}
        {% set material_unload_temp = abs_unload_temp|float %}
    {% elif filament == "ASA" %}
        {% set material_unload_temp = asa_unload_temp|float %}
    {% elif filament in ["TPU", "TPE"] %}
        {% set material_unload_temp = tpu_unload_temp|float %}
    {% else %}
        {% set material_unload_temp = default_unload_temp|float %}
    {% endif %}

    # TEMP= overrides the selected filament profile.
    {% set unload_temp = params.TEMP|default(material_unload_temp)|float %}
    {% set unload_temp_window = params.TEMP_WINDOW|default(unload_temp_window)|float %}
    {% set unload_temp_min = unload_temp - unload_temp_window %}
    {% set unload_temp_max = unload_temp + unload_temp_window %}

    # ---- Hotend unload motion overrides ----
    {% set push_distance = params.PUSH_DISTANCE|default(push_distance)|float %}
    {% set retract_distance = params.RETRACT_DISTANCE|default(retract_distance)|float %}
    {% set push_speed = [params.PUSH_SPEED|default(push_speed)|float, max_extrude_speed]|min %}
    {% set neck_retract_distance = params.NECK_RETRACT_DISTANCE|default(neck_retract_distance)|float %}
    {% set neck_retract_speed = [params.NECK_RETRACT_SPEED|default(neck_retract_speed)|float, max_extrude_speed]|min %}
    {% set retract_speed = [params.RETRACT_SPEED|default(retract_speed)|float, max_extrude_speed]|min %}
    {% set final_retract_distance = [retract_distance - neck_retract_distance, 0]|max %}
    {% set move_to_bucket = params.MOVE_TO_BUCKET|default(move_to_bucket)|int %}

    # ---- Purge bucket / travel values pulled from LOAD_FILAMENT ----
    {% set bucket_x = params.BUCKET_X|default(load_v.purge_bucket_x)|float %}
    {% set bucket_y = params.BUCKET_Y|default(load_v.purge_bucket_y)|float %}
    {% set bucket_z = params.BUCKET_Z|default(load_v.purge_bucket_z)|float %}
    {% set travel_speed = params.TRAVEL_SPEED|default(load_v.travel_speed)|float %}
    {% set z_travel_speed = params.Z_TRAVEL_SPEED|default(load_v.z_travel_speed)|float %}

    # ---- Buffer hard pull overrides ----
    {% set buffer_hard_pull_current = params.BUFFER_HARD_PULL_CURRENT|default(buffer_hard_pull_current)|float %}
    {% set buffer_hard_pull_distance = params.BUFFER_HARD_PULL_DISTANCE|default(buffer_hard_pull_distance)|float %}
    {% set buffer_hard_pull_speed = params.BUFFER_HARD_PULL_SPEED|default(buffer_hard_pull_speed)|float %}
    {% set buffer_hard_pull_accel = params.BUFFER_HARD_PULL_ACCEL|default(buffer_hard_pull_accel)|float %}
    {% set buffer_hard_pull_settle = params.BUFFER_HARD_PULL_SETTLE|default(buffer_hard_pull_settle)|float %}

    # ---- Buffer normal pull overrides ----
    {% set buffer_normal_pull_current = params.BUFFER_NORMAL_PULL_CURRENT|default(buffer_normal_pull_current)|string %}
    {% set buffer_use_config_current = buffer_normal_pull_current|upper == "CONFIG" %}
    {% set buffer_tension_distance = params.BUFFER_TENSION_DISTANCE|default(buffer_tension_distance)|float %}
    {% set buffer_tension_speed = params.BUFFER_TENSION_SPEED|default(buffer_tension_speed)|float %}
    {% set buffer_tension_accel = params.BUFFER_TENSION_ACCEL|default(buffer_tension_accel)|float %}
    {% set buffer_tension_lead_time = params.BUFFER_TENSION_LEAD_TIME|default(buffer_tension_lead_time)|float %}
    {% set buffer_tension_dwell = params.BUFFER_TENSION_DWELL|default(buffer_tension_dwell)|float %}
    {% set buffer_remaining_distance = [buffer_tension_distance - buffer_hard_pull_distance, 0]|max %}

    # ---- Final buffer-only retract overrides ----
    {% set final_buffer_retract_enabled = params.FINAL_BUFFER_RETRACT|default(final_buffer_retract_enabled)|int %}
    {% set final_buffer_retract_distance = params.FINAL_BUFFER_RETRACT_DISTANCE|default(final_buffer_retract_distance)|float %}
    {% set final_buffer_retract_speed = params.FINAL_BUFFER_RETRACT_SPEED|default(final_buffer_retract_speed)|float %}
    {% set final_buffer_retract_accel = params.FINAL_BUFFER_RETRACT_ACCEL|default(final_buffer_retract_accel)|float %}
    {% set final_buffer_retract_current = params.FINAL_BUFFER_RETRACT_CURRENT|default(final_buffer_retract_current)|string %}
    {% set final_buffer_retract_use_config_current = final_buffer_retract_current|upper == "CONFIG" %}
    {% set final_buffer_retract_settle = params.FINAL_BUFFER_RETRACT_SETTLE|default(final_buffer_retract_settle)|float %}
    {% set final_buffer_retract_time = (final_buffer_retract_distance / final_buffer_retract_speed) if (final_buffer_retract_distance > 0 and final_buffer_retract_speed > 0) else 0 %}
    {% set do_final_buffer_retract = final_buffer_retract_enabled == 1 and final_buffer_retract_distance > 0 %}

    # ---- Timing estimates ----
    {% set push_time = (push_distance / push_speed) if (push_distance > 0 and push_speed > 0) else 0 %}
    {% set neck_time = (neck_retract_distance / neck_retract_speed) if (neck_retract_distance > 0 and neck_retract_speed > 0) else 0 %}
    {% set final_time = (final_retract_distance / retract_speed) if (final_retract_distance > 0 and retract_speed > 0) else 0 %}
    {% set hard_pull_time = (buffer_hard_pull_distance / buffer_hard_pull_speed) if (buffer_hard_pull_distance > 0 and buffer_hard_pull_speed > 0) else 0 %}
    {% set normal_pull_time = (buffer_remaining_distance / buffer_tension_speed) if (buffer_remaining_distance > 0 and buffer_tension_speed > 0) else 0 %}
    {% set normal_pull_wait = normal_pull_time + buffer_tension_dwell %}
    {% set hotend_motion_time = buffer_tension_lead_time + push_time + neck_time + final_time %}
    {% set hard_pull_wait_after_retract = [hard_pull_time + buffer_hard_pull_settle - hotend_motion_time, 0]|max %}

    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        { action_respond_info("UNLOAD_FILAMENT disabled while actively printing.") }

    {% else %}
        M117 Simple unload from {active_extruder}
        RESPOND MSG="Simple unload: extruder={active_extruder}, filament={filament}, temp={unload_temp}, hard_pull={buffer_hard_pull_distance}mm@{buffer_hard_pull_current}A, normal_pull={buffer_remaining_distance}mm@{buffer_normal_pull_current}, final_buffer_retract={final_buffer_retract_distance}mm"

        SAVE_GCODE_STATE NAME=simple_unload_state

        # Set unload temp target first. If hotend is hotter than this, Klipper will cool before motion.
        SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={unload_temp}

        {% set homed_axes = printer.toolhead.homed_axes %}
        {% set printer_homed = 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %}

        {% if move_to_bucket == 1 and printer_homed %}
            G90
            G1 Z{bucket_z} F{z_travel_speed}
            G1 X{bucket_x} F{travel_speed}
            G1 Y{bucket_y} F{travel_speed}
        {% elif move_to_bucket == 1 and not printer_homed %}
            RESPOND MSG="Simple unload: printer not homed, skipping purge bucket move."
        {% endif %}

        # Wait until the nozzle is actually inside the unload temp window.
        # This blocks both ways: heating up if too cold, cooling down if too hot.
        M117 Waiting for unload temp window
        RESPOND MSG="Simple unload: waiting for {active_extruder} to reach {unload_temp_min}-{unload_temp_max}C before buffer pull/retract"
        TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={unload_temp_min} MAXIMUM={unload_temp_max}

        _BEEP

        M83
        G92 E0
        M400

        # Stage 1: hard buffer pull.
        # This is intended to help get filament moving out of the hotend/extruder before switching to normal current.
        {% if buffer_hard_pull_distance > 0 %}
            BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_hard_pull_current} DISTANCE={buffer_hard_pull_distance} SPEED={buffer_hard_pull_speed} ACCEL={buffer_hard_pull_accel}
            G4 P{(buffer_tension_lead_time * 1000)|int}
        {% endif %}

        # Optional forward push.
        # Leave at 0 unless later testing proves a tiny 1-2mm push helps.
        {% if push_distance > 0 %}
            G1 E{push_distance} F{(push_speed * 60)|int}
            M400
        {% endif %}

        # First retract to neck the molten section.
        {% if neck_retract_distance > 0 %}
            G1 E-{neck_retract_distance} F{(neck_retract_speed * 60)|int}
            M400
        {% endif %}

        # Fast final hotend retract after the tip has been necked down.
        {% if final_retract_distance > 0 %}
            G1 E-{final_retract_distance} F{(retract_speed * 60)|int}
            M400
        {% endif %}

        # If the hotend retract finished before the hard pull had time to complete,
        # wait just long enough before dropping current.
        {% if hard_pull_wait_after_retract > 0 %}
            G4 P{(hard_pull_wait_after_retract * 1000)|int}
        {% endif %}

        # Drop back to configured/current after the hard-pull distance.
        # If using CONFIG, omit CURRENT= so the Buffer0 macro reads run_current directly.
        # RELEASE=0 keeps the motor enabled for the remaining pull stage.
        {% if buffer_hard_pull_distance > 0 %}
            {% if buffer_use_config_current %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=0
            {% else %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} RELEASE=0
            {% endif %}
        {% endif %}

        # Stage 2: remaining buffer pull at normal/config current.
        {% if buffer_remaining_distance > 0 %}
            {% if buffer_use_config_current %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={buffer_remaining_distance} SPEED={buffer_tension_speed} ACCEL={buffer_tension_accel}
            {% else %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} DISTANCE={buffer_remaining_distance} SPEED={buffer_tension_speed} ACCEL={buffer_tension_accel}
            {% endif %}

            # Wait long enough for the normal buffer pull to complete, plus dwell.
            G4 P{(normal_pull_wait * 1000)|int}

            {% if buffer_use_config_current %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE={0 if do_final_buffer_retract else 1}
            {% else %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} RELEASE={0 if do_final_buffer_retract else 1}
            {% endif %}

        {% else %}
            {% if buffer_use_config_current %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE={0 if do_final_buffer_retract else 1}
            {% else %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={buffer_normal_pull_current} RELEASE={0 if do_final_buffer_retract else 1}
            {% endif %}
        {% endif %}

        # Stage 3: optional long buffer-only retract.
        # This pulls the filament back through the PTFE toward the buffer after the hotend unload is complete.
        {% if do_final_buffer_retract %}
            RESPOND MSG="Simple unload: final buffer retract {final_buffer_retract_distance}mm at {final_buffer_retract_speed}mm/s"

            {% if final_buffer_retract_use_config_current %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL DISTANCE={final_buffer_retract_distance} SPEED={final_buffer_retract_speed} ACCEL={final_buffer_retract_accel}
            {% else %}
                BUFFER_START_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={final_buffer_retract_current} DISTANCE={final_buffer_retract_distance} SPEED={final_buffer_retract_speed} ACCEL={final_buffer_retract_accel}
            {% endif %}

            G4 P{((final_buffer_retract_time + final_buffer_retract_settle) * 1000)|int}

            {% if final_buffer_retract_use_config_current %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL RELEASE=1
            {% else %}
                BUFFER_STOP_UNLOAD_TENSION_ACTIVE_TOOL CURRENT={final_buffer_retract_current} RELEASE=1
            {% endif %}
        {% endif %}

        M117 Simple unload complete
        _BEEP

        RESTORE_GCODE_STATE NAME=simple_unload_state
    {% endif %}
 
[gcode_macro PURGE_FILAMENT]
variable_purge_distance:  50
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set active_extruder = printer.toolhead.extruder %}
    {% set max_velocity = printer.configfile.settings[active_extruder].max_extrude_only_velocity * 60 %}  # Max safe extrude-only speed (convert mm/s → mm/min)
    
    M109 S240. ; wait for hotend
    SAVE_GCODE_STATE NAME=purge_state
    G91
    G92 E0
    G1 E{variable_purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=purge_state

#####################################################################
# Tool / Buffer Extruder States
#####################################################################

[gcode_macro _RESTORE_HOTEND_FOR_BUFFER]
description: Restore active extruder to the hotend paired with a buffer extruder
gcode:
  {% set buffer = params.BUFFER|default(printer.toolhead.extruder)|string %}

  {% if buffer == "extruder" %}
    {action_raise_error("Cannot restore from buffer: active extruder is already 'extruder'")}
  {% endif %}

  {% set buffer_num = buffer|replace("extruder", "")|int %}

  {% if buffer_num < 1 or (buffer_num % 2) == 0 %}
    {action_raise_error(buffer ~ " is not a buffer extruder in the paired numbering map")}
  {% endif %}

  {% set hotend_num = buffer_num - 1 %}

  {% if hotend_num == 0 %}
    {% set hotend_extruder = "extruder" %}
  {% else %}
    {% set hotend_extruder = "extruder" ~ hotend_num %}
  {% endif %}

  ACTIVATE_EXTRUDER EXTRUDER={hotend_extruder}

#####################################################################
# Basic functions, overrides, and Stock macro mods
#####################################################################
  
[gcode_macro _BEEP]
gcode:
    M300 S500 P500

[gcode_macro _WAIT]
description: Wait/dwell for a number of seconds
gcode:
    {% set time = params.TIME|default(3)|float %}
    M118 WAIT START {time}s
    M400
    G4 P{(time * 1000)|int}
    M118 WAIT DONE

[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    BTT_BED_MESH_CALIBRATE {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
    
[gcode_macro M600]
description: Filament change
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    START_BEEPING
    PAUSE
    STOP_BEEPING
    G91
    #G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    #G1 E-50 F1000 ; wtf is this
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28

    G0 X175 Y175 Z30 F3600 # Move to center of bed
    RESTORE_GCODE_STATE NAME=STATE_G32

## Emits an audible tone, use in conjunction with a passive buzzer to create beeps of different pitch and durations
## Original code from: https://github.com/rootiest/zippy-klipper_config/blob/master/macros/M300.cfg
## Script that converts MIDI files to M300 gcode: https://alexyu132.github.io/midi-m300/
[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
    {% set P = params.P|default(100)|int %} ; P sets the tone duration
    {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
    {% if S <= 0 %} ; dont divide through zero
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %} ;max frequency set to 10kHz
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %} ;convert frequency to seconds
    {% endif %}
    SET_PIN PIN=_beeper VALUE={L} CYCLE_TIME={F} ;Play tone
    G4 P{P} ;tone duration
    SET_PIN PIN=_beeper VALUE=0

[gcode_macro DEBUG_ACTIVE_EXTRUDER]
gcode:
    M118 Active extruder is {printer.toolhead.extruder}

#######################################################################################
# Checking speed capabilities
#######################################################################################



[gcode_macro TEST_Z_STABILITY]
description: QGL -> Z cycle -> QGL drift check

# ---- User tunables ----
variable_cycles: 20          # number of up/down cycles
variable_z_low: 50           # lower Z position
variable_z_high: 250          # upper Z position
variable_speed: 1800          # Z speed (mm/min)  20mm/s=1200mm/m  30/1800   40/2400   50/3000   70/4200    80/4800

gcode:
    {% set cycles = params.CYCLES|default(printer["gcode_macro TEST_Z_STABILITY"].cycles)|int %}
    {% set z_low = params.Z_LOW|default(printer["gcode_macro TEST_Z_STABILITY"].z_low)|float %}
    {% set z_high = params.Z_HIGH|default(printer["gcode_macro TEST_Z_STABILITY"].z_high)|float %}
    {% set speed = params.SPEED|default(printer["gcode_macro TEST_Z_STABILITY"].speed)|int %}

    M117 Z Stability Test: Baseline QGL
    RESPOND MSG="--- Z TEST: BASELINE QGL ---"

    G28
    QUAD_GANTRY_LEVEL

    # # Capture baseline QGL range (from last run)
    # {% set base_range = printer.quad_gantry_level.applied_range|default(-1) %}
    # RESPOND MSG="Baseline QGL Range: {base_range:.5f}"

    G90
    G0 Z{z_high} F{speed}

    M117 Z Cycling...
    RESPOND MSG="--- Z TEST: CYCLING {cycles} TIMES ({z_low}↔{z_high}) @ {speed} ---"

    {% for i in range(cycles) %}
        G0 Z{z_low} F{speed}
        G0 Z{z_high} F{speed}
    {% endfor %}

    M400

    M117 Z Stability Test: Post QGL
    RESPOND MSG="--- Z TEST: POST QGL ---"

    QUAD_GANTRY_LEVEL

    # {% set post_range = printer.quad_gantry_level.applied_range|default(-1) %}
    # RESPOND MSG="Post QGL Range: {post_range:.5f}"

    # {% if base_range >= 0 and post_range >= 0 %}
    #     {% set delta = post_range - base_range %}
    #     RESPOND MSG="Delta Range Change: {delta:.5f}"
    # {% endif %}

    M117 Z Stability Test Done

    
[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(50)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED
    